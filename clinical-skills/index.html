<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Clinical skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5fa;--card:#fff;--ink:#201436;--muted:#6b6380;--line:#e6dfef;--accent:#7a3fb0;--soft:#efe7f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111c;--card:#1f1a29;--ink:#f1ecf8;--muted:#a89fbb;--line:#2f283c;--accent:#c39bea;--soft:#2a2238}}
:root[data-theme="dark"]{--bg:#15111c;--card:#1f1a29;--ink:#f1ecf8;--muted:#a89fbb;--line:#2f283c;--accent:#c39bea;--soft:#2a2238}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 64px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
h1{font-size:clamp(28px,6vw,36px)}
h2{font-size:15px;font-family:Inter,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:32px 0 6px}
a{color:var(--accent);text-decoration:none}
.back{display:inline-block;font-weight:500;margin-bottom:14px}
.lead{color:var(--muted);margin:8px 0 0}
.here{margin-top:22px;background:var(--soft);border-radius:12px;padding:12px 16px}
.here p{margin:0 0 2px;font-size:14px;color:var(--muted)}
.here .name{display:inline-block;margin-right:16px}
.here span.name{color:var(--muted)}
.here a.name{font-weight:600}
.here a.name::after{content:" →"}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px}
li{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .name{color:var(--muted)}
li a.name{color:var(--ink);font-weight:500}
li a.name::after{content:" →";color:var(--accent)}
li .when{color:var(--muted);font-size:14px;white-space:nowrap}
.demo{margin-top:48px;font-size:13px;color:var(--muted)}
.demo a{margin-left:8px}
.demo a[aria-current="true"]{font-weight:600;text-decoration:underline}
</style></head>
<body><div class="wrap">

<a class="back" id="back" hidden href="../"></a>
<h1>Clinical skills</h1>
<p class="lead">Every history and exam from Years 1 and 2, one page each. Where an exam is taught twice, its page holds both.</p>

<div class="here" id="here" hidden><p id="here-title"></p><div id="here-links"></div></div>

<div id="lists"></div>

<p class="demo">Prototype, preview as if opened from:
  <a href="?">landing page</a><a href="?from=fom">FoM</a><a href="?from=pom1">PoM 1</a><a href="?from=pom2&amp;block=msk">PoM 2 MSK</a><a href="?from=t2c">T2C</a>
</p>
</div>

<script>
const COURSES = {fom: "FoM", pom1: "PoM 1", pom2: "PoM 2", t2c: "T2C"};
const BLOCKS = {msk: "MSK", neuro: "Neuro", psych: "Psych", repro: "Repro"};
const GROUPS = [["history", "History taking"], ["exam", "Physical exam"], ["pocus", "Ultrasound"], ["osce", "OSCE prep"]];

// taught: the courses it is taught in, first time first; page: set once the exam is built;
// blocks: PoM 2 blocks whose sessions teach it
const SKILLS = [
  {group: "history", name: "The patient-centred interview", taught: ["fom", "pom1"]},
  {group: "history", name: "Cultural humility", taught: ["pom1"]},
  {group: "history", name: "Presenting a case", taught: ["fom", "t2c"]},
  {group: "history", name: "Obstetric and gynecologic history", taught: ["pom2"], blocks: ["repro"]},
  {group: "history", name: "Psychiatric interview", taught: ["pom2"], blocks: ["psych"]},
  {group: "history", name: "Paediatric history", taught: ["t2c"]},
  {group: "history", name: "Geriatric assessment", taught: ["t2c"]},
  {group: "exam", name: "Vital signs", taught: ["fom"]},
  {group: "exam", name: "Respiratory", taught: ["fom", "pom1"]},
  {group: "exam", name: "Abdominal", taught: ["fom", "pom1"]},
  {group: "exam", name: "Cardiovascular", taught: ["fom", "pom1"]},
  {group: "exam", name: "Breast", taught: ["fom"]},
  {group: "exam", name: "Head and neck, eye, ear", taught: ["pom1", "t2c"]},
  {group: "exam", name: "Neurological", taught: ["pom1", "pom2"], blocks: ["neuro"]},
  {group: "exam", name: "MSK", taught: ["pom1", "pom2"], blocks: ["msk"], page: "../msk-exam/"},
  {group: "exam", name: "Male genital and rectal", taught: ["t2c"]},
  {group: "exam", name: "Pelvic", taught: ["t2c"], blocks: ["repro"]},
  {group: "pocus", name: "Heart and abdomen", taught: ["pom1", "t2c"]},
  {group: "osce", name: "How a station runs", taught: ["fom", "t2c"]},
  {group: "osce", name: "Putting it together", taught: ["t2c"]},
];

const params = new URLSearchParams(location.search);
const from = COURSES[params.get("from")] ? params.get("from") : null;
const block = from === "pom2" && BLOCKS[params.get("block")] ? params.get("block") : null;

function nameEl(s) {
  const el = document.createElement(s.page ? "a" : "span");
  el.className = "name";
  el.textContent = s.name;
  if (s.page) el.href = s.page;
  return el;
}

const lists = document.getElementById("lists");
for (const [key, title] of GROUPS) {
  const h = document.createElement("h2");
  h.textContent = title;
  const ul = document.createElement("ul");
  for (const s of SKILLS.filter(s => s.group === key)) {
    const li = document.createElement("li");
    const when = document.createElement("span");
    when.className = "when";
    when.textContent = s.taught.map(c => COURSES[c]).join(" → ");
    li.append(nameEl(s), when);
    ul.appendChild(li);
  }
  lists.append(h, ul);
}

// opened from a course: a way back, and this block's skills on top
document.querySelectorAll(".demo a").forEach(a => {
  const p = new URLSearchParams(a.getAttribute("href").slice(1));
  a.setAttribute("aria-current", String(p.get("from") === from && p.get("block") === block));
});
if (from) {
  const here = block ? `${COURSES[from]} ${BLOCKS[block]}` : COURSES[from];
  const back = document.getElementById("back");
  back.hidden = false;
  back.textContent = `← Back to ${here}`;
  const now = SKILLS.filter(s => block ? (s.blocks || []).includes(block) : s.taught.includes(from));
  if (now.length) {
    document.getElementById("here").hidden = false;
    document.getElementById("here-title").textContent = `In ${here}`;
    const links = document.getElementById("here-links");
    now.forEach(s => links.appendChild(nameEl(s)));
  }
}
</script>
</body></html>
