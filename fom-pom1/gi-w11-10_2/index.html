<text x="573.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">GI bleed: RESUSCITATE first, then UPPER or LOWER (the ligament of Treitz)?</text>
<text x="573.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">airway (intubate if needed) · 2 large-bore IVs · fluids · transfuse</text>
<text x="573.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">correct coagulopathy: fresh frozen plasma, platelets, vitamin K, Octaplex · STOP anticoagulants and antiplatelets</text>
<rect x="45.0" y="138.0" width="508.0" height="114.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="299.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">UPPER: HEMATEMESIS or MELENA</text>
<text x="55.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ↑ urea : creatinine</text>
<text x="55.0" y="201.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• fresh blood up a nasogastric tube</text>
<text x="55.0" y="219.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• urgent esophagogastroduodenoscopy (EGD) AFTER resuscitation: finds AND</text>
<text x="62.8" y="237.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">treats</text>
<rect x="593.0" y="138.0" width="508.0" height="114.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="847.0" y="172.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">LOWER: HEMATOCHEZIA · is the patient STABLE?</text>
<text x="603.0" y="192.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• #1 diverticulosis (usually stops), hemorrhoids, fissure</text>
<text x="603.0" y="210.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• inflammatory bowel disease, cancer, ischemic or infectious colitis, radiation,</text>
<text x="610.8" y="228.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">post-polypectomy</text>
<rect x="45.0" y="332.0" width="248.0" height="78.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="169.0" y="357.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Non-variceal upper bleed</text>
<text x="169.0" y="377.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">ulcer, gastritis, esophagitis,</text>
<text x="169.0" y="395.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">Mallory-Weiss tear, cancer</text>

<text x="429.0" y="357.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Variceal upper bleed</text>
<text x="429.0" y="377.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">portal hypertension: esophageal or</text>
<text x="429.0" y="395.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">gastric varices</text>

<text x="717.0" y="375.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stable lower bleed</text>
<rect x="853.0" y="332.0" width="248.0" height="78.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="977.0" y="366.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Unstable lower bleed</text>
<text x="977.0" y="386.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">a brisk UPPER bleed can look like this</text>
<rect x="45.0" y="450.0" width="248.0" height="132.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="169.0" y="475.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Hematemesis or melena</text>
<text x="55.0" y="495.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• anti-inflammatories (NSAIDs),</text>
<text x="62.8" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">anticoagulants</text>
<text x="55.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• peptic ulcer, H. pylori</text>
<text x="55.0" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• aortic aneurysm repair: aortoenteric</text>
<text x="62.8" y="567.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">fistula</text>
<rect x="305.0" y="450.0" width="248.0" height="132.0" rx="10" fill="#ebe4f7" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="429.0" y="493.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Hematemesis or melena</text>
<text x="315.0" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• liver disease, alcohol</text>
<text x="315.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• signs of chronic liver disease</text>
<text x="315.0" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ↑ liver enzymes</text>
<rect x="593.0" y="450.0" width="248.0" height="132.0" rx="10" fill="#dde9f7" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="717.0" y="475.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Hematochezia, vitals normal</text>
<text x="603.0" y="495.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• prior episodes, polyps, cancer,</text>
<text x="610.8" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">radiation</text>
<text x="603.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• last colonoscopy? recent</text>
<text x="610.8" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">polypectomy?</text>
<text x="603.0" y="567.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• family history of colorectal cancer</text>

<text x="863.0" y="522.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• tachycardia, hypotension</text>
<text x="863.0" y="540.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• orthostatic drop</text>
<rect x="45.0" y="622.0" width="248.0" height="96.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
