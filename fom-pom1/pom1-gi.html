<script>var D = {"course": "pom1", "block": "gi", "lectures": [{"id": "gi-w10-06", "num": "06", "name": "Anatomy of the Anterior Abdominal Wall", "title": "Anatomy of the Abdominal Wall & GI Tract", "framing": "<p>A tour of the abdomen from the outside in: wall layers and regions, the peritoneum and its folds, then the vessels, lymphatics and nerves of the gut. The organising idea is <strong>embryological origin<\/strong> – it predicts blood supply, drainage and innervation (the pectinate line is the clearest example).<\/p>", "week": 10, "weekLabel": "Week 10 - Motility, Dysphagia & Acid-Related Disease", "items": [{"t": "table", "cols": ["Right", "Middle", "Left"], "rows": [["<strong>Right Hypochondriac<\/strong><br>Liver, gallbladder<br>R kidney<br>Colon, hepatic flexure<br>Lungs", "<strong>Epigastric<\/strong><br>Esophagus, stomach<br>Adrenal glands<br>Liver<br>Transverse colon<br>Abdominal aorta, vena cava<br>Pylorus, duodenum (first part)", "<strong>Left Hypochondriac<\/strong><br>Stomach<br>Pancreas<br>Spleen<br>L kidney<br>Colon, splenic flexure<br>Lungs, cardiac"], ["<strong>Right Lateral/Lumbar<\/strong><br>R kidney<br>Ascending colon<br>Gallbladder<br>Small intestine<br>Duodenum (first part)", "<strong>Umbilical<\/strong><br>Transverse colon<br>Duodenum, pancreas<br>Abdominal aorta, vena cava<br>Small intestine<br>Iliac vessels", "<strong>Left Lateral/Lumbar<\/strong><br>L kidney<br>Descending colon<br>Pancreas<br>Small intestine (jejunum)"], ["<strong>Right Inguinal<\/strong><br>Cecum<br>R ovary/fallopian tube, testicle<br>Appendix<br>Small intestine (ileum)", "<strong>Pubic<\/strong><br>Bladder, uterus<br>Spermatic cords, seminal vesicles<br>Small intestine<br>Iliac vessels<br>Rectum", "<strong>Left Inguinal<\/strong><br>Sigmoid colon<br>L ovary/fallopian tube, testicle<br>Small intestine"]], "lead": "<p><strong>The nine abdominal regions<\/strong> and the organs projecting into each.<\/p>"}, {"t": "table", "cols": ["", "Intraperitoneal", "Retroperitonea rtal hypertension shows itself.<\/p>"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Pre-aortic lymph nodes\"] --> B[\"Confluence of lymphatic trunks\"] --> C[\"Cisterna chyli\"] --> D[\"Thoracic duct\"] --> E[\"Left venous angle<br/>systemic circulation\"]"}, {"t": "head", "html": "<h5>Layers of the gut wall<\/h5><p>Mucosa (epithelium, lamina propria, muscularis mucosae) → submucosa (with Meissner plexus) → muscularis externa (inner circular, Auerbach plexus, outer longitudinal) → serosa.<\/p>"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Common hepatic duct<br/>liver\"] --> C[\"Common bile duct\"]\n B[\"Cystic duct<br/>gallbladder\"] --> C\n C --> E[\"Hepatopancreatic ampulla<br/>of Vater\"]\n D[\"Main pancreatic duct\"] --> E\n E --> F[\"Major duodenal papilla<br/>2nd part of duodenum\"]"}]}, {"id": "gi-w10-08", "num": "08", "name": "PUD, Dyspepsia, & Acid-Lowering Drugs", "title": "Acid-Lowering, Antiemetic & Prokinetic Drugs", "framing": "<p>Three drug families for the upper GI tract. Each class is best learned as <strong>which receptor it hits<\/strong> – that predicts its indication and its side effects.<\/p>", "week": 10, "weekLabel": "Week 10 - Motility, Dysphagia & Acid-Related Disease", "items": [{"t": "table", "cols": ["Class", "Examples", "Mechanism", "Indications", "Adverse effects"], "rows": [["<strong>Proton pump inhibitors<\/strong> (<strong>PPIs<\/strong>)<br>“–<em>prazole<\/em>”<br>More efficacious than H2-blockers because they act on the last step of acid secretion and inhibit Ach, histamine, and gastrin", "Dexlansoprazole<br>Esomeprazole<br>Lansoprazole<br>Omeprazole<br>Pantoprazole<br>Rabeprazole", "<strong>Irreversibly inhibit the H+/K+-ATPase pump in stomach parietal cells<\/strong><br>• Acid labile – enteric coating<br>• Prodrugs<br>• 2-5 days to achieve steady state<br>• Highly selective, short t1/2<br>• Absorbed in the small intestine<br>• Excreted in urine as inactive metabolites<br>• Metabolized in the liver by CYP enzymes", "<strong>PUD<\/strong><br>Gastritis<br><strong>GERD<\/strong>, Barrett esophagus, erosive esophagitis<br>Zollinger-Ellison syndrome<br>Component of therapy for <em>H. pylori<\/em><br>Stress ulcer prophylaxis<br><strong>Take in the morning before a meal<\/strong>", "<strong>Well tolerated, low risk of serious side effects<\/strong><br>Headache, nausea, diarrhea; <strong>hypergastrinemia<\/strong><br>↑ <strong>risk of<\/strong> <em><strong>C. difficile<\/strong><\/em> <strong>infection<\/strong>, pneumonia, acute interstitial nephritis, and <strong>fundic gland polyps<\/strong><br><strong>Vitamin B12 malabsorption<\/strong><br>↓ <strong>serum Mg2+/Ca2+ absorption<\/strong><br>• ↑ risk of bone fractures<br><strong>DDI with clopidogrel<\/strong> – <strong>CYP2C19 metabolism<\/strong><br>• ↓ clopidogrel efficacy; ↑ risk of CV events<br>• Asian populations cannot metabolize PPIs as well; better response, but need lower doses"], ["<strong>H2-blockers<\/strong><br>“–<em>tidine<\/em>”", "Cimetidine (↓ use)<br>Famotidine<br>Nizatidine (patients with liver failure)<br>Ranitidine", "<strong>Reversibly block H2 receptors responsible for stimulating the stomach parietal cells<\/strong>, leading to ↓ H+ secretion<br>• Direct effect on histamine<br>• Indirect effect on gastrin and ACh<br>H2 receptors can become desensitized, leading to <strong>tachyphylaxis<\/strong>", "PUD<br>Gastritis<br>Uncomplicated GERD<br>Dyspepsia<br>Heartburn<br>Prevention: stress ulcers, dietary indiscretion<br><strong>Adjust dose for patients with renal impairment and older adults<\/strong>", "<strong>Well tolerated<\/strong><br>Drowsiness, fatigue, diarrhea, constipation, muscle pain<br><strong>Cimetidine is a potent inhibitor of CYP450<\/strong><br>• Affects metabolism of warfarin, propranolol, and benzodiazepines<br><strong>Anti-androgenic effects<\/strong>:<br>• Prolactin release, galactorrhea<br>• Gynecomastia<br>• Impotence, ↓ libido<br><strong>Can cross BBB<\/strong> – confusion, dizziness, headache<br>↓ renal excretion of creatinine"], ["<strong>Antacids<\/strong>", "Sodium bicarbonate (NaHCO3)", "Weak bases that <strong>neutralize gastric hydrochloric acid<\/strong> to form salt and water<br>• <strong>Rapid onset of action<\/strong><br>• Duration of action depends on gastric emptying", "Symptomatic relief: heartburn, dyspepsia, sour stomach, stress-induced ulcer<br><strong>Take after a meal<\/strong><br><strong>Can affect absorption, bioavailability, or urinary excretion of other drugs by altering gastric and urinary pH or by delaying gastric emptying – space drugs at least 2 hrs apart<\/strong>", "<strong>Metabolic alkalosis<\/strong>, <strong>fluid retention<\/strong>, hypernatremia – <strong>caution in patients with CVD<\/strong><br>Belching/flatulence, nausea, abdominal distention"], ["", "Calcium carbonate (CaCO3)", "<em>As above<\/em>", "<em>As above<\/em>", "<strong>Milk-alkali syndrome<\/strong>: <strong>hypercalcemia<\/strong>, renal stones, metabolic alkalosis – <strong>helps osteoporosis<\/strong><br>Rebound acid ↑"], ["", "Aluminum hydroxide (Al(OH)₃)", "<em>As above<\/em>", "<em>As above<\/em>", "<strong>CHOPS<\/strong>: <strong>constipation<\/strong>, <strong>hypophosphatemia<\/strong>, <strong>o<\/strong>steodystrophy, <strong>p<\/strong>roximal muscle weakness, <strong>s<\/strong>eizures"], ["", "Magnesium hydroxide (Mg(OH)2)", "<em>As above<\/em>", "<em>As above<\/em>", "<strong>Diarrhea<\/strong>, hyporeflexia, hypotension, cardiac arrest, hypophosphatemia, <strong>hypermagnesemia<\/strong>"]], "lead": "<p><strong>Acid-lowering drugs<\/strong> – PPIs act on the final common step, so they beat H2-blockers.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A{\"Cause of N/V?\"} -->|\"Chemo, radiation, post-op\"| B[\"5-HT3 antagonists<br/>-setron\"]\n A -->|\"Migraine, opioid, drug-induced\"| C[\"D2 antagonists<br/>phenothiazines, butyrophenones\"]\n A -->|\"Gastroparesis\"| D[\"Benzamides<br/>domperidone, metoclopramide\"]\n A -->|\"Vestibular, pregnancy\"| E[\"H1 antihistamines<br/>dimenhydrinate, doxylamine\"]\n B -->|\"Chemo N/V not controlled\"| F[\"Cannabinoid<br/>nabilone\"]"}, {"t": "table", "cols": ["Class", "Examples", "Mechanism", "Indications", "Adverse effects"], "rows": [["<strong>5-HT3-receptor antagonists<\/strong><br>“–<em>setron<\/em>”", "Ondansetron<br>Granisetron<br>Dolasetron<br><strong>Palonosetron<\/strong>", "<strong>Block serotonin on peripheral vagal and spinal afferent nerve terminals<\/strong> and in the <strong>central chemoreceptor trigger zone<\/strong><br>↓ GI motility, secretion, pain/discomfort", "<strong>Chemotherapy-induced N/V<\/strong><br><strong>Radiation-induced N/V<\/strong><br><strong>Post-operative N/V<\/strong><br>Uses: children, adults, pregnancy", "<strong>Very well tolerated<\/strong><br>Headache, light-headedness, fatigue, dizziness<br><strong>Constipation<\/strong><br>Ondansetron: ↑ QT interval (palonosetron ↓ risk)<br><strong>Serotonin syndrome<\/strong>: excessive serotonin release"], ["<strong>Dopamine (D2) receptor antagonists<\/strong> (NOT 1st line – side effects)", "<strong>Phenothiazines<\/strong><br>Chlorpromazine<br>Prochlorperazine<br>Olanzapine", "↑ <strong>chemoreceptor trigger zone threshold<\/strong><br><strong>Antihistaminic/anticholinergic actions<\/strong><br>↓ emetic response to the input signals coming from the gut afferent fibers", "<strong>Migraine-associated N/V<\/strong><br><strong>Opioid-induced N/V<\/strong><br>Drug-induced N/V<br>Post-operative N/V", "<strong>CNS effects<\/strong>: sedation, drowsiness, insomnia, anxiety, agitation, restlessness, hyperactive behaviour, personality disorder, psychosis<br><strong>Extrapyramidal effects<\/strong>: parkinsonian features, dystonia, akathisia, dysphagia, facial spasm<br><strong>Elevated prolactin secretion<\/strong>: galactorrhea, gynecomastia, impotence, menstrual disorders<br><strong>Cardiac effects<\/strong>: ↑ QT interval, arrhythmias, tachycardia, hypotension<br><strong>Natriuresis< c form of delta-9-THC", "<strong>Partial agonists of CB1 and CB2 receptors<\/strong><br>↓ GI motility<br>Endocannabinoid system has regulatory functions by <strong>suppressing the release of neurotransmitters<\/strong> (serotonin, ACh, GABA, glutamate)", "<strong>Chemotherapy-induced N/V<\/strong><br>Start with the lowest dose possible<br><strong>Caution<\/strong>: psychiatric patients, DDIs, abuse potential, cardiac patients, elderly patients", "Appetite stimulant, anorexia<br>Sedation, drowsiness, somnolence<br>Agitation, euphoria, confusion, depression, anxiety, hallucination, psychosis, “highs”<br>Hypotension, orthostatic hypotension<br>Constipation<br>Dry mouth"]], "lead": "<p><strong>Antiemetic drug classes<\/strong><\/p>"}, {"t": "table", "cols": ["Class", "Examples", "Mechanism", "Indications", "Adverse effects"], "rows": [["<strong>Dopamine (D2) receptor antagonists<\/strong>", "<strong>Domperidone<\/strong> – does NOT cross BBB", "<strong>D2 receptor antagonists<\/strong>", "<strong>Gastroparesis<\/strong><br>N/V<br><strong>Domperidone contraindicated in patients using QT prolonging agents<\/strong>", "<strong>CNS effects<\/strong>: sedation, drowsiness, insomnia, anxiety, agitation, restlessness, hyperactive behaviour, personality disorder, psychosis<br><strong>Extrapyramidal effects<\/strong>: parkinsonian features, dystonia, akathisia, dysphagia, facial spasm<br><strong>Elevated prolactin secretion<\/strong>: galactorrhea, gynecomastia, impotence, menstrual disorders<br><strong>Cardiac effects<\/strong>: ↑ QT interval, arrhythmias, tachycardia, hypotension<br><strong>Natriuresis<\/strong>: electrolyte imbalance<br><strong>GI motility<\/strong>: diarrhea or constipation"], ["", "<strong>Metoclopramide<\/strong> – crosses BBB, extrapyramidal effects, binds serotonin receptors", "D2 receptor antagonists<br><strong>5-HT4-receptor agonists<\/strong><br>↑ release of ACh by motor neurons<br>↑ GI motility, enhanced gastric emptying", "<em>As above<\/em>", "<em>As above<\/em>"], ["<strong>Serotonin receptor agonists<\/strong>", "<strong>Prucalopride<\/strong>", "<strong>5-HT4-receptor agonists<\/strong><br>↑ GI motility<br>Facilitates cholinergic neurotransmission", "<strong>Chronic idiopathic constipation<\/strong><br>N/V<br><strong>Contraindicated in patients with intestinal bleeding, perforation, or obstruction<\/strong>", "<strong>GI<\/strong>: abdominal pain, diarrhea, flatulence, nausea, swollen abdomen, vomiting<br><strong>CNS effects<\/strong>: dizziness, headache<br><strong>Other<\/strong>: fatigue<br><strong>Serious effects<\/strong>: suicidal thoughts"], ["<strong>Macrolide antibiotics<\/strong>", "<strong>Erythromycin<\/strong>", "Inhibit bacterial protein synthesis<br><strong>Can alter GI motility via activation of motilin receptors in the GI tract<\/strong><br>↑ smooth muscle cell contractility<br>↑ lower esophageal tone<br>Stimulates gastric and small bowel contractility<br>Improve gastric emptying", "<strong>Diabetic gastroparesis<\/strong>", "Diarrhea, loss of appetite, nausea, stomach cramps, vomiting<br><strong>Cardiac effects<\/strong>: ↑ QT interval, Torsades de pointes, ventricular arrhythmia<br><strong>Serious effects<\/strong>: pancreatitis, hepatitis, anaphylaxis, ototoxicity"]]}]}, {"id": "gi-w11-03", "num": "03", "name": "Diarrhea & Malabsorption", "title": "Diarrhea & Malabsorption", "framing": "<p>Diarrhea is a disturbance of the gut’s water balance. The approach sorts it by <strong>duration<\/strong> (acute = infectious, chronic = non-infectious), then <strong>blood<\/strong>, then <strong>mechanism<\/strong> (osmotic, secretory, inflammatory, motility) – the stool osmotic gap separates the first two.<\/p>", "week": 11, "weekLabel": "Week 11 - Absorption, Diarrhea, IBD & Luminal Malignancy", "items": [{"t": "table", "cols": ["Mechanism", "Causes"], "rows": [["<strong>Osmotic<\/strong>: too much water drawn into bowels", "Ingestion (laxatives), maldigestion (pancreatic insufficiency, disaccharidase deficiency), malabsorption (celiac disease), Toddler’s diarrhea (juice)"], ["<strong>Inflammatory<\/strong>: damage to mucosal lining", "Infections, IBD"], ["<strong>Secretory<\/strong>: increased secretion or inhibited absorption", "Neuroendocrine tumours (Zollinger-Ellison syndrome), cholera, chemical stimulants, hormones (VIP)"], ["<strong>Motility<\/strong>: rapid gut transit", "IBS"]], "lead": "<p><strong>Four pathophysiological mechanisms<\/strong><\/p>"}, {"t": "table", "cols": ["", "Small bowel", "Large bowel"], "rows": [["Volume", "Large", "Small"], ["Urgency", "Non-urgent", "Urgent"], ["Frequency", "Infrequent", "Frequent"]], "lead": "<p><strong>Where is it coming from?<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Diarrhea<br/>more than 3 BMs per day or over 200 g per day\"] --> B{\"Duration?\"}\n B -->|\"Under 4 weeks\"| C[\"Acute<br/>usually infectious\"]\n B -->|\"Over 4 weeks\"| D[\"Chronic<br/>usually non-infectious\"]\n C --> E{\"Bloody?\"}\n E -->|Yes| F[\"Dysentery<br/>inflammatory infection\"]\n E -->|No| G[\"Other infectious<br/>e.g. Giardia\"]\n D --> H{\"Bloody?\"}\n H -->|Yes| I[\"IBD\"]\n H -->|No| J[\"IBD, celiac disease,<br/>microscopic colitis\"]\n J --> K{\"Stool osmotic gap?\"}\n K -->|\"Over 50\"| L[\"Osmotic\"]\n K -->|\"Under 50\"| M[\"Secretory\"]"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Cholera toxin\"] --> B[\"Activates adenylate cyclase<br/>ATP to cAMP\"] --> C[\"Increased Cl- secretion<br/>decreased Na+ absorption\"] --> D[\"Water follows NaCl<br/>into small bowel lumen\"] --> E[\"Rice-water diarrhea\"]"}, {"t": "table", "cols": ["Category", "Defect", "Causes"], "rows": [["<strong>Defective intraluminal digestion<\/strong>", "<strong>Defective pancreatic enzymes<\/strong>", "Chronic pancreatitis (kills acinar cells), cystic fibrosis, pancreatic neoplasms, pancreatic surgery"], ["", "<strong>Inactivated pancreatic enzymes<\/strong>", "Hyperacidity (Zollinger-Ellison syndrome)"], ["", "<strong>De cetylcysteine\"] -->|\"replenishes\"| E"}, {"t": "table", "cols": ["Paracetamol-induced ALF", "Non-paracetamol ALF"], "rows": [["Arterial blood pH &lt; 7.3 (irrespective of grade of encephalopathy)", "Prothrombin time &gt; 100 s (INR &gt; 6.5) (irrespective of grade of encephalopathy)"], ["OR all of the following:<br>• Prothrombin time &gt; 100 s (INR &gt; 6.5)<br>• Serum creatinine &gt; 300 μmol/L<br>• Grade III or IV hepatic encephalopathy", "OR any 3 of the following (irrespective of grade of encephalopathy)<br>• Age &lt; 10 or &gt; 40 years<br>• Etiology: non-A/B hepatitis, drug-induced<br>• Duration of jaundice to encephalopathy &gt; 7 days<br>• Prothrombin time &gt; 50 (INR &gt; 3.5)<br>• Serum bilirubin &gt; 300 μmol/L"]], "lead": "<p><strong>King’s College criteria<\/strong> for acute liver failure (referral for transplant).<\/p>"}, {"t": "table", "cols": ["Alcohol use", "Women", "Men"], "rows": [["<strong>Moderate<\/strong>", "Up to 1 drink/day", "Up to 2 drinks/day"], ["<strong>Heavy<\/strong>", "&gt; 2 drinks/day", "&gt; 3 drinks/day"], ["<strong>Binge<\/strong>", "≥ 4 drinks over 2 hrs", "≥ 5 drinks over 2 hrs"]], "lead": "<p>1 standard drink = <strong>14 g / 18 mL / 0.6 oz<\/strong> of pure alcohol.<\/p>"}, {"t": "table", "cols": ["", "Hemochromatosis", "Wilson’s disease", "A1AT deficiency"], "rows": [["<strong>Causes<\/strong>", "Autosomal recessive inheritance<br>Mutation in HFE gene, chromosome 6", "Autosomal recessive inheritance<br>Mutation in ATP7B gene, chromosome 13", "Autosomal codominant inheritance<br>Mutation in SERPINA1 gene, chromosome 14"], ["<strong>Pathology<\/strong>", "Excess iron storage<br>↑ intestinal iron absorption", "Excess serum copper levels<br>Mutant P-type ATPase transporter inhibits the release of copper into bile", "<strong>Liver<\/strong>: misfolded gene product protein aggregates in hepatocellular ER<br><strong>Lungs<\/strong>: uninhibited elastase in alveoli destroys elastic tissue, causing emphysema"], ["<strong>Presentation<\/strong>", "Involves liver, heart (HF), pancreas (<strong>DM-1<\/strong>), skin (<strong>bronze discoloration<\/strong>), synovium, pituitary gland<br>Weakness, weight loss, abdominal pain, loss of libido", "Involves liver, brain, kidneys, corneas<br><strong>Kayser-Fleischer rings<\/strong>: deposits of copper on the outer edges of the corneas<br>Hepatitis, cirrhosis, decompensation<br>Neurologic and psychiatric changes", "Involves liver and lung<br>Young patients with liver damage and dyspnea without a Hx of tobacco smoking"], ["<strong>Dx<\/strong>", "↑ ferritin, ↑ transferrin saturation (&gt; 45%)<br>Genetic testing (C282Y/H63D)<br>Liver biopsy<br><strong>Choosing Wisely: do NOT order HFE genotyping based on serum ferritin values alone to Dx hereditary hemochromatosis<\/strong><br>• Significant false positive rate because of elevations due to inflammation", "↓ ceruloplasmin<br>↑ 24 hr copper collection<br>Liver biopsy (copper quantification)", "↓ A1AT level<br>Phenotype testing (M, S, Z)<br>Liver biopsy (A1AT globules)"], ["<strong>Tx<\/strong>", "Phlebotomy, chelating agents<br>Abstinence from alcohol", "<strong>Copper chelators<\/strong>: penicillamine, trientine, zinc acetate<br>Avoid copper-rich foods<br>Liver transplantation", "Supportive"], ["<strong>Px<\/strong>", "—", "Fatal without treatment", "—"]], "lead": "<p><strong>Inherited metabolic liver disease<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Ascites: diagnostic paracentesis\"] --> B{\"SAAG?\"}\n B -->|\"11 g/L or more\"| C[\"Portal hypertension:<br/>cirrhosis, alcoholic hepatitis, cardiac ascites,<br/>massive liver metastases, portal vein thrombosis,<br/>Budd-Chiari, veno-occlusive disease, myxedema\"]\n B -->|\"Under 11 g/L\"| D[\"Non-portal:<br/>peritoneal carcinomatosis, TB peritonitis,<br/>pancreatic or biliary ascites, nephrotic syndrome,<br/>serositis in connective tissue disease\"]"}, {"t": "table", "cols": ["Old classification", "ISHEN", "Description"], "rows": [["Unimpaired", "—", "No encephalopathy, normal testing"], ["Minimal", "Covert", "Neurophysiological alterations without clinical mental change"], ["Stage 1", "Covert", "Trivial lack of awareness, shortened attention span, altered sleep rhythm"], ["Stage 2", "Overt", "Lethargy or apathy, disorientation for time, dyspraxia, asterixis"], ["Stage 3", "Overt", "Somnolence to semi-stupor, gross disorientation, bizarre behaviour"], ["Stage 4", "Overt", "Coma"]], "lead": "<p><strong>Grading hepatic encephalopathy<\/strong><\/p>"}, {"t": "table", "cols": ["Type", "Diseases"], "rows": [["<strong>Conjugated<\/strong><br>↑ <strong>serum direct bilirubin (&gt; 15%)<\/strong><br><strong>Pathologic<\/strong>", "<strong>Dubin-Johnson syndrome<\/strong>: autosomal recessive condition caused by impaired intrahepatic bilirubin excretion<br>• Absence of the canalicular protein <strong>multidrug-resistant protein 2<\/strong> (<strong>MRP-2<\/strong>)<br>• Functionally normal, enlarged, black (<strong>dark<\/strong>) liver; asymptomatic, chronic/recurrent jaundice<br>• Dx: ↑ serum direct bilirubin, normal CBC, normal liver enzymes, grossly black liver on biopsy"], ["", "<strong>Rotor syndrome<\/strong>: autosomal recessive condition caused by impaired hepatic storage of conjugated bilirubin, which leaks out<br>• Phenotypically similar to Dubin-Johnson syndrome, but milder presentation; normal (<strong>regular<\/strong>) liver"], ["", "<strong>Alagille syndrome<\/strong>: autosomal dominant condition caused by too few bile ducts to drain the bile, which leads to bile build-up in the liver<br>• JAG1 or NOTCH2 gene mutations<br>• Prominent forehead, triangular face, butterfly vertebrae, posterior embryotoxon, tetralogy of Fallot, pulmonary stenosis"], ["", "<strong>Biliary tract obstruction<\/strong>: gallstones, cholangiocarcinoma, pancreatic cancer, liver cancer, liver fluke"], ["", "<strong>Biliary tract disease<\/strong>: primary sclerosing cholangitis, primary biliary cholangitis"], ["<strong>Unconjugated<\/strong><br>↑ <strong>serum indirect bilirubin<\/strong><br><strong>Physiologic or pathologic<\/strong>", "<strong>Crigler-Najjar type 1<\/strong>: autosomal recessive condition caused by a <strong>complete lack of UDP-glucuronyl transferase<\/strong>, the enzyme responsible for conjugation of indirect to direct bilirubin<br>• Normal appearing liver, severe jaundice at birth, colourless bile, kernicterus, lethargy, high-pitched cry<br>• Dx: severe jaundice and icterus in a newborn with severely elevated serum indirect bilirubin<br>• Tx: phototherapy, exchange transfusions, heme oxygenase inhibitors, liver transplant prior to onset of brain damage<br>• <strong>Does NOT respond to phenobarbital<\/strong><br>• Fatal within 18 months after birth if untreated due to severe kernicterus"], ["", "<strong>Crigler-Najjar type 2<\/strong>: less severe form of Crigler-Najjar type 1<br>• Tx: phototherapy; <strong>responds to phenobarbital<\/strong> – ↑ liver enzyme synthesis (UDP-glucuronyl transferase)"], ["", "<strong>Gilbert syndrome<\/strong>: autosomal recessive condition caused by transient reduction in hepatic UDP-glucuronyl transferase activity, which leads to a decrease in bile conjugation/increase in indirect bilirubin<br>• Asymptomatic, mild jaundice – usually an incidental finding in an otherwise healthy young male<br>• Associated with stress, illness, strenuous exercise, and fasting<br>• Dx: ↑ serum indirect bilirubin, normal CBC, normal liver enzymes"], ["", "<strong>Hemolytic disease<\/strong>: sickle cell, glucose-6-phosphate dehydrogenase deficiency, spherocytosis, microangiopathic hemolytic anemia, paroxysmal nocturnal hemoglobinuria, ABO/Rh isoimmunization, autoimmune hemolytic anemia (warm and cold)<br><strong>Ineffective erythropoiesis<\/strong>: vitamin B12/folate deficiency, porphyria, lead poisoning"], ["<strong>Mixed<\/strong>", "<strong>Acquired hepatocellular disease<\/strong>: cirrhosis, hepatitis, drugs (steroids, rifampin, probenecid, ribavirin), liver failure (sepsis)"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Jaundice<br/>bilirubin over 51.3 umol/L\"] --> B{\"Which fraction is raised?\"}\n B -->|\"Direct over 15% - conjugated\"| C[\"Always pathologic\"]\n C --> C1[\"Excretion defect:<br/>Dubin-Johnson, Rotor\"]\n C --> C2[\"Too few ducts: Alagille\"]\n C --> C3[\"Obstruction or biliary disease:<br/>gallstones, tumours, PSC, PBC\"]\n B -->|\"Indirect - unconjugated\"| D[\"Physiologic or pathologic\"]\n D --> D1[\"Less UDP-glucuronyl transferase:<br/>Crigler-Najjar 1 and 2, Gilbert\"]\n D --> D2[\"Overproduction:<br/>hemolysis, ineffective erythropoiesis\"]\n B -->|Mixed| E[\"Hepatocellular disease:<br/>cirrhosis, hepatitis, drugs, sepsis\"]"}, {"t": "table", "cols": ["", "Tissue", "Tumour"], "rows": [["<strong>Benign<\/strong>", "Epithelial", "<strong>Hepatic adenoma<\/strong>: <strong>oral contraceptive use<\/strong>, anabolic steroid use, type I glycogen storage disease/obesity<br>• Surgery if large, symptomatic or high-risk features<br>• HNF1-α inactivated = safest<br>• Inflammatory = intermediate risk; upregulated CRP and amyloid A<br>• <strong>β-catenin activated = high risk<\/strong>"], ["", "Epithelial", "<strong>Bile duct adenoma<\/strong>"], ["", "Non-epithelial", "<strong>Hepatic hemangioma<\/strong> (<strong>most common<\/strong>): venous malformation; often incidental, usually solitary<br>• Dx: radiology – <strong>biopsy contraindicated<\/strong> (hemorrhage)"], ["<strong>Malignant<\/strong>", "Epithelial", "<strong>Hepatocellular carcinoma<\/strong> (<strong>most common 1<\/strong>°): <strong>cirrhosis<\/strong>, <strong>viral hepatitis<\/strong> (<strong>HBV<\/strong>, HCV), tobacco smoking, alcohol, aflatoxin (<em>Aspergillus flavus<\/em>, <em>Aspergillus parasiticus<\/em>), males &gt; 40 years<br>• Asymptomatic, ↑ AFP (30-40%), thickened cell plates<br>• Intrahepatic spread: direct invasion, vascular (portal and hepatic veins), bile ducts<br>• Extrahepatic spread: hematogenous (lung, bone), lymphatic (porta hepatis), direct, peritoneal<br>• Tx: surgery, liver transplantation, radiofrequency ablation, transarterial chemoembolization, SBRT, sorafenib"], ["", "Epithelial", "<strong>Hepatoblastoma<\/strong> (<strong>most common in pediatrics<\/strong>): prematurity, low birth weight<br>• ↑ AFP, enlarged abdomen, anorexia, weight loss<br>• Tx: neoadjuvant therapy (chemotherapy, radiation), surgery, liver transplantation"], ["", "Epithelial", "<strong>Cholangiocarcinoma<\/strong> (intrahepatic bile ducts): <strong>PSC<\/strong>, <strong>ulcerative colitis<\/strong>, liver flukes, HCV, alcohol, HIV, gout, smoking<br>• <strong>Presents late<\/strong>, poor Px"], ["", "Non-epithelial", "<strong>Angiosarcoma<\/strong> (blood vessels): <strong>thorotrast<\/strong>/<strong>vinyl chloride<\/strong> (PVC) exposure, arsenic, sex steroids; older males"], ["", "Non-epithelial", "<strong>Rhabdomyosarcoma<\/strong> (pediatrics)"]]}]}, {"id": "gi-w11-09", "num": "09", "name": "Pharmacology of Prokinetics and Antidiarrheal Drugs", "title": "Antidiarrheal Drugs & GI Pearls", "framing": "<p>Antidiarrheals either <strong>slow the gut<\/strong> (opioid agonists) or <strong>reduce secretion<\/strong> (bismuth, bile acid resins). The second half is a set of daily GI clinical pearls that recur across the block.<\/p>", "week": 11, "weekLabel": "Week 11 - Absorption, Diarrhea, IBD & Luminal Malignancy", "items": [{"t": "head", "html": "<h5>Drug targets in the upper GI tract<\/h5><p>The parietal cell integrates three stimulants – <strong>ACh (M3), gastrin (CCK-B) and histamine (H2)<\/strong> – and two brakes – <strong>somatostatin and prostaglandins<\/strong> – onto one final step, the H+/K+-ATPase. Each drug class blocks a different point.<\/p>"}, {"t": "table", "cols": ["Class", "Examples", "Mechanism", "Indications", "Adverse effects / notes"], "rows": [["<strong>Opioid agonists<\/strong><br>Antimotility agents", "<strong>Loperamide<\/strong> (μ receptors)<br>Available OTC<br>Poor CNS distribution", "Activation of GI opioid receptors ↓ intestinal motility (μ receptors), secretion (δ receptors), and absorption (μ and δ receptors)", "<strong>Acute and IBS-associated chronic diarrhea<\/strong><br><strong>Common adverse effects<\/strong>:<br>• Dry mouth<br>• Abdominal cramps<br>• Anorexia<br>• Flatulence<br>• N/V<br>• Constipation<br>• Euphoria", "Low risk of abuse<br>Extensive hepatic metabolism<br>↑ <strong>tonus of anal sphincter<\/strong> (fecal incontinence use)"], ["", "<strong>Diphenoxylate<\/strong> (μ receptors)<br>Prescribed drug<br>Higher CNS distribution", "<em>As above<\/em>", "<em>As above<\/em>", "Potential for abuse/addiction<br>Commercial preparations contain <strong>atropine<\/strong> to discourage overdose"], ["", "<strong>Eluxadoline<\/strong> (μ and δ receptors)<br>Prescribed drug<br>Some CNS distribution", "<em>As above<\/em>", "<em>As above<\/em>", "Potential for abuse/addiction<br>Spasms in sphincter of Oddi<br>• Abdominal pain, pancreatitis<br>• Contraindicated in patients with a Hx of <strong>pancreatitis<\/strong>, <strong>alcoholism<\/strong>, without a gallbladder"], ["<strong>Bismuth compounds<\/strong><br>Antisecretory agents", "<strong>Bismuth subsalicylate<\/strong><br>Forms salicylic acid in low pH of stomach, which inhibits the production of PGE2", "Exact mechanisms NOT fully determined<br>Stimulate absorption of fluid and electrolytes across the intestinal wall<br>Bind to toxins produced by <em>E. coli<\/em><br>Antimicrobial actions", "<strong>Prevention/treatment of travellers’ diarrhea<\/strong><br>Quadruple therapy for <em>H. pylori<\/em> eradication<br>Heartburn, indigestion, nausea", "<strong>OTC, well-tolerated drugs<\/strong><br>Dark stools (&gt; 99% is excreted in feces)<br>Blackening of the tongue (as a result of bacterial metabolism of bismuth in intestines)<br>Neurotoxicity"], ["<strong>Bile salt-binding resins<\/strong><br>Antisecretory agents", "Cholestyramine<br>Colestipol<br>Colesevelam", "Sequester excess bile salts, preventing water and electrolyte secretion in the colon", "Bile salt-induced diarrhea<br>Pruritus associated with biliary/liver disease<br>Dyslipidemia<br><strong>Caution<\/strong>: take 1 hr before or 4 hrs after taking a second drug", "Affects absorption of amiodarone, NSAIDs, propranolol, warfarin, and steroids<br>↓ absorption of fat-soluble vitamins<br><strong>Common effects<\/strong>: constipation, nausea, bloating<br><strong>Serious effects<\/strong>: heart disease, pancreatitis"]], "lead": "<p><strong>Antidiarrheal drugs<\/strong> – antimotility (opioid) and antisecretory agents.<\/p>"}, {"t": "table", "cols": ["Date", "GI tip of the day"], "rows": [["2022-03-07", "The 2 most common causes of a patient presenting with dysphagia and a documented history of weight loss are esophageal cancer and achalasia. Other causes of dysphagia, such as peptic stricture, are much less likely to result in significant weight loss unless very severe."], ["2022-03-08", "An EGD with esophageal biopsies needs to be considered in a patient with intermittent solid-food dysphagia to rule out eosinophilic esophagitis (EoE) even in the presence of normal endoscopic findings. Eosinophil counts &gt; 15 per hpf in the mid or proximal esophagus is extremely suggestive of EoE and can be treated with PPI, swallowed topical steroids &amp; esophageal dilation."], ["2022-03-09", "The tip for today pertains to GI history taking. For any GI and liver-related illness, always ask about NSAIDs. It is also important to always take a detailed social history including smoking, alcohol, marijuana, and other recreational drug use. Don’t forget to elucidate any family history of GI related malignancy, IBD, celiac or liver disease. Finally, asking about any previous endoscopic evaluations can help to determine the need for further endoscopic investigation."], ["2022-03-10", "Typical symptoms of GERD (i.e. heartburn &amp; regurgitation) are the most likely to respond to treatment with Proton Pump Inhibitors (PPIs). Other symptoms potentially associated with GERD include: cough, shortness of breath, hoarseness of voice and dental enamel erosion. These so called “extra esophageal” symptoms of GERD are less likely to respond to PPIs, mainly because they are less likely to be actually caused by GERD. If in doubt whether the symptoms are related to GERD or not, a 24 hour pH study can be helpful."], ["2022-03-11", "Cyclical attacks of nausea and vomiting, known as Cannabis Hyperemesis Syndrome (CHS), have been reported with the long-term use of marijuana; It is generally associated with heavy users of THC (i.e. Daily use for months to years) and patients often report compulsive bathing in hot water as this may relieve their symptoms. The only effective treatment is Cannabis cessation."], ["2022-03-21", "Weight loss is not a typical symptom of IBS, so in a patient presenting with possible IBS and weight loss other causes need to be excluded. For treatment of IBS always remember dietary interventions (i.e. low FODMAPs diet), psychosocial interventions and tailor medical therapy based on predominant symptom complex."], ["2022-03-22", "Always consider whether a digital rectal exam is necessary when examining a patient with GI symptoms. This simple exam is often overlooked and can be quite useful and even lifesaving if pathology such as a rectal mass is found. This should always be performed in a patient presenting with rectal bleeding. Ensure patients are informed about what you are going to be doing, obtain consent and drape patient appropriately. Remember to always have a chaperone present. There are very few contraindications to rectal exam: febrile neutropenia, no anus, no finger!"], ["2022-03-23", "If suspicious for celiac disease, one can screen by ordering TTG antibodies. Always remember to order an IgA level anytime you order TTG antibodies, because TTG can be falsely negative if IgA is low. If TTG antibodies are positive, one should always go on to confirm the diagnosis with endoscopy and duodenal biopsies. Iron-deficiency anemia is the most common extraintestinal manifestation of celiac disease."], ["2022-03-24", "When working up iron deficiency anemia, don’t forget to treat the iron deficiency while investigations are pending!! Do not use serum iron to diagnose iron deficiency anemia… use ferritin or transferrin saturation instead as they are a more reliable indicator of actual iron stores."], ["2022-03-25", "Remember melena is more typical of an Upper GI bleed but occasionally can be a manifestation of a proximal Lower GI bleed. Similarly, bright red blood per rectum, is usually a manifestation of a lower GI bleed, but one always needs to be alert to the possibility that it represents a brisk Upper GI bleed, which would be suggested if the patient is hemodynamically unstable. The most important management principal for GI bleeds is to always resuscitate the patient aggressively first, then consider scoping them!"], ["2022-03-28", "All patients with chronic liver disease, with or without cirrhosis, should be vaccinated for Hep A and Hep B, unless they have active infection or are serologically immune. If a patient with compensated liver disease were to acquire an active infection with either Hepatitis A or Hepatitis B, this can lead to severe decompensation and this can be prevented through vaccination."], ["2022-03-29", "Early liver cirrhosis can be present with a normal appearing liver on imaging in addition to normal liver enzymes and synthetic liver bloodwork. High clinical suspicion is necessary. Unexplained splenomegaly, dilated portal vein, and thrombocytopenia can be early clues to the presence of cirrhosis."], ["2022-03-30", "Statins are safe to use in patients with cirrhosis. Liver enzymes should be routinely monitored, and these medications can be continued as long as liver enzymes do not elevate more than 2 times from baseline after starting statins."], ["2022-03-31", "Patients with acute pancreatitis needs fluids – lots of it. Ringer’s lactate is generally preferred, and patients often require 4-5L of fluid to make up for their fluid deficit. They also require pain control and reintroduction of nutrition as soon as they are able to tolerate it (i.e. symptoms improving). Typically they should be progressed from clear fluids to full fluids to diet as tolerated. If symptoms recur with reintroduction of food, then you may have to back off temporarily and if prolonged NPO is expected or required may need to consider supplemental nutrition with NJ tube or rarely TPN."], ["2022-04-01", "In patients with hepatic encephalopathy ammonia does not correlate with the degree of encephalopathy and should not be used in the diagnosis, rather the clinical assessment is key in making the diagnosis."]], "lead": "<p><strong>GI tips of the day<\/strong> – clinical pearls from the block.<\/p>"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Suspect celiac disease\"] --> B[\"TTG antibodies<br/>+ total IgA level\"]\n B -->|\"Low IgA\"| C[\"TTG may be falsely negative\"]\n B -->|\"TTG positive\"| D[\"Confirm: endoscopy<br/>+ duodenal biopsies\"]"}]}, {"id": "gi-w12-02", "num": "02", "name": "Histology & Pathology of the Liver and Pancreatobiliary System", "title": "GI Histology & Physiology", "framing": "<p>The structure and function of the digestive tract: segment histology, the hepatic lobule, then how food is moved (motility), acid is controlled, and nutrients, water, bilirubin and bile are handled. The organising idea is that <strong>every secretion and movement is regulated by the same few signals<\/strong> – ACh, gastrin, histamine, somatostatin, CCK and secretin.<\/p>", "week": 12, "weekLabel": "Week 12 - Liver, Biliary Tract & Pancreas", "items": [{"t": "table", "cols": ["Segment", "Histology"], "rows": [["<strong>Esophagus<\/strong>", "Nonkeratinized stratified squamous epithelium<br>Upper 1/3 = striated muscle<br>Lower 2/3 = smooth muscle"], ["<strong>Stomach<\/strong>", "Gastric glands – parietal cells, chief cells"], ["<strong>Duodenum<\/strong>", "Villi and microvilli<br><strong>Brunner glands<\/strong>: bicarbonate-secreting cells of the submucosa<br><strong>Crypts of Lieberkühn<\/strong>: contain stem cells that replace enterocytes, goblet cells, and Paneth cells<br>Plicae circulares"], ["<strong>Jejunum<\/strong>", "Villi<br>Crypts of Lieberkühn<br><strong>Arcades: few, large loops<\/strong><br><strong>Long vasa recta, less fat in mesentery<\/strong><br><strong>Plicae circulares = large, tall, dense<\/strong>"], ["<strong>Ileum<\/strong>", "Villi<br>Crypts of Lieberkühn<br><strong>Peyer patches<\/strong>: lymphoid aggregates in the lamina propria and submucosa<br><strong>Arcades: many short loops<\/strong><br><strong>Short vasa recta, more fat in mesentery<\/strong><br><strong>Plicae circulares = low, sparse<\/strong>"]], "lead": "<p><strong>Histology of the digestive tract<\/strong> – the jejunum vs ileum distinction is a classic.<\/p>"}, {"t": "table", "cols": ["Zone", "Features", "Affected first by"], "rows": [["<strong>Zone I<\/strong> – periportal", "Best oxygenated (resists circulatory compromise)", "Viral hepatitis, ingested toxins"], ["<strong>Zone II<\/strong> – intermediate", "—", "Yellow fever"], ["<strong>Zone III<\/strong> – pericentral", "Least oxygenated; highest cytochrome P-450; most sensitive to metabolic toxins", "<strong>Ischemia<\/strong>; site of <strong>alcoholic hepatitis<\/strong>"]], "lead": "<p><strong>Acinar zones<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Oral phase<br/>bolus formed, tongue propels it back\"] --> B[\"Pharyngeal phase<br/>epiglottis covers trachea, UES opens\"] --> C[\"Esophageal phase<br/>peristalsis to LES and stomach\"]"}, {"t": "table", "cols": ["Pattern", "Description"], "rows": [["<strong>Tonic contraction<\/strong>", "Prolonged, continuous (not rhythmic) contraction lasting minutes to hours; in the <strong>sphincters<\/strong> (contracted at rest)"], ["<strong>Peristalsis<\/strong>", "Reflex to luminal distension: a segment contracts while the adjacent segment relaxes; oral → caudal"], ["<strong>Secondary peristalsis<\/strong>", "Reflex contraction triggered by esophageal distension to clear remaining food"], ["<strong>Vagovagal reflex<\/strong>", "Relaxation of gastric fundus and body in response to esophageal distension"], ["<strong>Segmentation<\/strong>", "Mixes food with GI juices: a segment contracts at both ends, then a third contraction in the middle; movement can be retrograde"], ["<strong>Migrating motor complex (MMC)<\/strong>", "Stomach and small bowel contractions in the <strong>fasting<\/strong> state; cyclic; prevent bacterial overgrowth; initiated by <strong>motilin<\/strong>, repeat every 90–120 min<br>Phase I quiescent → phase II small irregular → phase III forceful regular"], ["<strong>Retropulsion<\/strong>", "Antral contents propelled back into the gastric body when the pylorus closes forcefully – mixes and grinds food into chyme"], ["<strong>Haustrations<\/strong>", "Segmental contractions of the large intestine that mix feces and allow fluid reabsorption in the ascending colon; 8–15 hrs; net movement to the transverse colon"], ["<strong>Mass movements<\/strong>", "Large contractions 1–3×/day pushing stool toward the rectum"], ["<strong>Gastrocolic reflex<\/strong>", "↑ frequency of mass movements after a meal"]], "lead": "<p><strong>Patterns of GI motility<\/strong><\/p>"}, {"t": "table", "cols": ["Pathway", "Stimulates", "Inhibits"], "rows": [["<strong>Paracrine<\/strong>", "ACh →<strong>histamine<\/strong> (H2 receptors) → gastric acid", "<strong>Prostaglandins<\/strong>⊣ gastric acid"], ["<strong>Hormonal<\/strong>", "ACh →<strong>gastrin-releasing peptide<\/strong> (<strong>GRP<\/strong>, post-ganglionic fibres of vagus nerve) →<strong>gastrin<\/strong>→ gastric acid", "<strong>Somatostatin<\/strong>⊣ histamine, gastrin, gastric acid<br><strong>Secretin<\/strong>, <strong>CCK<\/strong> (CCK-AR/CCK-BR), <strong>gastric inhibitory polypeptide<\/strong> (<strong>GIP<\/strong>) ↓ gastric acid"], ["<strong>Other<\/strong>", "<strong>Cephalic phase<\/strong> (ANS): smell, sight, taste, thought, swallowing food<br><strong>Gastric phase<\/strong> (vagovagal reflex, ENS reflexes): presence of partially digested peptides in the stomach<br><strong>Intestinal phase<\/strong>: presence of partially digested peptides in the proximal portion of the small intestine<br><strong>Serotonin<\/strong>→ GI motility<br><strong>Motilin<\/strong> → MMC", "↑ H+ (low pH)<br>Distention of duodenum<br>Fat and protein breakdown products in duodenum<br><strong>Vasoactive intestinal peptide<\/strong> (<strong>VIP<\/strong>), <strong>nitric oxide<\/strong> (<strong>NO<\/strong>) = smooth muscle relaxation, ↓ GI functions<br><strong>Dopamine<\/strong> (D2 receptors), <strong>endogenous opioids<\/strong>⊣ GI motility"]], "lead": "<p><strong>Regulation of gastric acid secretion and GI motility<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Cephalic phase: sight, smell, taste<br/>Gastric phase: distension, peptides\"] --> B[\"Vagus - ACh\"]\n B --> C[\"GRP\"] --> D[\"G cells release gastrin\"]\n B --> E[\"ECL cells release histamine\"]\n D --> E\n B --> F[\"Parietal cell H+ secretion\"]\n D --> F\n E -->|\"H2 receptors\"| F\n F --> G[\"Low pH, duodenal distension,<br/>fat and protein in duodenum\"]\n G --> H[\"Somatostatin, secretin, CCK, GIP\"]\n H -.->|\"inhibit\"| F\n I[\"Prostaglandins\"] -.->|\"inhibit\"| F"}, {"t": "table", "cols": ["Nutrient", "Absorbed as", "Mechanism", "Clinical significance"], "rows": [["<strong>Carbohydrates<\/strong> (4 kcal/g)<br>D: mouth, duodenum<br>A: small intestine", "Monosaccharides (glucose, galactose)", "<strong>SGLT1<\/strong> (<strong>Na+-dependent cotransport<\/strong>)", "<strong>Transported to liver<\/strong> through portal vein<br>Associated with lactose intolerance<br>Monosaccharides <br>Pruritus, fatigue, jaundice, xanthomas, malabsorption, hepatocellular failure, portal hypertension", "RUQ pain (radiates to R scapula)<br>Postprandial pain", "RUQ pain (radiates to R scapula)<br>Postprandial pain<br>Nausea, vomiting, bloating<br>↑ <strong>serum IgG4<\/strong>: chronic acalculous cholecystitis"], ["<strong>Dx<\/strong>", "<strong>Histology<\/strong>: stricturing and dilation with beading<br>↑ ALP, ↑↑ IgM<br>MRCP/ERCP<br>Liver biopsy", "<strong>Histology<\/strong>: <strong>granulomas<\/strong> present within portal tracts, lymphocyte infiltrates, <strong>no bile ducts<\/strong><br>↑↑ ALP, ↑ AST, ↑ ALT, ↑ GGT<br>Cholesterol (HDL), IgM, cryoglobulins<br><strong>Anti-mitochondrial Ab<\/strong><br><strong>Liver biopsy<\/strong> (<strong>definitive Dx<\/strong>)", "<strong>Ultrasound<\/strong> (<strong>gold standard<\/strong>)<br>MRCP, ERCP<br>Endoscopic ultrasound", "PEx: <strong>Murphy sign<\/strong><br>Ultrasound<br><strong>Hepatobiliary iminodiacetic acid scan/ cholescintigraphy<\/strong> (<strong>gold standard<\/strong>)"], ["<strong>Tx<\/strong>", "ABX and stents, liver transplant", "<strong>None<\/strong> – symptom relief<br><strong>Ursodiol<\/strong><br>Liver transplantation", "<strong>Cholecystectomy<\/strong><br>Dietary changes, avoid fatty foods", "<strong>ABX<\/strong><br><strong>Cholecystectomy once stable<\/strong>"], ["<strong>Px<\/strong>", "↑ risk of cholangiocarcinoma and gallbladder cancer", "Progressive and leads to liver cirrhosis", "<strong>Complications<\/strong>: cholecystitis, acute pancreatitis, acute cholangitis, recurrent biliary colic, choledocholithiasis, porcelain gallbladder", "<strong>Complications<\/strong>: gangrene, perforation"]], "lead": "<p><strong>Cholangitis and gallstone disease<\/strong> – PSC = primary sclerosing cholangitis; PBC = primary biliary cholangitis.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Gallstone\"] --> B{\"Where does it lodge?\"}\n B -->|\"Cystic duct, transient\"| C[\"Biliary co <br><strong>May occur after large meal or binge drinking<\/strong>", "<strong>Persistent, deep-seated pain that is unresponsive to antacids and worsens with ingestion of fatty foods and alcohol<\/strong><br>Pancreatic insufficiency, steatorrhea<br>Weight loss<br>Fat-soluble and B12 vitamin deficiencies", "Silent until late disease progression<br><strong>Painless obstructive jaundice<\/strong><br><strong>Unexplained weight loss<\/strong>, malaise, vomiting<br>Epigastric pain that radiates to the middle of the back<br>Migratory thrombophlebitis (Trousseau sign)<br>Onset of DM"], ["<strong>Dx<\/strong>", "Leukocytosis, ↑ <strong>serum lipase/amylase<\/strong><br><strong>Histology<\/strong>: <strong>acinar cell injury<\/strong>, <strong>duct obstruction<\/strong>, <strong>fat necrosis<\/strong> with pale basophilic calcium soaps, hemorrhage, necrotic debris, inflammatory response, edema<br>Ultrasound, <strong>CT scan<\/strong><br><strong>High probability CBD stone: ERCP<\/strong><br><strong>Low probability CBD stone: MRCP, EUS<\/strong>", "<strong>Histology<\/strong>: irregular ducts, loss of normal architecture and cytology, fibrous stroma; <strong>potential for misdiagnosis as malignancy<\/strong><br><strong>Pancreatic calcification, steatorrhea, DM<\/strong><br>↓ fecal elastase<br>↑ 72-hr fecal fat collection<br><strong>CT scan<\/strong>/<strong>MRI<\/strong> (most common)<br><strong>Endoscopic ultrasound<\/strong> (most sensitive)", "<strong>Biopsy<\/strong>: ERCP biliary brushing (low yield)<strong>, EUS FNA<\/strong> (<strong>higher yield<\/strong>)<br><strong>CA 19-9 tumour marker<\/strong> (monitoring)<br>CT scan"], ["<strong>Tx<\/strong>", "Rest<br>Abstinence from alcohol, AA<br>IV fluid and electrolyte replacement<br>NPO<br>Analgesics: opioids (meperidine)<br>Anti-emetics<br>Surgery (trauma, ductal stones, obstructive lesions, infected pancreatic necrosis)", "Abstinence from alcohol, smoking cessation<br>Replace nutritional deficiencies<br><strong>Pain<\/strong>: avoid alcohol and large meals, non-narcotics, narcotics, stent, surgery (Puestow procedure)<br><strong>Malabsorption<\/strong>: enzyme replacement, dietary fat restriction", "<strong>If caught early with no evidence of local or metastatic spread, the only chance at cure is surgery + adjuvant chemotherapy<\/strong><br>Head: pancreaticoduodenectomy (Whipple operation)<br>Tail: distal pancreatectomy<br><strong>Palliative<\/strong>:<br>• CBD obstruction: ERCP + stent, percutaneous biliary drain<br>• Gastric outlet obstruction: duodenal stent, gastrojejunostomy operation<br>• EUS + celiac plexus block for pain"], ["<strong>Px<\/strong>", "<strong>Complications<\/strong>: phlegmon, necrosis, abscess, pseudocyst, hemorrhage, portal vein thrombosis, splenic vein thrombosis", "<strong>Complications<\/strong>: <strong>pseudocyst<\/strong>, portal vein thrombosis, splenic vein thrombosis, CBD obstruction, duodenal obstruction, fistulas, ascites", "4th leading cause of cancer-related death<br>5-year survival &lt; 5%"]], "lead": "<p><strong>Pancreas pathologies<\/strong><\/p>"}, {"t": "table", "cols": ["Extra-abdominal", "Intra-abdominal"], "rows": [["More prominent on PEx when patient is asked to contract their abdominal wall or perform the Valsalva maneuver<br>Usually benign<br>DDx: large epidermal cysts, lipomas, abdominal wall hernia, abdominal wall hematoma (rectus sheath hematoma), malignant = sarcomas", "More likely to be malignant – should always be imaged<br>Anatomical location and Hx will determine the DDx"]], "lead": "<p><strong>Abdominal mass<\/strong> – usually an incidental finding on exam. Extra-abdominal = abdominal wall and subcutaneous tissue; intra-abdominal = within the cavity.<\/p>"}, {"t": "table", "cols": ["Indirect hernia", "Direct hernia"], "rows": [["Predisposed by <strong>patency of processus vaginalis<\/strong><br>More common (2/3)<br>Travels within inguinal canal within processus vaginalis inside spermatic cord<br>Enters canal through <strong>deep inguinal ring<\/strong>, <strong>lateral to inferior epigastric vessels<\/strong><br>Exits via superficial inguinal ring, <strong>often passing into scrotum/labium majus<\/strong><br>Covered by <strong>all 3 layers of spermatic fascia<\/strong>", "Predisposed by <strong>weakness of anterior abdominal wall<\/strong> (<strong>Hesselbach’s Triangle<\/strong>)<br>Less common (1/3)<br>Traverses the medial third of inguinal canal (peritoneum, transversalis fascia)<br>Enters canal <strong>medial to inferior epigastric vessels<\/strong><br>Exits via superficial ring, <strong>rarely passing into scrotum/labium majus<\/strong><br>Covered by <strong>external spermatic fascia<\/strong>"]]}, {"t": "table", "cols": ["Internal (above pectinate)", "External (below pectinate)"], "rows": [["Caused by prolapsed rectal mucosa containing <strong>internal rectal venous plexus<\/strong><br>Older age, chronic constipation; bright red blood<br><strong>Not painful<\/strong><br>Tx: <strong>banding<\/strong>, <strong>injection<\/strong>", "Caused by thromboses in <strong>external rectal venous plexus<\/strong> and covered by skin<br>Pregnancy, chronic constipation, prolonged toilet sitting/straining<br><strong>Painful<\/strong><br>Tx (within 72 hrs): <strong>clot excision<\/strong><br>Tx (beyond 72 hrs): <strong>stool softeners<\/strong>, <strong>pain control with NSAIDs<\/strong>, <strong>sitz bath<\/strong>"]]}]}, {"id": "gi-w12-07", "num": "07", "name": "Nutrition & Supplements", "title": "Clinical Nutrition, GI Hormones & Investigations", "framing": "<p>How to feed a patient who can’t eat (enteral if the gut works, parenteral if not), the hormones and secretions that run the gut, and the imaging and blood tests used to investigate it – ending with the approach to nausea and vomiting.<\/p>", "week": 12, "weekLabel": "Week 12 - Liver, Biliary Tract & Pancreas", "items": [{"t": "table", "cols": ["Tube", "Indications", "Complications"], "rows": [["<strong>Nasogastric tube<\/strong>", "Strokes, augmentation of feeding", "Food aversion, sinusitis, aspiration"], ["<strong>Nasojejunal tube<\/strong>", "Strokes, <strong>risk of aspiration with oral and NG feeding<\/strong>", "Complicated patients, food aversion, sinusitis, aspiration"], ["<strong>Gastrostomy tube<\/strong>", "Long-term feeding, low aspiration risk", "Insertion, pulling out, peritonitis, tube blockage, bleeding"], ["<strong>Gastrojejunostomy<\/strong>", "Long-term, continuous feeding (12-16 hrs/day); aspiration risk", "Insertion, pulling out, peritonitis, tube blockage, bleeding"]]}, {"t": "table", "cols": ["Formula", "Description"], "rows": [["<strong>General purpose<\/strong>", "Isotonic; majority are lactose and gluten free<br>Caloric density = 1.0-1.4 cal/cc; protein = 35-45 gm/L intact protein, fats = 30-40% calories"], ["<strong>Nutrient dense<\/strong>", "High osmolality; designed for fluid restriction or very high calorie – stroke, Parkinson’s disease, functioning small intestine<br>Caloric density = 1.5-2.2 cal/cc"], ["<strong>High nitrogen<\/strong>", "Patients with protein losses (burn exudates, fistulae), catabolic patients with high protein needs (trauma, sepsis, critical illness)<br>Caloric density = 1.0-2.0 cal/cc; protein = 50-80 g/L"], ["<strong>Chemically defined<\/strong> (<strong>elemental<\/strong>)", "Optimize nutrient absorption in compromised GI function – IBD, short bowel syndrome, pancreatic or bile salt insufficiency<br>Components given in digested form (no digestion needed, very low in fat)"], ["<strong>Semi-elemental<\/strong>", "Lower osmolarity than elemental; requires some digestion – Crohn disease, pancreatitis<br>Protein source is peptide source, mixture of long and short chain fatty acids"], ["<strong>Renal<\/strong>", "Low electrolyte, low protein"], ["<strong>Diabetic<\/strong>", "Low carbohydrate (35% of calories), added fibre"], ["<strong>Hepatic<\/strong>", "Low protein, ↑ branched-chain amino acids"]], "lead": "<p><strong>Enteral formulas<\/strong> – general, specialized and disease-specific.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Patient needs nutritional support\"] --> B{\"Functioning gut?\"}\n B -->|Yes| C[\"Enteral nutrition\"]\n C --> D{\"Expected duration?\"}\n D -->|\"Under 3 weeks\"| E[\"NG or ND tube\"]\n D -->|\"Over 6 weeks\"| F[\"Gastrostomy or jejunostomy\"]\n B -->|No| G[\"Parenteral nutrition\"]\n G --> H{\"NPO long enough?<br/>7 days nourished, 5 days malnourished\"}\n H -->|Yes| I[\"PPN: mostly fat + 10% glucose<br/>or TPN: mostly 25% glucose via central line\"]\n H -->|No| J[\"Wait - do not start TPN yet\"]"}, {"t": "table", "cols": ["Cell and location", "Substance", "Action", "Regulation"], "rows": [["<strong>G cells<\/strong><br>Antrum of stomach, duodenum, jejunum", "<strong>Gastrin<\/strong>", "↑ <strong>gastric H+ secretion<\/strong>, growth of gastric mucosa, and gastric motility<br>↑ by chronic PPI use, in chronic atrophic gastritis (<em>H. pylori<\/em>), and in Zollinger-Ellison syndrome (gastrinoma)", "↑: stomach distention/alkalinization, amino acids, peptides, vagal stimulation via <strong>gastrin-releasing peptide<\/strong> (<strong>GRP<\/strong>)<br>↓: pH &lt; 1.5"], ["<strong>D cells<\/strong><br>Pancreatic islets, GI mucosa", "<strong>Somatostatin<\/strong>", "↓ <strong>gastric acid<\/strong>, VIP, GIP, histamine, secretin, and motilin secretion; pancreatic and small intestine fluid secretion, gallbladder contraction, and insulin and glucagon release<br>Inhibits absorption of glucose, amino acids, and triglycerides", "↑: acid<br>↓: vagal stimulation"], ["<strong>I cells<\/strong><br>Duodenum, jejunum", "<strong>Cholecystokinin<\/strong> (<strong>CCK<\/strong>)", "↑ pancreatic secretion, gallbladder contraction, and sphincter of Oddi relaxation<br>↓ <strong>gastric emptying<\/strong> to provide enough time for digestion of fats in the upper GI tract<br>CCK activates CCK-A and CCK-B receptors in many parts of the body, including the brain<br>Inhibits appetite; stimulates the growth of exocrine pancreas", "↑: fatty acids, amino acids<br>↓: secretin"], ["<strong>S cells<\/strong><br>Duodenum", "<strong>Secretin<\/strong>", "↑ pancreatic HCO3– (allows pancreatic enzymes to function), bile, and pepsin secretion<br>↓ gastric acid secretion; stimulates the growth of exocrine pancreas", "↑: acid, fatty acids in lumen of duodenum"], ["<strong>K cells<\/strong><br>Duodenum, jejunum", "<strong>Gastric inhibitory peptide<\/strong> (<strong>GIP<\/strong>)/<strong>glucose-dependent insulinotropic peptide<\/strong>", "Exocrine: ↓ gastric H+ secretion<br>Endocrine: ↑ insulin release<br>↓ gastric emptying", "↑: fatty acids, amino acids, oral glucose"], ["<strong>M cells<\/strong><br>Upper small intestine", "<strong>Motilin<\/strong>", "Stimulates contraction of smooth muscle cells in the stomach and intestines<br>Produces <strong>migrating motor complexes<\/strong> (<strong>MMCs<\/strong>) during fasting<br>Motilin receptor agonists (erythromycin) are used to stimulate intestinal peristalsis", "↑: fasting state"], ["Parasympathetic ganglia in sphincters, gallbladder, small intestine", "<strong>Vasoactive intestinal polypeptide<\/strong> (<strong>VIP<\/strong>)", "↑ intestinal water and electrolyte secretion, and relaxation of intestinal smooth muscle and sphincters<br><strong>VIPoma<\/strong>: non-α, non-β islet cell pancreatic tumour that secretes VIP", "↑: distention and vagal stimulation<br>↓: adrenergic input"], ["<em>As above<\/em>", "<strong>Nitric oxide<\/strong>", "↑ smooth muscle relaxation, including lower esophageal sphincter (LES)<br>Loss of NO secretion is implicated in ↑ LES tone of achalasia", "—"], ["Stomach", "<strong>Ghrelin<\/strong>", "↑ appetite (↓ after gastric bypass surgery)<br>↑ in Prader-Willi syndrome", "↑: fasting state<br>↓: food"], ["<strong>Enterocytes<\/strong><br>Small and large intestines", "—", "Digestion<br>Absorption of nutrients and ions", "—"]], "lead": "<p><strong>GI regulatory substances<\/strong><\/p>"}, {"t": "table", "cols": ["Cell and location", "Product", "Action", "Regulation"], "rows": [["<strong>Parietal cells<\/strong><br>Body of stomach", "<strong>Gastric acid<\/strong> (<strong>HCl<\/strong>)", "↓ stomach pH<br>Activates pepsinogen, kills pathogens, digests food", "↑: histamine, vagal stimulation (ACh), gastrin<br>↓: somatostatin, GIP, prostaglandin, secretin"], ["", "<strong>Intrinsic factor<\/strong> (<strong>IF<\/strong>)", "Vitamin B12-binding protein required for B12 uptake/absorption in terminal ileum", "—"], ["<strong>Chief cells<\/strong><br>Body and fundus of stomach", "<strong>Pepsin<\/strong>", "Protein digestion – pepsinogen is converted to pepsin in the presence of H+", "↑: vagal stimulation (ACh), local acid"], ["", "<strong>Gastric lipase<\/strong>", "Fat digestion", "—"], ["<strong>Mucosal cells<\/strong><br>Antrum of stomach, duodenum (<strong>Brunner glands<\/strong>), salivary glands, pancreas", "<strong>Bicarbonate<\/strong> (<strong>HCO3–<\/strong>)", "Forms a protective barrier against gastric acid and pathogens<br>Neutralizes acid", "↑: pancreatic and biliary secretin with secretin"], ["<strong>Enterochromaffin-like cells<\/strong><br>Body and fundus of stomach", "<strong>Histamine<\/strong>", "Stimulates gastric acid secretion", "—"], ["<strong>Enterochromaffin cells<\/strong><br>Small intestine, appendix", "<strong>Serotonin<\/strong>", "Stimulates secretion of fluids by intestinal cells and <strong>motility<\/strong><br>Mediates <strong>pain perception<\/strong> and sensation of nausea; relays emetic signals to the CNS", "—"], ["", "<strong>Substance P<\/strong>", "Involved in nociceptive and emetic pathways<br>Stimulates intestinal motility and gallbladder contraction", "—"], ["<strong>Goblet cells<\/strong><br>Small and large intestines", "<strong>Mucus<\/strong>", "Lubrication – barrier against shear stress, passage of feces<br>Shields the intestinal mucosa from peptic digestion and chemical damage", "↑: irritant substances (toxins, heavy metals, spices, medications), PGE2"], ["<strong>Paneth cells<\/strong><br>Small and large intestines", "<strong>Lysozyme, phospholipase A2, defensins<\/strong>", "Defensive actions against pathogens", "—"]], "lead": "<p><strong>GI secretory products<\/strong> (blank first cell = same cell type as above)<\/p>"}, {"t": "table", "cols": ["Modality", "When to order"], "rows": [["<strong>Radiographs<\/strong>: form of electromagnetic radiation with 10 nm wavelength<br>• <strong>High absorption = white = metal, bone<\/strong><br>• <strong>Low absorption = black = fat, air<\/strong>", "Quick assessment of GI tract:<br>• <strong>Bowel obstruction<\/strong> (colonic volvulus)<br>• Concern for <strong>bowel perforation<\/strong> (<strong>free air<\/strong>)<br>Looking for radiopaque objects – <strong>renal stone calcifications<\/strong>, foreign body<br>Placement of NG tubes<br><strong>Cannot reasonably assess solid organs<\/strong> – limited tissue/organ differentiation"], ["<strong>Ultrasound<\/strong>: uses sound waves with frequencies above the range of human hearing and records the way sound is reflected back from various tissues<br>• <strong>Black = fluid<\/strong><br>• Patients should fast for at least <strong>4 hrs<\/strong> prior to reduce bowel gas<br>• Best for <strong>children<\/strong> and <strong>pregnant women<\/strong> – no radiation<br>• Portable for very sick or injured patients", "Evaluating <strong>solid organs<\/strong> – liver, kidney, spleen; <strong>difficult to evaluate pancreas<\/strong><br>Assessing <strong>fluid-filled structures<\/strong> – gallbladder, biliary system<br>Distinguishing solid vs. cystic lesion<br>Evaluating for ascites<br>Limited bowel imaging – appendix; intussusception in children"], ["<strong>Computed tomography<\/strong> (<strong>CT/CAT scan<\/strong>): an x-ray based technique<br>• <strong>Workhorse of GI imaging<\/strong><br>• IV contrast can worsen acute renal failure (contrast-induced nephropathy)<br><strong>CT colonography<\/strong>: inflate the colon with CO2 to distend the colon and highlight masses/polyps within the colon", "Great for acute abdomen NYD – perforation/free air, inflammation, calcification, abscess, abdominal aortic aneurysm (AAA) ruptures<br>Evaluating <strong>solid organs<\/strong> (<strong>use IV contrast<\/strong>)<br>• Acute: pancreatitis, hepatitis, jaundice<br>• Chronic: cirrhosis<br>Evaluating <strong>small bowel<\/strong> or <strong>colon<\/strong> – SBO, appendicitis, diverticulitis<br><strong>Cancer imaging<\/strong> – surveillance, diagnosis, staging, follow-up"], ["<strong>Magnetic resonance imaging<\/strong> (<strong>MRI<\/strong>): measures the behaviour of protons in different chemical environments when exposed to a magnetic field<br>• For abdominal imaging, patient has to be able to hold their breath 10-15s<br><strong>Magnetic resonance cholangiopancreatography<\/strong> (<strong>MRCP<\/strong>): produces detailed images of the hepatobiliary and pancreatic systems", "Evaluating <strong>solid organs<\/strong> – liver, pancreas<br>Bowel imaging – Crohn’s disease in children; appendicitis in pregnant women<br><strong>NOT good for abdominal pain NYD – use ultrasound or CT<\/strong>"]], "lead": "<p><strong>Investigations – imaging modalities<\/strong><\/p>"}, {"t": "table", "cols": ["AXR view", "Shows"], "rows": [["<strong>Supine abdomen<\/strong>", "Dilated bowel"], ["<strong>Upright abdomen<\/strong>", "Air/fluid levels in bowel"], ["<strong>Upright diaphragmatic<\/strong>", "Free air below the diaphragm"], ["<strong>Lateral decubitus<\/strong>", "For patients who cannot sit or stand"]], "lead": "<p><strong>Abdominal x-ray views<\/strong><\/p>"}, {"t": "table", "cols": ["", "Small bowel", "Colon"], "rows": [["<strong>Location<\/strong>", "Central", "Picture frame"], ["<strong>Diameter<\/strong>", "&lt; 3 cm", "&lt; 6 cm (cecum &lt; 9 cm)"], ["<strong>Fecal content<\/strong>", "Rarely", "Usually"]], "lead": "<p><strong>Small bowel vs colon on AXR<\/strong> – normal upper limits of diameter (3-6-9).<\/p>"}, {"t": "table", "cols": ["Category", "Enzyme", "About", "Hepatic causes of ↑", "Non-hepatic causes"], "rows": [["<strong>Hepatocellular<\/strong><br><strong>Normal &lt; 40<\/strong><br><strong>ALT &gt; AST in most liver disease<\/strong><br><strong>AST &gt; ALT in alcoholic liver disease<\/strong>", "<strong>Alanine aminotransferase<\/strong> (<strong>ALT<\/strong>)", "Catabolizes amino acids to form oxaloacetate and enter the citric acid cycle<br>Intracellular (cytosol) enzyme found in hepatocytes, kidney cells, skeletal muscle, heart<br><strong>Sensitive and specific for liver disease<\/strong><br>Half-life = 47 hrs", "<strong>Acute viral hepatitis<\/strong><br>• A-E, EBV, CMV, HSV<br><strong>Drug-induced liver injury<\/strong><br>Ischemic hepatitis<br>Autoimmune hepatitis<br>Wilson disease<br>Acute bile duct obstruction<br>Acute Budd-Chiari syndrome<br>Hepatic artery ligation", "Skeletal muscle damage<br>Cardiac muscle damage<br>Thyroid disease<br>Macro-AST<br>Strenuous exercise<br>Heat stroke<br>Hemolysis<br>Adrenal insufficiency"], ["", "<strong>Aspartate aminotransferase<\/strong> (<strong>AST<\/strong>)", "Catabolizes amino acids to form pyruvate and enter the citric acid cycle<br>Intracellular (cytosol, mitochondria) enzyme found in hepatocytes, skeletal muscle, heart, brain, RBCs<br><strong>More sensitive but less specific<\/strong><br>Half-life = 17 hrs", "", ""], ["<strong>Cholestatic<\/strong>", "<strong>Alkaline phosphatase<\/strong> (<strong>ALP<\/strong>)", "Canalicular enzyme that plays a role in bile production<br>Synthesized in liver, bone, intestine, and placenta<br>Elevated in all forms of cholestatic disease<br>ALP can be fractionated:<br>• Bone fraction is heat labile<br>• Liver fraction is heat stable", "<strong>Bile duct obstruction<\/strong><br><strong>Bile duct stricture<\/strong><br>Ductopenia<br>AIDS cholangiopathy<br>Cholestatic liver diseases<br>Medications<br>Drug-induced liver injury<br>Infiltrative liver diseases<br>Hepatic abscess", "<strong>Pregnancy<\/strong> (third trimester)<br><strong>Bone disease<\/strong><br>Chronic renal failure<br>Congestive heart failure<br>Lymphoma<br>Normal childhood growth<br>Infection, inflammation"], ["", "<strong>Gamma glutamyl transferase<\/strong> (<strong>GGT<\/strong>)", "Catalyzes transfer of gamma-glutamyl group from peptides to other amino acids<br>Found in hepatic and biliary epithelial cells<br>Induced by alcohol intake<br>Useful for confirming hepatobiliary disease", "", "Pancreatic<br>Renal/intestinal disease<br>Anticonvulsants<br>Oral contraceptives<br>Alcohol"]], "lead": "<p><strong>Liver enzyme markers<\/strong> – hepatocellular vs cholestatic pattern.<\/p>"}, {"t": "table", "cols": ["Test", "About", "Liver disease", "Other causes"], "rows": [["<strong>Albumin<\/strong>", "Synthesized exclusively by hepatocytes<br>Half-life = 18-20 days<br>Most important plasma protein; significant contribution to oncotic pressure", "↓ in chronic liver diseases", "↓: malnutrition, protein losing enteropathies, nephrotic syndrome, chronic infections"], ["<strong>Bilirubin<\/strong>", "Breakdown product of heme-containing proteins<br>Found in the blood in two fractions:<br>• <strong>Unconjugated fraction<\/strong>: insoluble in water, bound to albumin in the blood<br>• <strong>Conjugated bilirubin fraction<\/strong>: modified by the liver, water soluble", "↑ direct bilirubin in various liver diseases", "—"], ["<strong>Prothrombin/ INR<\/strong>", "Blood clotting factors are made exclusively in hepatocytes (<strong>NOT factor VIII<\/strong>)<br>Serum half-lives are as short as 6h (factor VII)<br>Prothrombin collectively measures factors II, V, VII, and X", "↑ in chronic liver disease", "—"]], "lead": "<p><strong>Liver function tests<\/strong><\/p>"}]}, {"id": "gi-w13-01", "num": "01", "name": "Approach to Abdominal Pain & Distension", "title": "Acute Abdomen, Obstruction & Esophageal Disease", "framing": "<p>The approach to abdominal pain is to decide first whether this is an <strong>acute (surgical) abdomen<\/strong> – perforation, ischemia, obstruction or bleeding – then work up the rest. The lecture also covers congenital gut anomalies and the major esophageal diseases.<\/p>", "week": 13, "weekLabel": "Week 13 - Abdominal Pain, Obstruction & Anorectal Disease", "items": [{"t": "table", "cols": ["", "Small bowel ischemia", "Large bowel ischemia"], "rows": [["<strong>Arterial occlusive<\/strong>", "<strong>Common<\/strong>", "Less common"], ["<strong>Venous occlusive<\/strong>", "<strong>Uncommon<\/strong>", "Rare"], ["<strong>Low flow<\/strong>", "Rare", "<strong>Common<\/strong>"], ["<strong>Surgery<\/strong>", "<strong>Common<\/strong>", "Rare"], ["<strong>Successful medical management<\/strong>", "Rare", "<strong>Common<\/strong>"], ["<strong>Revascularization procedures<\/strong>", "Uncommon", "Never performed"], ["<strong>Mortality<\/strong>", "55-85%", "&lt; 10%"]]}, {"t": "table", "cols": ["", "Small bowel (SBO)", "Large bowel (LBO)"], "rows": [["<strong>Causes<\/strong>", "<strong>Adhesions, hernias, neoplasm<\/strong><br>Intussusception, gallstone ileus, foreign body, stricture", "<strong>Neoplasm, diverticular disease, volvulus<\/strong>"], ["<strong>Presentation<\/strong>", "Colicky abdominal pain, progressive nausea and vomiting, obstipation<br>Bloating<br>Initial episode of diarrhea<br>Initial ↑ in bowel sounds, followed by absent or “tinkling” sounds", "<strong>Closed loop bowel obstruction<\/strong>: intestinal loop is obstructed at two sites<br>• <strong>LBO – cannot be decompressed through the ileocecal valve<\/strong><br>• Greater risk of vascular compromise<br>• Vomiting and NG tubes fail to decompress the loop<br>• Adhesive band, volvulus, internal hernia<br>• Colicky pain progressed to continuous pain, tenderness over affected loop on exam, may progress to peritonitis, patient progressively unwell"], ["<strong>Exam<\/strong>", "Uncomfor idic taste in mouth", "Longstanding GERD<br>Progressive dysphagia<br>Weight loss<br>Cough<br>Nocturnal regurgitation/aspiration", "<strong>Insidious<\/strong><br>Dysphagia (late), odynophagia<br>Weight loss, emesis<br>Hemorrhage<br>Aspiration 2° to TEF formation<br>AC: heartburn"], ["<strong>Dx<\/strong>", "Manometry shows normal or ↑ resting LES pressure, ↓ LES relaxation, and absence of peristalsis<br>Barium swallow shows a dilated esophagus with a distal “<strong>bird-beak<\/strong>” narrowing", "Endoscopy", "<strong>Clinical Hx<\/strong> (classic symptoms + absence of alarm features)<br><strong>Response to PPI trial<\/strong><br>Esophageal manometry<br><strong>24-hr ambulatory pH monitoring<\/strong><br>• Failed PPI trial<br>• pH &lt; 4, 5 cm above LES<br>• Normal test r/o GERD<br><strong>Endoscopy is NOT diagnostic<\/strong>", "<strong>Endoscopy<\/strong>: salmon-coloured esophageal mucosa extending upward from the gastroesophageal junction (in contrast to normal pale pink squamous epithelial mucosa)<br><strong>Biopsy<\/strong>: intestinal-type goblet cells in the columnar mucosa of the esophagus", "<strong>Endoscopy + biopsy<\/strong> (<strong>gold standard<\/strong>)<br>• Periodic screening endoscopy recommended in high-risk patients<br><strong>Contrast radiography<\/strong>: identifies esophageal strictures, ulcerations, and mucosal abnormalities<br><strong>Barium swallow<\/strong><br><strong>Staging<\/strong>: CXR, CT chest/abdomen"], ["<strong>Tx<\/strong>", "<strong>Curative<\/strong>: surgery – myotomy<br><strong>Symptom management<\/strong>: balloon dilation, botulinum toxin injection, CCBs", "Vasopressin<br>PPIs<br>Somatostatin, octreotide<br>Sclerotherapy, <strong>variceal band ligation<\/strong><br>Balloon tamponade<br>Prophylaxis: <strong>beta blockers<\/strong>, <strong>TIPS<\/strong>", "<strong>Lifestyle modifications<\/strong>: elevate head of bed, dietary changes, weight loss, smoking cessation, ↓ alcohol, stop harmful medications<br><strong>Aci
