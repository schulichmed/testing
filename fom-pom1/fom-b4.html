<script>var D = {"course": "fom", "block": "b4", "lectures": [{"id": "b4-w13-01", "num": "01", "name": "Homeostatic Control of Body Temperature", "title": "Homeostatic Control of Body Temperature", "framing": "<p>Body temperature is a <strong>regulated variable held by negative feedback<\/strong>: thermoreceptors report to the <strong>hypothalamus<\/strong>, which drives effectors that either produce or lose heat — every effector in the table below simply runs in one of two directions.<\/p>", "week": 13, "weekLabel": "Week 13 - Fever, Microbes & Innate Immunity", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"Thermoreceptors<br/>skin, spinal cord, viscera, brain\"] --> B[\"Hypothalamus integrates\"]\n B --> C{\"Temperature too high or too low?\"}\n C -->|\"Too cold\"| D[\"Posterior hypothalamus<br/>heat production\"]\n C -->|\"Too warm\"| E[\"Anterior hypothalamus<br/>heat loss\"]\n D --> F[\"Vasoconstriction, shivering,<br/>brown fat thermogenesis, heat-seeking\"]\n E --> G[\"Vasodilation, sweating,<br/>panting, cool-seeking\"]\n F --> H[\"Core temperature restored\"]\n G --> H\n H -->|\"negative feedback\"| A"}, {"t": "table", "cols": ["Type", "Effector", "Heat production", "Heat loss"], "rows": [["<strong>Physiological<\/strong>", "Brown adipose tissue thermogenesis (thyroid hormones)", "Activated", "Inhibited"], ["", "Skin blood flow (sympathetic/parasympathetic)", "Vasoconstriction", "Vasodilation"], ["", "Sweat glands (acetylcholine)", "Inhibited", "Sweating"], ["", "Evaporation in the lungs", "Inhibited", "Exhalation of warm air, panting"], ["", "Shivering thermogenesis (can be voluntarily suppressed)", "Activated", "Inhibited"], ["<strong>Behavioural<\/strong>", "Postural changes", "Reduce exposed surface", "Increase exposed surface"], ["", "Temperature choice", "Heat-seeking", "Cool-seeking"], ["", "Altering microenvironment", "Nesting, social huddling", "Air conditioning"]], "lead": "<p><strong>Effectors<\/strong> — each one runs in the heat-production or the heat-loss direction.<\/p>"}]}, {"id": "b4-w13-03", "num": "03", "name": "Innate Immunity Refresher", "title": "Innate Immunity Refresher", "framing": "<p>A refresher on the four arms that fight pathogens — <strong>antibodies and B cells, complement, T cells, and non-specific effector cells<\/strong> — organised around one idea: <strong>innate recognition (PRRs, complement) starts inflammation, and antigen-presenting cells hand it over to specific B and T cell responses<\/strong>.<\/p>", "week": 13, "weekLabel": "Week 13 - Fever, Microbes & Innate Immunity", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"Tissue injury or infection\"] --> B[\"Clotting factors cleave complement\"]\n A --> C[\"PRRs e.g. TLRs on mast cells and macrophages<br/>detect PAMPs and DAMPs\"]\n C --> D[\"Mast cells release histamine\"]\n D --> E[\"Vasodilation + ↑ permeability<br/>plasma, antibody, complement enter tissue\"]\n C --> F[\"Macrophages secrete TNF, IL-1,<br/>chemokines IL-8, C3a\"]\n F --> G[\"Endothelial adhesion molecules ↑\"]\n G --> H[\"Neutrophils, T cells, macrophages arrive\"]\n H --> I[\"Dendritic cells carry antigen<br/>to draining lymph node\"]\n I --> J[\"Antigen presented to T cells<br/>and supplied to B cells\"]"}, {"t": "table", "cols": ["Function", "Mechanism", "Isotype"], "rows": [["<strong>Opsonisation for phagocytosis<\/strong>", "Pathogens tagged for destruction by macrophages and neutrophils: Fab binds antigen on the pathogen, Fc binds receptors on the phagocyte", "IgG"], ["<strong>Activating complement<\/strong>", "Fab binds antigen on the pathogen, Fc binds <strong>C1<\/strong> → enzyme cascade → lysis by the membrane attack complex (MAC)", "IgM, IgG"], ["<strong>Neutralising toxins<\/strong>", "Antibody binds secreted toxins and neutralises them; antibody–toxin complexes are removed by phagocytosis", "—"], ["<strong>Blocking attachment<\/strong>", "Antibodies immobilise and agglutinate agents by binding surface antigens, preventing attachment to tissues (e.g. intestinal mucosa) or cell penetration", "—"]], "lead": "<p><strong>Antibody effector functions<\/strong><\/p>"}, {"t": "table", "cols": ["Isotype", "Key features"], "rows": [["<strong>IgM<\/strong> — μ heavy chain<br>(primary response)", "<strong>First antibody made in an infection<\/strong> — needs no class switch<br>Surface antibody on B cells: integral membrane protein with a <strong>transmembrane domain<\/strong> at the bottom of Fc<br>Secreted as a <strong>pentamer<\/strong> (10 antigen-binding sites) by activated B cells and plasma cells<br>Good at activating complement via its Fc regions and at agglutination"], ["<strong>IgG<\/strong> — γ heavy chain<br>(secondary response)", "<strong>Most abundant antibody in blood<\/strong><br>Four subclasses; production depends on cytokines present (IL-4, IL-2)<br><strong>Monomeric<\/strong>, very high antigen affinity<br><strong>Rapidly leaves the bloodstream into tissues<\/strong>, especially inflamed sites<br><strong>Only class actively transported across the placenta<\/strong> — sole antibody protection of newborns<br>Very good at complement activation, opsonisation via Fc receptors, and toxin neutralisation"], ["<strong>IgA<\/strong> — α heavy chain", "Low blood concentration (monomer and dimer)<br><strong>Most abundant and active in mucosal secretions, as a dimer<\/strong> — primary defence at bronchioles, nasal mucosa, prostate, vagina, intestine<br>Abundant in saliva, tears, <strong>breast milk<\/strong> (especially colostrum)"], ["<strong>IgE<\/strong> — ε heavy chain", "Low blood concentration — tightly bound to Fcε receptors on mast cells and basophils<br><strong>Type I hypersensitivity<\/strong>: allergy, asthma, anaphylaxis<br>Greatly ↑ in helminth infection"], ["<strong>IgD<\/strong> — δ heavy chain", "Surface antibody on B lymphocytes; antigen receptor needed for B cell activation"]], "lead": "<p><strong>Immunoglobulin isotypes<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Stem cell in bone marrow\"] --> B[\"Pre-B cell rearranges heavy chain<br/>+ surrogate light chain\"]\n B --> C{\"Activates BTK?\"}\n C -->|\"No\"| D[\"Try second allele<br/>or pre-B cell dies\"]\n C -->|\"Yes\"| E[\"Light chain rearranged<br/>surface IgM + IgD\"]\n E --> F[\"Naïve B cell in lymphoid organs\"]\n F --> G[\"Binds native antigen<br/>receptor-mediated endocytosis\"]\n G --> H[\"Peptide loaded on MHC II\"]\n H --> I[\"Presents to CD4+ Th cell<br/>IL-4 released\"]\n I --> J[\"Proliferation\"]\n J --> K[\"Plasma cells secrete antibody\"]\n J --> L[\"Memory B cells\"]"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Classical pathway<br/>IgG or IgM Fc bound to antigen<br/>C1, C4, C2\"] --> C[\"C3 split\"]\n B[\"Alternate pathway<br/>pathogen surface<br/>Factor B, D, properdin\"] --> C\n C --> D[\"C3a<br/>mast cells, chemotaxis\"]\n C --> E[\"C3b<br/>opsonin via CR3\"]\n E --> F[\"C5 convertase splits C5\"]\n F --> G[\"C5a<br/>anaphylatoxin, chemotaxis\"]\n F --> H[\"C5b binds target\"]\n H --> I[\"+ C6 + C7<br/>inserts into membrane\"]\n I --> J[\"+ C8 + up to 16 C9<br/>= MAC pore\"]\n J --> K[\"Osmotic lysis\"]"}, {"t": "table", "cols": ["", "MHC class I", "MHC class II"], "rows": [["Expressed on", "All cells except RBCs", "Only antigen-presenting cells (APC)"], ["Structure", "Class I protein + β2-microglobulin", "α chain + β chain, with a transmembrane segment anchoring them to the cell surface"], ["Presents to", "<strong>CD8+ cytotoxic T cells<\/strong>", "<strong>CD4+ helper T cells<\/strong>"], ["Role", "Samples the cell's internal contents for the immune system; everyone's MHC differs (except identical twins), so self can be told from foreign", "Presents antigen to helper T cells → both humoral (antibody) and cell-mediated immunity"]], "lead": "<p><strong>Major histocompatibility complex<\/strong> — human MHC proteins = <strong>human leukocyte antigens (HLA)<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Lymphoid stem cell in bone marrow\"] --> B[\"Pre-T cell travels to thymus\"]\n B --> C[\"TcR chains rearranged, linked to CD3\"]\n C --> D[\"Double positive CD4+ CD8+\"]\n D --> E{\"Binding to self MHC?\"}\n E -->|\"None\"| F[\"No survival signal<br/>dies - most cells\"]\n E -->|\"Very strong\"| G[\"Self-reactive<br/>killed\"]\n E -->|\"Weak\"| H[\"Survives\"]\n H --> I[\"Naïve CD4+ helper T cell\"]\n H --> J[\"Naïve CD8+ cytotoxic T cell\"]"}, {"t": "table", "cols": ["Cell", "Key features"], "rows": [["<strong>Monocytes<\/strong>", "Circulate in blood after leaving the BM, then enter tissue and mature into macrophages"], ["<strong>Macrophages<\/strong>", "Activated by Th-derived cytokines (IFN) or contact with bacteria/bacterial products<br>① <strong>Phagocytosis<\/strong> — remove inflammatory products, invading organisms, immune complexes, toxins, dying cells<br>② <strong>APC in secondary responses<\/strong> — activate memory T cells locally, quicker than transporting antigen to the draining node<br>③ <strong>Cytokine secretion<\/strong> — IL-1, IL-6, TNF"], ["<strong>NK cells<\/strong> = large granular lymphocytes (LGL)", "Share some surface markers with T cells; functionally like CTL but <strong>no TcR<\/strong><br>Do <strong>not<\/strong> need specific antigen on MHC to kill<br>Make large amounts of TNF-α → binds TNF receptor on targets → apoptosis"], ["<strong>Neutrophils<\/strong> = polymorphonuclear cells (PMN)", "Very short-lived (8 h after release from BM)<br>Attracted by chemotactic factors — <strong>first cells to arrive at inflammation<\/strong><br>Phagocytic killing: O2-dependent (O2–, H2O2), nitrogen-dependent (NO), and independent (defensins, digestive enzymes)"], ["<strong>Eosinophils<\/strong>", "Phagocytic cells"], ["<strong>Mast cells<\/strong> (tissue)", "High-affinity Fc receptors for IgE; stimulated by anaphylatoxins and cross-linking of surface IgE<br>Granules of preformed mediators (histamine, TNF-α); stimulation also → prostaglandins and leukotrienes"], ["<strong>Basophils<\/strong> (blood)", "High-affinity Fc receptors for IgE; type I hypersensitivity"]], "lead": "<p><strong>Effector cells of the immune system<\/strong><\/p>"}, {"t": "table", "cols": ["Cytokine", "Secreted by", "Effects"], "rows": [["<strong>IL-1<\/strong>", "Monocytes, macrophages, dendritic cells", "↑ endothelial adhesion molecules → <strong>transmigration<\/strong> of immune cells into tissue<br>Activates helper T cells<br>Promotes B cell maturation and clonal proliferation<br>Binds hypothalamic endothelial receptors and resets the thermoregulatory centre → fever — <strong>endogenous pyrogen<\/strong>"], ["<strong>IL-2<\/strong>", "Helper T cells", "Stimulates proliferation of antigen-primed helper T cells and NK cells<br>IL-2 + IL-4 → activated B cells make IgM and resist class switch to IgG"], ["<strong>IL-4<\/strong>", "Th2 cells", "↑ MHC II on resting B cells and macrophages<br>Stimulates proliferation and differentiation of activated B cells<br>IL-4 alone → plasma cell secreting <strong>IgE<\/strong> and other allergy-related antibodies<br>IL-4 + IL-10 → ↓ activity of activated macrophages"], ["<strong>IL-5<\/strong>", "Th2 cells", "Growth and differentiation of <strong>eosinophils<\/strong>"], ["<strong>IL-6<\/strong>", "Th2 cells, monocytes, macrophages, BM cells", "Proliferating B cells → plasma cells; stimulates antibody secretion<br>Helps myeloid stem cells differentiate<br>Stimulates <strong>hepatocytes<\/strong> to make acute phase proteins — <strong>C-reactive protein<\/strong>"], ["<strong>IL-8<\/strong> (chemokine)", "Macrophages, endothelial cells", "Chemotactic for <strong>neutrophils<\/strong>"], ["<strong>IL-10<\/strong>", "Th2 cells", "<strong>Inhibits macrophage cytokine production<\/strong> → down-regulates Th1<br>Down-regulates MHC II on APC"], ["<strong>IL-12<\/strong>", "Monocytes, macrophages, dendritic cells", "Used by APC to activate T cells and drive them down the <strong>Th1<\/strong> pathway<br>Opposes IL-4's effects on APC-stimulated T cells"], ["<strong>IFN-γ<\/strong>", "Activated T cells, NK cells", "Activates macrophages — better at killing intracellular pathogens (↑ H2O2, NO, lysozyme)<br>↑ MHC II on APC<br>From Th1 cells, down-regulates Th2 → class switch to IgG<br>Delayed-type hypersensitivity, inflammation, antibody production, viral infection"], ["<strong>TNF-α<\/strong>", "Monocytes, macrophages", "Binds TNF receptors → caspase pathway → apoptosis<br>Recruits neutrophils, monocytes, T cells, NK cells by changing endothelial adhesion molecules<br>Resets the hypothalamic thermoregulatory centre → fever — <strong>endogenous pyrogen<\/strong><br>Overproduction → tissue-destructive inflammation: arthritis, <strong>septic shock<\/strong>"], ["<strong>TGF-β<\/strong>", "Platelets, macrophages, lymphocytes", "↑ IL-1 production<br><strong>Down-regulates excess macrophage and T cell activation/proliferation<\/strong><br>Class switch to <strong>IgA<\/strong> in proliferating B cells<br>Chemoattractant for monocytes and macrophages<br>Aids wound healing — limits injury inflammation"]]}]}, {"id": "b4-w13-05", "num": "05", "name": "Microbiology Lab", "title": "The Microbiology Laboratory", "framing": "<p>How a specimen becomes a result: the lab's value depends on <strong>getting the right specimen, before antibiotics, to the lab fast<\/strong>, and then on choosing between <strong>direct methods<\/strong> (microscopy, culture, molecular, antigen) and <strong>indirect ones<\/strong> (serology).<\/p>", "week": 13, "weekLabel": "Week 13 - Fever, Microbes & Innate Immunity", "items": [{"t": "table", "cols": ["Phase", "Tasks"], "rows": [["Pre-analytic", "Positive identification, patient preparation, sample collection, sample integrity"], ["Analytic", "Standardisation, operator competence, analysis, quality assurance"], ["Post-analytic", "Result printing, interfacing, reporting, communicating"]], "lead": "<p><strong>Phases of testing<\/strong><\/p>"}, {"t": "table", "cols": ["Infecti ia<\/em>, <em>Cryptosporidium<\/em>"]], "lead": "<p><strong>Common GI pathogens<\/strong><\/p>"}, {"t": "table", "cols": ["Category", "Meaning", "MIC (example)", "Zone (example)"], "rows": [["<strong>Susceptible<\/strong>", "Inhibited by usually achievable concentrations at the recommended dose for the site of infection", "≤ 4", "≥ 20"], ["<strong>Intermediate<\/strong>", "MIC approaches attainable blood/tissue levels; response may be lower than for susceptible isolates; implies efficacy where the drug is physiologically concentrated or when a higher-than-normal dose can be used", "8–16", "15–19"], ["<strong>Resistant<\/strong>", "Not inhibited by usually achievable concentrations with normal dosing", "≥ 32", "≤ 14"]]}, {"t": "table", "cols": ["Approach", "Test", "Principles"], "rows": [["<strong>Direct<\/strong> (presence)", "<strong>Microscopy<\/strong>", "Magnifies objects too small for the naked eye; characterises cultivated organisms<br>Types: <strong>light<\/strong>, <strong>fluorescence<\/strong>, dark field, electron<br>Uses: rapid preliminary/final identification, detecting several organisms in one specimen or ones hard to culture, evaluating specimens, judging clinical significance, pre-culture information, choosing further tests"], ["", "<strong>Culture<\/strong>", "Multiplies organisms in medium under controlled conditions<br>Media: <strong>liquid = broth<\/strong>, <strong>solid = agar plate<\/strong>; nutritive (general purpose), enrichment, selective, differential<br>Colony shape: punctiform (pinpoint), circular, filamentous, irregular, rhizoid, curled · elevation: flat, raised, convex, umbonate, umbilicate, growth into media · margin: entire (smooth), irregular, filamentous<br>Identification: phenotypic, molecular, MALDI-TOF mass spectrometry<br>Followed by <strong>antimicrobial susceptibility testing<\/strong>"], ["", "<strong>Molecular<\/strong>", "Direct analysis of nucleic acid sequence — amplification or non-amplification<br><strong>PCR<\/strong rgical site infection, septic arthritis, vertebral osteomyelitis/discitis", "<strong>Non-invasive<\/strong>: pharyngitis (strep throat), cellulitis<br><strong>Invasive<\/strong>: bacteremia, TSS, <strong>necrotizing fasciitis<\/strong>, endometritis<br><strong>Post-infectious<\/strong>: rheumatic fever (rheumatic heart disease), post-streptococcal glomerulonephritis"], ["Transmission", "Contact", "Droplet/contact"], ["Colonises", "Nares, axilla, groin (skin folds) — loves to form biofilms", "Nasopharynx"], ["Virulence: fibrinogen manipulation", "<strong>Coagulase<\/strong>: secreted protein that binds and activates prothrombin<br><strong>Clumping factors (ClfA, ClfB)<\/strong>: surface proteins binding fibrinogen → clumping<br>Both drive platelet–fibrin <strong>vegetations on heart valves<\/strong> (platelet activation and adhesion in a fibrin matrix), which can embolise → renal infarction", "<strong>M-protein<\/strong>: multifunctional surface protein binding fibrinogen, IgG and complement regulatory proteins<br>M-protein-defective strains are readily phagocytosed<br>With recurrent infection, anti-M-protein antibodies (α-helical coiled-coil) may cross-react with cardiac <strong>tropomyosin<\/strong> → autoimmune <strong>rheumatic fever<\/strong>"], ["Adhesion proteins", "Fibronectin, fibrinogen", "Fibronectin, fibrinogen"], ["Hemolysin", "Alpha-hemolysin", "Streptolysin O"], ["Immune evasion", "<strong>Protein A<\/strong> binds IgG in an orientation that does not promote phagocytosis<br><strong>Chemotaxis inhibitory protein (CHIP)<\/strong> binds leukocyte chemotaxis receptors so they cannot follow a chemokine gradient", "<strong>M-protein<\/strong>: binds IgG, factor H<br>Cell-envelope protease <strong>SpyCEP<\/strong> degrades chemokines → impaired neutrophil recruitment"]], "lead": "<p><strong>Important Gram-positive cocci<\/strong> — <em>S. aureus<\/em> and group A strep are the common causes of soft tissue infection.<\/p>"}]}, {"id": "b4-w13-07", "num": "07", "name": "The Normal Healthy Microbiome", "title": "The Human Microbiome", "framing": "<p>The same microbe can be harmless or pathogenic depending on <strong>where it is<\/strong>: the organising idea is the spectrum from <strong>commensal → coloniser → infection<\/strong>, plus <strong>dysbiosis<\/strong> when the community itself shifts.<\/p>", "week": 13, "weekLabel": "Week 13 - Fever, Microbes & Innate Immunity", "items": [{"t": "table", "cols": ["Site", "Commensals", "Colonisers", "Infection", "Dysbiosis"], "rows": [["<strong>Skin<\/strong>", "<em>Staphylococcus<\/em>, <em>Streptococcus<\/em>, <em>Propionibacterium<\/em>, <em>Corynebacterium<\/em>, <em>Lactobacillus<\/em>, <em>Candida<\/em>", "Wounds colonised with <em>Pseudomonas<\/em>", "Compartment breach → <strong>cellulitis, impetigo, erysipelas, abscess<\/strong> (<em>S. aureus<\/em>, GAS)", "Eczema (less CoNS producing antimicrobial peptides)"], ["<strong>Mouth<\/strong>", "<em>S. pneumoniae<\/em>, <em>S. anginosus<\/em>, <em>Peptostreptococcus<\/em>, <em>Fusobacterium<\/em>, <em>Parvimonas micra<\/em>, <em>Candida<\/em>", "<em>S. aureus<\/em>, <em>S. pneumoniae<\/em>, <em>Moraxella catarrhalis<\/em>, <em>Haemophilus influenzae<\/em>", "Compartment breach → dental abscess, deep neck space infection<br><strong>Pharyngitis<\/strong>: GAS, adenovirus<br>Poor dental hygiene → plaque, gingivitis", "—"], ["<strong>Gut<\/strong>", "<em>S. anginosus<\/em>, <em>Enterococcus<\/em>, <em>E. coli<\/em>, <em>Klebsiella pneumoniae<\/em>, <em>Proteus<\/em>, <em>Bacteroides fragilis<\/em>, <em>Candida<\/em>", "—", "<strong>Colitis<\/strong>: <em>Salmonella<\/em>, <em>Shigella<\/em>, <em>Campylobacter<\/em>, <em>C. difficile<\/em><br>Compartment breach → <strong>peritonitis<\/strong>: <em>E. coli<\/em>, <em>K. pneumoniae<\/em>, <em>Enterobacter<\/em>, <em>B. fragilis<\/em>", "IBD (ulcerative colitis, Crohn's), IBS, <em>C. difficile<\/em>"], ["<strong>Vagina<\/strong>", "<em>Lactobacillus<\/em>, <em>Candida<\/em>", "—", "Compartment breach → <strong>PID<\/strong>: <em>E. coli<\/em>, anaerobes<br>Outsider infection: gonorrhea, chlamydia", "Bacterial vaginosis, vulvovaginal candidiasis"]]}]}, {"id": "b4-w13-09", "num": "09", "name": "Approach to a Patient with Fever", "title": "Approach to a Patient with Fever", "framing": "<p>A fever workup runs in a fixed order — <strong>safety, then stability and sepsis screen, then history, exam, differential, investigations and treatment<\/strong> — with the thresholds and the history shifting by age group (children, adults, older adults).<\/p>", "week": 13, "weekLabel": "Week 13 - Fever, Microbes & Innate Immunity", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"Patient with fever\"] --> B[\"Safety check<br/>hand hygiene + PPE\"]\n B --> C{\"Stable? Vitals + sepsis screen<br/>qSOFA adults, SIRS pediatrics\"}\n C -->|\"2+ points\"| D[\"High risk / sepsis<br/>resuscitate, full septic workup,<br/>empiric antibiotics\"]\n C -->|\"Stable\"| E[\"History<br/>age-specific, exposures\"]\n D --> E\n E --> F[\"Head-to-toe exam<br/>finish with infected area\"]\n F --> G[\"Differential<br/>by location; rule out emergencies\"]\n G --> H[\"Investigations<br/>2 sets blood cultures, targeted tests\"]\n H --> I[\"Treat cause + antipyretics\"]"}, {"t": "table", "cols": ["Group", "Site", "Threshold"], "rows": [["Pediatrics", "Rectum, armpit", "<strong>38°C<\/strong>"], ["Adults", "Oral/tympanic", "<strong>37.2°C (6 AM) or 37.8°C<\/strong>"], ["Older adults", "Oral/tympanic", "<strong>37.8°C single<\/strong> or <strong>37.2°C persistent<\/strong>, or <strong>rise ≥ 1.1°C above baseline<\/strong>"]], "lead": "<p><strong>What counts as fever<\/strong><\/p>"}, {"t": "table", "cols": ["", "Pediatrics", "Adults", "Older adults"], "rows": [["HPI", "HPI", "Fever: documented, onset, frequency, relieving, exacerbating, rigors, chills<br>Localising symptoms: pain, tenderness<br>General symptoms<br>Happened before? When? Diagnosis? Treatment?", "<strong>Fever absent i <strong>Tumor<\/strong>", "Swelling", "Fluid accumulation in tissues"], ["<strong>Functio laesa<\/strong>", "Loss of function", "—"]], "lead": "<p><strong>Cardinal signs of inflammation<\/strong> (Celsus)<\/p>"}]}, {"id": "b4-w13-11", "num": "11", "name": "Some Important Gram-Negatives", "title": "Important Gram-Negatives and Mycobacteria", "framing": "<p><em>E. coli<\/em> shows how one species causes different diseases by <strong>which adhesin it carries and which toxin it secretes<\/strong>; mycobacteria, by contrast, are defined by a <strong>mycolic-acid wall<\/strong> that makes them acid-fast and drives chronic infection.<\/p>", "week": 13, "weekLabel": "Week 13 - Fever, Microbes & Innate Immunity", "items": [{"t": "table", "cols": ["", "<em>E. coli<\/em>"], "rows": [["Classification", "Gram-negative bacilli, aerobic<br>Grows on sheep blood agar; <strong>oxidase –<\/strong>"], ["Diseases", "<strong>UTI<\/strong><ul><li><strong>Pyelonephritis<\/strong>: <strong>PapG<\/strong> adhesin binds a galactose-containing glycolipid in the upper urinary tract and kidney → tissue tropism<\/li><li><strong>Cystitis<\/strong>: <strong>FimH<\/strong> adhesin at the pilus tip binds the bladder mucosal surface<\/li><\/ul>Colitis · bacteremia · sepsis"], ["Transmission", "Contact, contaminated food/water"], ["Colonises", "Gut microbiome"], ["Virulence: adhesion", "Fimbriae — <strong>pyelonephritis = glycolipids<\/strong>; <strong>cystitis = mannose<\/strong>"], ["Immune evasion", "<strong>O-polysaccharide<\/strong> of LPS can prevent assembly of the complement MAC<br><em>E. coli<\/em> K12 capsule contains sialic acid, which prevents complement activation<br>Uropathogenic <em>E. coli<\/em> (K1) make a sialic acid capsule (mimicry)"], ["<strong>STEC<\/strong> (Shiga toxin-producing), <em>E. coli<\/em> O157:H7", "Adhesin <strong>intimin<\/strong> binds its receptor <strong>Tir<\/strong>, which the bacterium inserts into the intestinal epithelial membrane → <strong>actin pedestal<\/strong>, from which Shiga toxin is secreted (B-subunit pentamer + A-subunit toxin)<br>B subunit binds <strong>globotriaosylceramide (Gb3)<\/strong> → endocytosis<br>Retrograde transport through the Golgi to the ER, where the toxin component leaves the vesicle and modifies ribosomal RNA → <strong>protein synthesis stops → cell death<\/strong>"]], "lead": "<p><strong><em>Escherichia coli<\/em><\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"STEC attaches via intimin<br/>to Tir in epithelial membrane\"] --> B[\"Actin pedestal forms\"]\n B --> C[\"Shiga toxin secreted<br/>B pentamer + A subunit\"]\n C --> D[\"B subunit binds Gb3\"]\n D --> E[\"Endocytosis\"]\n E --> F[\"Retrograde transport<br/>Golgi to ER\"]\n F --> G[\"A subunit acts on ribosomal RNA\"]\n G --> H[\"Protein synthesis inhibited<br/>cell death\"]"}, {"t": "table", "cols": ["Group", "Species"], "rows": [["<strong>M. tuberculosis complex<\/strong>", "<em>M. tuberculosis<\/em>, <em>M. bovis<\/em>"], ["<strong>NTM — rapid growers<\/strong> (5–7 days)", "<em>M. abscessus<\/em>, <em>M. fortuitum<\/em>, <em>M. smegmatis<\/em>"], ["<strong>NTM — slow growers<\/strong>", "<em>Mycobacterium avium<\/em> complex (<em>M. avium<\/em>, <em>M. intracellulare<\/em>), <em>M. kansasii<\/em>, <em>M. marinum<\/em>, <em>M. gordonae<\/em>"], ["<strong>Other<\/strong>", "<em>M. leprae<\/em>"]]}]}, {"id": "b4-w13-14", "num": "14", "name": "Pathology of Acute Inflammation", "title": "Patterns of Acute Inflammation", "framing": "<p>Acute inflammation takes <strong>four morphological patterns<\/strong>, and what distinguishes them is <strong>what leaks out of the vessels<\/strong>: pus (neutrophils), fibrin, cell-poor fluid, or a breach of the mucosa itself.<\/p>", "week": 13, "weekLabel": "Week 13 - Fever, Microbes & Innate Immunity", "items": [{"t": "table", "cols": ["Pattern", "Features and examples"], "rows": [["<strong>Purulent / suppurative<\/strong>", "Most often from pus-producing <strong>pyogenic bacteria<\/strong> (<em>Staphylococcus<\/em>) → <strong>liquefactive necrosis<\/strong><br>Common sites: skin (groin, axilla, perianal), mouth (teeth), GI (around the gut), lung<br><strong>Abscess<\/strong>: pus (<strong>neutrophils<\/strong>) localised to a cavity created by tissue destruction<br>Tx: <strong>incision and drainage<\/strong>; deep organ abscesses may need a more invasive surgical approach<br>Antibiotics penetrate poorly — the process is walled off, with an avascular pus-filled necrotic centre<br>Example: acute appendicitis"], ["<strong>Fibrinous<\/strong>", "Greatly ↑ vascular permeability lets fibrinogen through inter-endothelial spaces → <strong>fibrin deposition<\/strong><br>Occurs in spaces or potential spaces: pleural, pericardial, meninges<br><strong>Fibrinous pericarditis<\/strong>: exaggerated immune response after MI (Dressler's syndrome), cardiac surgery, uremia, autoimmune disease (SLE)"], ["<strong>Serous<\/strong>", "Exudation of \"cell-poor\" fluid<br><strong>Pleura/pericardium = effusion<\/strong> · <strong>peritoneum = ascites<\/strong> · <strong>skin = bulla/blister<\/strong>"], ["<strong>Ulcer<\/strong>", "Local defect on a mucosal surface creating a breach in the mucosa<br>Sites: skin, oral mucosa (canker sore), GI tract (stomach/duodenum in peptic ulcer disease, colon in IBD)"]]}]}, {"id": "b4-w13-15", "num": "15", "name": "Some Important Clostridial Species", "title": "Clostridial Species", "framing": "<p>Clostridia are <strong>anaerobic, spore-forming Gram-positive bacilli<\/strong>, and each species is best remembered by <strong>what its toxin does<\/strong> — from colitis (<em>C. difficile<\/em>) to spastic (tetanus) or flaccid (botulism) paralysis.<\/p>", "week": 13, "weekLabel": "Week 13 - Fever, Microbes & Innate Immunity", "items": [{"t": "table", "cols": ["Species", "Disease and mechanism"], "rows": [["<em>C. difficile<\/em>", "Diarrhea; <strong>pseudomembranous colitis<\/strong><br>Large clostridial toxins <strong>TcdA and TcdB<\/strong> (TcdB most potent) enter epithelial cells → IL-1β and chemokines, neutrophil influx, tight-junction disruption, fluid secretion, cell death<br>Binary toxin: <strong>CDTb<\/strong> binds an epithelial receptor, is endocytosed, oligomerises and forms a pore; <strong>CDTa<\/strong> is translocated through the pore into the cytoplasm as the endosome acidifies (vacuolar ATPase) and <strong>ribosylates actin<\/strong> → cytoskeleton destroyed, loss of cell shape and tight junctions, cell death"], ["<em>C. perfringens<\/em>", "<strong>Gangrene<\/strong>: blood flow to a large area of tissue is cut off → tissue breaks down and dies (greenish-black)"], ["<em>C. tetani<\/em>", "<strong>Tetanus<\/strong>: trismus (lockjaw), risus sardonicus (sardonic grin), opisthotonos (backward arching)<br><strong>Inhibits release of GABA/glycine<\/strong> → uncontrolled neurotransmitter release → muscle contraction/spasm"], ["<em>C. botulinum<\/em>", "<strong>Infant botulism<\/strong> (flaccid paralysis): gut colonisation; honey contaminated by spores; dust/soil with spores<br><strong>Foodborne<\/strong>: self-canned products, prison brew (pruno, hooch, moonshine, bootleg)<br><strong>Wound<\/strong> and <strong>iatrogenic<\/strong> botulism<br><strong>Inhibits acetylcholine release<\/strong> → no muscle contraction"], ["<em>C. septicum<\/em>", "Gangrene, sepsis, soft tissue infections"], ["<em>C. sordellii<\/em>", "TSS, gynecological infections, soft tissue infections"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"C. difficile in colon\"] --> B[\"TcdA + TcdB enter epithelial cells\"]\n A --> C[\"CDTb binds receptor, endocytosed,<br/>forms pore\"]\n B --> D[\"IL-1β + chemokines<br/>neutrophil influx\"]\n B --> E[\"Tight junctions disrupted<br/>fluid secretion\"]\n C --> F[\"CDTa enters cytoplasm<br/>as endosome acidifies\"]\n F --> G[\"CDTa ribosylates actin<br/>cytoskeleton destroyed\"]\n D --> H[\"Cell death<br/>diarrhea, pseudomembranous colitis\"]\n E --> H\n G --> H"}, {" luenza C"], "rows": [["Host range", "Humans, pigs, horses, birds, marine mammals", "Humans only", "Humans, pigs"], ["Epidemiology", "<strong>Antigenic shift + drift<\/strong>", "Antigenic drift", "Antigenic drift"], ["Clinical", "Seasonal; <strong>can cause pandemics<\/strong> with significant mortality in the young", "Seasonal; severe disease mainly in elderly/high-risk; no pandemics", "Mild, common in children, not seasonal"], ["Genome", "8 segments", "8 segments", "7 segments"], ["Structure", "10 proteins; M2 unique", "11 proteins; NB unique", "9 proteins; HEF unique"]], "lead": "<p><strong>Influenza types<\/strong><\/p>"}]}, {"id": "b4-w14-04", "num": "04", "name": "Intro to Infection Control", "title": "Introduction to Infection Prevention and Control", "framing": "<p>Infection spreads along a <strong>six-link chain<\/strong> — agent, reservoir, portal of exit, mode of transmission, portal of entry, susceptible host — and every IPAC measure works by <strong>breaking the weakest link<\/strong>. Additional precautions are chosen by the <strong>mode of transmission<\/strong>.<\/p>", "week": 14, "weekLabel": "Week 14 - Transmission, Antimicrobials & Vaccines", "items": [{"t": "pathway", "mermaid": "flowchart LR\n A[\"Infectious agent\"] --> B[\"Reservoir\"]\n B --> C[\"Portal of exit\"]\n C --> D[\"Mode of transmission\"]\n D --> E[\"Portal of entry\"]\n E --> F[\"Susceptible host\"]\n F --> A"}, {"t": "table", "cols": ["Link", "Definition", "Examples", "Interventions"], "rows": [["<strong>Infectious agent<\/strong>", "<strong>Virulence<\/strong> = ability to grow and multiply (toxins, invasiveness, capsule, adherence, survival in host cells)<br><strong>Invasiveness<\/strong> = ability to enter tissue<br><strong>Pathogenicity<\/strong> = ability to cause disease", "Bacteria, viruses, fungi, parasites, prions; endogenous or exogenous", "Rapid, accurate identification; vaccination"], ["<strong>Reservoir<\/strong>", "Where organisms thrive and reproduce", "Humans, animals, soil, food, water, equipment", "Employee health, environmental sanitation, disinfection/sterilisation"], ["<strong>Portal of exit<\/strong>", "How the organism leaves the reservoir", "Coughing/sneezing, body secretions, feces", "Proper attire, handwashing, control of secretions, waste disposal"], ["<strong>Mode of transmission<\/strong>", "Route to the new host", "Direct: contact, droplet<br>Indirect: contact, airborne, vehicle, vector", "Handwashing, sterilisation, air-flow control, food handling, isolation"], ["<strong>Portal of entry<\/strong>", "How the organism enters the new host", "Mouth, nose, eyes, cuts in skin", "Aseptic technique, catheter care, wound care"], ["<strong>Susceptible host<\/strong>", "Lacks immunity or physical resistance", "Infants, elderly, immunocompromised — ANYONE", "Treat underlying disease; recognise high-risk patients"]], "lead": "<p><strong>The chain of infection<\/strong> — break the weakest link.<\/p>"}, {"t": "table", "cols": ["Control", "Measures"], "rows": [["<strong>Administrative<\/strong>", "Occupational health — vaccines/confirmed immunity, PEP/prophylaxis<br>Policies and procedures — precautions, cleaning, triage with plastic screen and 2 m separation, spill clean-up, education of staff and patients"], ["<strong>Engineering<\/strong>", "Single rooms/toilet/sink, ABHR dispensers, waste containers, accessible PPE, safety syringes"], ["<strong>PPE<\/strong>", "<strong>Gloves<\/strong> + hand hygiene — hands exposed to blood, excretions, secretions, non-intact skin, contaminated items<br><strong>Facial protection<\/strong> — splash, spray, cough, sneeze<br><strong>Gown<\/strong> — skin/clothing exposed to splashes or contaminated items<br><strong>Donning<\/strong>: hand hygiene → gown → mask/respirator → eye protection → gloves<br><strong>Doffing<\/strong>: gloves → gown → hand hygiene → eye protection → mask/respirator → hand hygiene"]], "lead": "<p><strong>IPAC controls<\/strong><\/p>"}, {"t": "table", "cols": ["Mode", "Precautions", "Examples"], "rows": [["<strong>Direct contact<\/strong> — physical contact with an infected or colonised person", "Gloves, gown; dedicated equipment or disinfect before use on another patient", "<em>C. difficile<\/em>, MRSA, CPE, gastroenteritis viruses, respiratory viruses (RSV, influenza, parainfluenza, rhinovirus)"], ["<strong>Indirect contact<\/strong> — via an object", "As for contact", "Contaminated gloves, medical equipment, instruments"], ["<strong>Droplet<\/strong> — large droplets <strong>≥ 5 μm<\/strong> from coughing/sneezing, propelled <strong>&lt; 2 m<\/strong>, enter nasal/oral mucosa", "Face mask, eye protection within 2 m; patient wears procedure/surgical mask for transport", "Meningitis, pertussis, rubella"], ["<strong>Droplet + contact<\/strong>", "Gloves, gown, face mask, eye protection", "Pneumonia of unknown etiology, acute respiratory illness (influenza)"], ["<strong>Droplet + contact, enhanced PPE<\/strong>", "Gloves, level 2 gown, N95, full-face visor; door closed; clean PPE for staff and patient during transport; dedicated non-critical equipment", "Suspected/confirmed COVID-19 undergoing an AGMP"], ["<strong>Airborne<\/strong> — particles <strong>&lt; 5 μm<\/strong> on dust, widely dispersed by air currents; hardest to control", "<strong>Negative-pressure room<\/strong>, door and windows closed; <strong>fit-tested, seal-checked N95<\/strong> for entry and transport (source also lists \"N98 mask\"); patient wears a procedure/surgical mask for transport", "<strong>Varicella<\/strong> (chickenpox), <strong><em>M. tuberculosis<\/em><\/strong>, <strong>rubeola (measles)<\/strong>, viral hemorrhagic fever viruses"], ["<strong>Common vehicle<\/strong> — contaminated source; may cause a large outbreak", "—", "Botulism; food, medication, IV fluid, shared equipment"], ["<strong>Vector<\/strong> — mosquitoes, fleas, ticks", "—", "West Nile virus, dengue fever"]], "lead": "<p><strong>Additional precautions by mode of transmission<\/strong><\/p>"}, {"t": "table", "cols": ["Alert level", "Procedures"], "rows": [["<strong>1: pre-outbreak / suspected<\/strong>", "Increased transmission noted, case threshold not yet met<br>Identify, communicate and fix gaps in routine practices that may be spreading the organism<br>Early measures to avoid escalation"], ["<strong>2: outbreak<\/strong>", "Case threshold met or exceeded<br>Communicated more widely, including senior leadership and the Middlesex-London Health Unit<br>Additional control measures to stop transmission<br>Admissions routinely stopped; non-essential group activities may be cancelled; symptomatic staff stay home; common areas (lunchroom, recreation room) may close"]], "lead": "<p><strong>LHSC outbreak policy<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Increased transmission noted\"] --> B{\"Case threshold met?\"}\n B -->|\"No\"| C[\"Alert level 1: pre-outbreak<br/>fix gaps in routine practices\"]\n C -->|\"escalates\"| B\n B -->|\"Yes\"| D[\"Alert level 2: outbreak\"]\n D --> E[\"Notify senior leadership<br/>+ Middlesex-London Health Unit\"]\n D --> F[\"Stop admissions, cancel group activities,<br/>symptomatic staff home, close common areas\"]"}]}, {"id": "b4-w14-07", "num": "07", "name": "Vaccine Adverse Effects", "title": "Vaccine Adverse Events and Reporting", "framing": "<p>An <strong>AEFI<\/strong> is any unwanted health event within 6 weeks of immunisation, <strong>whether or not the vaccine caused it<\/strong> — so the lecture is about classifying causes, knowing the real (usually tiny) frequencies, and the <strong>mandatory reporting chain<\/strong> from provider to WHO.<\/p>", "week": 14, "weekLabel": "Week 14 - Transmission, Antimicrobials & Vaccines", "items": [{"t": "table", "cols": ["Cause", "Example"], "rows": [["Vaccine component allergy", "Anaphylaxis after Pfizer in a patient with PEG hypersensitivity"], ["Defective component", "Paralysis after oral polio vaccine (inadequate inactivation)"], ["Vaccine process (error or anxiety)", "Contaminated vial with injection abscess; syncope; hyperventilation"], ["Independent of the vaccine", "Fractured radius, UTI"]], "lead": "<p><strong>Causes of AEFI<\/strong><\/p>"}, {"t": "table", "cols": ["Category", "Frequency"], "rows": [["Very common", "≥ 10%"], ["Common", "1–10%"], ["Uncommon", "0.1–1%"], ["Rare", "1/10,000 to &lt; 10/10,000"], ["Very rare", "&lt; 1/10,000"]], "lead": "<p><strong>Frequency categories<\/strong><\/p>"}, {"t": "table", "cols": ["Ingredient", "Purpose"], "rows": [["Active ingredient", "A very small amount of a harmless form of the bacterium or virus"], ["Adjuvants", "Stronger immune response; no significant risk in the tiny amounts used"], ["Residual traces", "Manufacturing substances, measured in ppm/ppb in the final vaccine"], ["Preservatives and stabilisers", "Maintain quality, safe storage, prevent contamination"], ["Water", "Main ingredient"]], "lead": "<p><strong>What is in a vaccine<\/strong><\/p>"}, {"t": "table", "cols": ["Type", "Vaccine", "Adverse event", "Frequency"], "rows": [["<strong>Live<\/strong>", "Rotavirus", "Intussusception", "1–2/10<sup>5<\/sup>"], ["", "MMR", "Febrile seizures", "3–9/10<sup>4<\/sup>"], ["", "MMR", "Thrombocytopenia", "2–3/10<sup>5<\/sup>"], ["", "MMR", "Anaphylaxis", "3–10/10<sup>6<\/sup>"], ["<strong>Inactivated<\/strong>", "<strong>Whole-cell pertussis<\/strong>", "<strong>Prolonged crying or seizures<\/strong>", "<strong>&lt; 1/10<sup>2<\/sup><\/strong>"], ["", "Whole-cell pertussis", "Hypotonic hyporesponsive episode (HHE)", "&lt; 1–2/10<sup>3<\/sup>"], ["", "Inactivated polio", "None", "—"], ["<strong>Toxoid<\/strong>", "Diphtheria", "Hyperpyrexia", "3/10<sup>3<\/sup>"], ["", "Diphtheria", "Febrile seizures", "8/10<sup>4<\/sup>"], ["", "Diphtheria", "HHE", "0–29/10<sup>6<\/sup>"], ["", "Tetanus", "Anaphylaxis", "1/10<sup>6<\/sup>"], ["", "Tetanus", "Brachial neuritis", "0.7/10<sup>7<\/sup>"], ["<strong>Subunit<\/strong>", "Hepatitis B", "Anaphylaxis", "1/10<sup>6<\/sup>"], ["<strong>Conjugate / other<\/strong>", "Pneumococcal, <em>H. influenzae<\/em> B, meningococcal (ACYW), HPV", "Prolonged crying/seizures/HHE", "None (rare)"]], "lead": "<p><strong>Adverse events by vaccine type<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"AEFI occurs<br/>within 6 weeks\"] --> B[\"Provider or public completes AEFI form<br/>mandatory for immunisers\"]\n B --> C[\"Local Public Health Unit<br/>MOH or PHN review, advise on future doses\"]\n C --> D[\"Provincial public health hub\"]\n D --> E[\"National: Canadian AEFI<br/>Surveillance System, PHAC\"]\n E --> F[\"Global: WHO International<br/>Drug Monitoring program\"]\n G[\"IMPACT at children's hospitals\"] --> E\n H[\"Manufacturers report serious AEs\"] --> I[\"Health Canada\"]"}]}, {"id": "b4-w14-08", "num": "08", "name": "Vaccine Hesitancy", "title": "Vaccine Development, COVID-19 Vaccines and Hesitancy", "framing": "<p>How a vaccine gets from the lab to the arm in Canada, how the COVID-19 platforms differ, and how to <strong>counsel a hesitant patient<\/strong> — where the organising idea is that <strong>a provider's sound advice is one of the strongest influences on the decision<\/strong>.<\/p>", "week": 14, "weekLabel": "Week 14 - Transmission, Antimicrobials & Vaccines", "items": [{"t": "table", "cols": ["Stage", "Process"], "rows": [["Exploratory", "Scientists develop a potential vaccine"], ["Preclinical", "Lab and animal studies before human testing"], ["Clinical trials", "<strong>Phase I<\/strong> — 10s of volunteers: is it safe? What is a safe dose? Side effects?<br><strong>Phase II<\/strong> — 100s: how well does it work? Safe in larger numbers? Safest, most effective dose?<br><strong>Phase III<\/strong> — 10,000s: does it prevent disease? What are the side effects?"], ["Application", "Manufacturer submits to Health Canada"], ["Scientific review", "Health Canada expert teams independently review all vaccine data"], ["Approval", "If safe, effective, meets manufac "<strong>Killed or attenuated virus<\/strong>", "Inactivated vaccines developed by Chinese and Indian companies; live attenuated COVID-19 vaccines unlikely to progress (hard to produce and attenuate)", "Sinopharm, Sinovac"]]}, {"t": "table", "cols": ["", "Adenoviral vector", "mRNA"], "rows": [["Mechanism", "Both introduce genetic material encoding COVID-19 genes so human cells make the viral protein", "(same)"], ["Delivery", "Harmless adenovirus", "Lipid nanoparticles"], ["Components", "Adenovirus vector, ethanol, EDTA, sucrose, histidine", "mRNA, polyethylene glycol (PEG), lipids, salts, sucrose"], ["Storage", "Stable for months in a regular fridge", "Special storage; low temperatures critical"], ["Dosing", "AZ: 2 doses, 4–12 weeks apart<br>J&amp;J: 1 dose", "Pfizer: 2 doses, 3 weeks apart (source: \"3 days\")<br>Moderna: 2 doses, 4 weeks apart"], ["Immunosuppressed", "3 doses to complete a primary series", "3 doses to complete a primary series"], ["Rare adverse effects", "Allergy<br><strong>Clots / TTS (&lt; 10/10<sup>6<\/sup>)<\/strong>, capillary leak syndrome<br>Guillain-Barré syndrome", "Allergy<br><strong>Myocarditis/pericarditis (&lt; 10–70/10<sup>6<\/sup>)<\/strong><br>Bell's palsy"], ["Advantages", "Established technology; strong T- and B-cell response", "Good safety and reliability; simple to manufacture — can match variant genetic codes"], ["Disadvantages", "Prior vector exposure ↓ effectiveness; relatively complex manufacture", "Unintended immune reaction, delivery challenges, storage issues, not previously licensed in humans"], ["Gaps", "No correlate of immunity — unknown how protected someone is (antibody level) or when to boost", "Same"]]}, {"t": "table", "cols": ["Factor", "Reasoning"], "rows": [["Distrust", "Personal/negative experience, mixed messages from the healthcare team, historical context (Tuskegee)"], ["Fear of vaccine harm", "Produced too rapidly, trials excluded people like them, social-media myths, limited data, needle phobia"], ["Feel they have no risk", "Lifestyle/age/health status seen as protective; belief of no or limited personal risk"], ["Feel COVID-19 is a hoax", "\"Just the flu\", manipulated statistics"]], "lead": "<p><strong>COVID-19 hesitancy factors<\/strong><\/p>"}, {"t": "table", "cols": ["Level", "Definition", "Example"], "rows": [["<strong>Sporadic<\/strong>", "Occurs infrequently and irregularly", "SARS-CoV-1"], ["<strong>Endemic<\/strong>", "Constant presence / usual prevalence in a population", "<em>Salmonella<\/em>"], ["<strong>Epidemic<\/strong>", "Cases above what is expected; <strong>outbreak<\/strong> is synonymous but usually a more limited area", "Influenza in fall and winter"], ["<strong>Pandemic<\/strong>", "An epidemic spread over several countries or continents, usually affecting many people", "SARS-CoV-2"]], "lead": "<p><strong>Levels of disease<\/strong><\/p>"}]}, {"id": "b4-w14-09", "num": "09", "name": "Antivirals", "title": "Antivirals for Herpesviruses and Influenza", "framing": "<p>Two drug families: <strong>herpesvirus antivirals block viral DNA polymerase<\/strong> (guanosine analogues, or foscarnet as a pyrophosphate analogue), and <strong>influenza antivirals mostly block neuraminidase<\/strong>, trapping new virus on the infected cell.<\/p>", "week": 14, "weekLabel": "Week 14 - Transmission, Antimicrobials & Vaccines", "items": [{"t": "pathway", "mermaid": "flowchart LR\n A[\"Valacyclovir<br/>oral prodrug\"] --> B[\"Acyclovir\"]\n B --> C[\"Triphosphorylated\"]\n C --> D[\"Inhibits viral<br/>DNA polymerase\"]\n F[\"Valganciclovir<br/>oral prodrug\"] --> G[\"Ganciclovir\"]\n G --> D\n E[\"Foscarnet<br/>pyrophosphate analogue\"] --> D"}, {"t": "table", "cols": ["", "Acyclovir", "Valacyclovir (Valtrex)", "Ganciclovir (Cytovene)", "Valganciclovir", "Foscarnet"], "rows": [["Spectrum", "<strong>HSV-1, HSV-2, VZV<\/strong>", "<strong>HSV-1, HSV-2, VZV<\/strong>", "<strong>CMV<\/strong>, HSV-1, HSV-2, VZV", "<strong>CMV<\/strong>, HSV-1, HSV-2, VZV", "<strong>Drug-resistant viruses, CMV<\/strong>"], ["Form", "Active (triphosphorylated)", "Prodrug", "—", "Prodrug", "—"], ["Route", "Oral, IV", "<strong>Oral<\/strong>", "IV", "<strong>Oral<\/strong>", "IV"], ["Bioavailability", "10–20%", "<strong>55%<\/strong>", "N/A", "<strong>55%<\/strong>", "—"], ["Half-life", "2.5 h", "2.5 h", "4 h", "4 h", "—"], ["Excretion", "Urine", "Urine", "Urine", "Urine", "—"], ["Renal dose adjustment", "Yes", "Yes", "Yes", "Yes", "Yes"], ["Adverse reactions", "Malaise, renal dysfunction, N/V/D, anemia, neutropenia, thrombocytopenia", "Malaise, renal dysfunction, N/V/D, anemia, neutropenia, thrombocytopenia", "Renal dysfunction, fever, N/V/D, anemia, neutropenia, thrombocytopenia", "Renal dysfunction, fever, N/V/D, anemia, neutropenia, thrombocytopenia", "Renal dysfunction, fever, headache, N/V/D, <strong>electrolyte disturbances<\/strong>, anemia, granulocytopenia"], ["Common doses", "200 mg po 5×/day<br>400 mg po 5×/day<br>10 mg/kg IV q8h", "1 g po TID<br>2 g po BID", "5 mg/kg IV q12h", "900 mg po q12h<br>900 mg po daily", "60 mg/kg IV q8h<br>90 mg/kg IV q12h"]]}, {"t": "table", "cols": ["", "Oseltamivir (Tamiflu)", "Zanamivir (Relenza)", "Baloxavir marboxil"], "rows": [["Mechanism", "Neuraminidase inhibitor", "Neuraminidase inhibitor", "<strong>Targets RNA replication/gene expression<\/strong>"], ["Availability", "—", "—", "Not in Canada"], ["Route", "Oral", "Inhaled", "Oral"], ["Renal dose adjustment", "Yes", "<strong>No<\/strong> (monitor for accumulation)", "—"], ["Adverse reactions", "Headache, vomiting, nausea", "Headache, vomiting, nausea", "Nausea, nasopharyngitis"], ["Treatment dose", "75 mg po q12h × 5 days", "2 inhalations (10 mg) q12h × 5 days", "40–80 kg: 40 mg po once<br>≥ 80 kg: 80 mg po once"], ["Prophylactic dose", "75 mg daily", "2 inhalations (10 mg) daily", "—"]]}]}, {"id": "b4-w14-10", "num": "10", "name": "Introduction to Sepsis", "title": "Introduction to Sepsis", "framing": "<p>Sepsis is <strong>life-threatening organ dysfunction from a dysregulated host response to infection<\/strong> — inflammation that is no longer local. Management rests on four principles, and the one that saves the most lives is <strong>early, appropriate antibiotics<\/strong>.<\/p>", "week": 14, "weekLabel": "Week 14 - Transmission, Antimicrobials & Vaccines", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"Infection\"] --> B[\"Dysregulated host response<br/>pro- vs anti-inflammatory imbalance\"]\n B --> C[\"Systemic inflammation\"]\n C --> D[\"Microcirculatory dysfunction\"]\n D --> E[\"Cellular injury\"]\n E --> F[\"Multiple organ dysfunction<br/>heart, lung, brain, kidney, liver, clotting\"]\n C --> G[\"Arteriolar vasodilation<br/>+ capillary leak\"]\n G --> H{\"BP responds to fluids?\"}\n H -->|\"No\"| I[\"Septic shock<br/>add vasopressors\"]\n H -->|\"Yes\"| J[\"Continue resuscitation\"]"}, {"t": "table", "cols": ["Step", "What to do"], "rows": [["<strong>1. Early recognition<\/strong>", "Wherever you work, if you see sick patients you need a plan to NOT miss sepsis<br><strong>Physiology<\/strong>: tachypnea/hypoxia (lung), tachycardia/hypotension, oliguria (kidney)<br><strong>Symptoms<\/strong>: rapid decline in performance status, family is concerned, major change in cognition/confusion, looks/feels very unwell<br><strong>High-risk groups<\/strong>: recent surgery, recent chemotherapy, immunosuppressed, elderly"], ["<strong>2. Early treatment<\/strong>", "<strong>Nothing saves lives in sepsis like early, appropriate antibiotics<\/strong> — get the drug into the blood ASAP<br>From onset of hypotension minutes count: <strong>~8% ↑ mortality per hour of delay<\/strong><br><strong>Broad spectrum<\/strong>, often multidrug<br>Draw cultures before antibiotics <strong>only if this WILL NOT DELAY antibiotics<\/strong>"], ["<strong>3. Source control<\/strong>", "Find the source promptly — exam (wound, rash), imaging (CT, ultrasound)<br>Control it promptly — surgery, drainage, removal of infected foreign body"], ["<strong>4. Life support<\/strong>", "Invasive support for failing organs buys time for therapy to work — it does not fix the problem<br>Cardiovascular: vasopressors, inotropes<br>Pulmonary: mechanical ventilation, prone positioning, lung-protective ventilation, ECMO<br>Renal: dialysis, CRRT<br>Neurologic: sedation, delirium medication"]], "lead": "<p><strong>Basic principles of sepsis management<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Sick patient<br/>tachypnea, hypotension, oliguria, confusion,<br/>high-risk group\"] --> B[\"Recognise sepsis\"]\n B --> C{\"Can cultures be drawn<br/>without delaying antibiotics?\"}\n C -->|\"Yes\"| D[\"Draw cultures\"]\n C -->|\"No\"| E[\"Broad-spectrum antibiotics ASAP<br/>~8% mortality per hour of delay\"]\n D --> E\n E --> F[\"Find the source<br/>exam, CT, ultrasound\"]\n F --> G[\"Source control<br/>surgery, drainage, remove device\"]\n E --> H[\"Life support for failing organs<br/>pressors, ventilation, dialysis\"]"}]}, {"id": "b4-w14-11", "num": "11", "name": "Intro to Antimicrobial Resistance", "title": "Choosing an Antimicrobial Agent", "framing": "<p>Choosing an antimicrobial means matching <strong>the likely organism and its likely susceptibility<\/strong> to <strong>host and drug factors<\/strong> — and deciding <strong>when<\/strong> to start, which depends on how sick the patient is.<\/p>", "week": 14, "weekLabel": "Week 14 - Transmission, Antimicrobials & Vaccines", "items": [{"t": "table", "cols": ["Situation", "Approach", "Examples"], "rows": [["<strong>Urgent<\/strong>", "Start antimicrobials immediately after or concurrently with collecting diagnostic specimens", "Septic shock, acute bacterial meningitis, febrile neutropenia"], ["<strong>Subacute infection, clinically stable<\/strong>", "Avoid starting antibiotics before appropriate samples are collected", "Osteomyelitis, diskitis, subacute endocarditis"], ["<strong>Mild infection, otherwise healthy<\/strong>", "Refrain from antibiotics unless sure of the diagnosis and the likely etiology is bacterial", "—"]], "lead": "<p><strong>Timing of initiation<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Suspected infection\"] --> B{\"Urgent?<br/>septic shock, meningitis,<br/>febrile neutropenia\"}\n B -->|\"Yes\"| C[\"Specimens + antimicrobials<br/>immediately, concurrently\"]\n B -->|\"No\"| D{\"Subacute and stable?\"}\n D -->|\"Yes\"| E[\"Collect samples first<br/>then start therapy\"]\n D -->|\"No, mild in healthy patient\"| F{\"Diagnosis sure<br/>and likely bacterial?\"}\n F -->|\"Yes\"| G[\"Treat\"]\n F -->|\"No\"| H[\"Refrain from antibiotics\"]"}]}, {"id": "b4-w14-in-class-outbreak-management-and-antibiotics", "num": "—", "name": "In-Class - Outbreak Management and Antibiotics", "title": "Outbreak Management and Healthcare-Associated Infections", "framing": "<p>Outbreak management follows <strong>ten ordered steps<\/strong>, from verifying that there is an outbreak to debriefing the team — and because outbreaks are <strong>sociological as much as medical<\/strong>, the fix must reach root causes.<\/p>", "week": 14, "weekLabel": "Week 14 - Transmission, Antimicrobials & Vaccines", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"1 Verify the outbreak\"] --> B[\"2 Confirm the diagnosis\"]\n B --> C[\"3 Assemble the team\"]\n C --> D[\"4 Define and find cases<br/>case definition, line list\"]\n D --> E[\"5 Orient data by person,<br/>place, time\"]\n E --> F[\"6 Generate hypotheses\"]\n F --> G[\"7 Test hypotheses\"]\n G --> H[\"8 Prevention and control measures\"]\n H --> I[\"9 Communicate findings\"]\n I --> J[\"10 Debrief the team\"]"}, {"t": "table", "cols": ["Step", "Actions"], "rows": [["<strong>1. Verify the outbreak<\/strong>", "<strong>Reportable diseases<\/strong>: diseases/syndromes that legislation requires specified people to report to public health; obligations fall on clinicians, labs, institutions, public health and governments<br>Critical for surveillance — gives risk-factor information<br>Empowers public health action — individual-level information for interventions (contact tracing); triggers the legislative authority of medical officers of health<br>Fulfils Canada's obligations under the International Health Regulations<br>Shifting risk groups: MSM, illicit drug use, homeless/under-housed, incarceration"], ["<strong>2. Confirm the diagnosis<\/strong>", "Laboratory results"], ["<strong>3. Assemble the team<\/strong>", "Interdisciplinary — physicians, nurses, inspectors, epidemiologists, communications, administrative support"], ["<strong>4. Define and find cases<\/strong>", "<strong>Case definition<\/strong>: clinical signs/symptoms plus laboratory confirmation criteria; varies by jurisdiction<br><strong>Line list<\/strong>: tracks cases; facilities and public health update it daily; shows outbreak status (under control, ready to declare over)"], ["<strong>5. Orient the data<\/strong>", "By person, place (maps) and time (epidemic curves)<br><strong>Epidemic curve<\/strong>: cases plotted over time — shows changes in prevalence and incidence, supports analysis of transmission"], ["<strong>6. Generate hypotheses<\/strong>", "Who is exposed, what is the source?<br>Patterns: <strong>common source<\/strong> (point, continuous, intermittent) vs <strong>propagated<\/strong> (more than one incubation period)"], ["<strong>7. Test hypotheses<\/strong>", "—"], ["<strong>8. Prevention and control<\/strong>", "Know the mode of transmission<br><strong>Isolation<\/strong>: separates sick, contagious people from the well<br><strong>Quarantine<\/strong>: separates and restricts movement of exposed people to see if they become sick<br>Enhanced precautions — gown, gloves, mask/eye protection<br>Environmental cleaning and decontamination<br>PEP for contacts and at-risk people — vaccination, IVIg<br>Vector control — needle disposal, mosquito control"], ["<strong>9. Communicate the findings<\/strong>", "—"], ["<strong>10. Debrief the team<\/strong>", "—"]], "lead": "<p><strong>Steps in outbreak management<\/strong><\/p>"}]}, {"id": "b4-w15-01", "num": "01", "name": "Approach to the Immunocompromised Host", "title": "Approach to Fever in the Immunocompromised Host", "framing": "<p>Different conditions impair <strong>different arms of the immune system<\/strong>, and immune deficiency is <strong>dynamic — it is all about timing<\/strong>. The differential is the <strong>usual one + opportunistic infections + context<\/strong>, remembering that the presentation (even the fever) may be blunted.<\/p>", "week": 15, "weekLabel": "Week 15 - Immunocompromise, Allergy & Autoimmunity", "items": [{"t": "pathway", "mermaid": "flowchart LR\n Z[\"Patient own stem cells\"] --> A[\"Conditioning<br/>radiation or high-dose chemo\"]\n A --> B[\"Donor graft infusion\"]\n B --> C[\"Pre-engraftment<br/>neutropenia\"]\n C --> D[\"Post-engraftment<br/>NK cells recover\"]\n D --> E[\"Late phase<br/>CD4 T cells recover\"]"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Fever or illness in<br/>immunocompromised host\"] --> B[\"Define the immune defect<br/>condition, drugs, CD4, transplant phase\"]\n B --> C[\"Note masking factors<br/>cytokine blockers may hide fever\"]\n C --> D[\"Usual differential\"]\n D --> E[\"+ opportunistic infections<br/>for that defect\"]\n E --> F[\"+ context and timing\"]"}]}, {"id": "b4-w15-02", "num": "02", "name": "Opportunistic Infections", "title": "Opportunistic Infections", "framing": "<p><strong>Opportunistic infections<\/strong> occur more often and more severely when immunity is compromised. Five organisms anchor the lecture, and each is tied to a <strong>specific immune threshold or risk group<\/strong>.<\/p>", "week": 15, "weekLabel": "Week 15 - Immunocompromise, Allergy & Autoimmunity", "items": [{"t": "table", "cols": ["", "<em>M. tuberculosis<\/em> complex", "<em>M. avium<\/em> complex", "CMV", "<em>Cryptococcus<\/em>", "PJP"], "rows": [["Organisms", "<em>M. tuberculosis<\/em> complex", "<em>M. avium<\/em>, <em>M. intracellulare<\/em>, <em>M. chimaera<\/em>", "Cytomegalovirus", "<em>C. neoformans<\/em>, <em>C. gattii<\/em>", "<em>Pneumocystis jirovecii<\/em>"], ["Transmission", "Airborne", "Colonises water sources (hot tubs); <strong>not person to person<\/strong>", "Body fluids (saliva, genital fluids, urine); pregnancy, birth", "Inhalation of fungal conidia; bird excreta", "Airborne"], ["Risk factors", "Foreign-born, close contacts of infectious cases, Indigenous Canadians, incarceration, elderly<br><strong>Reactivation<\/strong>: prior active or latent TB, HIV co-infection, immunocompromise, comorbidities", "Cystic fibrosis, COPD, bronchiectasis<br>Older women (Lady Windermere syndrome)<br>Inherited IFN-γ disorders in patients from SE and East Asia", "Common — 40–50% infected<br><strong>HIV/AIDS (CD4 &lt; 100/mm³)<\/strong><br>Solid organ transplant, HSCT<br>Immunosuppressive drugs/chemotherapy", "HIV/AIDS, prolonged glucocorticoids, organ transplant, malignancy", "<strong>HIV (CD4 &lt; 200/μL)<\/strong><br>Solid organ transplant, HSCT<br>BM and solid organ malignancy<br><strong>Long-term steroids<\/strong><br>Immunosuppressive drugs"], ["Symptoms", "<strong>Cough &gt; 3 weeks<\/strong>, hemoptysis, constitutional symptoms", "Dyspnea, abdominal pain, constitutional symptoms, anemia", "Children: mostly asymptomatic<br>Adults: mono-like syndrome; prolonged fever, mild hepatitis", "Headache, fever, fatigue (meningitis-like); cough, dyspnea, hemoptysis; umbilicated papules", "Fever, dyspnea, cough; <strong>hypoxemia (O2 &lt; 93%)<\/strong>"], ["Disease", "Tuberculosis", "MAC lung disease; <strong>disseminated disease in HIV with CD4 &lt; 50/mm³<\/strong>", "Reactivation: pneumonia, colitis, retinitis, meningoencephalitis, transverse myelitis, CMV syndrome (fever, thrombocytopenia, leukopenia, mild hepatitis)", "<em>C. neoformans<\/em>: meningitis, pulmonary nodules<br><em>C. gattii<\/em>: meningitis, pulmonary disease", "Pneumonia"], ["Ix", "<strong>3 sputum specimens<\/strong> (spontaneous or induced) 1 h apart, ≥ 1 early morning (sensitivity 65–70%)<br>CXR, CT chest<br>Acid-fast stain, culture, susceptibility; mycobacterial PCR, lateral flow assay", "Respiratory culture; imaging", "<strong>Serology<\/strong> IgM/IgG; <strong>monitor with CMV PCR<\/strong>; histopathology", "Serial LPs to monitor raised ICP and culture clearance<br>In HIV on HAART, monitor immune recovery (CD4 &gt; 100/μL and undetectable/very low HIV RNA for &gt; 3 months)", "<strong>↑ LDH<\/strong> in HIV<br>Bronchoscopy stains: calcofluor, Gomori methenamine silver<br>CXR interstitial pattern; CT <strong>ground-glass opacities<\/strong>"], ["Treatment / prevention", "<strong>Isoniazid + rifampin + ethambutol + pyrazinamide<\/strong>", "<strong>Azithromycin + rifampin + ethambutol<\/strong>", "Ganciclovir, valganciclovir<br>Pregnancy screening<br>Transplant: monitoring and pre-emptive therapy; prophylaxis (letermovir)", "1. Amphotericin B + flucytosine<br>2. Fluconazole (consolidation)<br>3. Fluconazole (maintenance)", "<strong>TMP-SMX<\/strong><br>Clindamycin-primaquine (2nd line)<br>Adjunctive steroids if severe<br>Consider secondary prophylaxis"]]}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Cryptococcal disease\"] --> B[\"1 Induction<br/>amphotericin B + flucytosine\"]\n B --> C[\"2 Consolidation<br/>fluconazole\"]\n C --> D[\"3 Maintenance<br/>fluconazole\"]\n B -.-> E[\"Serial LPs for ICP<br/>and culture clearance\"]\n D -.-> F[\"HIV on HAART: monitor immune recovery<br/>CD4 over 100 and suppressed RNA over 3 months\"]"}, {"t": "table", "cols": ["CD4 count", "Infections"], "rows": [["&lt; 200/μL", "PJP"], ["&lt; 100/mm³", "CMV reactivation"], ["&lt; 50/mm³", "Disseminated MAC (and CMV retinitis, lymphoma — see immunocompromised host)"]], "lead": "<p><strong>CD4 thresholds to remember<\/strong> (HIV)<\/p>"}]}, {"id": "b4-w15-04", "num": "04", "name": "Antifungals", "title": "Antifungals", "framing": "<p>Fungi are eukaryotes, so selective drugs must hit what humans lack: the <strong>cell wall<\/strong> (echinocandins) or the <strong>ergosterol-based membrane<\/strong> (azoles block ergosterol synthesis; polyenes bind the membrane directly).<\/p>", "week": 15, "weekLabel": "Week 15 - Immunocompromise, Allergy & Autoimmunity", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"Azoles\"] -->|\"inhibit\"| B[\"Lanosterol 14α-demethylase<br/>CYP450\"]\n B --> C[\"No ergosterol synthesis\"]\n C --> D[\"Altered membrane permeability\"]\n E[\"Polyenes<br/>amphotericin B\"] -->|\"insert into\"| D\n F[\"Echinocandins\"] -->|\"inhibit\"| G[\"1,3-β-D-glucan synthesis\"]\n G --> H[\"Defective cell wall\"]\n D --> I[\"Fungal cell death\"]\n H --> I"}, {"t": "table", "cols": ["", "Azoles — 1st gen", "Azoles — 2nd gen", "Echinocandins", "Polyenes"], "rows": [["Agents", "<strong>Fluconazole<\/strong> (limited for non-<em>C. albicans<\/em>), itraconazole", "<strong>Voriconazole<\/strong>, posaconazole, isavuconazole, efinaconazole", "<strong>Caspofungin<\/strong> (reliable <em>Candida<\/em> coverage), micafungin, anidulafungin", "<strong>Amphotericin B<\/strong> — broad spectrum"], ["Route", "Oral, IV", "Oral, IV", "IV", "IV"], ["Mechanism", "Inhibit <strong>CYP450 lanosterol 14α-demethylase<\/strong> → no <strong>ergosterol synthesis<\/strong> → altered membrane permeability<br>Also inhibit human CYP450 — <strong>caution for DDIs<\/strong>", "Same as 1st-gen azoles", "Inhibit <strong>1,3-β-D-glucan synthesis<\/strong> (fungal cell wall)<br>Few DDIs<br><strong>Poor penetration into eyes, CNS, urine<\/strong>", "From <em>Streptomyces nodosus<\/em>; inserts into the fungal <strong>cytoplasmic membrane<\/strong> → altered permeability, cell death"], ["Renal dose adjustment", "Yes", "No, but caution with IV formulations", "No", "—"], ["Adverse reactions", "Headache, N/V/D, QT prolongation, <strong>hepatotoxic<\/strong>", "↑ serum creatinine, N/V/D, QT prolongation, <strong>hepatotoxic<\/strong>", "N/V/D, rash, ↑ liver enzymes", "Infusion-related reactions, <strong>nephrotoxicity<\/strong>"], ["Common doses", "Fluconazole 150 mg po once; 400 mg po daily", "Voriconazole 6 mg/kg IV q12h × 2, then 4 mg/kg IV q12h; 200 mg po BID", "Caspofungin 70 mg IV once, then 50 mg daily", "Various formulations; dose depends on formulation"]]}]}, {"id": "b4-w15-05", "num": "05", "name": "Approach to Immunodeficiency", "title": "Approach to Immunodeficiency, Hypersensitivity and Allergy", "framing": "<p>The <strong>pattern of infection points to the broken arm of immunity<\/strong>: phagocyte defects → catalase-positive bacteria and fungi; complement → <em>Neisseria<\/em>; T cells → opportunists in the first 6 months; antibodies → encapsulated bacteria after maternal IgG wanes. The second half turns the problem around — an immune system that <strong>overreacts<\/strong> (Gell and Coombs, anaphylaxis, common allergies).<\/p>", "week": 15, "weekLabel": "Week 15 - Immunocompromise, Allergy & Autoimmunity", "items": [{"t": "table", "cols": ["Children (to age 18)", "Adults"], "rows": [["≥ 4 new ear infections in 1 year", "≥ 2 new ear infections in 1 year"], ["≥ 2 serious sinus infections in 1 year", "≥ 2 new sinus infections in 1 year, without allergy"], ["≥ 2 pneumonias in 1 year", "≥ 1 pneumonia per year for more than 1 year"], ["≥ 2 deep-seated infections, including septicemia", "Recurrent viral infections — colds, herpes, warts, condyloma"], ["≥ 2 months on antibiotics with little effect", "Infection with normally harmless TB-like bacteria"], ["Need for IV antibiotics", "Recurrent need for IV antibiotics to clear infections"], ["Failure of an infant to gain weight or grow", "Chronic diarrhea with weight loss"], ["Recurrent deep skin or organ abscesses", "Recurrent deep skin or organ abscesses"], ["Persistent oral thrush or skin fungal infection", "Persistent oral thrush or skin fungal infection"], ["FHx of primary immunodeficiency", "FHx of primary immunodeficiency"]], "lead": "<p><strong>Warning signs of primary immunodeficiency<\/strong><\/p>"}, {"t": "table", "cols": ["", "Phagocytic disorders", "Complement disorders"], "rows": [["Onset", "Infancy or early childhood", "Any age"], ["Infections", "Bacteria: <em>S. aureus<\/em>, <em>Pseudomonas<\/em>, <em>Serratia<\/em>, <em>Klebsiella<\/em><br>Fungi/others: <em>Candida<\/em>, <em>Nocardia<\/em>, <em>Aspergillus<\/em>", "<em>Neisseria gonorrhoeae<\/em>, <em>N. meningitidis<\/em>"], ["Clinical features", "Severe infections by common pathogens; granulomas; poor wound healing; abscesses, skin, oral and anorectal infections", "Associated autoimmunity — RA, lupus, scleroderma"], ["Key causes", "<strong>Chronic granulomatous disease<\/strong> (most common innate immunodeficiency)<br>X-linked (70%) — presents in first 5 years; autosomal recessive (22%) — diagnosed in early adulthood<br><strong>NADPH oxidase<\/strong> mutations → phagocytosed bacteria not destroyed<br>Severe infections with <strong>catalase-positive<\/strong> organisms: pneumonia, skin abscess, lymphadenopathy, liver abscess, osteomyelitis", "<strong>Early complement deficiency<\/strong>: milder infections by encapsulated organisms (<em>Streptococcus<\/em>, <em>H. influenzae<\/em>, <em>Neisseria<\/em>); most likely to have autoimmunity<br><strong>C3 deficiency<\/strong>: C3 is key for opsonisation → encapsulated organism infections<br><strong>Terminal (MAC) deficiency<\/strong>: most severe; <strong>recurrent systemic <em>Neisseria<\/em><\/strong>; C9 deficiency most common"], ["Ix", "<strong>Dihydrorhodamine 123 assay<\/strong>, genetic testing", "—"]], "lead": "<p><strong>Primary immunodeficiency — innate<\/strong><\/p>"}, {"t": "table", "cols": ["", "T cell (most severe)", "Humoral"], "rows": [["Onset", "<strong>First 6 months<\/strong>", "<strong>After 6 months<\/strong> (maternal antibody wanes) or adulthood"], ["Infections", "Opportunists: <em>Mycobacterium<\/em>, CMV, EBV, VZV, enterovirus, <em>Candida<\/em>, PJP", "<strong>Encapsulated bacteria<\/strong>: <em>H. influenzae<\/em>, pneumococci, streptococci; fungi; parasites (<em>Giardia lamblia<\/em>); enterovirus"], ["Clinical features", "Failure to thrive, oral thrush, severe rash/eczema<br>GVHD from maternal lymphocytes<br>Disseminated infection after vaccination (BCG)", "Recurrent sinopulmonary infections (pneumonia, otitis media, sinusitis)<br>Chronic GI issues (diarrhea)<br>Autoimmunity"], ["Key diseases", "<strong>SCID<\/strong>: T cells cannot function; severe infections in first 6 months; <strong>death likely without BM transplant<\/strong>", "<strong>Selective IgA deficiency<\/strong> — most common humoral (1/400); mild, mostly <strong>asymptomatic<\/strong> (IgG compensates); antibiotics for URTIs if frequent sinopulmonary infections<br><strong>CVID<\/strong> — most common <strong>symptomatic<\/strong> primary immunodeficiency (1/10,000–50,000); recurrent sinopulmonary infections, chronic diarrhea; <strong>IgG replacement<\/strong> (monthly IV or weekly SC)"], ["Causes", "X-linked, autosomal recessive", "Unknown"], ["Ix", "<strong>Newborn screening<\/strong>: T cell receptor excision circles (<strong>TRECs<\/strong>, cleaved DNA) — low/absent suggests SCID; finds children before symptoms", "—"]], "lead": "<p><strong>Primary immunodeficiency — adaptive<\/strong><\/p>"}, {"t": "table", "cols": ["Phenotype", "Defect"], "rows": [["T– B+ NK–", "Common gamma chain deficiency"], ["T– B+ NK+", "IL-7 receptor deficiency"], ["T– B– NK+", "RAG1 and RAG2 deficiency; Artemis deficiency (DCLRE1C)"], ["T– B– NK–", "Adenosine deaminase (ADA) deficiency; purine nucleoside phosphorylase (PNP) deficiency"]], "lead": "<p><strong>SCID phenotypes<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Recurrent or unusual infections<br/>warning signs\"] --> B{\"Pattern of infection?\"}\n B -->|\"Catalase+ bacteria, fungi,<br/>abscesses, granulomas\"| C[\"Phagocytic disorder e.g. CGD<br/>DHR 123 assay\"]\n B -->|\"Neisseria, encapsulated,<br/>autoimmunity\"| D[\"Complement disorder\"]\n B -->|\"Opportunists in first 6 months,<br/>failure to thrive\"| E[\"T cell defect e.g. SCID<br/>TRECs\"]\n B -->|\"Encapsulated bacteria<br/>after 6 months, sinopulmonary\"| F[\"Humoral defect<br/>IgA deficiency, CVID\"]\n B -->|\"Drugs, malignancy, HIV,<br/>asplenia, malnutrition\"| G[\"Secondary immunodeficiency\"]"}, {"t": "table", "cols": ["Target", "Drugs"], "rows": [["Signalling", "Anti-TNF: etanercept, infliximab<br>CD20 inhibitor: rituximab<br>Janus kinase (JAK) inhibitors"], ["Immune cells", "Calcineurin inhibitors: cyclosporine, tacrolimus<br>Purine metabolism inhibitors: azathioprine, mycophenolate mofetil"], ["Multiple", "Steroids: prednisone"]], "lead": "<p><strong>Drugs that affect the immune system<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Exposure<br/>sex, blood, transplacental\"] --> B[\"Initial infection<br/>mild illness at ~1 month\"]\n B --> C[\"HIV-specific immune response<br/>viral load falls\"]\n C --> D[\"Clinical latency ~8 years<br/>CD4 loss continues\"]\n D --> E[\"AIDS ~2 years<br/>OIs, Kaposi, wasting\"]\n E --> F[\"Death\"]"}, {"t": "table", "cols": ["Type", "Effector mechanism", "Examples"], "rows": [["<strong>I — IgE-mediated<\/strong> (allergy, asthma)", "Th2 cells, IgE, mast cells, eosinophils<br>Mast cell mediators (vasoactive amines, lipid mediators, cytokines)<br>Cytokine-driven inflammation (eosinophils, neutrophils)", "Allergic rhinitis, immediate food/drug/venom allergy, cat-triggered asthma"], ["<strong>II — antibody-mediated cell death<\/strong>", "IgM/IgG against cell-surface or extracellular matrix antigens<br>Complement and Fc receptor recruitment of neutrophils, macrophages<br>Opsonisation and phagocytosis<br>Abnormal cell function — hormone or neurotransmitter receptor signalling", "Drug-induced cytopenia"], ["<strong>III — immune complex<\/strong>", "Complexes of circulating antigen + IgM/IgG deposit in vascular basement membrane<br>Complement and Fc receptor recruitment of leukocytes", "Serum sickness-like reaction; common in autoimmunity"], ["<strong>IV — delayed (cell-mediated)<\/strong>", "CD4+ T cells — cytokine inflammation, macrophage activation<br>CD8+ CTLs — direct target-cell lysis", "SJS, TEN — life-threatening drug reactions"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Sudden illness after possible trigger\"] --> B{\"Any one criterion met?\"}\n B -->|\"1: skin/mucosa + respiratory or ↓ BP\"| D[\"Anaphylaxis highly likely\"]\n B -->|\"2: two or more systems after likely allergen\"| D\n B -->|\"3: ↓ BP after known allergen\"| D\n B -->|\"None\"| C[\"Reassess; observe\"]\n D --> E[\"Remove trigger\"]\n E --> F[\"IM epinephrine 0.01 mg/kg<br/>1:1000, max 0.3 mg\"]\n F --> G{\"Improving?\"}\n G -->|\"No\"| H[\"Repeat epinephrine q5-15 min\"]\n H --> G\n G -->|\"Yes\"| I[\"Adjuncts after epinephrine:<br/>O2, fluids, antihistamine,<br/>salbutamol, steroids\"]"}, {"t": "table", "cols": ["", "Allergic rhinitis", "Food allergy"], "rows": [["Epidemiology", "All ages, onset usually &lt; 30; common — 30% of the population", "All ages, mostly childhood; 3–35% self-report food allergy (adjust diet)"], ["Risk factors", "—", "Atopic dermatitis"], ["History", "Congestion, sneezing, rhinorrhea, pruritus, conjunctival erythema, watery eyes<br>Chronic/intermittent, indoor/outdoor, season, triggers, treatment response, FHx, associated symptoms", "Identify the offending food; timing of onset<br>Cutaneous (hives, itch, eczema), cough, wheeze, dyspnea, chest tightness, LOC, ↓ BP, vomiting, abdominal pain"], ["DDx", "<strong>Allergic rhinitis<\/strong>: itching (pathognomonic), conjunctivitis<br><strong>Non-allergic/vasomotor<\/strong>: congestion, rhinorrhea<br><strong>Nasal polyps<\/strong>: anosmia<br><strong>Infectious<\/strong>: fever, sore throat", "<strong>Allergy<\/strong>: immunological mechanism explains symptoms<br><strong>Intolerance<\/strong>: known non-immune mechanism<br><strong>Aversion<\/s ]"}]}, {"id": "b4-w15-08", "num": "08", "name": "Pathology of Chronic Inflammation", "title": "Chronic Inflammation, Granulomas, Herpesviruses and Fungi", "framing": "<p>Chronic inflammation is inflammation that <strong>persists for weeks to months alongside attempts at repair<\/strong>, driven by macrophages and lymphocytes; its signature structure is the <strong>granuloma<\/strong>, the body's attempt to wall off what it cannot clear. The lecture then catalogues two persistent pathogen groups — <strong>latent herpesviruses<\/strong> and <strong>medically important fungi<\/strong>.<\/p>", "week": 15, "weekLabel": "Week 15 - Immunocompromise, Allergy & Autoimmunity", "items": [{"t": "table", "cols": ["Cell", "Role and appearance"], "rows": [["<strong>Macrophages<\/strong>", "Dominant cell in many chronic inflammatory reactions"], ["<strong>Eosinophils<\/strong>", "Allergic reactions and parasitic infections<br>Granules contain <strong>major basic protein<\/strong> — toxic to parasites and host epithelium; can cause tissue damage in allergy<br>Bright red (eosinophilic) granules, <strong>bilobed nuclei<\/strong>"], ["<strong>Lymphocytes<\/strong> (B, T, NK)", "Major players in adaptive immunity, activated by microbes and environmental antigens<br>Release cytokines that amplify and sustain inflammation<br>Appear as just a purple nucleus (minimal cytoplasm)"], ["<strong>Plasma cells<\/strong> (differentiated B cells)", "Make antibodies<br><strong>Eccentric nuclei with a \"clock face\"<\/strong> chromatin pattern"]], "lead": "<p><strong>Cells of chronic inflammation<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Persistent agent hard to clear<br/>TB, fungi, talc, sutures\"] --> B[\"Macrophages activated\"]\n B --> C[\"Epithelioid histiocytes\"]\n C --> D[\"Some fuse into<br/>Langhans giant cells\"]\n C --> E[\"Ring of T lymphocytes\"]\n D --> F[\"Granuloma walls off agent\"]\n E --> F\n F --> G[\"Hypoxia + free radicals<br/>caseating necrosis\"]"}, {"t
