<script>var D = {"course": "pom1", "block": "cardio", "lectures": [{"id": "cardio-w1-01", "num": "01", "name": "Cardiac Electrical Physiology", "title": "Circulation, the Cardiac Cycle & Cardiac Electrical Physiology", "framing": "<p>How blood moves through a <strong>series<\/strong> pulmonary circuit and a <strong>parallel<\/strong> systemic circuit, how one cardiac cycle fills and empties the ventricle, and the ion currents that make the heart beat. The organising idea: <strong>pressure gradients open and close the valves<\/strong>, and ion gradients set the rhythm.<\/p>", "week": 1, "weekLabel": "Week 1 - Cardiac Physiology, ECG & Cardiac Pharmacology", "items": [{"t": "table", "cols": ["", "Right heart", "Left heart"], "rows": [["Atrium → valve", "Right atrium → <strong>tricuspid<\/strong> valve", "Left atrium → <strong>mitral<\/strong> valve"], ["Ventricle → valve", "Right ventricle → <strong>pulmonary<\/strong> valve", "Left ventricle → <strong>aortic<\/strong> valve"], ["Outflow", "To lungs (pulmonary artery)", "To systemic circulation (aorta)"], ["Circuit", "<strong>Pulmonary circulation – low pressure<\/strong><br>• Oxygenation<br>• Carbon dioxide removal/ventilation", "<strong>Systemic circulation – high pressure<\/strong><br>• Oxygenated blood<br>• Redistribution"]]}, {"t": "table", "cols": ["", "Pulmonary circulation", "Systemic circulation"], "rows": [["Role", "Separates the right and left ventricle", "Organ and tissue perfusion"], ["Pressure", "<strong>Low pressure system (20/10)<\/strong> – RV less muscular than LV", "<strong>High pressure system (120/80)<\/strong> – can change blood-flow distribution<br>• Dehydration/hypervolemia: less skin and kidney perfusion to retain water<br>• Exercise: vasodilation of skin and muscles"], ["Arrangement", "In <strong>series<\/strong> – <strong>output of RV and LV matched<\/strong>", "In <strong>parallel<\/strong>"], ["Resistance", "<strong>R_total = R1 + R2 + R3 + R4<\/strong>", "<strong>1/R_total = 1/R1 + 1/R2 + 1/R3 + 1/R4<\/strong>"]], "lead": "<p><strong>Pathways of blood flow<\/strong><\/p>"}, {"t": "head", "html": "<h5>The vasculature – 100 000 miles!<\/h5>"}, {"t": "table", "cols": ["Vessel", "Features"], "rows": [["Arteries", "• High pressure system (<strong>120/80<\/strong>)<br>• Rapid transit<br>• Distensible – become less elastic with increasing age<br>• <strong>Elastic arteries = conducting arteries<\/strong>; elastic fibres (pressure reservoir)<br>• <strong>Muscular arteries = distributing arteries<\/strong>; smooth muscle (vasoconstriction)"], ["Arterioles", "• <strong>Resistance vessels<\/strong> – vasoconstriction, vasodilation<br>• Thick, elastic, muscular walls<br>• Control of microvascular blood flow to various organs"], ["Capillaries", "• <strong>Large cross-sectional area<\/strong><br>• Exchange system – nearby cells extract nutrients/deposit wastes<br>• Slow, non-pulsatile flow<br>• Length = 0.3–1 mm<br>• <strong>Capillary pressure = 20 mm Hg<\/strong><br>• <strong>Capillary refill<\/strong> evaluates microvascular flow clinically; chronic vasoconstriction, hypovolemia, or obstructive shock will delay the refill"], ["Venules and veins", "• <strong>Capacitance vessels<\/strong> – hold 70% of blood volume<br>• Low pressure system<br>• Compliant<br>• Able to contract and dilate<br>• Valves propel blood back to the heart – varicose veins if incompetent"]]}, {"t": "table", "cols": ["Compartment", "% of blood volume"], "rows": [["Heart", "10%"], ["Systemic arteries", "12%"], ["Capillaries", "6%"], ["<strong>Large veins<\/strong>", "<strong>15%<\/strong>"], ["<strong>Small veins<\/strong>", "<strong>45%<\/strong>"], ["Lungs", "12%"]], "lead": "<p><strong>Where’s the blood?<\/strong> Most of it sits in the veins.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Low-flow state\"] --> B[\"Arteriolar vasoconstriction\"]\n A --> C[\"Venoconstriction<br/>↓ capacitance\"]\n B --> D[\"Redistribution of flow to vital organs\"]\n C --> D\n D --> E[\"Increased oxygen extraction\"]\n E --> F[\"Decrease in venous pO2\"]\n C --> G{\"Maximum constriction reached?\"}\n G -->|\"Yes + further blood loss\"| H[\"Hypovolemia unmasked<br/>sudden deterioration\"]"}, {"t": "table", "cols": ["Step", "Events", "Volume", "Pressure"], "rows": [["<strong>1. Atrial systole<\/strong><br>a wave · P wave · S4 may be heard", "• AV valves open<br>• Pulmonary/aortic valves closed<br>• There is a delay between electrical and mechanical events in the heart<br>• Normally a small contribution to ventricular filling", "• Increased ventricular volume<br>• In some clinical situations atrial systole is more important for filling:<br>– High HR: less diastolic time<br>– Stiff ventricle: does not fill well passively<br>• <strong>Atrial fibrillation<\/strong>: atria have no organized contraction; HR irregularly irregular; <strong>no atrial systole<\/strong>", "• Slight increase in atrial pressure"], ["<strong>2. Isovolumetric contraction<\/strong><br>c wave · QRS complex · S1", "• Ventricles begin to contract<br>• <strong>AV valves close<\/strong><br>• Pulmonary/aortic valves closed", "• Maximum ventricular volume <strong>unchanged<\/strong><br>• <strong>End-diastolic volume (EDV)<\/strong>: volume in the ventricle at the end of diastole, before the heart contracts; <strong>120 mL<\/strong>", "• Increase in ventricular pressure closes the AV valves<br>• Increase in atrial pressure as the valves push upwards into the atria"], ["<strong>3. Rapid ejection<\/strong>", "• AV valves closed<br>• <strong>Pulmonary/aortic valves open<\/strong><br>• Blood ejected", "• Decreased ventricular volume", "• Ventricular pressure forces valves open<br>• <strong>Stenosis<\/strong>: narrow valve that does not open properly; requires higher pressure<br>• Increase in pulmonary/aortic pressures as they receive blood<br>• Gradient between LV and aorta is small"], ["<strong>4. Reduced ejection<\/strong><br>v wave · end of T wave", "• Ventricles begin to <strong>repolarize<\/strong><br>• AV valves closed<br>• Atrial filling continuing", "• Decreased ventricular volume", "—"], ["<strong>5. Isovolumetric relaxation<\/strong><br>S2", "• Ventricles begin to relax<br>• AV valves closed<br>• <strong>Pulmonary/aortic valves close<\/strong><br>• Active, energy-dependent process; if ventricles do not relax well, they do not fill well (<strong>diastolic dysfunction<\/strong>)", "• Ventricular volume <strong>unchanged<\/strong><br>• <strong>End-systolic volume (ESV)<\/strong>: volume remaining at the end of systole; <strong>50 mL<\/strong>", "• Decrease in ventricular pressure<br>• Aortic/pulmonary pressures &gt; ventricular pressures, so aortic and pulmonary valves close"], ["<strong>6. Rapid filling<\/strong><br>S3 may be heard", "• <strong>AV valves open<\/strong><br>• Pulmonary/aortic valves closed", "• Increased ventricular volume", "• Fall in ventricular pressure opens the AV valves<br>• Atrial pressure falls as the atrium passively gives blood to the ventricle"], ["<strong>7. Reduced filling<\/strong>", "• AV valves open<br>• Pulmonary/aortic valves closed", "• Increased ventricular volume", "• Gradual increase in ventricular pressure"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"1 Atrial systole<br/>P wave · a wave · S4\"] --> B[\"2 Isovolumetric contraction<br/>AV valves close · QRS · c wave · S1\"]\n B --> C[\"3 Rapid ejection<br/>aortic and pulmonary valves open\"]\n C --> D[\"4 Reduced ejection<br/>end of T wave · v wave\"]\n D --> E[\"5 Isovolumetric relaxation<br/>aortic and pulmonary valves close · S2\"]\n E --> F[\"6 Rapid filling<br/>AV valves open · S3\"]\n F --> G[\"7 Reduced filling\"]\n G --> A"}, {"t": "table", "cols": ["", "Systolic failure", "Diastolic failure"], "rows": [["Ventricle", "Dilated ventricle", "Stiff ventricle"], ["EDP", "Increase", "Increase"], ["EF", "Decrease", "Same"], ["SV", "Decreased", "Same"], ["EDV", "Increased", "Same"]]}, {"t": "head", "html": "<h5>The cardiac action potential<\/h5>"}, {"t": "table", "cols": ["Phase", "Ion channels involved"], "rows": [["<strong>Phase 0<\/strong> – depolarization", "V.G. Na+ channels open, Na+ flows into the cell"], ["<strong>Phase 1<\/strong> – early repolarization", "V.G. K+ channels open, K+ flows out of the cell<br>V.G. Na+ channels become inactivated"], ["<strong>Phase 2<\/strong> – plateau", "V.G. Ca2+ channels open, Ca2+ flows into the cell<br>Ca2+ influx essentially balances the K+ efflux → unchanging potential<br>These channels begin to open in Phase 0 and close in response to increased cytosolic Ca2+"], ["<strong>Phase 3<\/strong> – late repolarization", "V.G. Ca2+ channels close<br>V.G. K+ channels continue to open, K+ flows out of the cell"], ["<strong>Phase 4<\/strong>", "Return to the resting membrane potential"]]}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"SA node\"] -->|\"0.03 s\"| B[\"AV node\"]\n B -->|\"0.13 s\"| C[\"Purkinje system\"]\n C -->|\"0.03 s\"| D[\"Ventricular muscle\"]\n D -->|\"0.03 s\"| E[\"Through muscle cells<br/>total 0.19 s\"]"}]}, {"id": "cardio-w1-02", "num": "02", "name": "Introduction to ECG", "title": "ECG Basics and Interpretation", "framing": "<p>The ECG records the heart’s depolarization as seen from 12 viewpoints; <strong>a wave moving toward a positive electrode writes an upward deflection<\/strong>. Everything else – leads, axis, localising an infarct – follows from that one rule, read in a fixed order: rate, rhythm, axis, hypertrophy, ischemia.<\/p>", "week": 1, "weekLabel": "Week 1 - Cardiac Physiology, ECG & Cardiac Pharmacology", "items": [{"t": "table", "cols": ["Wave / interval", "Represents", "Normal / notes"], "rows": [["<strong>P wave<\/strong>", "Atrial depolarization and contraction", ""], ["<strong>PR interval<\/strong>", "Pause at the AV node before ventricular depolarization", "<strong>120–200 ms<\/strong>"], ["<strong>QRS complex<\/strong>", "Ventricular depolarization and contraction", "<strong>80–120 ms<\/strong><br>• Q: first downward deflection; often absent<br>• R: first upward deflection<br>• S: any downward wave preceded by an upward wave<br>• QS: no upward wave"], ["<strong>ST segment<\/strong>", "Plateau phase of ventricular repolarization", "Normally level with baseline – <strong>pathology if elevated or depressed<\/strong>"], ["<strong>T wave<\/strong>", "Late phase of rapid ventricular repolarization", ""], ["<strong>QT interval<\/strong>", "Duration of ventricular systole", "Less than half the R-to-R interval at normal rates<br><strong>Males ≤ 440 ms; females ≤ 460 ms<\/strong><br>Prolonged by genetics, drugs, electrolytes, hypothermia"], ["<strong>U wave<\/strong>", "Ventricular repolarization", "Can be normal or a sign of <strong>hypokalemia<\/strong>"]], "lead": "<p><strong>ECG waves<\/strong><\/p>"}, {"t": "head", "html": "<h5>The 12 standard ECG leads<\/h5><p><strong>6 limb leads<\/strong> (R arm, L arm, L leg) + <strong>6 chest leads<\/strong>.<\/p>"}, {"t": "table", "cols": ["Lead", "Positive electrode", "Negative electrode"], "rows": [["<strong>Bipolar limb leads<\/strong> (Einthoven’s triangle)", "", ""], ["Lead I", "Left arm", "Right arm"], ["Lead II", "Left leg", "Right arm"], ["Lead III", "Left leg", "Left arm"], ["<strong>Augmented limb leads<\/strong> (unipolar)", "", ""], ["aVR", "Right arm", "Left arm + left leg (common ground)"], ["aVL", "Left arm", "Right arm + left leg (common ground)"], ["aVF (II + III)", "Left leg", "Left arm + right arm (common ground)"]]}, {"t": "table", "cols": ["Lead", "Views", "Position"], "rows": [["<strong>V1<\/strong>", "Right chest", "4th intercostal space, R sternal border"], ["<strong>V2<\/strong>", "Right chest", "4th intercostal space, L sternal border"], ["<strong>V3<\/strong>", "Interventricular septum (RV)", "Midway between V2 and V4"], ["<strong>V4<\/strong>", "Interventricular septum (LV)", "5th intercostal space, L midclavicular line"], ["<strong>V5<\/strong>", "Left chest", "5th intercostal space, L anterior axillary line"], ["<strong>V6<\/strong>", "Left chest", "5th intercostal space, L mid-axillary line"]], "lead": "<p><strong>Chest wall leads (unipolar)<\/strong> – lie in a <strong>horizontal (transverse) plane<\/strong>; each chest electrode is positive, projects through the patient’s back (negative), and is oriented through the AV node.<\/p>"}, {"t": "head", "html": "<h5>ECG interpretation<\/h5><p>Work through the tracing in the same order every time.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Rate<br/>300-150-100-75-60-50\"] --> B[\"Rhythm<br/>P before each QRS? QRS after each P?\"]\n B --> C[\"Intervals<br/>PR for AV blocks · QRS for BBB\"]\n C --> D[\"Axis<br/>leads I and aVF · lead II for left axis\"]\n D --> E[\"Hypertrophy<br/>check V1\"]\n E --> F[\"Ischemia and infarction<br/>Q waves · T inversion · ST changes\"]\n F --> G[\"Pericarditis<br/>diffuse concave ST elevation · PR depression\"]"}, {"t": "pathway", "mermaid": "flowchart TD\n A{\"QRS in lead I?\"} -->|\"Positive\"| B{\"QRS in aVF?\"}\n A -->|\"Negative\"| C{\"QRS in aVF?\"}\n B -->|\"Positive\"| D[\"Normal axis\"]\n B -->|\"Negative\"| E{\"Lead II positive?\"}\n E -->|\"Yes\"| D\n E -->|\"No\"| F[\"Left axis deviation\"]\n C -->|\"Positive\"| G[\"Right axis deviation\"]\n C -->|\"Negative\"| H[\"Extreme right axis deviation\"]"}, {"t": "table", "cols": ["Location", "Leads", "Look for"], "rows": [["<strong>Right atrium<\/strong>", "II, III, aVF", "Tall P wave"], ["<strong>Right ventricle<\/strong>", "V1–V3", "Large R wave"], ["<strong>Left atrium<\/strong>", "I, II, V1", "Long notched or biphasic P wave"], ["<strong>Left ventricle<\/strong>", "V1, V6", "Large S in V1 + large R in V6 &gt; 35 mm"]], "lead": "<p><strong>Hypertrophy<\/strong> – check V1<\/p>"}, {"t": "table", "cols": ["Location", "ST elevation in", "Reciprocal", "Artery", "Rule"], "rows": [["<strong>Posterior<\/strong>", "None", "V1, V2", "Posterior interventricular artery (RCA)", "↑ posterior = ↓ anterior leads"], ["<strong>Anterior<\/strong>", "V1–V4", "II, III, aVF", "LAD (LCA)", "↑ anterior = ↓ inferior leads"], ["<strong>Inferior<\/strong>", "II, III, aVF", "I, aVL", "RCA", "↑ inferior = ↓ lateral leads"], ["<strong>Lateral<\/strong>", "I, aVL, V5, V6", "V1, V2", "Circumflex", "↑ lateral = ↓ septal leads"], ["<strong>Septal<\/strong>", "Loss of R wave in V1, V2 or V3", "None", "LAD (LCA), posterior interventricular artery (RCA)", "↑ septal = ↓ posterior leads"]]}, {"t": "head", "html": "<h5>Rhythm disorders<\/h5><p><strong>Irregular rhythms<\/strong> lack a constant duration between paced cycles.<\/p>"}, {"t": "table", "cols": ["Rhythm", "Rate", "Features"], "rows": [["<strong>Multifocal atrial tachycardia<\/strong>", "&gt; 100/min", "At least 3 different P-wave morphologies in the same lead"], ["<strong>Escape rhythms<\/strong> – response of an automaticity focus to a pause in SA node pacemaking", "", ""], ["<strong>Junctional escape<\/strong> (idiojunctional)", "<strong>40–60/min<\/strong>", "A junctional focus in the AV node takes over as pacemaker<br>Inverted P wave immediately before, after, or buried within each QRS"], ["<strong>Ventricular escape<\/strong> (idioventricular)", "<strong>20–40/min<\/strong>", "A ventricular automaticity focus takes over as pacemaker"], ["<strong>Tachyarrhythmias<\/strong> – rapid rhythms from very irritable automaticity foci", "", ""], ["<strong>Paroxysmal tachycardia<\/strong> (sudden)", "<strong>150–250/min<\/strong>", ""], ["<strong>Atrial flutter<\/strong>", "<strong>250–350/min<\/strong>", "Continuous rapid sawtooth atrial complexes from a single rapid-firing atrial focus<br>Many flutter waves needed to produce a ventricular response"], ["<strong>Ventricular flutter<\/strong> / torsades de pointes", "<strong>250–350/min<\/strong>", "Rapid series of smooth sine waves from a single rapid-firing ventricular focus<br>Usually a short burst leading to ventricular fibrillation"], ["<strong>Atrial fibrillation<\/strong>", "<strong>350–450/min<\/strong>", "Jagged baseline of tiny spikes from multiple atrial foci<br>Ventricular QRS response is irregular"], ["<strong>Ventricular fibrillation<\/strong>", "<strong>350–450/min<\/strong>", "Multiple ventricular foci → totally erratic rhythm without identifiable waves<br><strong>Needs immediate treatment<\/strong>"], ["<strong>AVNRT<\/strong> (AV node re-entrant tachycardia)", "", "P wave after the QRS complex"], ["<strong>Wide complex regular tachycardia<\/strong>", "&gt; 100/min", "QRS <strong>&gt; 120 ms<\/strong>"]]}, {"t": "table", "cols": ["Block", "Site", "ECG"], "rows": [["<strong>First degree AV block<\/strong>", "Usually delay in the AV node; influenced by autonomic tone", "<strong>PR &gt; 200 ms; no dropped QRS<\/strong><br>All P waves conducted"], ["<strong>Second degree, Mobitz I<\/strong> (Wenckebach)", "Usually the AV node, or high parasympathetic tone", "<strong>Progressive PR prolongation, then a dropped QRS<\/strong><br>Cycle after the block has the shortest PR<br>Often benign; no pacemaker unless symptomatic"], ["<strong>Second degree, Mobitz II<\/strong>", "Likely infranodal", "<strong>Constant PR; spontaneous dropped QRS<\/strong><br>PR after the block same as before<br>Higher progression to complete AVB; <strong>usually pacemaker indicated<\/strong>"], ["<strong>Third degree<\/strong> (complete)", "", "<strong>AV dissociation – no P wave produces a QRS<\/strong><br>Regular P waves; regular QRS, slower than the P waves<br>Ventricular rate 40–60/min → junctional focus; 20–40/min → ventricular focus"]], "lead": "<p><strong>Blocks<\/strong> prevent the conduction of depolarization.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A{\"Every P wave followed by a QRS?\"} -->|\"Yes\"| B{\"PR over 200 ms?\"}\n B -->|\"Yes\"| C[\"First degree AV block\"]\n B -->|\"No\"| N[\"No AV block\"]\n A -->|\"Some dropped\"| D{\"PR before the drop?\"}\n D -->|\"Progressively lengthens\"| E[\"Mobitz I Wenckebach<br/>often benign\"]\n D -->|\"Constant\"| F[\"Mobitz II<br/>usually pacemaker\"]\n A -->|\"None related to QRS\"| G[\"Third degree AV dissociation\"]\n G --> H{\"Ventricular rate?\"}\n H -->|\"40-60/min\"| I[\"Junctional escape focus\"]\n H -->|\"20-40/min\"| J[\"Ventricular escape focus\"]"}, {"t": "table", "cols": ["", "Left bundle branch block", "Right bundle branch block"], "rows": [["Septum", "LBB fails to activate septum", "LBB activates septum"], ["RV", "RBB activates RV", "RBB fails to activate RV"], ["LV", "LBB fails to activate LV; <strong>LV activated late through the RBB<\/strong>", "LBB activates LV"], ["Late chamber", "LV", "<strong>RV activated late through the LBB<\/strong>"], ["V1", "Delay away from V1 → <strong>negative QRS<\/strong>", "Delay toward V1 → <strong>positive QRS, large second “rabbit ear”<\/strong>"], ["V6", "Delay toward V6 → <strong>positive QRS<\/strong>", "Delay away from V6 → <strong>abnormal S wave ending the QRS<\/strong>"]], "lead": "<p><strong>Bundle branch blocks<\/strong><\/p>"}]}, {"id": "cardio-w1-03", "num": "03", "name": "Anatomy of the Heart and Mediastinum", "title": "Anatomy of the Mediastinum and the Heart", "framing": "<p>A map of the chest’s middle compartment and the heart inside it. The organising idea is <strong>the sternal angle<\/strong>: it splits superior from inferior mediastinum, and from there each structure – chamber, valve, coronary branch, nerve – has a fixed place and a fixed job.<\/p>", "week": 1, "weekLabel": "Week 1 - Cardiac Physiology, ECG & Cardiac Pharmacology", "items": [{"t": "table", "cols": ["Division", "Boundaries", "Contents"], "rows": [["<strong>Superior mediastinum<\/strong>", "<strong>Superior thoracic aperture<\/strong> to the <strong>sternal angle<\/strong> anteriorly and the <strong>inferior border of T4<\/strong> posteriorly", "Thymus gland · brachiocephalic veins · SVC · arch of aorta and branches · vagus nerve · L recurrent laryngeal nerve · ligamentum arteriosum · phrenic nerve · trachea · esophagus"], ["<strong>Inferior mediastinum<\/strong>", "<strong>Sternal angle<\/strong> to the <strong>diaphragm<\/strong>", "Divided into anterior, middle and posterior:"], ["", "<strong>Anterior<\/strong>: between the sternum and pericardial sac", "Thymus gland (children, adolescents) · fat (adults) · lymph nodes · internal thoracic vessels and branches"], ["", "<strong>Middle<\/strong>: within the pericardial sac", "Heart · ascending aorta · pulmonary vessels · terminal SVC · phrenic nerves"], ["", "<strong>Posterior<\/strong>: from the pericardial sac and lung roots to the thoracic vertebral bodies", "Descending aorta · thoracic duct · azygos venous system (<strong>collateral pathway from the IVC in the abdomen<\/strong>) · esophagus · sympathetic trunk · thoracic splanchnic nerves"]]}, {"t": "head", "html": "<h5>Arteries and veins of the mediastinum<\/h5>"}, {"t": "table", "cols": ["Chamber", "Key features"], "rows": [["<strong>Right atrium<\/strong><br>receives deoxygenated blood from the body", "• <strong>R auricle<\/strong> and anterior portion contain <strong>pectinate muscles<\/strong><br>• <strong>Crista terminalis<\/strong> separates the pectinate muscles from the smooth posterior wall<br>• <strong>Fossa ovalis<\/strong>: remnant of the fetal foramen ovale that shunted blood to the L heart<br>• Three veins deliver blood: <strong>SVC<\/strong> (upper body), <strong>IVC<\/strong> (lower body; largest vein), <strong>coronary sinus<\/strong> (heart tissue – enters between the right AV valve and the IVC opening)"], ["<strong>Right ventricle<\/strong><br>pumps deoxygenated blood to the lungs", "• <strong>Tricuspid valve<\/strong> bases attach to a fibrous ring that resists dilation; free cusp edges attach to <strong>chordae tendineae<\/strong><br>• <strong>Papillary muscles<\/strong> anchor the tricuspid valve; with the chordae they stop the cusps being pushed back into the atrium during contraction<br>• <strong>Septomarginal trabecula<\/strong> carries part of the conducting system → coordinated RV contraction<br>• <strong>Trabeculae carneae<\/strong>: muscular ridges<br>• Blood leaves via the <strong>conus arteriosus<\/strong> (smooth part just below the <strong>pulmonary semilunar valve<\/strong>) into the <strong>pulmonary trunk<\/strong>"], ["<strong>Left atrium<\/strong><br>receives oxygenated blood from the lungs", "• Smooth interior; walls slightly thicker than the RA<br>• Forms most of the <strong>base of the heart<\/strong><br>• <strong>L auricle<\/strong> is small and contains pectinate muscles; the rest is smooth-walled<br>• <strong>Four pulmonary veins<\/strong> (R/L superior, R/L inferior) deliver oxygenated blood"], ["<strong>Left ventricle<\/strong><br>pumps oxygenated blood to the body", "• <strong>Mitral valve<\/strong> chordae attach to <strong>two large papillary muscles<\/strong> on the LV wall, which contract with the LV<br>• <strong>Larger and thicker-walled than the RV<\/strong> – pumps systemically under greater pressure<br>• Numerous small trabeculae carneae<br>• Ejects through the <strong>aortic semilunar valve<\/strong> (left, right and posterior cusps) into the ascending aorta"]], "lead": "<p><strong>Chambers of the heart<\/strong><\/p>"}, {"t": "table", "cols": ["Vessel", "Position and role"], "rows": [["<strong>Pulmonary trunk<\/strong>", "Anterior and on the L side; from the RV, divides into two <strong>pulmonary arteries<\/strong> carrying deoxygenated blood to the lungs"], ["<strong>Aorta<\/strong>", "To the R of the pulmonary trunk; from the LV, carries blood systemically"], ["<strong>Superior vena cava<\/strong>", "R side, posteriorly; returns deoxygenated blood from the <strong>upper 1/3<\/strong> of the body to the RA"], ["<strong>Inferior vena cava<\/strong>", "Ascends through the diaphragm; returns deoxygenated blood from the <strong>lower 2/3<\/strong> of the body to the RA"]], "lead": "<p><strong>Great vessels of the heart<\/strong><\/p>"}, {"t": "table", "cols": ["Septum", "Features", "Defect"], "rows": [["<strong>Interatrial<\/strong>", "Separates RA and LA rventricular artery to the AV node"], ["<strong>Left coronary<\/strong> (in the coronary sulcus)", "<strong>Anterior interventricular<\/strong> (LAD)", "Anterior interventricular groove to the apex – RV, LV and the <strong>anterior 2/3 of the septum<\/strong>; anastomoses with the posterior interventricular artery (RCA)"], ["", "<strong>Circumflex<\/strong>", "Continues in the coronary sulcus to the posterior heart – LA and LV; gives rise to the <strong>L marginal artery<\/strong>; anastomoses with the RCA"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"SA node<br/>AP produced\"] --> B[\"Three internodal tracts\"]\n B --> C[\"AV node<br/>one-way conduction\"]\n C --> D[\"Bundle of His\"]\n D --> E[\"R and L bundle branches<br/>through the interventricular septum\"]\n E --> F[\"Apex of the heart\"]\n F --> G[\"Purkinje fibres\"]\n G --> H[\"Ventricular contraction\"]"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Myocardial ischemia<br/>metabolic by-products\"] --> B[\"Visceral afferents<br/>along sympathetic nerves\"]\n B --> C[\"Dorsal roots T1-T4/5\"]\n C --> D[\"Referred to T1-T4/5 dermatomes\"]\n E[\"Pericardial inflammation\"] --> F[\"Phrenic nerve\"]\n F --> G[\"Referred to C3-C5<br/>top of shoulder\"]"}]}, {"id": "cardio-w1-04", "num": "04", "name": "Introduction to Cardiac Physiology", "title": "Normal Heart Sounds and Classifying Cardiac Murmurs", "framing": "<p>Two normal sounds mark valve closure; two extra sounds and every murmur point to a specific abnormal load or valve. The organising idea: <strong>describe a murmur by timing, location, intensity and shape<\/strong>, and the diagnosis narrows itself.<\/p>", "week": 1, "weekLabel": "Week 1 - Cardiac Physiology, ECG & Cardiac Pharmacology", "items": [{"t": "table", "cols": ["Sound", "Cause", "Timing", "Significance"], "rows": [["<strong>S1<\/strong> (LUB)", "<strong>Mitral and tricuspid valves closing<\/strong>", "Start of systole", "Normal"], ["<strong>S2<\/strong> (DUB)", "<strong>Aortic and : 1, "weekLabel": "Week 1 - Cardiac Physiology, ECG & Cardiac Pharmacology", "items": [{"t": "head", "html": "<h5>Determinants of cardiac output<\/h5><ul><li><strong>Cardiac output (CO)<\/strong>: blood pumped in one minute; increases with oxygen demand (exercise, fever); <strong>normal = 5 L/min<\/strong><\/li><li><strong>CO = HR × SV<\/strong><\/li><li><strong>Cardiac index<\/strong>: relates heart performance to body size – <strong>CI = CO/body surface area<\/strong> (L/min/m2)<\/li><\/ul>"}, {"t": "table", "cols": ["Determinant", "Effect on preload"], "rows": [["Blood volume", "↑ volume → ↑ preload"], ["Venous tone", "↑ venous tone → ↑ preload"], ["Ventricular compliance", "A more compliant ventricle holds more blood at a given pressure than a noncompliant one"], ["Afterload", "↑ afterload → ↑ preload: less blood ejected, more residual blood adds to EDV"], ["Contractility", "More blood ejected in systole → less left to add to EDV"], ["Atrial contraction", "Atrial “kick” forces extra blood into the ventricle"], ["Intrathoracic pressure", "Excessive thoracic pressure can reduce venous return to the RV"]], "lead": "<p><strong>Determinants of preload<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Acute blood loss\"] --> B[\"↓ blood volume → ↓ preload\"]\n B --> C[\"↓ stroke volume\"]\n C --> D[\"Sympathetic activation\"]\n D --> E[\"↑ heart rate\"]\n D --> F[\"Vasoconstriction<br/>↓ capillary refill\"]\n D --> G[\"↓ urine output<br/>preserve volume\"]\n E --> H[\"BP initially maintained\"]\n F --> H\n G --> H\n H -->|\"Ongoing loss\"| I[\"BP falls\"]\n I --> J[\"Stop bleed · elevate legs<br/>fluids or transfusion · surgery\"]"}, {"t": "table", "cols": ["Hypertrophy type", "Stimulus", "Wall"], "rows": [["<strong>Physiologic<\/strong> (athlete’s heart)", "Training – normal, lower HR", "Changes are reversible"], ["<strong>Concentric<\/strong>", "<strong>Pressure overload<\/strong>", "↑ relative wall thickness"], ["<strong>Eccentric<\/strong> (dilated)", "<strong>Volume overload<\/strong>", "Normal relative wall thickness"]], "lead": "<p><strong>Hypertrophy<\/strong>: an increase in ventricular mass and cell volume.<\/p>"}]}, {"id": "cardio-w1-07", "num": "07", "name": "Microcirculation and Lymphatics", "title": "Microcirculation, Vascular Flow and BP Regulation", "framing": "<p>How the capillary bed exchanges material and fluid, and how flow and pressure are controlled – from Poiseuille’s law through the baroreflex to local metabolites. The organising idea: <strong>Flow = ΔP/R<\/strong>, and nearly every control mechanism works by changing <strong>R at the arterioles<\/strong>.<\/p>", "week": 1, "weekLabel": "Week 1 - Cardiac Physiology, ECG & Cardiac Pharmacology", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"Low BP\"] --> B[\"↓ stretch of aortic arch and carotid sinus\"]\n B --> C[\"↓ afferent signalling<br/>vagus and glossopharyngeal\"]\n C --> D[\"Nucleus tractus solitarius<br/>medulla\"]\n D --> E[\"Parasympathetic inhibited\"]\n D --> F[\"↑ sympathetic outflow<br/>T1-4 · trunk ganglion · cardiac accelerator nerve\"]\n F --> G[\"Norepinephrine released\"]\n G --> H[\"↑ HR · contractility · SV\"]\n G --> I[\"Vasoconstriction ↑ TPR\"]\n E --> H\n H --> J[\"↑ BP\"]\n I --> J"}, {"t": "table", "cols": ["", "Sympathetic (fight or flight)", "Parasympathetic (rest and digest)"], "rows": [["Heart", "↑ HR and force (↑ SV) → ↑ CO → ↑ MAP", "↓ HR and force (↓ SV) → ↓ CO → ↓ MAP"], ["Arterioles", "Innervates arterioles → constriction → ↑ TPR → ↑ MAP", "<strong>Does NOT innervate blood vessels<\/strong> → ↓ TPR → ↓ MAP"], ["Tone", "Continuously active, 1 AP every few sec (max 20 AP/sec)<br><strong>Causes both vasoconstriction and vasodilation by changing tonic activity to the arterioles<\/strong>", "When PSNS is activated, SNS is shut off<br>When SNS is shut off, blood vessels dilate"]]}, {"t": "table", "cols": ["Hormone", "Vasoconstrictor (↑ TPR, ↑ MAP)", "Vasodilator (↓ TPR, ↓ MAP)"], "rows": [["<strong> l effect<br>↓ intrinsic rate of SA node<br>Slows conduction through AV node", "↑ myocardial contractility<br>↓ HR", "Systolic heart failure (HFrEF)<br>Chronic atrial fibrillation", "2nd/3rd degree AV block<br>Renal insufficiency<br>Hypokalemia<br>Hypercalcemia", "Arrhythmias<br>AV block<br>Nausea, vomiting<br>Confusion<br>Hallucinations, psychosis<br>Yellow-green vision, halos"], ["<strong>Nitrates<\/strong>", "<strong>Nitroglycerin<\/strong>", "Relax vascular smooth muscle<br>↑ cGMP", "Vasodilation<br>↓ myocardial oxygen demand<br>↓ preload and afterload<br>↑ perfusion of myocardium", "Myocardial ischemia (angina)<br>Coronary spasm<br>MI with pulmonary edema", "Low blood pressure<br><strong>PDE-5 inhibitors<\/strong>", "Headache<br>Hypotension<br>Reflex tachycardia<br>Withdrawal symptoms"], ["<strong>Vasodilators<\/strong>", "<strong>Hydralazine<\/strong>", "Relax vascular smooth muscle", "Vasodilation", "Antihypertensive<br>Combined with nitrates for patients intolerant of ACEI/ARBs<br>May benefit black population with HFrEF", "Coronary artery disease", "Headache<br>Reflex tachycardia<br>Hypotension<br>Lupus-like syndrome"], ["<strong>CCB<\/strong><br>“<em>-pine<\/em>”", "<strong>Dihydropyridines<\/strong><br><strong>Amlodipine<\/strong><br>Nifedipine<br>Nimodipine", "Block smooth muscle Ca2+ channels", "Vasodilation", "Hypertension", "Severe aortic stenosis<br>Liver failure", "Headache<br>Hypotension<br>Edema"], ["", "<strong>Non-dihydropyridines<\/strong><br>Verapamil<br>Diltiazem", "Block smooth muscle and myocardial Ca2+ channels<br>↓ conduction (SA and AV nodes)<br>↑ refractory period of AV node", "Vasodilation (less potent)<br>Effects similar to β-blockers<br>↓ myocardial contractility", "Atrial fibrillation<br>Supraventricular tachycardias", "<strong>Systolic heart failure<\/strong><br>Bradycardia<br>2nd/3rd degree AV block<br>Hypotension", "Worsening CO<br>Bradycardia<br>Edema"], ["<strong>Beta blockers<\/strong>", "Nonselective<br><strong>Propranolol<\/strong>", "Block beta 1 and beta 2 receptors", "<strong>Beta 1:<\/strong> ↓ HR, ↓ myocardial contractility, ↓ conduction velocity<br><strong>Beta 2:<\/strong> vasoconstriction, bronchoconstriction", "Myocardial ischemia (angina)<br>Post-MI — decrease mortality<br>Hypertension<br>Systolic heart failure (HFrEF)<br>Atrial fibrillation", "Hypotension<br>Bradycardia<br>Symptomatic poorly controlled heart failure<br><strong>Severe reactive airway disease<\/strong>", "Bronchospasm (beta 2)<br>Bradycardia<br>Worsening heart failure<br>Fatigue<br>Headache<br>Abrupt withdrawal: reflex tachycardia, ischemia"]], "lead": "<p><strong>Cardiovascular drug classes<\/strong> — mechanism, effects, uses and toxicities.<\/p>"}, {"t": "head", "html": "<h5>Practice questions: cardiovascular drugs<\/h5><ul><li><strong>50.<\/strong> Digoxin, ACE inhibitors, ARBs, MRAs and beta blockers have all been shown to decrease mortality in systolic (decreased EF) heart failure EXCEPT: <strong>digoxin<\/strong><\/li><li><strong>51.<\/strong> ED patient with tongue and oropharyngeal swelling and difficulty swallowing — angioedema; admitted to ICU after otolaryngology consult. Of furosemide (Lasix, diuretic), spironolactone, perindopril (ACEI), metoprolol (beta blocker) and atorvastatin (statin), the MOST likely cause: <strong>perindopril, ACEI<\/strong><\/li><li><strong>52.<\/strong> Diffuse muscle pain (especially thighs, shoulders, lower back) and weakness over two days, elevated creatine kinase. If an adverse drug event, the MOST likely medication: <strong>atorvastatin, statin<\/strong><\/li><li><strong>53.<\/strong> Chronic cough — if medication-related, the MOST likely medication: <strong>lisinopril, ACEI<\/strong><\/li><li><strong>54.<\/strong> Ramipril (ACEI), nitroglycerin transdermal patch, valsartan (ARB), spironolactone (MRA) and eplerenone (MRA) may all predispose to hyperkalemia EXCEPT: <strong>nitroglycerin transdermal patch<\/strong><\/li><\/ul>"}, {"t": "table", "cols": ["", "Parasympathetic", "Sympathetic"], "rows": [["Role", "Rest and digest", "Fight or flight"], ["Outflow", "<strong>Craniosacral<\/strong>: cranial nerves 3, 7, 9, 10; sacral outflow", "<strong>Thoracolumbar<\/strong>"], ["Preganglionic fibre", "Long (<strong>cholinergic<\/strong>)", "Short (<strong>cholinergic<\/strong>)"], ["Postganglionic fibre", "Short (<strong>cholinergic<\/strong>)", "Long (<strong>adrenergic<\/strong>; <strong>cholinergic to sweat glands<\/strong>)"], ["Effects", "<strong>SLUDGE<\/strong>: <strong>S<\/strong>alivation, <strong>L<\/strong>acrimation, <strong>U<\/strong>rination, <strong>D<\/strong>efecation, <strong>G<\/strong>astrointestinal upset, <strong>E<\/strong>mesis (vomiting)<br>Bronchorrhea (watery sputum)<br>Bronchoconstriction<br>Bradycardia<br>Miosis (pupil constriction)", "Sweating<br>Far vision accommodation<br>Muscle blood flow<br>Increased cardiac output<br>Bronchodilation<br>Tachycardia<br>Mydriasis (pupil dilation)"]], "lead": "<p><strong>Autonomic nervous system<\/strong><\/p>"}, {"t": "table", "cols": ["Receptor", "Location / action"], "rows": [["<strong>α1<\/strong>", "Postsynaptic, to skin and GI tract; vasoconstriction; mediate contraction of the prostate gland"], ["<strong>α2<\/strong>", "Presynaptic inhibition of norepinephrine release (negative feedback); vasodilation"], ["<strong>β1<\/strong>", "↑ HR, myocardial contractility and conduction velocity"], ["<strong>β2<\/strong>", "Smooth muscle relaxation: vasodilation, bronchodilation, uterine relaxation"]], "lead": "<p><strong>Adrenergic receptors<\/strong> (GPCRs) — epinephrine, dopamine and norepinephrine act on receptors on effector organs of the sympathetic nervous system. Neuronal reuptake avoids resynthesis of new molecules; <strong>cocaine blocks the reuptake transporters<\/strong>, keeping norepinephrine active in the cleft → sympathomimetic response.<\/p>"}, {"t": "table", "cols": ["Receptor", "Type", "Location"], "rows": [["<strong>Nicotinic<\/strong>", "Na+ channel receptor", "Ganglia of PSNS and SNS; NMJ of skeletal muscle; brain"], ["<strong>Muscarinic<\/strong>", "GPCR", "Effector organs (PSNS, sweat glands); brain"]], "lead": "<p><strong>Cholinergic receptors<\/strong> — acetylcholine acts on all receptors in the ganglia of both the sympathetic and parasympathetic systems, on effector organs of the parasympathetic system, and on sweat glands in the sympathetic system.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Acetyl CoA + choline\"] --> B[\"ACh synthesized\"]\n B --> C[\"Stored in vesicles<br/>10 000-50 000 per vesicle\"]\n C -->|\"depolarization, Ca2+ influx\"| D[\"ACh released into synapse\"]\n D --> E[\"Nicotinic or muscarinic<br/>receptor activation\"]\n D --> F[\"Breakdown by<br/>acetylcholinesterase\"]\n F --> G[\"Choline recycled\"]\n G --> A\n X1[\"Botulinum toxin\"] -.->|\"blocks release\"| D\n X2[\"AChE inhibitors<br/>carbamates, organophosphates\"] -.->|\"block breakdown\"| F\n X3[\"Muscarinic or nicotinic<br/>blockers\"] -.->|\"block\"| E"}, {"t": "table", "cols": ["Drug class", "Examples", "Mechanism", "Effects", "Indications", "Adverse effects"], "rows": [["<strong>Muscarinic agonists<\/strong> (cholinomimetics)", "Bethanechol chloride (Duvoid, Urecholine)<br>Amanita muscaria", "Activate muscarinic receptors", "PSNS activation<br>Bladder stimulant", "Post-operative urinary retention<br>Neurogenic bladder", "SLUDGE symptoms<br><strong>Diaphoresis: sweating<\/strong><br>Hallucinations<br>Seizures if crosses BBB"], ["<strong>Nicotinic agonists<\/strong>", "Nicotine", "Activate nicotinic receptors<br>CNS stimulant<br>Low doses: SNS activation<br>High doses: PSNS activation", "↑ alertness<br>↑ HR and BP<br>Salivation, nausea, vomiting", "Smoking cessation", "Addiction<br>Muscle fasciculations<br>Paralysis<br>Seizures<br>Coma"], ["<strong>AChE inhibitors<\/strong>", "Reversible: carbamates<br>Irreversible: organophosphates", "Block breakdown of ACh", "↑ <strong>ACh levels<\/strong><br>PSNS activation", "Myasthenia gravis<br>Cognitive impairment (dementia)", "SLUDGE symptoms<br>Muscle fasciculations<br>Paralysis<br>CNS: seizures, psychosis, restlessness, confusion"], ["<strong>Muscarinic blockers<\/strong> (anticholinergics)", "<strong>Atropine<\/strong><br>Detrol<br>Atrovent", "Block muscarinic receptors", "Block PSNS activation<br>↑ HR<br>Bronchodilation", "Atropine: cardiac arrest, muscarinic toxicity, AChE toxicity<br>Detrol: overactive bladder<br>Atrovent (+ Ventolin): asthma, COPD", "<strong>Toxidrome<\/strong>: hot as a hare, dry as a bone, red as a beet, blind as a bat, mad as a hatter"], ["<strong>Nicotinic blockers<\/strong><br>“<em>-ium<\/em>”", "<strong>Depolarizing<\/strong><br>Succinylcholine", "Block nicotinic receptors; depolarize cells continually<br>Fast acting (works within 1 min, wears off within 5 mins)<br>Not metabolized by tissue AChE", "Muscle paralysis", "Anaesthesia<br>Reversal: AChE inhibitor to increase ACh at NMJ (competes with the muscle relaxant at the receptor); combine with atropine to prevent muscarinic effects", "— (not listed)"], ["", "<strong>Nondepolarizing<\/strong><br>Vecuronium<br>Cisatracurium", "Block nicotinic receptors; competitive antagonists at NMJ<br>Slower onset<br>Prolonged action (20–60 mins)", "Muscle paralysis (as above)", "As above", "— (not listed)"]], "lead": "<p><strong>Cholinergic drugs<\/strong><\/p>"}, {"t": "head", "html": "<h5>Practice questions: autonomic drugs<\/h5><ul><li><strong>55.<\/strong> Mr. Thompson, 45, with amyotrophic lateral sclerosis, has difficulty swallowing and drooling of saliva; fed a liquid diet through a gastrojejunostomy. Glycopyrrolate (Robinul) is used to dry his secretions — similar to atropine but does not cross the blood–brain barrier. Side effect you would NOT expect: <strong>increased muscle weakness<\/strong> (atropine = muscarinic receptor blocker)<\/li><li><strong>56.<\/strong> 19-year-old: T 39.7°C, HR 142, RR 20, BP 165/96; flushed, warm dry skin; agitated and incoherent; pupils 6 mm (mydriasis), sluggishly reactive; soft abdomen, absent bowel sounds; ate jimson weed seeds (four other teenagers en route with the same symptoms). Most similar drug class: <strong>belladonna alkaloid<\/strong> (blocks muscarinic receptors) → toxidrome effects; Benadryl and Gravol also have these effects<\/li><li><strong>57.<\/strong> Neurotransmitter released by the preganglionic neurons innervating the adrenal medulla: <strong>acetylcholine<\/strong><\/li><li><strong>58.<\/strong> 15-year-old after a seizure at home: HR 135 (sinus tachycardia), BP 158/68, RR 30, T 39.8°C (febrile); pupils dilated (7 mm); pale and sweaty. Drug effect type: <strong>sympathomimetic<\/strong> — similar to anticholinergic (antimuscarinic), but patients with anticholinergic toxidrome do NOT sweat; cocaine may present this way, as it blocks reuptake of norepinephrine at nerve terminals<\/li><li><strong>59.<\/strong> 1985 Tokyo subway: difficulty breathing with bronchorrhea, drooling, runny nose and eyes, sweating, nausea, involuntary muscle movements, weakness (some paralysis), involuntary urination, vomiting, confusion, convulsions, coma. Sarin is most likely: <strong>acetylcholinesterase inhibitor<\/strong> → muscarinic and nicotinic effects; used in chemical warfare; crosses the BBB causing confusion, seizures, coma<\/li><li><strong>60.<\/strong> Botulinum toxin (Botox) blocks release of ACh vesicles from cholinergic neurons; used clinically as an injection and a potent toxin. NOT expected in botulism: <strong>small miotic pupils<\/strong> — pupils would be dilated due to loss of ACh release<\/li><li><strong>61.<\/strong> IV infusion went interstitial; medication leaked into tissue and the skin is necrotic. The medication most likely is an <strong>alpha receptor agonist<\/strong>: potent alpha agonists are run through a large central vein (jugular, subclavian); peripheral IVs can be used in an emergency, but extravasation causes profound vasoconstriction → tissue ischemia and necrosis. If caught early, an alpha blocker can be infiltrated into the area to try to prevent skin damage<\/li><\/ul><p><strong>62–64.<\/strong> Isoproterenol: synthetic catecholamine, β1 agonist = β2 agonist, no α effect. Norepinephrine: endogenous catecholamine, α agonist with only slight β effects clinically. Fenoterol: +++ β2, + β1, no α. Labetalol: α blockade plus β1 and β2 blockade.<\/p><ul><li><strong>62.<\/strong> MOST helpful for bradycardia: <strong>isoproterenol<\/strong> — β1 agonists increase HR, CO and contractility<\/li><li><strong>63.<\/strong> Most helpful for hypotension: <strong>norepinephrine<\/strong> — α agonists cause vasoconstriction and increased BP<\/li><li><strong>64.<\/strong> Most helpful for bronchodilation: <strong>fenoterol<\/strong> — β2 agonists cause bronchodilation<\/li><\/ul>"}, {"t": "table", "cols": ["Test", "Result", "Normal range"], "rows": [["Hb", "147 g/L", "135–170 g/L"], ["Leukocytes", "10 × 10<sup>9<\/sup>/L", "4.0–10.0 × 10<sup>9<\/sup>/L"], ["Platelets", "243 × 10<sup>9<\/sup>/L", "150–400 × 10<sup>9<\/sup>/L"], ["Na+", "136 mmol/L", "135–145 mmol/L"], ["K+", "3.7 mmol/L", "3.5–5.0 mmol/L"], ["Urea", "9.3 mmol/L", "&lt; 11.9 mmol/L"], ["Creatinine", "76 umol/L", "62–120 (units as given: mmol/L)"], ["TSH", "3.40 mIU/L", "0.27–4.2 mIU/L"]], "lead": "<p><strong>Bloodwork<\/strong> — his baseline results are within normal limits.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Breathless, HR 150,<br/>signs of volume overload\"] --> B[\"ECG, CXR, bloodwork\"]\n B --> C[\"Atrial flutter with RVR<br/>+ heart failure\"]\n C --> D[\"Rate control\"]\n C --> E[\"Treat heart failure<br/>oxygen, diuretics\"]\n C --> F[\"Anticoagulation<br/>check not anemic first\"]\n C -.-> G[\"Rhythm correction<br/>not immediately\"]\n D --> H[\"Beta blocker<br/>low dose, with caution\"]\n D --> I[\"Digoxin<br/>acutely unwell\"]\n D -.-> J[\"Not diltiazem - negative inotrope<br/>Not amlodipine - no rate effect\"]\n I -->|\"once improved\"| H"}]}, {"id": "cardio-w2-02", "num": "02", "name": "Imaging in Cardiovascular Disease", "title": "Investigations in Cardiovascular Disease", "framing": "<p>How to investigate suspected ischemic heart disease, from history to catheter. The organising idea: <strong>match the test to the pretest probability and to the question<\/strong> (anatomy vs. function vs. viability) – no testing when risk is low, functional stress testing when it is intermediate, angiography when non-invasive results are high-risk.<\/p>", "week": 2, "weekLabel": "Week 2 - Valvular Disease, Heart Sounds & Endocarditis", "items": [{"t": "table", "cols": ["Framingham risk", "10-yr CVD risk", "Management"], "rows": [["<strong>Low<\/strong>", "&lt; 10%", "Lifestyle interventions; retest in 5 years with risk estimation"], ["<strong>Intermediate<\/strong>", "10-19%", "Lifestyle interventions + moderate-potency statin"], ["<strong>High<\/strong>", "≥ 20%", "Lifestyle interventions + high-potency statin; consider ASA"]], "lead": "<p><strong>Framingham risk score<\/strong>: estimated 10-year CVD risk, based on age, sex, smoking status, total cholesterol, HDL, and systolic BP.<\/p>"}, {"t": "table", "cols": ["Presentation", "ECG findings"], "rows": [["Classic angina", "Normal; ST segment depression and T wave abnormalities; Q waves"], ["STEMI", "ST elevation, T wave inversions, Q waves, LBBB"], ["NSTEMI", "ST segment depression and T wave inversions"]], "lead": "<p><strong>ECG<\/strong> assesses electrical activity; an important tool in the diagnosis of myocardial ischemia or infarction. The ECG may be normal or nonspecific.<\/p>"}, {"t": "table", "cols": ["Biomarker", "Kinetics", "Notes"], "rows": [["<strong>Troponin<\/strong><br>(acute chest pain)", "Initial rise 2-4 h<br>Peak 12 h<br>Normal by 5-10 days", "<strong>Most sensitive and specific for myocardial injury<\/strong><br>Larger MI = longer detection in blood<br>Can also be elevated by contusion, myocarditis, stretch from PE, and arrhythmias"], ["<strong>Creatine kinase<\/strong> (CK-MB)", "Peak 10-24 h", "Specific if no skeletal muscle injury"], ["<strong>LDH<\/strong>", "Peak 24-72 h", ""], ["<strong>Myoglobin<\/strong>", "Peak 2 h", "Low specificity for MI"]]}, {"t": "table", "cols": ["Scenario", "Next investigation"], "rows": [["41-year-old man, asymptomatic (no chest pain or SOB), non-smoker, no family history, BP 128/76, normal cardiac exam, normal ECG; asks for heart tests for \"blockages\"", "<strong>None<\/strong> – low pretest probability: Hx/PEx unremarkable, labwork normal (lipid profile, glucose, creatinine), low Framingham risk score, ECG normal; reassurance on lifestyle changes"], ["Returns 4 years later with atypical chest pain, hypertension (BP 148/86) and hypercholesterolemia", "<strong>Stress test<\/strong>"], ["Has a bad knee and cannot walk on a treadmill", "<strong>Persantine – MIBI<\/strong>"], ["Chest pain now affects quality of life (pain + SOB on 1 flight of stairs); non-invasive study high-risk (MIBI: large area of reversible ischemia)", "<strong>Coronary angiogram<\/strong>"], ["Sudden substernal chest pressure for 2 h → ER; ECG shows anterior STEMI. Initial bloods?", "<strong>CBC; electrolytes, BUN, creatinine; glucose; troponin<\/strong>"], ["After the MI: which test best assesses the strongest predictor of long-term survival?", "<strong>2D echocardiogram – MUGA<\/strong> (LV function)"]], "lead": "<p><strong>Case example<\/strong> – one patient, escalating investigation as pretest probability rises.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Suspected CAD\"] --> B[\"Hx + PEx, ECG, labs<br/>Framingham risk score\"]\n B --> C{\"Asymptomatic and low risk?\"}\n C -->|\"Yes\"| D[\"No testing<br/>reassure + lifestyle\"]\n C -->|\"No - symptoms or rising risk\"| E{\"Pretest probability?\"}\n E -->|\"Low-moderate\"| F[\"CT coronary angiogram<br/>test of exclusion, NPV 99%\"]\n E -->|\"Intermediate 25-75%\"| G[\"Stress testing<br/>see stressor choice below\"]\n G --> H{\"High-risk result?<br/>e.g. large reversible ischemia\"}\n H -->|\"Yes\"| I[\"Coronary angiogram\"]\n H -->|\"No\"| J[\"Medical management\"]\n K[\"Acute STEMI\"] --> L[\"CBC, electrolytes, BUN,<br/>creatinine, glucose, troponin\"]\n L --> M[\"After MI: LV function<br/>echo or MUGA\"]"}, {"t": "table", "cols": ["What to image", "Imaging tests (<strong>bold = gold standard<\/strong>)"], "rows": [["Chamber size and global function", "ECHO, CT, <strong>MRI<\/strong>, nuclear scintigraphy"], ["Valves", "<strong>ECHO<\/strong>, MRI, transesophageal echocardiogram"], ["Coronary arteries", "<strong>Anatomical<\/strong>: CT, MRI, <strong>cardiac catheterization<\/strong><br><strong>Functional<\/strong>: MRI, stress ECHO, nuclear scintigraphy, cardiac catheterization<br><strong>Viability<\/strong>: MRI, nuclear scintigraphy"], ["Aorta", "CT, MRI, transthoracic/transesophageal/abdominal ultrasound"], ["Pericardium", "ECHO, CT, MRI"], ["Myocardial disease", "ECHO, MRI"], ["Congenital heart disease", "ECHO, MRI"]], "lead": "<p><strong>Imaging in cardiovascular disease<\/strong> – pick the test by the question you are asking.<\/p>"}, {"t": "table", "cols": ["Test for CAD", "Anatomy", "Function", "Sens %", "Spec %", "Pretest probability"], "rows": [["Exercise stress test", "—", "+", "68", "77", "Intermediate (25-75%)"], ["Stress echo", "—", "++", "76", "88", ""], ["Nuclear", "—", "++", "88", "77", ""], ["Cardiac CT angiogram", "++", "—", "99", "64", "Low-moderate (screening)"], ["Coronary angiography", "++", "—", "—", "—", ""], ["PET", "—", "—", "91", "83", ""]], "lead": "<p>Blank pretest-probability cells were blank in the source (likely merged with the row above).<\/p>"}, {"t": "table", "cols": ["Agent", "Mechanism", "Use", "Contraindications"], "rows": [["<strong>Vasodilator<\/strong>:<br>Persantine (dipyridamole)", "Inhibits cellular uptake of adenosine → ↑ adenosine levels and binding to adenosine receptors<br>Adenosine: coronary vasodilator; peripheral vasodilation ± AV block (undesired); bronchoconstriction (undesired)", "Pharmacologic stress for MPI and stress echo<br><strong>Theophylline and caffeine blunt the effect<\/strong> (antagonize the adenosine receptor) → withhold for 48 hours prior to the study", "Sick sinus syndrome (AV block)<br>Bronchospastic airway disease (asthma)"], ["<strong>Inotrope/chronotrope<\/strong>:<br>Dobutamine", "Synthetic: beta-1 ↑ HR and contractility; beta-2 has vasodilation effects", "Stress echocardiography (<strong>preferred agent<\/strong>)<br>Stress radionuclide MPI (2nd line)<br>When the patient has a contraindication to a vasodilator or ingested caffeine in the past 12 hours", "Sustained ventricular arrhythmias<br>Recent MI<br>Severe hypertension (SBP &gt; 128 mm Hg)"]], "lead": "<p><strong>Pharmacologic stress test agents<\/strong> – used when the patient cannot exercise.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Stress test needed\"] --> B{\"Can exercise on a treadmill?\"}\n B -->|\"Yes\"| C{\"Interpretable normal resting ECG?\"}\n C -->|\"Yes\"| D[\"Exercise stress test ECG\"]\n C -->|\"No - abnormal resting ECG\"| E[\"Stress imaging<br/>nuclear MPI or stress echo\"]\n B -->|\"No - orthopedic, PVD,<br/>neuropathy, HR meds\"| F[\"Pharmacologic stress imaging\"]\n F --> G{\"Vasodilator contraindicated?<br/>sick sinus, bronchospasm,<br/>caffeine in past 12 h\"}\n G -->|\"No\"| H[\"Dipyridamole<br/>hold caffeine and theophylline 48 h\"]\n G -->|\"Yes\"| I[\"Dobutamine<br/>preferred for stress echo\"]\n H --> J{\"High-risk result?\"}\n I --> J\n D --> J\n E --> J\n J -->|\"Yes\"| K[\"Coronary angiogram\"]"}, {"t": "head", "html": "<h5>Initial tests<\/h5><p>Chest X-ray and transthoracic echo (with Doppler and contrast) come first.<\/p>"}, {"t": "table", "cols": ["Test", "Description", "Advantages", "Disadvantages"], "rows": [["<strong>Chest radiography (CXR)<\/strong>", "Usually precedes other cardiac imaging modalities in clinical algorithms<br>Allows some Ax of:<br>• Cardiac size<br>• Relative chamber enlargement<br>• Pulmonary vascular changes<br>• Intravascular catheters, pacing leads", "Widely available<br>Inexpensive<br>Some anatomical information<br>Performed quickly<br>Can be used to guide some emergent treatment decisions", "Low-dose ionizing radiation<br>Does not provide detailed myocardial function or valvular Ax"], ["<strong>Cardiac ultrasound / echocardiography<\/strong> (TTE)", "Sonographer uses an ultrasound machine to send ultrasound waves into the patient's body<br>Sound waves are reflected and interpreted by the machine/tech", "<strong>Excellent information about cardiac anatomy of chambers, valves, blood vessels, pericardial effusion + chamber function<\/strong><br>Portable<br>Widely available<br>Relatively inexpensive<br>Performed/interpreted in real time<br>Non-invasive<br>No radiation", "No direct information about coronary adequacy<br>Limited by intercostal windows<br>Sometimes technical factors preclude good images (<strong>body habitus<\/strong>)<br>Can be normal in IHD<br>Can be abnormal: infarcted or chronically ischemic myocardium may show a regional wall motion abnormality:<br>• Hypokinesis (reduced)<br>• Akinesis (absent)<br>• Dyskinesis (paradoxical)"]]}, {"t": "table", "cols": ["Test", "Description", "Advantages", "Disadvantages"], "rows": [["<strong>Colour Doppler echocardiography<\/strong>", "Intuitive display of blood flow and tissue motion<br>Visual Ax of abnormal flow patterns:<br>• Valvular lesions<br>• Congenital abnormalities", "", ""], ["<strong>Spectral Doppler echocardiography<\/strong>", "Allows quantification of valvular lesions<br>Guides decisions regarding therapy:<br>• Medical<br>• Surgical", "", ""], ["<strong>Contrast echocardiography<\/strong>", "Intravascular ultrasonic contrast may improve the quality and information yield from TTE, especially in those with poor image quality or during stress studies<br>Indications:<br>• LV opacification for function and wall motion analysis<br>• Exclusion of LV thrombus", "", "Contrast administration"]]}, {"t": "head", "html": "<h5>Advanced non-invasive imaging<\/h5><p>Functional (stress) tests look for inducible ischemia; CT, MRI and MUGA give anatomy and function.<\/p>"}, {"t": "table", "cols": ["Test", "Description", "Advantages", "Disadvantages"], "rows": [["<strong>Exercise stress test (ECG)<\/strong>", "Effective for risk stratification of patients with suspected or known CAD<br>Must possess an interpretable normal resting ECG – baseline affects sensitivity<br>Exercise duration &lt; 6 minutes = strongest prognostic variable", "Simple, inexpensive<br>Provides information on:<br>• Symptoms<br>• Cardiovascular function<br>• Hemodynamic response", "Must be able to walk on a treadmill<br>Not for:<br>• Acute MI (within 2 days)<br>• Unstable angina<br>• Uncontrolled arrhythmias<br>• Symptomatic severe AS<br>• Uncontrolled symptomatic CHF<br>• PE<br>• Myocarditis, pericarditis<br>• Aortic dissection"], ["<strong>Nuclear scintigraphy / myocardial perfusion imaging<\/strong> (MPI/MIBI)", "Injection of radioisotopes, which are taken up into myocardium:<br>• Technetium (<sup>99m<\/sup>Tc), thallium (<sup>201<\/sup>Tl)<br>Gamma camera rotates around the chest; 3D images of the heart are formed in standard orientations<br>Compare rest images with stress images:<br>• Exercise – preferred<br>• Pharmacological stress – IV<br>Reversible defect (normal at rest, defect at stress) = ischemia; fixed defect (at stress and rest) = infarction", "Ax of LV size + function (EF) of myocardium and coronary anatomy<br>Diagnostic (improved accuracy) and prognostic information for CAD<br>Sensitive for significant CAD<br>Ax of myocardial viability (thallium)<br>Ax of extent/territory of ischemia<br>Pharmacological MPI considerations:<br>• Patient cannot exercise<br>• Abnormal resting ECG<br>• Orthopedic limitations<br>• Peripheral vascular disease<br>• Neuropathies<br>• HR meds (beta blockers, digoxin)", "Cost<br>Duration/time commitment<br>Patient discomfort<br>Ionizing radiation exposure: ~100 CXR equivalents"], ["<strong>Stress echocardiography<\/strong>", "Ax of presence of myocardial ischemia<br>Compare rest images with stress images:<br>• Exercise<br>• Pharmacological stress – persantine (dipyridamole), dobutamine", "Portability<br>Less time<br>No radiation<br>Provides information on the extent and severity of exercise/stress-induced LV dysfunction", "Body size<br>Interpretation is subjective<br>Images need to be obtained immediately after exercise or drug infusion"]]}, {"t": "table", "cols": ["Test", "Description", "Advantages", "Disadvantages"], "rows": [["<strong>Computed tomography (CT)<\/strong>", "Indications:<br>• Anatomical information<br>• Coronary artery and graft angiography ± calcium scoring<br>• Pericardial Ax<br>• Define structures not well imaged by other modalities (pulmonary veins, congenital heart disease)<br>• Aorta", "Non-invasive<br>High-resolution images<br>Complete vessel visualization (lumen, wall, plaque)", "Ionizing radiation exposure<br>Contrast administration:<br>• Allergies<br>• Deterioration in kidney function with pre-existing kidney disease"], ["<strong>CT coronary angiography<\/strong> (CTCA)", "<strong>Test of exclusion for the presence of CAD<\/strong><br><strong>Negative predictive value = 99%<\/strong><br>Good correlation between CT angiography and invasive coronary angiograms<br>Give a beta blocker 1 h prior to slow HR down and reduce motion artifact<br>Calcium is a marker for atherosclerotic disease:<br>• More calcium = more disease present<br>• Calcium score &gt; 300 signifies increased risk of cardiac events", "Very sensitive for detection of coronary atherosclerosis (plaque) and coronary anatomy", "Not specific for flow-limiting lesions<br>Contrast administration<br>Not a good screening tool<br>Dense calcium is problematic<br>Ionizing radiation exposure: 400-800 CXR equivalents"]]}, {"t": "table", "cols": ["Test", "Description", "Advantages", "Disadvantages"], "rows": [["<strong>Magnetic resonance imaging (MRI)<\/strong>", "Uses radio-frequency waves and very strong magnets", "<strong>Gold standard for Ax of anatomy + function of chambers, valves, and major arteries/veins<\/strong><br>Non-invasive<br>No radiation<br>Excellent, high-resolution images<br>Tissue characterization<br>Confident diagnoses", "Specialized equipment<br>Experienced staff required<br>Protocols tailored to questions<br>Contrast administration for some applications<br>MRI safety issues<br>Patient discomfort<br>Contraindicated for some patients:<br>• Older adults<br>• Metallic foreign bodies<br>• Neuro/thoracic/abdominal surgery"], ["<strong>Multiple gated acquisition (MUGA) scan<\/strong>", "Produces a moving image of the beating heart and outlines the cardiac chambers during systole and diastole<br>Technetium (<sup>99m<\/sup>Tc) is attached to red cells and injected into the bloodstream<br>Red cells fill the cardiac chambers, and the low-level radiation (1 CXR equivalent) is picked up by a gamma camera", "Extremely useful and highly accurate for Ax of heart function + EF (normal &gt; 50%):<br>• Post-MI<br>• Non-ischemic cardiomyopathy: consideration for an automatic implantable cardioverter defibrillator (AICD)<br>• Anthracycline therapy; women who had chemotherapy for breast cancer", ""]]}, {"t": "head", "html": "<h5>Invasive tests<\/h5>"}, {"t": "table", "cols": ["Test", "Description", "Advantages", "Disadvantages"], "rows": [["<strong>Transesophageal echocardiogram<\/strong> (TEE)", "Patient fasted, local anaesthesia/sedation, probe passed from mouth to esophagus<br>Indications:<br>• Diagnostic in cases where TTE is not sufficient<br>• Pre-operative Ax for cardiac (valvular) surgery<br>• Intraoperative monitoring or cardiac procedural guidance", "Better image quality than TTE<br>More sensitive for diagnosis/exclusion in specific pathologies, e.g. endocarditis<br>Ax of anatomy + function<br>Excellent for pre-operative planning", "Invasive<br>Requires sedation<br>Risk of injury to mouth, teeth, and esophagus<br>Risk of aspiration"], ["<strong>3D echocardiography<\/strong>", "Can be performed as part of TTE or TEE<br>Pretty pictures<br>Some incremental information gain<br>Reproducible:<br>• LV function<br>• Valve disease", "", ""]]}, {"t": "table", "cols": ["Test", "Description", "Advantages", "Disadvantages"], "rows": [["<strong>Cardiac catheterization / coronary angiogram<\/strong>", "Passage of an introducer sheath into the radial artery or femoral artery<br>Diagnostic and therapeutic roles<br>Intracardiac pressure measurement<br>Used to guide percutaneous coronary intervention (angioplasty, stenting) and other percutaneous cardiac procedures<br>Indications:<br>• High-risk stress test or nuclear study<br>• Hemodynamic instability ± cardiogenic shock<br>• Severe LV dysfunction or overt HF<br>• Persistent angina despite medical therapy<br>• Mechanical complications – MR, VSD<br>• Sustained ventricular tachycardia<br>• Dynamic ST-T ECG changes", "<strong>Gold standard for defining coronary anatomy/Dx of CAD<\/strong><br>Ax of anatomy + function<br>High temporal + spatial resolution<br><strong>Real time<\/strong><br><strong>Intervene/treat at time of test<\/strong><br>May be combined with acquisition of other functional information:<br>• Cardiac hemodynamics<br>• Coronary pressure/flow Ax", "Cost<br>Contrast load<br>Ionizing radiation exposure<br>Limited to catheterization facilities<br>Invasive with complications:<br>• MI (1/1000)<br>• Stroke (1/1000)<br>• Death (1/1000)<br>• Vascular complication (most common)<br>• Renal injury (contrast toxicity)<br>Presence of a high-grade lesion does NOT:<br>• Prove symptoms are ischemic<br>• Predict future risk of a coronary event"]]}, {"t": "table", "cols": ["Timing", "Where", "Diagnosis", "Characteristics"], "rows": [["<strong>Systolic<\/strong>", "Border", "Tricuspid regurgitation", "Tricuspid valve leaflets fail to collapse properly during systole and blood can leak back from the RV into the RA<br>Increases with inspiration – negative intrathoracic pressure draws more blood to the R side of the heart"], ["", "Border", "Ventricular septal defect", "Hole in the interventricular septum; blood flows from the LV to the RV in systole due to the pressure differences between the ventricles"], ["", "Base", "Aortic stenosis", "Thickening in the aortic valve; obstruction to blood flow exiting the LV into the aorta"], ["", "Base", "Atrial septal defect", "Hole in the interatrial septum; blood flows from the LA to the RA"], ["", "Apex", "Mitral regurgitation", "Issues with mitral valve closure during systole; blood can leak back from the LV into the LA"], ["", "Apex", "Mitral valve prolapse", "Redundant mitral valve leaflets and chordae tendineae, which can result in the mitral valve prolapsing back into the LA later in systole, with an associated jet of mitral regurgitation"], ["", "All", "Hypertrophic cardiomyopathy", "Areas of the ventricle become thickened, which can change blood flow and hemodynamics"], ["<strong>Diastolic<\/strong>", "Border", "Aortic regurgitation", "Ineffective closure of the aortic valve; blood leaks back from the aorta into the LV in diastole"], ["", "Apex", "Mitral stenosis", "Thickening/reduced opening of the mitral valve, so it is more difficult for blood to go from the LA to the LV in diastole"], ["<strong>Systolic + diastolic<\/strong>", "Border", "Pericardial rub", "<strong>Pathognomonic for acute pericarditis<\/strong>; triphasic, scratching, grating sound"]], "lead": "<p><strong>Review: murmurs by timing and location<\/strong> (carried over from the heart sounds notes).<\/p>"}, {"t": "table", "cols": ["Practice question", "Answer"], "rows": [["When you hear an S1, which valves are closing?", "<strong>Mitral, tricuspid<\/strong>"], ["Uncontrolled hypertension for many years: normal S1 and S2 plus an additional late diastolic sound. What is the extra sound?", "<strong>S4<\/strong> → often present in patients with \"stiff\" or pressure-loaded left ventricles"], ["Diastolic rumble loudest at the apex; the apex beat is hard to palpate. Likely cause?", "<strong>Mitral stenosis<\/strong> → low-pitched rumble in diastole; apex beat can be challenging to palpate because less blood enters the LV"], ["Systolic murmur loudest at the base. Which could be the cause: tricuspid regurgitation, aortic regurgitation, aortic stenosis, mitral regurgitation?", "<strong>Aortic stenosis<\/strong>"], ["Systolic murmur at the apex radiating to the axilla, with an S3; apex beat displaced laterally. Likely cause?", "<strong>Mitral regurgitation<\/strong>"]]}]}, {"id": "cardio-w2-03", "num": "03", "name": "Pericardial Disease", "title": "Pericardial Disease", "framing": "<p>Three pericardial syndromes – <strong>acute pericarditis, effusion (with or without tamponade) and constriction<\/strong> – compared across the same headings. The organising idea: inflammation causes pain, fluid and stiffness each <strong>impair diastolic filling<\/strong>, and the rate of change decides how sick the patient is.<\/p>", "week": 2, "weekLabel": "Week 2 - Valvular Disease, Heart Sounds & Endocarditis", "items": [{"t": "table", "cols": ["Category", "Cause", "Examples"], "rows": [["<strong>Infectious<\/strong>", "<strong>Viral<\/strong> (most common)", "Enteroviruses, herpesviruses, adenovirus, parvovirus B19, HIV, COVID-19"], ["", "Bacterial", "<em>Mycobacterium tuberculosis<\/em>, <em>Borrelia burgdorferi<\/em>, <em>Pneumococcus<\/em> spp, <em>Staphylococcus<\/em> spp"], ["", "Fungal, parasitic", "Very rare"], ["<strong>Non-infectious<\/strong>", "Autoimmune", "Lupus, rheumatoid arthritis"], ["", "Malignant", "Primary tumours (rare), metastatic tumours (lung cancer, breast cancer, lymphoma)"], ["", "Metabolic", "Uremia (severe renal failure), myxedema (severe hypothyroidism)"], ["", "Traumatic, iatrogenic", "Direct injury (penetrating trauma), indirect injury (non-penetrating trauma), post-pericardiotomy syndrome, radiation-induced"], ["", "Drug-related", "Lupus-like syndromes (methyldopa, INH, phenytoin), chemotherapy agents"], ["", "Other", "Post-MI (acute, Dressler syndrome), amyloidosis, aortic dissection"]], "lead": "<p><strong>Causes of acute pericarditis and pericardial effusion<\/strong><\/p>"}, {"t": "table", "cols": ["", "Acute pericarditis", "Pericardial effusion", "Constrictive pericarditis"], "rows": [["<strong>Definition<\/strong>", "Inflammation of the pericardium<br>Complications:<br>• Recurrent pericarditis<br>• Chronic pericarditis<br>• Constrictive pericarditis<br>• Associated myocarditis", "Increased pericardial fluid (normal = 50 mL)<br><strong>Slower accumulation = better tolerated<\/strong> – up to 2 L before symptoms<br><strong>Faster accumulation = more symptomatic<\/strong> – symptoms with only 200–300 mL", "Compromised cardiac function from a thickened, rigid, fibrous pericardium secondary to acute pericarditis<br>Thickened, calcified, stiff; loses compliance:<br>• Cannot expand when the heart fills (diastole)<br>• Impaired cardiac filling<br>• High intracardiac pressures<br>• <strong>Equalization of pressures in all 4 chambers<\/strong>"], ["<strong>Symptoms<\/strong>", "<strong>Chest pain: sharp, pleuritic<\/strong><br>• Worse with inspiration<br>• <strong>Worse supine, better leaning forward<\/strong><br>± fever<br>± signs of systemic disease (malignancy, autoimmune conditions, hypothyroidism)", "<strong>“Tamponade physiology”<\/strong> when fluid impairs cardiac filling (30% of patients)<br>Pre-syncope, syncope<br>Dyspnea<br>Pedal edema<br>Hiccups (phrenic nerve irritation)<br>Dysphagia<br>Symptoms of the underlying cause", "From elevated filling pressures:<br>Fatigue/weakness · ↓ exercise tolerance<br>RHF: pedal edema, ascites<br>LHF: exertional dyspnea, orthopnea, PND, cough<br>Similar to other CVD states – <strong>need a high index of suspicion<\/strong>"], ["<strong>Signs<\/strong>", "<strong>Pericardial friction rub<\/strong>: triphasic (atrial contraction, ventricular expansion – diastole; ventricular contraction – systole), scratchy, can be transient<br>↑ WBC<br>↑ inflammatory markers (ESR, CRP)<br>↑ myocardial injury markers (CK, troponin)", "Small–moderate: no signs on exam<br>Large: <strong>Ewart’s sign<\/strong> below the L scapula (dullness, ↓ breath sounds)<br>Tamponade:<br>• <strong>Beck’s triad – low BP, high JVP<\/strong> (prominent x, blunted y), <strong>muffled heart sounds<\/strong><br>• <strong>Pulsus paradoxus &gt; 10–12 mm Hg<\/strong>: BP variation with respiration", "↑ JVP (prominent y descent)<br>• <strong>Kussmaul’s sign<\/strong>: no expected fall, or a rise, in JVP on inspiration<br><strong>Pericardial knock<\/strong>: early diastolic, loud, high-pitched – rapid equalization of filling pressures<br>Hepatomegaly/features of cirrhosis<br>Ascites, peripheral edema"], ["<strong>Diagnosis<\/strong>", "<strong>ESC 2015 – need 2 of:<\/strong><br>• Pleuritic chest pain<br>• Pericardial rub<br>• New widespread ST elevation or PR depression<br>• Pericardial effusion<br>Supportive: ↑ inflammatory markers; pericardial inflammation on CT or MRI", "<strong>CXR<\/strong>: ↑ cardiac silhouette if &gt; 250 mL; <strong>“water bottle heart”<\/strong> if very large<br><strong>Echo<\/strong>: presence and size of effusion; signs of cardiac compression/tamponade", "<strong>ECG<\/strong>: LA enlargement, AF, non-specific T changes, low voltages<br><strong>Echo<\/strong>: normal systolic function, diastolic dysfunction, plethoric IVC, septal bounce, respirophasic septal motion; pericardial thickness hard to see on TTE<br><strong>CXR/CT<\/strong>: pericardial calcification<br><strong>Cardiac MRI<\/strong>: thickness, enhancement after gadolinium, respirophasic septal motion<br><strong>Catheterization<\/strong>: elevated, equalized pressures in all 4 chambers; <strong>“square root sign”<\/strong> (early diastolic filling); ventricular interdependence"], ["<strong>Treatment<\/strong>", "• <strong>High-dose NSAIDs<\/strong> (1–2 weeks) + proton pump inhibitor to prevent ulcers<br>• <strong>Colchicine<\/strong> (3 months) – ↓ recurrences<br>• Steroids (tapering) – autoimmune<br>• Immune modulators – anakinra, IVIG, azathioprine<br>• Pericardiectomy<br>• <strong>Exercise restriction for 3 months<\/strong>", "Treat the underlying cause<br><strong>Drain the fluid<\/strong>: pericardiocentesis (percutaneous) or pericardial window (surgical)<br><strong>Therapeutic<\/strong>: tamponade physiology (IV fluids or pressors stabilize BP while preparing to drain); suspected purulent effusion<br><strong>Diagnostic<\/strong>: large effusions where malignancy or infection is suspected", "Treat the heart failure: diuretics, low-salt diet<br>Treat inflammation, especially with late gadolinium enhancement on MRI: NSAIDs/colchicine/steroids/anakinra (IL-1 inhibitor)/azathioprine<br><strong>Surgical pericardiectomy – earlier is better<\/strong>"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Pleuritic chest pain<br/>worse supine · better leaning forward\"] --> B{\"2 of 4 criteria?<br/>pain · rub · widespread ST up or PR down · effusion\"}\n B -->|\"Yes\"| C[\"Acute pericarditis\"]\n B -->|\"No\"| D[\"Consider other causes<br/>supportive: ESR · CRP · CT or MRI\"]\n C --> E[\"High-dose NSAID 1-2 weeks + PPI\"]\n C --> F[\"Colchicine 3 months\"]\n C --> G[\"Exercise restriction 3 months\"]\n E --> H{\"Autoimmune or refractory?\"}\n H -->|\"Yes\"| I[\"Steroid taper · anakinra · IVIG<br/>azathioprine · pericardiectomy\"]"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Pericardial effusion\"] --> B{\"Rate of accumulation?\"}\n B -->|\"Slow\"| C[\"Tolerated up to 2 L\"]\n B -->|\"Fast\"| D[\"Symptomatic at 200-300 mL\"]\n C --> E{\"Tamponade physiology?<br/>Beck triad · pulsus paradoxus\"}\n D --> E\n E -->|\"Yes\"| F[\"IV fluids or pressors<br/>while preparing to drain\"]\n F --> G[\"Therapeutic drainage<br/>pericardiocentesis or window\"]\n E -->|\"No\"| H{\"Purulent, or malignancy or<br/>infection suspected?\"}\n H -->|\"Yes\"| I[\"Drain: therapeutic or diagnostic\"]\n H -->|\"No\"| J[\"Treat the underlying cause\"]"}, {"t": "table", "cols": ["Condition", "ECG"], "rows": [["<strong>Acute pericarditis<\/strong>", "<strong>Stage 1<\/strong> (first 2 weeks): widespread, concave-up ST elevation; PR depression, PR elevation in aVR<br><strong>Stage 2<\/strong> (1–3 weeks): ST normalizes, generalized T flattening<br><strong>Stage 3<\/strong> (3–several weeks): flattened T waves invert<br><strong>Stage 4<\/strong> (several weeks onwards): ECG returns to normal"], ["<strong>Large pericardial effusion<\/strong>", "↓ voltages: QRS <strong>&lt; 5 mm<\/strong> in limb leads, <strong>&lt; 10 mm<\/strong> in precordial leads"], ["<strong>Tamponade<\/strong>", "<strong>Electrical alternans<\/strong>: QRS size varies beat to beat – the heart is swinging"]], "lead": "<p><strong>ECG features<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Stage 1 · weeks 0-2<br/>diffuse concave ST up · PR down\"] --> B[\"Stage 2 · weeks 1-3<br/>ST normalizes · T flattens\"]\n B --> C[\"Stage 3<br/>T waves invert\"]\n C --> D[\"Stage 4<br/>ECG normal\"]"}]}, {"id": "cardio-w2-09", "num": "09", "name": "Endocarditis", "title": "Infective Endocarditis (and Atherosclerosis)", "framing": "<p>Infective endocarditis is <strong>infection of a damaged endocardial surface<\/strong>: injured endothelium forms a sterile platelet-fibrin thrombus that transient bacteremia seeds into a vegetation. Everything follows from the vegetation: it <strong>destroys valves<\/strong> (heart failure), <strong>throws septic emboli<\/strong> (the peripheral signs) and hides in <strong>biofilm<\/strong> (weeks of IV antibiotics). The notes finish with atherosclerosis, a different chronic injury-and-repair disease of the arterial intima.<\/p>", "week": 2, "weekLabel": "Week 2 - Valvular Disease, Heart Sounds & Endocarditis", "items": [{"t": "head", "html": "<h5>Definition<\/h5><p><strong>Endocarditis<\/strong>: infection of the endocardial surface of the heart, one or more heart valves, or an indwelling cardiac device, with local collection of fibrinous material and superimposed infection.<\/p><h5>Epidemiology<\/h5><ul><li>Incidence 1970-2000: <strong>5-7 cases per 100 000 person-years<\/strong><\/li><li>Incidence since 2000: <strong>15 cases per 100 000 person-years<\/strong><\/li><li>Typical patient: <strong>male, mean age 67 years<\/strong><\/li><li>Younger patients: developing countries, underprivileged socioeconomic demographic<\/li><\/ul>"}, {"t": "table", "cols": ["Category", "Risk factors"], "rows": [["<strong>Cardiac<\/strong>", "<strong>Congenital heart disease<\/strong>: bicuspid aortic valve, mitral valve prolapse, ventricular septal defect"], ["", "<strong>Acquired valvular heart disease<\/strong>: rheumatic heart disease, previous endocarditis, prosthetic cardiac valves"], ["<strong>Patient<\/strong>", "Immunocompromised, <strong>IVDU<\/strong>, indwelling vascular catheters or devices, septicemia"], ["<strong>Potentially infective procedures<\/strong>", "Dental procedures, body piercing, skin wounds, systemic sepsis, genitourinary instrumentation, endoscopies"]]}, {"t": "table", "cols": ["Timing", "Organisms (most to least common)"], "rows": [["<strong>Early<\/strong> (&lt; 60 days)", "<strong>CNST<\/strong> &gt; <strong><em>S. aureus<\/em><\/strong> &gt; <strong>G-ve bacilli<\/strong> &gt; Enterococcus = fungi = diphtheroids &gt; HACEK &gt; polymicrobial &gt; <em>Streptococcus<\/em> spp"], ["<strong>Intermediate<\/strong>", "<strong>CNST<\/strong> &gt; <strong><em>S. aureus<\/em><\/strong> = <strong>Enterococcus<\/strong> = <strong>fungi<\/strong> &gt; <em>Streptococcus<\/em> spp &gt; HACEK = polymicrobial &gt; G-ve bacilli = diphtheroids"], ["<strong>Late<\/strong> (&gt; 60 days)", "<strong><em>Streptococcus<\/em> spp<\/strong> &gt; <strong><em>S. aureus<\/em><\/strong> &gt; <strong>CNST<\/strong> &gt; Enterococcus &gt; G-ve bacilli = HACEK = polymicrobial &gt; diphtheroids &gt; fungi"]], "lead": "<p><strong>Prosthetic valve endocarditis<\/strong>: organisms in order of frequency (CNST = coagulase-negative staphylococci).<\/p>"}, {"t": "head", "html": "<h5>Pathophysiology: how a vegetation forms<\/h5><ul><li>Normal valvular endothelium is <strong>smooth and resistant to bacterial colonization<\/strong><\/li><li><strong>Non-bacterial thrombotic endocarditis (NBTE)<\/strong> follows damage to the vascular surface:<ul><li>Systemic disease states (rheumatic carditis)<\/li><li>Mechanical injury by catheters or electrodes<\/li><li>Injury from repeated injections of solid particles in IVDU<\/li><\/ul><\/li><li><strong>Transient bacteremia<\/strong> → microorganism-NBTE interaction<\/li><li><strong>Platelet aggregation<\/strong> and evolution of the vegetation<\/li><li><strong>Biofilm formation<\/strong>: makes the vegetation more resistant to antibiotic therapy<\/li><\/ul>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Normal valve endothelium<br/>smooth, resists colonization\"] --> B[\"Damage to vascular surface\"]\n C[\"Rheumatic carditis\"] --> B\n D[\"Catheters or electrodes\"] --> B\n E[\"Injected solid particles in IVDU\"] --> B\n B --> F[\"Non-bacterial thrombotic endocarditis<br/>NBTE\"]\n G[\"Transient bacteremia<br/>dental, piercing, wounds, GU, endoscopy\"] --> H[\"Microorganism-NBTE interaction\"]\n F --> H\n H --> I[\"Platelet aggregation<br/>vegetation evolves\"]\n I --> J[\"Biofilm formation<br/>resists antibiotics\"]\n I --> K[\"Septic emboli<br/>systemic spread\"]"}, {"t": "head", "html": "<h5>Symptoms<\/h5><ul><li><strong>Acute<\/strong>: fulminant septic illness with emboli, valve destruction, and cardiac decompensation<\/li><li><strong>Subacute<\/strong>: non-specific constitutional symptoms: anorexia/weight loss, fevers/chills/night sweats, fatigue/general malaise, flu-like illness, cardiac decompensation (shortness of breath, edema)<\/li><\/ul><h5>Clinical findings<\/h5><ul><li><strong>Peripheral stigmata<\/strong>: septic emboli, finger clubbing, subungual hematoma, splinter hemorrhages, Roth spots, Janeway lesions<\/li><li><strong>Cardiac decompensation<\/strong>: tachycardia, new murmur, peripheral edema, weight gain (fluid retention), pulmonary edema<\/li><li><strong>Sepsis<\/strong>: fever, organ-specific infective syndromes secondary to emboli<\/li><\/ul>"}, {"t": "table", "cols": ["System", "Ask about", "Examine"], "rows": [["<strong>General<\/strong>", "", "Level of consciousness, mental status, vitals"], ["<strong>HEENT<\/strong>", "", "Fundoscopy for <strong>Roth spots<\/strong>, conjunctival hemorrhage, neck stiffness, oral mucosal petechiae"], ["<strong>CNS<\/strong>", "Stroke, focal neurological symptoms (vegetations may have spread systemically)", "Full neuro exam"], ["<strong>Cardiac<\/strong>", "CHF: dyspnea, ankle edema, PND", "JVP, S3, regurgitant murmur, volume status"], ["<strong>Respiratory<\/strong>", "Septic emboli to lungs: cough, sputum production", "Signs of pneumonia"], ["<strong>MSK<\/strong>", "Septic emboli to joints: joint pain", "Joint exam"], ["<strong>GU<\/strong>", "Hematuria", ""], ["<strong>GI<\/strong>", "Bloody diarrhea from septic emboli, abdominal pain", "Hepatosplenomegaly, masses"], ["<strong>Skin / peripheral<\/strong>", "Skin rash (peripheral septic emboli)", "Clubbing, splinter hemorrhages, <strong>Osler nodes (painful)<\/strong>, <strong>Janeway lesions<\/strong>"]], "lead": "<p><strong>History and physical exam<\/strong>: search every system for emboli and heart failure.<\/p>"}, {"t": "head", "html": "<h5>Investigations<\/h5><ul><li><strong>Bloodwork<\/strong>: CBC, coagulation, electrolytes, creatinine, glucose, cancer antigen profile, liver enzymes, lactate, albumin, cardiac enzymes, ESR, complement, rheumatoid factor<\/li><li><strong>Pan-culture<\/strong>: <strong>3 blood cultures<\/strong> for extended growth (2 bottles, 3 sites, 3 times in the first hour if very sick), urine culture, sput
