strong>: reduced EF (HFrEF); LV loses normal contraction, less ejection force; ↑ preload<br><strong>Diastolic = failure to fill<\/strong>: preserved EF (HFpEF); LV does not relax fully between beats; ↑ afterload", "Most commonly from <strong>pulmonary hypertension due to chronic lung disease<\/strong> – COPD, PE, pulmonary fibrosis, sleep apnea, myasthenia gravis, poliomyelitis<br>Causes RV dilation and RVH"], ["Mechanism of symptoms", "Reduced forward flow (fatigue, ↓ exercise tolerance, lightheadedness, low BP) and reduced filling from the lung (SOB, orthopnea/PND)", "Blood backs up in the veins from the RV → venous congestion"], ["Symptoms (Q5)", "Fatigue, ↑ capillary wedge pressure, pulmonary congestion, PND, confusion, restlessness, orthopnea, tachycardia, exertional dyspnea, cyanosis", "Fatigue, ↑ peripheral venous pressure, ascites, enlarged liver/spleen, distended jugular veins, dependent/pitting edema, anorexia/GI complaints, swelling of legs, ankles, abdomen"]]}, {"t": "table", "cols": ["", "Systolic HF (HFrEF)", "Diastolic HF (HFpEF)"], "rows": [["Load", "<strong>Volume overload<\/strong> (↑ preload)", "<strong>Pressure overload<\/strong> (↑ afterload/EDP); hypertrophy normalizes wall stress"], ["Remodeling", "<strong>Eccentric<\/strong> – sarcomeres added <strong>in series<\/strong>; wall thins, cavity enlarges", "<strong>Concentric<\/strong> – sarcomeres added <strong>in parallel<\/strong>; wall thickens"], ["Course", "Maladaptive; linked to mitochondrial dysfunction and cell death; may partly reverse with a VAD", "Compensatory response to pathological stimuli; can progress to maladaptive eccentric remodeling"]], "lead": "<p><strong>Cardiac hypertrophy in heart failure<\/strong> (see also Q9)<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"↓ Cardiac output\"] --> B[\"Baroreceptor dysfunction<br/>↓ afferent inhibitory signals\"]\n B --> C[\"Vasomotor / cardioregulatory centre\"]\n C --> D[\"↑ Sympathetic activity\"]\n C --> E[\"↑ AVP from posterior pituitary\"]\n D --> F[\"↑ Renin\"]\n F --> G[\"↑ Angiotensin II\"]\n G --> H[\"↑ Aldosterone\"]\n D --> I[\"Vasoconstriction<br/>↓ limb and renal blood flow\"]\n G --> J[\"↑ Na+ and water reabsorption\"]\n H --> J\n E --> J\n E --> I\n J --> K[\"Congestion, edema\"]\n I --> L[\"↑ Afterload\"]"}, {"t": "table", "cols": ["Category", "Cause", "Examples"], "rows": [["<strong>Diseased myocardium<\/strong>", "Ischemic heart disease", "Myocardial scar, stunning/hibernation, epicardial CAD, abnormal coronary microcirculation, endothelial dysfunction"], ["", "Toxic damage", "Recreational substances, heavy metals, medications, radiation"], ["", "Immune/inflammatory", "Infection-related – bacteria, viruses, fungi, parasites<br>Non-infectious – autoimmune disease, hypersensitivity, eosinophilic myocarditis"], ["", "Infiltration", "Metastatic, non-metastatic (amyloidosis)"], ["", "Metabolic derangements", "Hormonal, nutritional"], ["", "Genetic abnormalities", "HCM, DCM, muscular dystrophies"], ["<strong>Abnormal loading<\/strong>", "Hypertension", ""], ["", "Valve and myocardial structural defects", "Acquired – mitral, aortic, tricuspid, pulmonary valve disease<br>Congenital – atrial and ventricular septal defects"], ["", "Pericardial / endomyocardial", "Constrictive pericarditis, pericardial effusion<br>Hypereosinophilic syndrome, endomyocardial fibrosis"], ["", "High output states", "Severe anemia, sepsis, pregnancy"], ["", "Volume overload", "Renal failure, iatrogenic fluid overload"], ["<strong>Arrhythmias<\/strong>", "Tachyarrhythmias", "Atrial, ventricular"], ["", "Bradyarrhythmias", "Sinus node dysfunction, conduction disorders"]]}, {"t": "table", "cols": ["Cause", "Key points"], "rows": [["<strong>Ischemic (65%)<\/strong>", "Most have prior MI or CAD – present with an infarct and HF<br>A blocked vessel puts downstream myocardium at risk of ischemia/necrosis; remodeling → dilated, thin-walled ventricle<br><strong>Ischemic cardiomyopathy<\/strong>: HF with <strong>LVEF &lt; 40%<\/strong> plus prior MI, viable hibernating myocardium, or severe CAD<br>Atherosclerosis is the most common cause of HF in developed countries<br>Occult CAD is not uncommon – angiography helps when etiology is unclear<br>Irreversible (prior MI) or reversible (chronically ischemic but viable) loss of contractility"], ["", "<strong>Ischemic dilated CM<\/strong> = based on underlying ischemic heart disease – pathologists call this HF secondary to ischemic heart disease with LV dysfunction<br><strong>Non-ischemic dilated CM<\/strong> = normal coronaries; primary (idiopathic) or secondary (e.g. HF from lupus)"], ["<strong>Cardiomyopathic (25%)<\/strong>", "<strong>Cardiomyopathy<\/strong>: structurally and functionally abnormal heart muscle without CAD, hypertension, valvular or congenital disease sufficient to explain it"], ["", "<strong>DCM<\/strong>: chamber enlargement + systolic dysfunction with normal wall thickness → progressive HF, arrhythmias, conduction abnormalities, thromboembolism, sudden/HF death; wide age range; identified when symptoms are severe<br>Causes: viruses (parvovirus B19, HHV6, coxsackie, influenza, HIV), gene mutations (more common)<br>Idiopathic – up to 30% familial/genetic · Inflammatory – myocarditis (infectious or not), incl. <strong>granulomatous myocarditis (sarcoidosis)<\/strong>: non-caseating granulomas, inflammatory infiltrate destroying striated muscle · Peripartum – poor nutrition and postpartum care · Metabolic – thyroid, diabetes, hemochromatosis · Toxic – anthracycline, EtOH, radiation, heavy metals · <strong>Tachycardia-induced – treating the tachycardia resolves it<\/strong>"], ["", "<strong>HCM<\/strong>: ventricular walls thicken and stiffen; small ventricles; inherited or a mutation"], ["", "<strong>RCM<\/strong>: walls stiff but not necessarily thick – cardiac amyloidosis (infiltrate stiffens ventricles, affects valves); idiopathic RCM (atria massive relative to ventricles)"], ["<strong>Valvular/congenital (10%)<\/strong>", "Mitral and aortic disease – AS, AR, MR; chronic volume or pressure overload<br>Chronic MR: EDV and ESV rise → dilated ventricle stretches the mitral annulus → worse MR and cardiomyopathy<br>Regurgitation makes large hearts: normal 250-300 g; diseased 500-600 g; severe MR/AR 750-1000 g (<strong>cor bovinum<\/strong>, “cow's heart”)"], ["<strong>Hypertension<\/strong>", "Still a major cause worldwide; less common in the West with effective drugs<br>Two patterns: LVH + pressure overload → HF with normal EF (→ low EF if an MI occurs); or dilated, poorly functioning heart → HF with low EF"]], "lead": "<p><strong>Causes of systolic HF (HFrEF) – 40% of HF<\/strong><\/p>"}, {"t": "table", "cols": ["Criterion", "Classification"], "rows": [["Onset", "Asymptomatic, acute, chronic, end stage"], ["Ventricle affected", "Left, right, biventricular"], ["Dysfunction type", "Systolic (HFrEF), diastolic/preserved (HFpEF)"], ["Functional class", "NYHA I, II, III, IV"], ["Stage (AHA/ACC)", "A, B, C, D"], ["Etiology", "Ischemic, dilated CM, hypertrophic CM, restrictive CM, valvular"]], "lead": "<p><strong>Classifications of heart failure<\/strong><\/p>"}, {"t": "table", "cols": ["NYHA class", "Description"], "rows": [["<strong>I<\/strong> (asymptomatic)", "Cardiac disease but no symptoms and no limitation of ordinary activity"], ["<strong>II<\/strong> (mild)", "Mild symptoms, slight limitation during ordinary activity"], ["<strong>III<\/strong> (moderate)", "Significant limitation; comfortable only at rest"], ["<strong>IV<\/strong> (severe)", "Severe limitation; symptoms even at rest"]], "lead": "<p><strong>NYHA functional class<\/strong> – symptoms (fatigue, palpitation, dyspnea) wax and wane over time, so class can move both ways.<\/p>"}, {"t": "table", "cols": ["AHA stage", "Description"], "rows": [["<strong>A<\/strong>", "High risk, no structural disease or symptoms – e.g. patient on chemotherapy"], ["<strong>B<\/strong>", "Structural disease, no signs or symptoms – LVH, LV dysfunction"], ["<strong>C<\/strong>", "Structural disease with prior or current symptoms – clinical HF begins"], ["<strong>D<\/strong>", "Advanced (refractory) HF and death"]], "lead": "<p><strong>AHA/ACC stages<\/strong> – progressive; <strong>a patient cannot move backwards<\/strong>.<\/p>"}, {"t": "table", "cols": ["Type", "LVEF", "Criteria"], "rows": [["<strong>HFrEF<\/strong>", "&lt; 40%", "Symptoms ± signs"], ["<strong>HFmrEF<\/strong>", "40-49%", "Symptoms ± signs + ↑ natriuretic peptides + structural disease (LVH and/or LAE) or diastolic dysfunction"], ["<strong>HFpEF<\/strong>", "≥ 50%", "Symptoms ± signs + ↑ natriuretic peptides + structural disease (LVH and/or LAE) or diastolic dysfunction"], ["<strong>HF recovered EF<\/strong>", "&gt; 50%", "Previous HFrEF that has recovered"]], "lead": "<p><strong>Classification by ejection fraction<\/strong><\/p>"}, {"t": "table", "cols": ["History item", "Why it matters"], "rows": [["Clues to etiology", "FHx – familial cardiomyopathy"], ["Duration of illness", "Recent-onset systolic HF may recover over time"], ["Severity + triggers of dyspnea/fatigue; chest pain; exercise capacity", "NYHA class; possible ischemia"], ["Anorexia, early satiety, weight loss", "GI symptoms; cardiac cachexia (poor prognosis)"], ["Palpitations, (pre)syncope, ICD shocks", "Paroxysmal AF, VT; ICD shocks (bad prognosis)"], ["TIA or thromboembolism symptoms", "Anticoagulation?"], ["Peripheral edema or ascites", "Volume overload"], ["Disordered breathing, sleep problems", "Treating sleep apnea may improve cardiac function and ↓ pulmonary HT"], ["Recent or frequent HF hospitalizations", "Bad 1-year prognosis"], ["Stopping HF medications", "Adverse 1-year prognosis"], ["Medications that exacerbate HF", "Removing them is a therapeutic opportunity"], ["Diet", "Assess awareness and restriction of sodium and fluid"], ["Adherence", "Access to medications, family support, follow-up, cultural sensitivity"]], "lead": "<p><strong>Clinical assessment – history<\/strong><\/p>"}, {"t": "table", "cols": ["", "Symptoms", "Signs"], "rows": [["<strong>Typical / more specific<\/strong>", "<strong>Dyspnea<\/strong> on exertion or lying down; orthopnea; PND<br>↓ exercise tolerance, longer recovery<br><strong>Fatigue<\/strong>, tiredness, weakness<br>Peripheral edema (<strong>ankle swelling<\/strong>)", "<strong>Elevated JVP<\/strong><br>Hepatojugular reflux<br>Third heart sound<br>Laterally displaced apex<br>Cardiac murmur"], ["<strong>Less typical / less specific<\/strong>", "Nocturnal cough or wheeze with white or pink blood-tinged phlegm<br>Bloating; loss of appetite<br>Confusion (especially elderly); depression<br>Palpitations; dizziness, nausea, syncope<br>Bendopnea<br>Poor concentration, ↓ alertness", "Weight gain from fluid (&gt; 2 kg/week); weight loss (advanced HF); cachexia<br>Peripheral edema (ankle, sacral, scrotal), ascites<br>Pulmonary crepitations; basal dullness/↓ air entry (effusion)<br>Tachycardia, irregular pulse; tachypnea (&gt; 16/min)<br>Cheyne-Stokes respiration/sleep apnea<br>Hepatomegaly; cold extremities; oliguria"]], "lead": "<p><strong>Symptoms and signs<\/strong><\/p>"}, {"t": "table", "cols": ["Profile", "Features"], "rows": [["<strong>Congestion<\/strong> (wet)", "Pulmonary congestion, orthopnea/PND, bilateral peripheral edema, JVD, congested hepatomegaly, gut congestion/ascites, hepatojugular reflux"], ["<strong>Hypoperfusion<\/strong> (cold)", "Cold sweaty extremities, oliguria, confusion, dizziness, <strong>narrow pulse pressure<\/strong>"]], "lead": "<p><strong>Hemodynamic profile: warm/cold and wet/dry<\/strong> – cold and wet has the worst prognosis.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Acute HF: assess profile\"] --> B{\"Congested - wet?\"}\n B -->|\"No\"| C{\"Hypoperfused - cold?\"}\n C -->|\"No\"| D[\"Warm-dry<br/>adjust oral therapy\"]\n C -->|\"Yes\"| E[\"Cold-dry<br/>fluid challenge, inotropes<br/>if still hypoperfused\"]\n B -->|\"Yes\"| F{\"Hypoperfused - cold?\"}\n F -->|\"No\"| G[\"Warm-wet<br/>diuretics + vasodilators<br/>ultrafiltration if diuretic resistant\"]\n F -->|\"Yes\"| H{\"SBP under 90?\"}\n H -->|\"Yes\"| I[\"Cold-wet, low BP<br/>inotrope, vasopressor if refractory,<br/>diuretics, mechanical support\"]\n H -->|\"No\"| J[\"Cold-wet, SBP over 90<br/>vasodilators, diuretics,<br/>inotropes if refractory\"]"}, {"t": "table", "cols": ["Test", "Findings"], "rows": [["<strong>Labs<\/strong>", "Glucose, creatinine/GFR, BUN, LFTs, electrolytes (Ca2+, Mg2+), fasting lipids<br>CBC, ferritin, TSH, troponin; urinalysis (protein, infection)<br><strong>Natriuretic peptides<\/strong>: elevated BNP suggests HF; <strong>low BNP rules out HF<\/strong>"], ["<strong>Chest x-ray<\/strong>", "Heart size and pulmonary congestion/edema; cardiomegaly = a/b &gt; 0.5<br>Identifies alternative pulmonary causes – heart vs lung breathlessness<br>Significant LV systolic dysfunction may exist without cardiomegaly"], ["<strong>ECG<\/strong>", "Normal ECG → HF unlikely (&lt; 2% in acute presentations) / HFpEF<br>Abnormal ECG → HFrEF<br>Q waves (infarction) that could cause HF; LVH"], ["<strong>Echo<\/strong>", "LV and RV function, diastolic function, chamber size, hypertrophy, pericardial and valvular disease<br>Common HF findings: LA appendage thrombus in AF, severe RV dysfunction, severe MR"], ["<strong>Other<\/strong>", "Nuclear perfusion scan (non-invasive)<br>Cardiac MRI – scar burden, precise ventricular function<br>Cardiac catheterization/coronary angiogram<br>Pulmonary artery (Swan-Ganz) catheter – invasive hemodynamics<br>Endomyocardial biopsy – HCM, active myocarditis, sarcoidosis, amyloidosis, Fabry disease"]], "lead": "<p><strong>Investigations<\/strong><\/p>"}, {"t": "table", "cols": ["", "ACEI", "Beta blocker", "MRA", "ARB"], "rows": [["<strong>Drugs<\/strong>", "Enalapril, lisinopril, ramipril, trandolapril", "Bisoprolol, carvedilol, metoprolol", "Spironolactone, eplerenone", "Candesartan, valsartan"], ["<strong>Indications<\/strong>", "All HF patients; <strong>1st line NYHA II-IV<\/strong>; NYHA I (asymptomatic LV dysfunction)", "All stable NYHA II-III; refer NYHA IV", "NYHA III-IV; NYHA II after ACEI + BB; after ACEI + BB post-MI", "1st line with BB if ACEI-intolerant; 2nd line after optimized ACEI + BB in NYHA II-IV"], ["<strong>Contra-indications<\/strong>", "Bilateral renal artery stenosis; angioneurotic edema", "Asthma", "Bilateral renal artery stenosis", "Bilateral renal artery stenosis"], ["<strong>Cautions<\/strong>", "K+ &gt; 5.0; Cr &gt; 221; SBP &lt; 90", "NYHA IV; HF exacerbation; heart block or HR &lt; 60; severe congestion or SBP &lt; 90", "K+ &gt; 5.0; Cr &gt; 221", "K+ &gt; 5.0; Cr &gt; 221; SBP &lt; 90"], ["<strong>Interactions<\/strong>", "K+ supplements, K+-sparing diuretics, MRA, ARB, NSAID, high-K+ “low salt” substitutes", "Verapamil/diltiazem; digoxin/amiodarone", "K+ supplements, K+-sparing diuretics, ACEI, ARB, NSAID, high-K+ salt substitutes", "K+ supplements, K+-sparing diuretics, MRA, ACEI, NSAID, high-K+ salt substitutes"], ["<strong>Where<\/strong>", "Community for most, except cautions", "Community if stable", "Community or hospital", "Community for most"], ["<strong>How to use<\/strong>", "Start low; double ≥ every 2 weeks; aim for target or highest tolerated; some drug is better than none; check BP, electrolytes, renal function 2 weeks after each change", "Start low; double every 2-4 weeks; some drug is better than none; monitor BP, HR, clinical status", "Start low; bloods at 1, 4, 8, 12 weeks, 6, 9, 12 months, then every 6 months; moderate ↑ K+/Cr → ↓ dose, alternate days; extreme ↑ → stop immediately", "Start low; double every 2-4 weeks; some drug is better than none; check K+ and Cr 1-2 weeks after each change"], ["<strong>Patient advice<\/strong>", "Improves within weeks to months; avoid OTC NSAIDs and K+ salt substitutes", "Improvement may take 3-6 months; weigh daily; ↑ diuretic if weight ↑ 1.5-2.0 kg over &gt; 2 days", "Improves within weeks to months; avoid NSAIDs and K+ salt substitutes; stop spironolactone with diarrhea/vomiting", "Improves within weeks to months; avoid NSAIDs and K+ salt substitutes"], ["<strong>Problem: hypotension<\/strong>", "Asymptomatic – no change<br>Symptomatic – reassess nitrates, CCBs, other vasodilators; ↓ diuretic", "Asymptomatic – no change<br>Symptomatic – reassess vasodilators; ↓ diuretic; consider ACEI dose", "Hyperkalemia – avoid nephrotoxic (NSAIDs) and K+-retaining drugs", "Asymptomatic – no change<br>Symptomatic – reassess vasodilators; ↓ diuretic"], ["<strong>Problem: other<\/strong>", "Worsening renal function – some ↑ K+/Cr expected; stop nephrotoxins or halve ACEI", "Worsening symptoms – ↑ diuretic; halve/stop BB", "Gynecomastia/breast discomfort (spironolactone)<br>Renal function: ↑ K+/Cr risk greater with ACEI + ARB than either alone – monitor carefully", "Worsening renal function – some ↑ K+/Cr expected; stop nephrotoxins or halve ARB"]], "lead": "<p><strong>Core HFrEF drugs<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"LVEF ≤ 40% with symptoms<br/>diuretics for congestion throughout\"] --> B[\"Triple therapy: ACEI or ARB + BB + MRA<br/>titrate to target\"]\n B --> C{\"Reassess symptoms\"}\n C -->|\"NYHA I\"| D[\"Continue triple therapy\"]\n C -->|\"NYHA II-IV, sinus, HR ≥ 70\"| E[\"Add ivabradine<br/>switch ACEI/ARB to ARNI\"]\n C -->|\"NYHA II-IV, HR under 70,<br/>AF or paced\"| F[\"Switch ACEI/ARB to ARNI\"]\n D --> G{\"Reassess symptoms and LVEF\"}\n E --> G\n F --> G\n G -->|\"NYHA I or LVEF over 35%\"| H[\"Continue; reassess every 1-3 years\"]\n G -->|\"NYHA I-III, LVEF ≤ 35%\"| I[\"ICD/CRT algorithm\"]\n G -->|\"NYHA IV\"| J[\"Hydralazine/nitrates, advanced HF referral,<br/>palliative care referral\"]"}, {"t": "table", "cols": ["#", "Statement", "Answer"], "rows": [["15", "Chronic HF is a manifestation of advanced heart disease", "<strong>True<\/strong> – late manifestation of almost any heart disease; progressive and ultimately fatal"], ["16", "A syndrome results from a specific disease process", "<strong>False<\/strong> – syndromes occur in the absence of a specific disease process"], ["17", "HF is the most common reason for admission in patients &gt; 65", "<strong>True<\/strong> – frequent hospitalization, high morbidity and mortality"], ["18", "Symptomatic HF starts in stage B", "<strong>False<\/strong> – stage C"], ["19", "“Heart failure” requires a current or past episode of overt HF", "<strong>True<\/strong> – prognosis is set by symptoms plus structural disease"], ["20", "The most common etiology is end-stage ischemic heart disease", "<strong>True<\/strong> – 65% in the community"], ["21", "The most common presentation is preserved LV function", "<strong>False<\/strong> – 60% (as written in source)"], ["22", "Some secondary causes can give HFrEF or HFpEF", "<strong>True<\/strong> – sarcoidosis, hypertension, HCM (5-8%)"], ["23", "Myocarditis is most commonly infectious", "<strong>False<\/strong> – infectious, toxic or unspecified"], ["24", "HF from ischemic disease is pathologically an “ischemic cardiomyopathy”", "<strong>False<\/strong> – ischemic CM is a clinical category"]], "lead": "<p><strong>Practice questions 15-24 (true/false)<\/strong><\/p>"}]}, {"id": "cardio-w4-05", "num": "05", "name": "Physiology of Hypertension", "title": "Hypertension: Diagnosis, Causes and Risk", "framing": "<p>Hypertension is defined by <strong>treatment benefit<\/strong>, not a number alone. The lecture follows the four-step approach: confirm it is really hypertension, find a cause, estimate CV risk, then plan treatment.<\/p>", "week": 4, "weekLabel": "Week 4 - Heart Failure, Hypertension & Congenital Disease", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"High BP reading\"] --> B[\"1 Confirm hypertension<br/>one reading is not enough\"]\n B --> C[\"Proper technique, repeat readings,<br/>out-of-office ABPM or HBPM\"]\n C --> D[\"2 Determine the cause<br/>secondary and aggravating factors\"]\n D --> E[\"3 Determine the risk of<br/>adverse CV outcomes\"]\n E --> F[\"4 Plan to lower risk<br/>lifestyle + medications\"]"}, {"t": "table", "cols": ["Method", "Abbreviation", "Note"], "rows": [["Office", "OBP", ""], ["Office automated", "AOBP", ""], ["Ambulatory", "ABP", "<strong>Gold standard<\/strong>"], ["Home", "HBP", ""]], "lead": "<p><strong>BP measurement methods<\/strong> – HBPM and ABPM predict CV risk better than office BPM; <strong>night-time BP correlates best with future CV events<\/strong>.<\/p>"}, {"t": "table", "cols": ["Secondary cause", "Prevalence"], "rows": [["Obstructive sleep apnea", "10%"], ["Chronic renal disease", "5%"], ["Primary aldosteronism", "5%"], ["Alcohol or substance use", "5%"], ["Medications", "5%"], ["Renovascular disease", "2%"], ["Cushing syndrome", "0.1%"], ["Pheochromocytoma", "0.1%"], ["Coarctation of aorta", "0.1%"]], "lead": "<p><strong>Secondary causes of hypertension<\/strong><\/p>"}, {"t": "table", "cols": ["Self-inflicted", "Doctor-inflicted", "Fate"], "rows": [["Salt<br>NSAIDs<br>Stimulants – Rx, OTC, street drugs<br>Alcohol<br>Withdrawal from Rx or non-Rx drugs<br>Pain", "Wearing a white coat<br>Not measuring BP correctly<br>Medications: glucocorticoids, NSAIDs, stimulants, estrogens/androgens, cyclosporine/EPO, nasal decongestants", "Obstructive sleep apnea – ↑ aldosterone/NE<br>Hyperaldosteronism – low serum K+<br>Intrinsic kidney disease – urinalysis<br>Renal artery stenosis – atherosclerosis<br>Thyroid/parathyroid disease – TSH, serum Ca2+<br>Endocrine: pheochromocytoma, Cushing syndrome, acromegaly"]], "lead": "<p><strong>Secondary “aggravating” causes<\/strong><\/p>"}]}, {"id": "cardio-w4-06", "num": "06", "name": "Management of Hypertension", "title": "Treatment of Hypertension", "framing": "<p>Treatment intensity follows <strong>global CV risk<\/strong>: thresholds and targets tighten as risk rises. Most patients need <strong>several drugs combined<\/strong> (RAAS stimulator + RAAS inhibitor), added rather than dose-doubled.<\/p>", "week": 4, "weekLabel": "Week 4 - Heart Failure, Hypertension & Congenital Disease", "items": [{"t": "table", "cols": ["Population", "SBP", "DBP"], "rows": [["<strong>High risk<\/strong> (SPRINT population)", "≥ 130", "NA"], ["Diabetes", "≥ 130", "≥ 80"], ["Moderate risk", "≥ 140", "≥ 90"], ["Low risk (no TOD or CV risk factors)", "≥ 160", "≥ 100"]], "lead": "<p><strong>Usual office BP thresholds for starting pharmacological treatment<\/strong><\/p>"}, {"t": "table", "cols": ["Population", "SBP", "DBP"], "rows": [["<strong>High risk<\/strong>", "≤ 120", "NA"], ["Diabetes", "&lt; 130", "&lt; 80"], ["All others", "&lt; 140", "&lt; 90"]], "lead": "<p><strong>Recommended office BP treatment targets<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Confirmed hypertension\"] --> B[\"Health behaviour management for all\"]\n B --> C{\"BP above treatment threshold<br/>for risk group?\"}\n C -->|\"No\"| D[\"Lifestyle, monitor\"]\n C -->|\"Yes\"| E{\"More than 10 mm Hg<br/>above target?\"}\n E -->|\"No\"| F[\"One first-line drug<br/>thiazide-like, ACEI, ARB,<br/>long-acting CCB, BB if under 60\"]\n E -->|\"Yes\"| G[\"Two drugs as low-dose<br/>single pill combination\"]\n F --> H{\"At target?\"}\n G --> H\n H -->|\"No\"| I[\"Add a drug rather than<br/>doubling the dose\"]\n I --> H\n H -->|\"Yes\"| J[\"Monitor, adherence\"]"}, {"t": "table", "cols": ["Compelling indication", "Preferred treatment"], "rows": [["Ischemic heart disease", "Beta blocker + ACEI"], ["Recent STEMI", "Beta blocker"], ["LV systolic dysfunction", "ACEI or ARB"], ["Cerebrovascular disease", "Diuretics, dihydropyridines, ARB"], ["LV hypertrophy", "Anything"], ["Non-diabetic CKD", "ACEI or ARB"], ["Renovascular disease", "<strong>Do NOT use RAAS blockers<\/strong> (significant hyperkalemia or further renal impairment)"], ["Diabetes with neuropathy", "ARB"], ["Global vascular protection", "Statin + ASA"]], "lead": "<p><strong>Choice of drugs for compelling indications<\/strong><\/p>"}, {"t": "table", "cols": ["Column A: RAAS stimulation", "Column B: RAAS inhibition"], "rows": [["Diuretic", "Beta blocker"], ["Long-acting CCB", "Direct renin inhibitor"], ["", "ACEI"], ["", "ARB"], ["", "MRA"], ["", "ENaC inhibitor (amiloride)"]], "lead": "<p><strong>Effective combinations = column A + column B.<\/strong> Preferred 3-drug cocktail = diuretic + ACEI/ARB + long-acting CCB. Monitor electrolytes when giving 2 drugs from the same column.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Step 1: RAAS inhibitor<br/>ACEI or ARB - cough risk?\"] --> B[\"Step 2: add diuretic or CCB<br/>by K+ and pedal edema\"]\n B --> C[\"Step 3: add the other<br/>diuretic or CCB\"]\n C --> D[\"Step 4: spironolactone, doxazosin<br/>or beta blocker by K+ and HR\"]\n D --> E{\"Step 5: at target?<br/>4 drugs control 95%\"}\n E -->|\"Yes\"| F[\"Monitor\"]\n E -->|\"No\"| G[\"Directly observed therapy<br/>with ABP monitoring\"]\n G --> H{\"Step 6: kidney function and K+\"}\n H -->|\"Poor kidney function\"| I[\"Renal impairment algorithm\"]\n H -->|\"K+ over 3.7\"| J[\"More thiazide-like diuretic\"]\n H -->|\"K+ under 3.7\"| K[\"Increase spironolactone\"]"}]}, {"id": "cardio-w4-07", "num": "07", "name": "Congenital Heart Disease", "title": "Congenital Heart Disease", "framing": "<p>CHD is sorted with two questions: <strong>pink or blue?<\/strong> and <strong>how much pulmonary blood flow?<\/strong> The answers group the lesions (left-to-right shunts, obstructions, right-to-left shunts, mixing lesions, separate circulations), and each group follows from where development went wrong. The lecture also covers pediatric murmurs, chest pain and Kawasaki disease.<\/p>", "week": 4, "weekLabel": "Week 4 - Heart Failure, Hypertension & Congenital Disease", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"Day 14: crescent heart field\"] --> B[\"Day 20: bilateral endocardial tubes\"]\n B --> C[\"Day 21: fusion in the midline\"]\n C --> D[\"Day 22: primitive heart tube<br/>truncus, bulbus, ventricle, atrium\"]\n D --> E[\"Day 24: looping anterior and right\"]\n E --> F[\"Day 35: common AV canal<br/>RV gives both outflow tracts\"]\n F --> G[\"Septation: atria, ventricles, outflow<br/>foramen ovale, spiral outflow septum\"]\n G --> H[\"Valves, great artery and vein branching\"]\n E -.->|\"errors\"| I[\"Abnormal connections<br/>or orientation\"]\n G -.->|\"errors\"| J[\"Septal defects ASD, VSD\"]\n H -.->|\"errors\"| K[\"Valve lesions, abnormal veins,<br/>aorta and PA abnormalities\"]"}, {"t": "table", "cols": ["", "Infants", "Older children"], "rows": [["<strong>Symptoms<\/strong>", "Failure to thrive<br>Respiratory distress, especially with feeds<br>Excessive diaphoresis with feeds<br>Poor feeding", "Exercise intolerance<br>Malaise<br>SOB on exertion or orthopnea"], ["<strong>Signs<\/strong>", "Tachypnea, tachycardia<br>Pallor, hepatomegaly, hyperdynamic precordium<br>↑ work of breathing<br>Failure to thrive – low weight", "Tachypnea, tachycardia<br>Pallor, hepatomegaly, hyperdynamic precordium<br>Edema<br>Crackles rare"]], "lead": "<p><strong>Congestive symptoms and signs by age<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Congenital heart disease\"] --> B[\"Pink - acyanotic\"]\n A --> C[\"Blue - cyanotic\"]\n B --> D[\"Normal PBF<br/>valve lesions: bicuspid AV, AS/AR,<br/>PS, MR; coarctation\"]\n B --> E[\"↑ PBF - left-to-right shunts<br/>ASD, VSD, PDA, AVSD\"]\n C --> F[\"↓ PBF - right-to-left shunts<br/>Tetralogy of Fallot, tricuspid atresia,<br/>pulmonary atresia or critical stenosis\"]\n C --> G[\"Normal or ↑ PBF - mixing lesions<br/>TAPVR, truncus arteriosus\"]\n C --> H[\"Separate circulations<br/>transposition of the great arteries\"]"}, {"t": "table", "cols": ["Lesion", "Shunt and epidemiology", "Findings and course"], "rows": [["<strong>ASD<\/strong>", "L→R across the atrial septum (↑ RA compliance, ↑ LA pressure)<br>10% of CHD; <strong>30% of CHD newly diagnosed in adults<\/strong><br>Hemodynamics: ↑ <strong>flow<\/strong> – volume overload of the pulmonary circulation", "Generally asymptomatic in children; presents in adults with arrhythmias, pulmonary hypertension, HF and congestion<br><strong>RV heave<\/strong> (RV enlargement)<br><strong>Wide fixed split S2<\/strong> – extra flow delays pulmonary valve closure<br><strong>Blowing systolic ejection murmur<\/strong> at LUSB (↑ flow across the pulmonary valve)<br>May close spontaneously in the first 2 years<br>Tx: repair around 5 years – surgical patch or interventional device"], ["<strong>VSD<\/strong>", "L→R across the ventricular septum (↑ LV systolic pressure, ↓ pulmonary vascular resistance)<br>5% of newborns; 20-30% of CHD<br>Hemodynamics: ↑ <strong>pressure and/or flow<\/strong>; shunting in <strong>systole<\/strong> (RV and LV pressures similar in diastole)", "Presentation depends on defect size – larger defects shunt more at higher pressure<br>Congestive symptoms often at <strong>6-12 weeks<\/strong><br>May close spontaneously in 1-2 years, but may need earlier surgery to protect the lungs from high pressure"], ["", "<strong>Small VSD<\/strong>", "Normal RV/PA pressure and flow; <strong>pansystolic murmur<\/strong>; normal S2; no CHF"], ["", "<strong>Medium VSD<\/strong>", "Fairly normal RV/PA pressure; ↑ flow; pansystolic murmur; narrowly split S2; ± CHF"], ["", "<strong>Large VSD<\/strong>", "↑ RV/PA pressure; ↑ flow; <strong>systolic ejection murmur<\/strong>; <strong>single S2<\/strong>; almost always CHF"], ["<strong>PDA<\/strong>", "L→R in <strong>systole and diastole<\/strong> (aortic pressure &gt; PA throughout; ↓ PVR)<br><strong>80% of very premature neonates<\/strong>; 5-10% of CHD in term neonates<br>Hemodynamics: ↑ pressure and/or flow", "Presentation depends on size (like VSD)<br><strong>Continuous murmur<\/strong>, L infraclavicular, radiating to the back<br>Diastolic shunting = extra lung flow at the expense of tissue perfusion → <strong>wide pulse pressure, bounding pulses<\/strong><br>± other CHF signs"], ["<strong>AVSD<\/strong>", "Endocardial cushion defect (middle of the heart)<br><strong>Common in Down syndrome<\/strong>", "Atrial and ventricular shunts usually present – but NOT just an ASD + VSD<br>Universal <strong>AV valve abnormality<\/strong> – may leak or be too narrow<br>Hemodynamics depend on shunt size and valve function"]], "lead": "<p><strong>Left-to-right shunt lesions<\/strong> – pink with ↑ PBF<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Cyanotic neonate\"] --> B[\"Hyperoxia test<br/>100% inspired oxygen\"]\n B --> C{\"PaO2 on 100% O2?\"}\n C -->|\"Rises toward ~600\"| D[\"Respiratory or infectious cause\"]\n C -->|\"Stays under 100-150\"| E[\"Cyanotic CHD - the 5 Ts\"]\n E --> F[\"Prostaglandin to keep PDA open<br/>if ↓ PBF lesion\"]\n E --> G[\"Surgery - all cyanotic CHD<br/>need surgery to survive\"]"}, {"t": "table", "cols": ["Lesion (hint)", "Anatomy and hemodynamics", "Presentation and treatment"], "rows": [["<strong>Truncus arteriosus<\/strong><br>1 – one thumb up", "1% of CHD<br>Single artery leaves the heart and gives rise to aorta and PAs; large VSD with the trunk committed to both ventricles<br>Blood mixes on exit → cyanosis; easy lung flow → high PBF at the expense of organ perfusion", "Infants quickly develop end-organ failure (coronary, gut ischemia) and pulmonary congestion<br>Tx: surgery in the first 1-2 weeks – VSD patched so the trunk becomes the aorta; PAs connected to the RV by a conduit"], ["<strong>Transposition of the great arteries<\/strong><br>2 – cross two fingers<br>↑ PBF", "Circulations in <strong>parallel<\/strong> (two independent circuits) instead of series<br>Survival depends on fetal shunts letting red blood reach the systemic circulation<br>5% of CHD – <strong>most common cyanotic CHD presenting as a neonate<\/strong>", "<strong>Profound cyanosis<\/strong> in the newborn period with minimal respiratory distress for the saturation; little/no murmur<br>Severe cyanosis is life-threatening<br>Tx: surgery in the first week"], ["<strong>Tricuspid atresia<\/strong><br>3 – tri<br>↓ PBF", "3% of CHD<br>Absent tricuspid valve – <strong>single ventricle<\/strong> lesion<br>All systemic venous blood must cross an ASD; lungs reached only via a VSD or PDA; RV usually hypoplastic", "No curative surgery – the valve cannot be recreated<br>Tx: single-ventricle palliation – 2-3 surgeries in the first 5 years, usually allowing survival to adulthood; significant morbidity and mortality"], ["<strong>Tetralogy of Fallot<\/strong><br>4 – tetra<br>↓ PBF", "<strong>RV outflow obstruction<\/strong> (displaced septum) + <strong>VSD<\/strong> + <strong>overriding aorta<\/strong> + eventual <strong>RVH<\/strong><br>6% of CHD – <strong>most common cyanotic CHD<\/strong>", "Severity follows the RV outflow obstruction: mild – harsh SEM, subtle/late cyanosis; severe – newborn cyanosis<br><strong>Tet spells<\/strong>: dynamic loss of pulmonary outflow → babies go extremely blue (life-threatening)<br>Un-operated: progressive cyanosis, tet spells, limited lifespan<br>Tx: surgery at 4-6 months – close VSD, open RV outflow"], ["<strong>TAPVR<\/strong><br>5 – five-letter acronym<br>↑ PBF", "1% of CHD (rare)<br>Pulmonary veins drain to a systemic vein instead of the LA – blue and red blood mix in the RA<br>An ASD is needed to survive; most blood returns to the lungs via the RV", "Unobstructed: like a big ASD + mild cyanosis → surgery at 2-3 months to re-route the veins<br><strong>Obstructed<\/strong>: significant cyanosis + pulmonary edema with a small heart → <strong>emergency surgery<\/strong>"]], "lead": "<p><strong>Cyanotic CHD – the 5 Ts<\/strong><\/p>"}, {"t": "table", "cols": ["Step", "Considerations"], "rows": [["<strong>Hx<\/strong>", "<strong>Infant/toddler<\/strong>: ↑ work of breathing (especially feeds), frequent/severe respiratory infections; feeding and growth problems (diaphoresis, tiring with feeds), failure to thrive; cyanosis, activity level, LOC<br><strong>Older child/adolescent<\/strong>: chest pain, palpitations; dyspnea, cyanosis; syncope, presyncope; malaise, exercise intolerance<br>Pregnancy exposures, FHx of pediatric/congenital heart disease, PMHx, diet"], ["<strong>PEx<\/strong>", "<strong>Full cardiac exam<\/strong>: inspection (distress, perfusion, dysmorphisms); palpation of precordium (PMI, heaves, thrills) and pulses – <strong>ALWAYS check femoral pulses for coarctation<\/strong>; auscultation<br>Plus respiratory exam and liver (hepatomegaly)"], ["<strong>Auscultation<\/strong>", "Step by step: S1 → S2 ± splitting → systole (murmurs, extra sounds) → diastole; address all before removing the stethoscope<br>Listen for timing and type, location and radiation, quantity and quality, changes with position, associated abnormalities"], ["<strong>Tips in children<\/strong>", "Know what you are listening for; be patient (wait for crying to stop or breathing to be ‘filtered out’); be opportunistic (listen first); be deliberate and active; practice"]], "lead": "<p><strong>Approach to a pediatric murmur<\/strong><\/p>"}, {"t": "table", "cols": ["Feature", "Benign / physiologic", "Pathologic"], "rows": [["Timing/type", "Systolic ejection (continuous if venous hum)", "Systolic ejection, <strong>pansystolic<\/strong>, <strong>diastolic<\/strong>, or continuous"], ["Intensity", "1-3/6 (never a thrill)", "Up to 4-6/6"], ["Quality", "Soft, musical, vibratory, blowing", "Harsh (or soft, blowing), rarely musical"], ["Location", "Specific to the murmur", "Variable"], ["Maneuvers", "Louder supine (except venous hum)", "Variable"], ["Triggers", "High cardiac output state", ""], ["Associated", "Normal cardiac history, sats and BP; ± fever, tachycardia, pallor; otherwise normal exam and tests", "± cardiac symptoms or FHx, desaturation, 4-limb BP gradient, dysmorphisms, FTT; hyperdynamic precordium, heaves/thrills, abnormal sounds"]], "lead": "<p><strong>Innocent vs pathologic murmur<\/strong><\/p>"}, {"t": "table", "cols": ["", "Still's murmur", "Peripheral PA stenosis", "Flow murmurs", "Venous hum"], "rows": [["<strong>Notes<\/strong>", "<strong>Most common<\/strong>; 44% of referrals", "Relative branch PA hypoplasia; acute angle off the main PA", "Pulmonary and aortic flow", "2nd most common; the odd one out – turbulent flow in superficial neck veins"], ["<strong>Who<\/strong>", "2-6 years", "Newborn to 6 months", "Older children and adolescents; thin children, pectus excavatum; ↑ CO (anemia, fever, dehydration)", "Older toddler and up (when upright)"], ["<strong>Sound<\/strong>", "1-3/6 SEM; vibratory, musical, twangy, whirring; <strong>louder supine<\/strong>", "1-3/6 SEM; soft, low-pitched", "1-2/6 SEM; soft, non-musical", "1-3/6 <strong>continuous<\/strong>, low-frequency; <strong>disappears supine or with jugular compression<\/strong>"], ["<strong>Location<\/strong>", "LLSB; no radiation", "LUSB; wide radiation to lung fields", "Upper sternal borders; minimal radiation", "RUSB, right supraclavicular"], ["<strong>Heart sounds<\/strong>", "", "", "Normally split S2, no clicks", ""], ["<strong>DDx<\/strong>", "", "Pulmonary stenosis (harsher, ejection click, persists &gt; 6 months); pathologic branch PA stenosis (harsher, persists &gt; 6 months)", "ASD (soft, but wide fixed split S2, RV heave); valvar stenosis (harsher, click, LV/RV heave)", ""]], "lead": "<p><strong>Innocent murmurs<\/strong><\/p>"}, {"t": "table", "cols": ["Step", "Considerations"], "rows": [["<strong>Hx<\/strong>", "Aggravating and alleviating features – exercise vs rest, movement, breathing<br>Quality (often hard for children to describe), quantity, location (discrete vs vague), associated symptoms<br>FHx, PMHx"], ["<strong>PEx<\/strong>", "Reproducible pain<br>Cardiac abnormalities – extra heart sounds, murmurs<br>Non-cardiac abnormalities – signs of respiratory disease (wheeze)"]]}, {"t": "table", "cols": ["Feature", "Benign / MSK", "Pathologic / cardiac"], "rows": [["Aggravating", "Random, including rest; pleuritic; body position", "<strong>Exercise (and only exercise)<\/strong>; predictable degree of exertion"], ["Alleviating", "Rest, distraction, time", "Rest (and only rest)"], ["Location", "Often discrete, left or right", "Vague, hard to pinpoint"], ["Quality", "Variable; sharp (maybe crushing or squeezing)", "Crushing, squeezing"], ["Other", "Discrete, palpable; often anxiety about the heart", "Not reproducible at rest"], ["Associated", "Otherwise normal history and exam", "± cardiac symptoms or FHx (<strong>syncope most worrisome<\/strong>); active precordium, heaves/thrills, extra sounds, pathologic murmurs"]], "lead": "<p><strong>Benign vs cardiac chest pain<\/strong><\/p>"}, {"t": "table", "cols": ["Phase", "Timing", "Features"], "rows": [["<strong>Acute<\/strong>", "0-9 days", "Microvascular angiitis, acute endarteritis; classic symptoms<br>Labs: thrombocytopenia, aseptic meningitis, sterile pyuria, ↑ CRP<br>Rarely HF, dysrhythmia"], ["<strong>Subacute<\/strong>", "Weeks 2-4", "Panvasculitis of coronaries with <strong>aneurysms and thrombus<\/strong><br>Desquamation of hands/feet; fever resolves<br>Labs: <strong>thrombocytosis<\/strong>"], ["<strong>Convalescent/chronic<\/strong>", "1 month-4 years", "Coronary scarring, stenosis, calcification, recanalization; myocardial fibrosis; CRP normalizes"]], "lead": "<p><strong>Phases of Kawasaki disease<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Fever ≥ 4-5 days\"] --> B{\"≥ 4 of 5: conjunctivitis, mucosal changes,<br/>rash, hand/foot changes, cervical node\"}\n B -->|\"Yes\"| C[\"Kawasaki disease\"]\n C --> D[\"IVIG + ASA<br/>within 10 days of fever onset\"]\n D --> E[\"Aneurysm risk 25% → 4%\"]\n C --> F{\"Coronary complications?\"}\n F -->|\"Yes\"| G[\"Antiplatelet, anticoagulation,<br/>exercise restriction, lifelong follow-up,<br/>possible stent or CABG\"]"}]}, {"id": "cardio-w4-08", "num": "08", "name": "Pediatric Cardiology Case Review", "title": "Pediatric Palpitations", "framing": "<p>In an adolescent with palpitations, the task is separating <strong>sinus tachycardia<\/strong> (gradual, rate-appropriate) from <strong>SVT<\/strong> (abrupt, &gt; 200 bpm) – and the exam rarely helps, so the diagnosis comes from history and capturing the rhythm.<\/p>", "week": 4, "weekLabel": "Week 4 - Heart Failure, Hypertension & Congenital Disease", "items": [{"t": "table", "cols": ["Step", "Considerations"], "rows": [["<strong>Hx<\/strong>", "What the palpitations feel like (fast? irregular?), onset and offset, triggers, actual heart rate if measured"], ["<strong>PEx<\/strong>", "Not particularly helpful – usually not having palpitations in clinic"], ["<strong>Ix<\/strong>", "Try to capture the rhythm while symptomatic<br>Resting ECG may be normal, but may show patterns predisposing to arrhythmia<br>ECG during palpitations is diagnostic<br>Longer-term rhythm monitoring: <strong>Holter<\/strong> (2-lead continuous ECG, 24-48 hours, rarely 1-2 weeks) or longer continuous/intermittent monitors (3-8 weeks)"], ["<strong>DDx<\/strong>", "<strong>Sinus tachycardia<\/strong> – exercise, anxiety, presyncope (dehydration, position changes, prolonged standing), organic (hyperthyroid, hypertension)<br><strong>Sinus rhythm<\/strong> – increased awareness of a normal heart rate<br><strong>Supraventricular tachycardia<\/strong><br><strong>Ventricular tachycardia is more likely to present with syncope than palpitations<\/strong>"]], "lead": "<p><strong>Approach to pediatric palpitations<\/strong><\/p>"}, {"t": "table", "cols": ["Feature", "Sinus / sinus tachy", "Arrhythmia / SVT"], "rows": [["Rate", "Less than maximal HR; usually &lt; 150-180 bpm at rest", "Usually &gt; 200 bpm (slightly slower in older adolescents); too fast to count"], ["Onset", "<strong>Slow<\/strong> (&gt; 10-30 seconds)", "<strong>Rapid<\/strong> (1-5 seconds)"], ["Offset", "Slow", "Rapid (may be slower if anxiety adds a sinus tachycardia)"], ["Associated", "May have presyncope or SOB with or before palpitations; normal exam", "Presyncope, chest pain or SOB follow the onset of palpitations; usually normal exam"], ["ECG", "Normal", "May see WPW"], ["Monitoring", "Sinus rhythm or sinus tachycardia", "SVT or other arrhythmia captured"]], "lead": "<p><strong>Sinus tachycardia vs SVT<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Adolescent with palpitations\"] --> B[\"History: feel, onset/offset,<br/>triggers, measured HR\"]\n B --> C[\"Resting ECG<br/>look for WPW or predisposing pattern\"]\n C --> D[\"Capture rhythm while symptomatic<br/>Holter 24-48 h or 3-8 week monitor\"]\n D --> E{\"Rhythm during symptoms?\"}\n E -->|\"Sinus, gradual onset, HR under 180\"| F[\"Sinus tachycardia or awareness<br/>of normal rhythm - find the cause\"]\n E -->|\"Abrupt onset, HR over 200\"| G[\"SVT\"]\n A --> H{\"Syncope rather than palpitations?\"}\n H -->|\"Yes\"| I[\"Think VT\"]"}]}, {"id": "cardio-w4-09", "num": "09", "name": "Heart Failure Advanced Therapies and Transplant", "title": "Advanced Heart Failure", "framing": "<p>Advanced (stage D) heart failure is recognized when standard therapy stops working – the patient is <strong>cold<\/strong>. The decision is then which durable option fits: <strong>transplant, VAD, or palliation<\/strong>, with inotropes as a bridge.<\/p>", "week": 4, "weekLabel": "Week 4 - Heart Failure, Hypertension & Congenital Disease", "items": [{"t": "table", "cols": ["Letter", "Marker", "Criterion"], "rows": [["<strong>I<\/strong>", "Inotropes", "Previous or ongoing dobutamine, milrinone or dopamine"], ["<strong>N<\/strong>", "NYHA class / natriuretic peptide", "Persistent NYHA III/IV symptoms or persistently high BNP"], ["<strong>E<\/strong>", "End-organ dysfunction", "Worsening liver or renal function"], ["<strong>E<\/strong>", "Ejection fraction", "Very low EF (&lt; 20%)"], ["<strong>D<\/strong>", "Defibrillator shocks", "Recurrent shocks/ATP for VT/VF"], ["<strong>H<\/strong>", "Hospitalizations", "≥ 2 HF hospitalizations in 12 months"], ["<strong>E<\/strong>", "Edema / escalating diuretics", "Persistent edema or frequent diuretic dose adjustments"], ["<strong>L<\/strong>", "Low blood pressure", "Consistently low SBP (&lt; 90 mm Hg)"], ["<strong>P<\/strong>", "Prognostic medications", "Need to reduce / inability to uptitrate goal-directed therapies"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Advanced HF<br/>I NEED HELP markers\"] --> B[\"Refer to advanced HF centre\"]\n B --> C{\"Wants advanced options?\"}\n C -->|\"No\"| H[\"Palliation<br/>inotropes for symptoms\"]\n C -->|\"Yes\"| D{\"Advanced enough?<br/>CPET, invasive hemodynamics\"}\n D -->|\"Yes\"| E{\"Contraindications?<br/>comorbidity, psychosocial,<br/>immunologic, surgical, age\"}\n E -->|\"None\"| F[\"Transplant listing<br/>VAD or inotropes as bridge\"]\n E -->|\"Present\"| G[\"VAD as destination therapy\"]\n D -->|\"No\"| I[\"Continue medical therapy\"]"}, {"t": "table", "cols": ["Axial flow", "Centrifugal flow"], "rows": [["Blood travels in the same direction as the rotor's orientation", "Blood enters perpendicular to the rotor's orientation"], ["Blood can contact static devices – stators", "Rotor need not contact any static surface – magnetic levitation"], ["Less sensitive to physiological factors like afterload", "More sensitive to afterload changes because of the 90° entry"], ["May provide better ventricular offloading", "Physiological changes affect the device's ability to offload"]]}]}, {"id": "cardio-w5-01", "num": "01", "name": "Mechanism of Arrhythmia", "title": "Mechanisms of Arrhythmia", "framing": "<p>Every arrhythmia is a failure of one of two functions – <strong>impulse initiation<\/strong> or <strong>impulse conduction<\/strong>. Failure of either gives bradycardia; abnormal excess of either (automaticity, triggered activity, re-entry) gives tachycardia.<\/p>", "week": 5, "weekLabel": "Week 5 - Arrhythmias, Syncope & Atrial Fibrillation", "items": [{"t": "table", "cols": ["Pacemaker", "Rate", "ECG findings"], "rows": [["Sinus node", "40-90 bpm", "P waves before each QRS complex"], ["Atrium (abnormal)", "", ""], ["AV node and junction", "35-50 bpm", "Narrow regular QRS complex without a preceding P wave"], ["His-Purkinje", "20-40 bpm", "Wide regular QRS complex"], ["Ventricular (abnormal)", "&lt; 30 bpm", ""]], "lead": "<p><strong>Hierarchy of pacemaker automaticity<\/strong> – each lower site is slower.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Premature beat - PAC\"] --> B{\"Both limbs refractory?\"}\n B -->|\"Yes\"| C[\"No conduction\"]\n B -->|\"No\"| D[\"Blocks in limb with longer refractoriness<br/>uni-directional block\"]\n D --> E[\"Conducts slowly down the other limb\"]\n E --> F{\"Blocked limb recovered<br/>by the time impulse arrives?\"}\n F -->|\"No - conduction too fast\"| G[\"Still refractory<br/>no re-entry\"]\n F -->|\"Yes\"| H[\"Retrograde conduction up the blocked limb\"]\n H --> I[\"Circuit re-stimulates itself<br/>re-entrant tachycardia\"]"}, {"t": "table", "cols": ["Orthodromic AVRT (90%)", "Antidromic AVRT (10%)"], "rows": [["Uni-directionally blocked first beat comes <strong>down the AV node<\/strong> (slows conduction) and <strong>up the accessory pathway<\/strong>, back to the AV node", "Uni-directionally blocked first beat comes <strong>down the accessory pathway<\/strong> and up the AV node, opposite to normal conduction"], ["Conduction to the ventricle uses the AV node and His-Purkinje system", "Conduction to the ventricle uses the accessory pathway"], ["<strong>Narrow complex<\/strong> regular tachycardia", "<strong>Wide complex<\/strong> tachycardia"]]}, {"t": "table", "cols": ["Re-entrant rhythm", "Circuit", "QRS"], "rows": [["Orthodromic AVRT", "Down AV node, up accessory pathway", "Narrow, regular"], ["Antidromic AVRT", "Down accessory pathway, up AV node", "Wide"], ["AVNRT", "Two limbs within the AV node", "Narrow, regular"], ["Scar VT", "Through and around MI scar", "Wide, regular"]], "lead": "<p><strong>Re-entrant tachycardias at a glance<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Prolonged phase 3 K+ outflow<br/>long QT\"] --> B[\"Extended repolarization\"]\n B --> C[\"Na+ and Ca2+ channels recover\"]\n C --> D[\"New inward current before<br/>repolarization completes\"]\n D --> E[\"Early afterdepolarization\"]\n E --> F[\"Repetitive depolarizations\"]\n F --> G[\"Torsades de Pointes<br/>polymorphic VT\"]\n H[\"Bradycardia or pauses\"] --> G"}]}, {"id": "cardio-w5-02", "num": "02", "name": "Bradycardia", "title": "Bradycardia", "framing": "<p>Bradycardia is either a <strong>battery<\/strong> problem (sinus node dysfunction – too few P waves) or a <strong>wiring<\/strong> problem (AV block – P waves without QRS). Whether to pace depends on <strong>mortality risk<\/strong> and <strong>symptoms<\/strong>, not the heart rate alone.<\/p>", "week": 5, "weekLabel": "Week 5 - Arrhythmias, Syncope & Atrial Fibrillation", "items": [{"t": "table", "cols": ["Degree", "Definition", "Features"], "rows": [["<strong>1st degree<\/strong>", "PR interval &gt; 200 ms", "All P waves are conducted"], ["<strong>2nd degree<\/strong>", "At least 1 non-conducted P wave; more P waves than QRS", "Group beating: QRS complexes appear bunched in groups<br>Site of block: AV node or infra-nodal; pacemaker likely indicated"], ["", "Mobitz I (Wenckebach)", "Gradual PR prolongation before the block"], ["", "Mobitz II", "No PR prolongation preceding the block"], ["", "2:1 AV block", "Every second P wave non-conducted; no consecutive PR intervals to judge whether they prolong or are fixed"], ["<strong>3rd degree<\/strong> (complete)", "No conducted P waves; more P waves than QRS", "AV dissociation – QRS regular, PR variable<br>Regular escape rhythm: junctional (narrow QRS) or ventricular (wide QRS)<br>Site: AV node (&gt; 40 bpm) or infra-nodal (&lt; 40 bpm)"], ["", "AF with complete AV block", "<strong>Regular<\/strong> QRS with fibrillatory waves at baseline (AF is normally irregularly irregular)"]], "lead": "<p><strong>Degrees of AV block<\/strong><\/p>"}, {"t": "table", "cols": ["Block", "ECG sign"], "rows": [["Left bundle branch block", "Wide QRS, <strong>negative<\/strong> in V1"], ["Right bundle branch block", "Wide QRS, <strong>positive<\/strong> in V1"], ["Left anterior fascicular block", "Left axis deviation"], ["Left posterior fascicular block", "Right axis deviation"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Bradycardia\"] --> B{\"Mobitz II or<br/>3rd degree AV block?\"}\n B -->|\"Yes\"| C[\"Treat for mortality<br/>risk of sudden death<br/>pacemaker even if asymptomatic\"]\n B -->|\"No\"| D{\"Symptomatic?\"}\n D -->|\"Yes\"| E[\"Treat for morbidity<br/>e.g. sick sinus syndrome, symptomatic Mobitz I\"]\n D -->|\"No\"| F[\"No treatment<br/>sinus brady, pauses, Mobitz I,<br/>1st degree block, BBB\"]\n C --> G[\"Acute: atropine, isoproterenol,<br/>temporary pacing\"]\n E --> G\n G --> H[\"Chronic: permanent pacemaker\"]"}, {"t": "table", "cols": ["Acute treatment", "Chronic treatment"], "rows": [["<strong>IV atropine<\/strong> (anticholinergic): ↑ HR, improves conduction", "<strong>Permanent pacemaker<\/strong>"], ["<strong>IV isoproterenol<\/strong> (sympathomimetic): ↑ HR, improves conduction", "Wire passed through L subclavian vein, SVC, tricuspid valve, into RA and/or RV"], ["<strong>Temporary transcutaneous pacing<\/strong>: pads stimulate the heart through the chest wall", "Attached to a generator housing a battery and computer chip"], ["<strong>Temporary transvenous pacing wire<\/strong>: through the jugular vein into the RV", "ECG: sharp spikes followed by a wide QRS"]]}]}, {"id": "cardio-w5-03", "num": "03", "name": "Syncope", "title": "Syncope", "framing": "<p>Syncope is transient LOC from reduced cerebral blood flow. Most is <strong>benign reflex (vasovagal) syncope<\/strong>; the job is to find the minority with <strong>cardiac syncope<\/strong>, which carries the worst prognosis, and the history does most of that sorting.<\/p>", "week": 5, "weekLabel": "Week 5 - Arrhythmias, Syncope & Atrial Fibrillation", "items": [{"t": "table", "cols": ["Category", "Cause", "Notes"], "rows": [["<strong>Reflex syncope (75%)<\/strong><br>neurally-mediated / neurocardiogenic", "Vasovagal (75%)", "Usually structurally normal hearts, otherwise healthy; any age"], ["", "Situational", "Vasovagal variant with a recognized trigger – micturition, cough, pain"], ["", "Orthostatic", "Postural tachycardia syndrome, postural hypotension"], ["", "Carotid sinus hypersensitivity", "Baroreceptors in the carotid vasculature become stimulated"], ["<strong>Cardiac syncope (15%)<\/strong><br>worst prognosis", "Structural/obstructive (1%)", "Aortic stenosis, hypertrophic obstructive cardiomyopathy, cardiac tumours"], ["", "Arrhythmia (25%)", "Bradycardia, tachycardia"], ["<strong>Neurologic<\/strong>", "Seizure", "Can mimic syncope"], ["", "CVA or TIA (affecting RAS)", ""], ["", "Intracranial hemorrhage", ""], ["<strong>Other<\/strong>", "Metabolic", "Hypoglycemia, hypoxia"], ["", "Pulmonary embolus", ""], ["", "Psychogenic (factitious)", ""]], "lead": "<p><strong>Differential diagnosis of syncope<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Standing<br/>↓ venous return, ↓ CO\"] --> B[\"Baroreceptor stimulation<br/>↑ SNS output\"]\n B --> C[\"↑ HR, ↑ SVR\"]\n C --> D[\"↑ Vagal output<br/>brainstem\"]\n D --> E[\"↓ HR, ↓ SVR\"]\n E --> F[\"↓ BP\"]\n F --> G[\"Presyncope or syncope\"]"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Transient LOC\"] --> B[\"Confirm LOC<br/>not a fall, trip, dizziness\"]\n B --> C[\"History: circumstances, prodrome,<br/>post-drome, witnesses, PMHx, FHx\"]\n C --> D{\"Red flags?<br/>exertional, sudden, structural disease,<br/>abnormal ECG, FHx sudden death\"}\n D -->|\"No - typical trigger and prodrome\"| E[\"Vasovagal<br/>reassure, salt and water, avoid triggers\"]\n D -->|\"Yes\"| F[\"Initial screening<br/>bloodwork, ECG, echo\"]\n F --> G[\"Ambulatory monitoring<br/>symptom-rhythm correlation\"]\n G --> H[\"Provocation<br/>tilt, stress test, EP study\"]\n H --> I[\"Treat underlying cause<br/>surgery, pacemaker, ablation, ICD\"]"}, {"t": "table", "cols": ["Step", "Vasovagal syncope"], "rows": [["<strong>Hx<\/strong>", "<strong>Common situations<\/strong>: post-prandial, warm day, prolonged standing; post-exertion, post-cough, post-micturition; triggered by pain, anxiety, stress, illness<br><strong>Prodrome<\/strong> (seconds-hours before): fatigue, weakness, nausea, sweating, pallor, visual disturbance, abdominal discomfort<br><strong>Post-episode<\/strong>: fatigue, malaise – whereas cardiac syncope with heart block may feel back to normal after the episode"], ["<strong>ECG<\/strong>", "Absence of QRS complexes – the heart is affected by the vasovagal reflex, it does not cause it<br>Parasympathetic tone hits the sinus node and AV node at the same time: sinus node → P waves slow; AV node → Wenckebach or AV block<br><strong>Simultaneous sinus slowing and heart block is diagnostic of a vasovagal reflex<\/strong>"], ["<strong>Tilt table<\/strong>", "Vasovagal reflex ↓ systemic vascular resistance → BP falls<br><strong>Pure vasodepressor<\/strong> – HR stays stable<br><strong>Cardioinhibitory/mixed<\/strong> – HR also drops"], ["<strong>Lifestyle<\/strong>", "Reassurance – VVS is generally benign (simply a bodily reflex)<br>Salt (electrolytes) and water (hydration)<br>Trigger avoidance"], ["<strong>Counter-pressure<\/strong>", "Feeling a prodrome – do NOT stand to “walk it off”; sit/lie down<br>Squeeze/cross the legs to increase perfusion to the brain"], ["<strong>Drugs<\/strong>", "Beta blockers – block the SNS overdrive that leads to the reflex PNS surge<br>Fludrocortisone – retains salt in the kidney, ↑ BP<br>Midodrine – ↑ vascular resistance, ↑ BP"], ["<strong>Pacemaker<\/strong>", "Generally not warranted; rare instances – refractory patients, occupations where an event is high risk<br>Patients often still faint: pacing addresses only the cardioinhibitory component, not the vasodepressor component<br><strong>Surgical placebo is very effective at treating VVS<\/strong>"]], "lead": "<p><strong>Clinical presentation and management of vasovagal syncope (VVS)<\/strong><\/p>"}, {"t": "table", "cols": ["Step", "Cardiac syncope"], "rows": [["<strong>Initial screening<\/strong>", "Routine bloodwork<br>ECG<br>Echocardiogram; cardiac MRI or CT if high suspicion – structural heart disease increases the risk of malignant arrhythmia"], ["<strong>Ambulatory monitoring<\/strong>", "Patients are often seen AFTER the event – only useful if another episode occurs during monitoring<br><strong>Symptom-rhythm correlation<\/strong> diagnoses arrhythmic causes (brady, tachy); the patient keeps a symptom diary to compare with the rhythm<br>Monitors: Holter (24-48 h); external loop recorder; implantable loop recorder (2-3 year battery)"], ["<strong>Provocation<\/strong>", "Tilt test, stress test, drug infusions<br>Electrophysiology testing (invasive): catheters through the veins into the heart; stimulate and measure electrical activity; look for conduction disease or inducible tachycardia"], ["<strong>Management<\/strong>", "Treat the underlying cardiac condition:<br>Structural – surgical correction of the obstruction<br>Bradycardia – pacemaker<br>Tachycardia – medications, cardiac ablation, implantable defibrillator"]], "lead": "<p><strong>Clinical approach to cardiac syncope<\/strong><\/p>"}, {"t": "table", "cols": ["Red flag", "Why it matters"], "rows": [["<strong>Exertional syncope<\/strong>", "Fainting during exercise is NOT vasovagal – suggests cardiac causes; obstruction and arrhythmia can be provoked by exertion/↑ demand"], ["<strong>Aortic stenosis<\/strong>", "3-year survival after the onset of symptoms"], ["<strong>Hypertrophic cardiomyopathy<\/strong>", "Diagnosed by echocardiogram; cause of sudden death in otherwise healthy people"], ["<strong>Inherited arrhythmias<\/strong>", "FHx of sudden death can point to arrhythmia<br>Long QT syndrome → Torsades de Pointes – triggered by alarm clocks and swimming<br>Catecholaminergic polymorphic VT (bidirectional) – triggered by exercise"], ["<strong>Sudden syncope<\/strong>", "Ask “What was the last thing you remember before fainting?”<br>No memory of any problem = sudden syncope<br>Injury with the event often means it was sudden and they could not protect themselves<br>Feeling unwell beforehand is not sudden syncope"], ["<strong>Structural heart disease<\/strong>", "Known CAD, prior MI, poor LVEF"], ["<strong>Abnormal ECG<\/strong>", "Bradycardia risk: conduction disease – LBBB, RBBB, 1st degree AV block<br>Tachycardia risk: structural disease – Q waves, long QT, WPW (delta waves), Brugada syndrome"]], "lead": "<p><strong>Red flags that warrant additional investigation<\/strong><\/p>"}]}, {"id": "cardio-w5-04", "num": "04", "name": "Tachycardia", "title": "Tachycardia: SVT and VT", "framing": "<p>Tachycardia sorts first by <strong>QRS width<\/strong>: narrow = supraventricular (benign, no sudden death), wide = VT until proven otherwise (can cause collapse and sudden death). For SVT, the next question is whether it <strong>depends on the AV node<\/strong>.<\/p>", "week": 5, "weekLabel": "Week 5 - Arrhythmias, Syncope & Atrial Fibrillation", "items": [{"t": "table", "cols": ["Feature", "SVT", "VT"], "rows": [["QRS", "<strong>Narrow<\/strong> (&lt; 120 ms)", "<strong>Wide<\/strong>"], ["Origin", "Top chambers (atria) – activates both ventricles together via AV node and His-Purkinje", "Bottom chambers (ventricles)"], ["HR", "100-200 bpm", "100-200 bpm"], ["Prognosis", "Recurrent symptoms but <strong>NO sudden death<\/strong>; excellent prognosis", "Can cause <strong>hemodynamic collapse and sudden death<\/strong> if untreated"], ["Pitfall", "Can mimic VT if QRS is wide (bundle branch block)", ""]], "lead": "<p><strong>Supraventricular vs ventricular tachycardia<\/strong><\/p>"}, {"t": "head", "html": "<h5>Supraventricular tachycardia (SVT)<\/h5><p>SVTs are classified by whether the arrhythmia <strong>needs the AV node<\/strong> – which is what blocking the AV node (adenosine, vagal maneuvers) reveals.<\/p>"}, {"t": "table", "cols": ["Class", "Type", "Notes"], "rows": [["<strong>Sinus tachycardia<\/strong>", "Sinus", "Hyperthyroidism, fever, anemia, exercise"], ["<strong>Atrial tachycardia<\/strong><br>AV node <strong>independent<\/strong> – continues when the AV node is blocked", "Ectopic atrial tachycardia", ""], ["", "Atrial flutter", "P (flutter) waves continue to circulate"], ["", "Atrial fibrillation", "QRS complexes rapid and irregular"], ["<strong>Junctional re-entrant<\/strong><br>AV node <strong>dependent<\/strong> – terminates when the AV node is blocked", "AV node re-entry (AVNRT)", "Circuit localized within the AV node"], ["", "Atrioventricular re-entry (AVRT)", "Uses an accessory pathway"]], "lead": "<p><strong>Classification of SVT<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Narrow complex tachycardia\"] --> B[\"Block the AV node<br/>vagal maneuver or IV adenosine\"]\n B --> C{\"Arrhythmia terminates?\"}\n C -->|\"Yes\"| D[\"AV node dependent\"]\n D --> D1[\"AVNRT<br/>circuit within the AV node\"]\n D --> D2[\"AVRT<br/>accessory pathway\"]\n C -->|\"No - continues\"| E[\"AV node independent\"]\n E --> E1[\"Ectopic atrial tachycardia\"]\n E --> E2[\"Atrial flutter\"]\n E --> E3[\"Atrial fibrillation\"]"}, {"t": "table", "cols": ["Lead", "Sinus tachycardia", "Atrial tachycardia (likely LA)"], "rows": [["I", "SA node activates atrium R → L (+ P wave)", "Atrium activated L → R (– P wave)"], ["II", "Top → bottom (+ P wave)", "Bottom → top (– P wave)"], ["III", "Top → bottom (+ P wave)", "Bottom → top (– P wave)"]]}, {"t": "table", "cols": ["Acute management", "Chronic management"], "rows": [["<strong>AV node blockade<\/strong>:<br>Vagal maneuvers – carotid sinus massage<br><strong>IV adenosine<\/strong> – short-lasting, 10 seconds<br>IV verapamil, IV diltiazem – long-lasting<br>IV amiodarone", "No therapy if spells are infrequent and minimally symptomatic"], ["<strong>Restore sinus<\/strong>:<br>Cardioversion<br>Procainamide – slow atrium<br>Ibutilide – slow atrium", "Empirical drug therapy: beta blockers, CCB<br><strong>Catheter ablation<\/strong>: destroy the cardiac tissue contributing to the arrhythmia"]], "lead": "<p><strong>Clinical management of SVT<\/strong><\/p>"}, {"t": "table", "cols": ["ECG", "Rate", "Features"], "rows": [["Typical LBBB", "80 bpm", "Wide QRS; lateral leads: rabbit ears"], ["Typical RBBB", "75 bpm", "V1: R, S, R′; normal axis"], ["SVT with LBBB aberrancy", "200 bpm", "Small R, deep S wave; lateral leads: rabbit ears"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Wide complex tachycardia\"] --> B{\"Unstable or deteriorating?\"}\n B -->|\"Yes\"| C[\"Cardioversion\"]\n B -->|\"No - uncertain\"| D[\"IV adenosine<br/>establish AV dependency\"]\n D --> E{\"Terminates or slows?\"}\n E -->|\"Terminates\"| F[\"AV node dependent SVT<br/>with aberrancy or accessory pathway\"]\n E -->|\"No effect\"| G[\"Treat as VT<br/>VT does not stop with adenosine\"]\n G --> H[\"IV procainamide or lidocaine,<br/>amiodarone if refractory,<br/>cardiovert if uncertain\"]"}, {"t": "table", "cols": ["Acute management", "Chronic management"], "rows": [["IV adenosine to assist diagnosis if uncertain", "Oral antiarrhythmics (sotalol, propafenone, amiodarone)"], ["IV lidocaine – monomorphic ischemic VT", "Implantable defibrillator (ICD)"], ["IV procainamide – any monomorphic VT", "Catheter ablation"], ["IV amiodarone – refractory VT (polymorphic not related to QT syndrome) or VF", "Unique considerations for QT syndrome and other repolarization syndromes"], ["<strong>Cardioversion is always appropriate for deteriorating hemodynamics or uncertainty<\/strong>", ""]], "lead": "<p><strong>Clinical management of VT<\/strong><\/p>"}]}, {"id": "cardio-w5-05", "num": "05", "name": "Atrial Fibrillation", "title": "Atrial Fibrillation", "framing": "<p>AF is chaotic re-entry in the atria producing an irregularly irregular rhythm. It harms in three ways – <strong>stroke, rapid rate, lost atrial kick<\/strong> – and management matches each: <strong>anticoagulate, rate-control, rhythm-control<\/strong>.<\/p>", "week": 5, "weekLabel": "Week 5 - Arrhythmias, Syncope & Atrial Fibrillation", "items": [{"t": "table", "cols": ["Type", "Features"], "rows": [["<strong>Paroxysmal<\/strong>", "Highly symptomatic self-terminating episodes, minutes to hours<br>Patients are well when back in sinus rhythm"], ["<strong>Persistent<\/strong>", "Does not stop spontaneously – antiarrhythmic agents or DC cardioversion required"], ["<strong>Chronic (permanent)<\/strong>", "In AF all the time – agents slow the ventricular rate and control symptoms<br>No attempt is made to restore sinus rhythm"]], "lead": "<p><strong>Classification of patient presentation<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Atrial fibrillation<br/>chaotic atrial activation\"] --> B[\"1 Stasis of blood<br/>+ LA enlargement\"]\n A --> C[\"2 Rapid irregular<br/>ventricular rate 130-170\"]\n A --> D[\"3 Loss of atrial kick\"]\n B --> E[\"Clot → stroke, embolism\"]\n E --> F[\"Anticoagulation<br/>by CHADS2\"]\n C --> G[\"Palpitations, dyspnea,<br/>chest discomfort\"]\n G --> H[\"Rate control<br/>beta blocker, CCB, digoxin\"]\n D --> I[\"↓ LV filling and CO<br/>breathlessness, fatigue\"]\n I --> J[\"Rhythm control<br/>antiarrhythmics, DC cardioversion\"]"}, {"t": "table", "cols": ["CHADS2 item", "Points"], "rows": [["<strong>C<\/strong>HF", "1"], ["<strong>H<\/strong>ypertension", "1"], ["<strong>A<\/strong>ge &gt; 75 years", "1"], ["<strong>D<\/strong>iabetes", "1"], ["Prior <strong>S<\/strong>troke or TIA", "2"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Rhythm control planned\"] --> B{\"AF duration?\"}\n B -->|\"Under 48 hours\"| C[\"OK without anticoagulation\"]\n B -->|\"Over 48 hours or unknown\"| D[\"Rate control +<br/>3 weeks anticoagulation\"]\n C --> E[\"DC cardioversion<br/>propofol, 50-200 J synchronized\"]\n D --> E\n E --> F[\"Sinus rhythm\"]"}]}, {"id": "cardio-w5-06", "num": "06", "name": "Antiarrhythmic Therapies", "title": "Antiarrhythmic Pharmacology", "framing": "<p>Antiarrhythmics act on specific phases of the action potential (Vaughan Williams classes I-IV), and every one can also <strong>cause<\/strong> arrhythmias. Therapy starts with precipitating factors and a clear goal, not with the drug.<\/p>", "week": 5, "weekLabel": "Week 5 - Arrhythmias, Syncope & Atrial Fibrillation", "items": [{"t": "table", "cols": ["Class", "Drug", "Effects", "Clinical use"], "rows": [["<strong>I: Na+ channel blocker<\/strong><br>phase 0", "1a: Procainamide", "Prolongs AP duration – widens QRS<br>Active metabolite has class III action (prolonged QT)", "SVT<br>Convert AF to sinus<br>Ventricular arrhythmias"], ["", "1c: Lidocaine", "Caution: hepatic metabolism; half-life 1-2 hours<br>Toxicity: CNS toxicity, cardiovascular collapse", "VT (ischemia)<br>Local anesthetic"], ["<strong>II: Beta blockers<\/strong><br>phase 4", "Metoprolol", "Slows sinus rate, ↓ AV node conduction, modulates SNS", "Ischemic heart disease, systolic HF<br>↓ rate in AF"], ["<strong>III: K+ channel blocker<\/strong><br>phase 3", "Amiodarone", "Prolongs plateau – ↑ QT<br>Oral: long-term therapy, loading dose required<br>IV bolus: ↓ BP<br>Half-life 24+ hours; accumulates in tissue with half-life 2-6 months", "SVT<br>Ventricular arrhythmias<br>Emergency rate control in rapid AF"], ["", "Amiodarone adverse effects", "Not very proarrhythmic despite class III effect<br>Pulmonary toxicity – inflammation, fibrosis<br>Thyroid – hyper- or hypothyroidism<br>Corneal microdeposits, skin discoloration, GI effects, neuropathy", ""], ["", "Sotalol", "Prolongs repolarization – ↑ QT, can be proarrhythmic<br>↓ automaticity, slows AV node conduction", ""], ["<strong>IV: Ca2+ channel blocker<\/strong><br>phase 2", "Verapamil<br>Diltiazem", "IV bolus: acute situations, ↓ BP<br>Oral: long-term therapy; <strong>avoid in HF<\/strong>", "Supraventricular arrhythmias<br>Slow AV node conduction<br><strong>NOT for ventricular arrhythmias<\/strong>"]], "lead": "<p><strong>Vaughan Williams classification of antiarrhythmics<\/strong><\/p>"}, {"t": "table", "cols": ["", "Digoxin", "Adenosine"], "rows": [["Mechanism", "Inhibits Na+/K+ ATPase → ↑ intracellular Ca2+ → ↑ contractility<br>Indirect vagal effect ↓ intrinsic SA node rate", "Prolongs AV conduction – rapid but very short response"], ["Uses", "Rate control in AF, but: will not convert AF to sinus; poor rate control for recurrent AF; vagal effect is overcome by sympathetic outflow (ICU patients, exercise)<br>Possibly useful in sedentary patients", "Terminates a re-entrant arrhythmia (AVNRT) or diagnoses an SVT / regular monomorphic wide complex tachycardia<br>AV re-entry → converts to sinus<br>AF or sinus tachycardia → slows the rate"], ["How to give", "", "Try a vagal maneuver first<br>IV bolus, very quickly, with monitor and continuous ECG<br>If the first dose fails, repeat at double dose"], ["Adverse effects", "Toxicity may cause virtually any arrhythmia", "Bronchospasm in asthma/COPD<br>Flushing and possible chest pain – warn the patient"]]}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Arrhythmia\"] --> B{\"Is this patient...\"}\n B -->|\"Stable\"| C[\"Drugs\"]\n B -->|\"Unstable\"| D[\"Electricity<br/>cardioversion or defibrillation\"]\n B -->|\"Dead\"| E[\"CPR + electricity + drugs\"]\n C --> F[\"Then find and treat the cause\"]\n D --> F\n E --> F"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Collapse, unresponsive\"] --> B[\"Start CPR<br/>oxygen, attach monitor/defibrillator\"]\n B --> C{\"Check rhythm<br/>every 2 minutes\"}\n C -->|\"VF or pulseless VT\"| D[\"Shock\"]\n D --> E[\"Continue CPR\"]\n C -->|\"Not shockable\"| E\n E --> F[\"Epinephrine every 3-5 min<br/>amiodarone or lidocaine if refractory VF/pVT\"]\n F --> G[\"Advanced airway, capnography<br/>treat reversible causes Hs and Ts\"]\n G --> C\n C -->|\"ROSC\"| H[\"Post-cardiac arrest care\"]"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Tachyarrhythmia with pulse<br/>HR typically ≥150\"] --> B[\"Treat underlying cause<br/>airway, O2, monitor, IV, 12-lead\"]\n B --> C{\"Hypotension, altered mental status,<br/>shock, ischemic pain, acute HF?\"}\n C -->|\"Yes\"| D[\"Synchronized cardioversion<br/>adenosine if regular narrow\"]\n C -->|\"No\"| E{\"Wide QRS ≥ 0.12 s?\"}\n E -->|\"Yes\"| F[\"Adenosine only if regular and monomorphic<br/>antiarrhythmic infusion, expert consult\"]\n E -->|\"No\"| G[\"Vagal maneuvers, adenosine if regular<br/>beta blocker or CCB\"]\n D --> H[\"If refractory: underlying cause,<br/>higher energy, add antiarrhythmic\"]\n F --> H"}, {"t": "table", "cols": ["Drug", "Comment"], "rows": [["Adenosine", "Slows pre-existing AF, then wears off"], ["Verapamil", "Slows rate"], ["Diltiazem", "Slows rate"], ["Digoxin", "Slows rate, but needs a loading dose – not the best choice"], ["<strong>Metoprolol<\/strong>", "<strong>Already takes it chronically and tolerates it<\/strong>"], ["Amiodarone", "Slows rate"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Low K+\"] --> D[\"Prolonged QT\"]\n B[\"QT drugs<br/>methadone, haloperidol, levofloxacin\"] --> D\n D --> E[\"Torsades de Pointes\"]\n E --> F[\"Arrest: CPR + defibrillation\"]\n F --> G[\"ROSC: check baseline QT\"]\n G --> H[\"Mg2+, correct K+ slowly\"]\n G --> I[\"Stop QT drugs<br/>except methadone\"]\n G --> J[\"Increase baseline HR<br/>to shorten QT\"]"}, {"t": "table", "cols": ["TCA effect", "Consequence"], "rows": [["Na+ channel blockade (Q29)", "<strong>↑ QRS duration<\/strong>"], ["Muscarinic blockade (Q30)", "<strong>Dilated pupils (mydriasis)<\/strong>"], ["Alpha-receptor blockade (Q31)", "<strong>Hypotension<\/strong> – alpha receptors vasoconstrict; blockade → vasodilation"], ["GABA antagonism", "Seizures"]]}]}, {"id": "cardio-w5-in-class-ecg-review", "num": "—", "name": "In Class - ECG Review", "title": "ECG Review: New Atrial Fibrillation", "framing": "<p>A case of palpitations in a 65-year-old woman worked from ECG to management. The ECG settles the diagnosis (AF: narrow, irregularly irregular); management then rests on two principles – <strong>anticoagulation<\/strong> and <strong>rate vs rhythm control<\/strong>.<\/p>", "week": 5, "weekLabel": "Week 5 - Arrhythmias, Syncope & Atrial Fibrillation", "items": [{"t": "table", "cols": ["Option", "ECG clue"], "rows": [["<strong>a) Atrial fibrillation<\/strong> ✔", "Narrow complex and <strong>irregularly irregular<\/strong>"], ["b) Supraventricular tachycardia", "Narrow complex and regular"], ["c) Atrial flutter", "Flutter or “F waves” in the inferior leads"], ["d) Ventricular tachycardia", "Wide complex and regular"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"New AF, stable\"] --> B[\"CHADS2 score\"]\n B --> C[\"Anticoagulate if indicated\"]\n A --> D[\"Rate control<br/>beta blocker or CCB\"]\n A --> E{\"Cardioversion?\"}\n E --> F{\"Duration over 48 h or unknown<br/>and not anticoagulated?\"}\n F -->|\"No\"| G[\"Cardioversion can be considered\"]\n F -->|\"Yes\"| H{\"Hemodynamically unstable<br/>or thrombus excluded by TEE?\"}\n H -->|\"Yes\"| G\n H -->|\"No\"| I[\"Do not cardiovert<br/>anticoagulate and rate-control\"]"}]}]};</script>
