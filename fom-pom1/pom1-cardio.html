um culture<\/li><li><strong>ECG and CXR<\/strong>: may show conduction disease that can accompany abscess formation, or septic emboli<\/li><\/ul><h5>Echocardiography (as soon as possible once IE is suspected)<\/h5><ul><li>Evaluate valvular dysfunction, assess hemodynamic severity of valve lesions, assess underlying ventricular function, detect associated abnormalities (shunts)<\/li><li>Follow-up of patients with persistent or recurrent bacteremia or other clinical deterioration<\/li><li><strong>False negatives<\/strong> if vegetations are small or have already embolized<\/li><li>Warranted even when an associated condition already requires a protracted antimicrobial course (e.g. vertebral osteomyelitis)<\/li><\/ul>"}, {"t": "table", "cols": ["", "TTE", "TEE"], "rows": [["<strong>Role<\/strong>", "<strong>First diagnostic test<\/strong>", "Second line / complications"], ["<strong>Sensitivity<\/strong>", "70%", "&gt; 90% for valvular vegetation"], ["<strong>Specificity<\/strong>", "99+%", ""], ["<strong>Use when<\/strong>", "Suspected IE", "Negative or technically inadequate TTE with high clinical suspicion<br>Concern for intracardiac complications<br>Significant valvular regurgitation, to decide need for surgery<br>Cardiac device and persistent fever, even without new murmur or bacteremia"], ["<strong>Strength<\/strong>", "Non-invasive", "Superior for cardiac complications: abscess, leaflet perforation, aortic pseudoaneurysm, intracardiac fistula"]]}, {"t": "table", "cols": ["Major criteria", "Minor criteria"], "rows": [["<strong>Blood culture<\/strong> positive for IE with a typical organism from <strong>2 separate<\/strong> blood cultures", "Predisposing heart condition or IVDU"], ["<strong>Persistently positive<\/strong> blood cultures for any organism (at least 2 positive cultures of samples drawn &gt; 12 h apart)", "Fever ≥ 38°C"], ["Single positive blood culture for <em>Coxiella burnetii<\/em> or anti-phase I IgG antibody titer &gt; 1:800", "<strong>Vascular phenomena<\/strong>: arterial emboli, septic pulmonary infarcts, mycotic aneurysm, intracranial hemorrhage, conjunctival hemorrhages, Janeway lesions"], ["<strong>Echocardiogram<\/strong> positive for IE: vegetation, abscess, new partial dehiscence of a prosthetic valve, or new valve regurgitation", "<strong>Immunological phenomena<\/strong>: Osler nodes, Roth spots, rheumatoid factor, glomerulonephritis"], ["", "Microbiological evidence (incl. a positive blood culture) not meeting major criteria"]], "lead": "<p><strong>Modified Duke criteria<\/strong><\/p>"}, {"t": "table", "cols": ["Classification", "Requires"], "rows": [["<strong>Definite IE<\/strong>", "2 major, <strong>or<\/strong> 1 major + 3 minor, <strong>or<\/strong> 5 minor"], ["<strong>Possible IE<\/strong>", "1 major + 1 minor, <strong>or<\/strong> 3 minor"], ["<strong>IE rejected<\/strong>", "Firm alternative diagnosis present<br>Signs/symptoms resolve with 4 days of antibiotic therapy<br>No pathological evidence of IE at surgery (with 4 days of antibiotic therapy)<br>Criteria for possible IE not met"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Suspected IE\"] --> B[\"3 sets of blood cultures<br/>+ TTE\"]\n B --> C[\"Count Duke major and minor criteria\"]\n C --> D{\"2 major, 1 major + 3 minor,<br/>or 5 minor?\"}\n D -->|\"Yes\"| E[\"DEFINITE IE\"]\n D -->|\"No\"| F{\"1 major + 1 minor,<br/>or 3 minor?\"}\n F -->|\"Yes\"| G[\"POSSIBLE IE\"]\n F -->|\"No\"| H[\"IE REJECTED<br/>criteria for possible IE not met\"]\n G --> I{\"Firm alternative Dx, resolves with 4 days<br/>of antibiotics, or no IE at surgery?\"}\n I -->|\"Yes\"| H\n I -->|\"No\"| J[\"Treat as IE\"]\n E --> J"}, {"t": "head", "html": "<h5>Treatment: antibiotics<\/h5><ul><li><strong>6-12 weeks of IV antibiotics<\/strong><ul><li>Native valve endocarditis: IV vancomycin + IV cefepime<\/li><li>Prosthetic valve endocarditis: IV vancomycin + IV cefepime<\/li><li>Culture-negative endocarditis: IV vancomycin, IV ceftriaxone, IV gentamicin or doxycycline<\/li><\/ul><\/li><\/ul><h5>Treatment: indications for surgery<\/h5><ul><li><strong>Heart failure<\/strong>: valve dysfunction or intracardiac fistula causing pulmonary edema or cardiogenic shock<\/li><li><strong>Persistent infection<\/strong>: enlarging vegetation or persistent bacteremia despite appropriate antibiotic therapy<\/li><li><strong>Complication of infection<\/strong>: local uncontrolled infection resulting in abscess, heart block, or penetrating lesion<\/li><li><strong>Prevention of embolism<\/strong>: mobile vegetation <strong>&gt; 10 mm<\/strong>, especially on the anterior mitral leaflet and after a previous embolic episode<\/li><\/ul>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Possible or definite IE\"] --> B[\"6-12 weeks IV antibiotics\"]\n B --> C{\"Major ischemic stroke or<br/>intracranial hemorrhage?\"}\n C -->|\"Yes\"| D[\"Delay surgery at least 4 weeks\"]\n C -->|\"No\"| E{\"HF from valve dysfunction or fistula,<br/>resistant organism, heart block or abscess,<br/>persistent infection, relapsing PVE?\"}\n E -->|\"Yes\"| F[\"Early surgery\"]\n E -->|\"No\"| G{\"Mobile vegetation over 10 mm or<br/>recurrent emboli despite antibiotics?\"}\n G -->|\"Yes\"| H[\"Consider early surgery\"]\n G -->|\"No\"| I[\"Continue antibiotics<br/>reassess, consider repeat echo\"]"}, {"t": "head", "html": "<h5>Atherogenesis: the process of atherosclerotic plaque formation<\/h5><ul><li>An <strong>exaggerated repair process<\/strong> (long-term, low-grade inflammation)<\/li><li>Players: platelets, macrophages, endothelium, smooth muscle cells, extracellular matrix, lipids, growth factors, cytokines<\/li><\/ul><ol><li><strong>Chronic endothelial injury<\/strong>: hyperlipidemia, hypertension, smoking, homocysteine, hemodynamic factors, toxins, viruses, immune reactions<\/li><li><strong>Endothelial dysfunction<\/strong> (increased permeability, leukocyte adhesion); monocyte and platelet adhesion and emigration<\/li><li><strong>Smooth muscle emigration<\/strong> from media to intima; macrophage/histiocyte activation<\/li><li>Macrophages and smooth muscle cells <strong>engulf lipid<\/strong> (cholesterol derived from the blood) → <strong>fatty streaks<\/strong> (e.g. aorta), the precursor lesion of an atherosclerotic plaque<\/li><li><strong>Smooth muscle proliferation<\/strong>, collagen and other ECM deposition, extracellular lipid → <strong>raised plaques<\/strong><\/li><\/ol><p>Histology: <strong>foamy macrophages/histiocytes<\/strong> and <strong>cholesterol clefts<\/strong>.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Risk factors<br/>hyperlipidemia, HTN, smoking, homocysteine,<br/>hemodynamic, toxins, viruses, immune\"] --> B[\"1 Chronic endothelial injury\"]\n B --> C[\"2 Endothelial dysfunction<br/>permeability, leukocyte adhesion\"]\n C --> D[\"Monocyte and platelet adhesion<br/>and emigration\"]\n D --> E[\"3 Smooth muscle migrates media to intima<br/>macrophage activation\"]\n E --> F[\"4 Macrophages and SMCs engulf lipid<br/>foam cells\"]\n F --> G[\"Fatty streak<br/>precursor lesion\"]\n G --> H[\"5 SMC proliferation, collagen, ECM,<br/>extracellular lipid\"]\n H --> I[\"Raised fibrous plaque\"]\n I --> J[\"Complicated lesion<br/>rupture, thrombosis, hematoma\"]"}, {"t": "table", "cols": ["Major non-modifiable", "Major modifiable", "Others"], "rows": [["<strong>Older age<\/strong>: plaque development", "<strong>Hyperlipidemia<\/strong>: cholesterol", "Obesity"], ["<strong>Male<\/strong>: estrogen is protective", "<strong>Hypertension<\/strong>: hydrostatic pressure damage", "Physical inactivity"], ["<strong>Family history<\/strong>: 50-60s; polygenic", "<strong>Diabetes mellitus<\/strong>", "Stress/type A personality"], ["", "<strong>Smoking<\/strong>: chemicals absorbed", "Post-menopausal estrogen deficiency"], ["", "", "Alcohol: 1 drink is cardioprotective"], ["", "", "C-reactive protein"]], "lead": "<p><strong>Atherosclerosis risk factors<\/strong><\/p>"}, {"t": "head", "html": "<h5>Manifestations of atherosclerosis<\/h5><ul><li>Plaque tends to develop in areas of <strong>turbulent flow<\/strong> (e.g. the carotid bifurcation)<\/li><li>Atherothrombosis of the extra-cranial cerebral arteries can cause arterioembolic TIA or ischemic stroke (&lt; 25% of all ischemic strokes and TIA)<\/li><li>1-year CV event rates increase with the number of symptomatic disease locations: <strong>risk rises sharply with diffuse vascular disease<\/strong> (p &lt; 0.001)<\/li><\/ul>"}, {"t": "table", "cols": ["Site", "Clinical disease"], "rows": [["<strong>Heart<\/strong>", "Angina/myocardial infarct"], ["<strong>Brain<\/strong>", "TIA/cerebral infarct"], ["<strong>Extremities<\/strong>", "Claudication (pain with walking)/gangrene (necrosis of tissue)"], ["<strong>Intestine<\/strong>", "Ischemic gut (mesenteric vessel disease)"], ["<strong>Kidney<\/strong>", "Cholesterol emboli (atheroemboli to kidney)"], ["<strong>Aorta<\/strong>", "Abdominal aneurysm"]], "lead": "<p><strong>Arteriopathy<\/strong>: potential for multi-organ involvement.<\/p>"}]}, {"id": "cardio-w3-04", "num": "04", "name": "Myocardial Infarction", "title": "Coronary Artery Disease, Myocardial Infarction & Complications of Acute MI", "framing": "<p>Coronary atherosclerosis becomes an emergency when a <strong>vulnerable plaque ruptures and thrombus forms<\/strong>: an occlusive thrombus gives a STEMI (reperfuse now), a non-occlusive one an NSTEMI (stabilize, then angiography). The note then follows the damage through healing and its complications, and closes with aortic aneurysm and dissection.<\/p>", "week": 3, "weekLabel": "Week 3 - Ischemic Heart Disease & Vascular Pathology", "items": [{"t": "table", "cols": ["Pattern", "Stenosis", "Vessels"], "rows": [["<strong>Left main coronary stenosis<\/strong> – “widow maker”", "&gt; 50%", "Left main"], ["<strong>Left main equivalent<\/strong>", "&gt; 70%", "Proximal LAD + circumflex"], ["<strong>Triple vessel disease<\/strong>", "&gt; 70%", "LAD + circumflex + RCA"], ["<strong>Double vessel disease<\/strong>", "&gt; 70%", "Proximal LAD + circumflex or RCA"]], "lead": "<p><strong>High-risk anatomic patterns<\/strong> – the thresholds that define them differ: 50% for left main, 70% elsewhere.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Harvest conduit<br/>saphenous vein endoscopically,<br/>radial or internal thoracic artery\"] --> B[\"Median sternotomy\"]\n B --> C[\"Take down internal thoracic artery<br/>left attached proximally\"]\n C --> D[\"Open pericardium<br/>aortic arterial cannula + atrial venous cannula\"]\n D --> E[\"On heart-lung machine<br/>cross-clamp aorta\"]\n E --> F[\"Arrest heart<br/>high-potassium cardioplegia\"]\n F --> G[\"Distal anastomoses<br/>8-0 prolene; check with flow probe\"]\n G --> H[\"Proximal vein/radial grafts to aorta<br/>6-0 prolene\"]\n H --> I[\"Remove cross-clamp<br/>coronaries + grafts reperfused\"]\n I --> J[\"Wean bypass, remove cannulas<br/>tighten purse strings\"]\n J --> K[\"Protamine reverses heparin\"]\n K --> L[\"Wire sternum, close\"]"}, {"t": "table", "cols": ["Complication", "Details"], "rows": [["<strong>Cerebrovascular accident (CVA)<\/strong>", "<strong>Worst possible complication<\/strong> – risk of stroke during CABG, and aortic atherosclerosis, increase with age<br>Causes: emboli (ascending-aorta plaque compressed by the clamp embolizes on removal), hypotension, hypoxia<br>After a CVA: mortality 21%; 2-fold longer hospital stay; 6-fold more likely to be discharged to a nursing home"], ["<strong>Hemorrhage<\/strong>", "3% reoperation rate for hemorrhage<br>10% of blood transfusions go to cardiac surgery patients – 20% of cardiac patients use 80% of the blood products<br>Transfusion risks: older age, female, anemia, ASA, urgency, duration of CPB, recent thrombolytic therapy, reoperation, clopidogrel &lt; 4 days ago, glycoprotein IIb/IIIa inhibitors (abciximab; prevent platelet aggregation)<br>Transfusion in CABG is associated with <strong>reduced long-term survival<\/strong>"], ["<strong>Infection<\/strong>", "Any operation has a risk of infection<br>Common sites: pneumonia (10%), wound (10%), urinary tract (4%), <strong>mediastinitis (1.5%)<\/strong><br>• Mediastinitis: rare but devastating – mortality rises to 15-25%; reoperation with debridement and IV antibiotics for a minimum of 6 weeks<br>• Predictors: obesity, diabetes, previous cardiac surgery, significant post-operative bleeding, long operation, bilateral internal thoracic arteries (controversial)"], ["<strong>Myocardial infarction<\/strong>", "Listed as a complication (no further detail in the note)"], ["<strong>Neurocognitive changes<\/strong>", "70% have changes at 1 month and 30% at 9 months – all patients are the same at 6 years"]], "lead": "<p><strong>CABG morbidity<\/strong><\/p>"}, {"t": "table", "cols": ["", "Transmural", "Subendocardial"], "rows": [["Wall thickness", "&gt; 50%", "&lt; 50%"], ["ECG", "<strong>ST elevation, Q wave<\/strong>", "<strong>ST depression, non-Q wave<\/strong>"]]}, {"t": "table", "cols": ["Stage", "Processes", "Histology"], "rows": [["<strong>I: Ischemic injury<\/strong>", "Necrosis, hemorrhage", "Early MI: loss of banding in cardiomyocytes – probably a couple of days old<br>Cardiac enzymes rise as coagulation necrosis occurs and cell membranes become leaky"], ["<strong>II: Inflammation<\/strong>", "Vascular phase (vasodilation, edema); polymorphonuclear then mononuclear leukocytes", "Early coagulation necrosis with neutrophils arriving – <strong>12-24 h<\/strong><br>Fully developed coagulation necrosis with maximal neutrophil infiltrate – <strong>2-3 days<\/strong><br>Macrophages phagocytose dead muscle"], ["<strong>III: Granulation tissue<\/strong>", "Neovasculature; fibroblast proliferation producing collagen, proteoglycans and myofibroblasts", "Healing postero-lateral MI; dead muscle being replaced by fibrous tissue"], ["<strong>IV: Scar<\/strong>", "Collagen remodelling, loss of blood vessels", "Healed infarct / fibrous scar (turquoise collagen on connective-tissue stain) – <strong>3-6 months<\/strong><br>Large healed posterior-wall transmural MI scar"]], "lead": "<p><strong>Stages of MI healing<\/strong> – <strong>muscle does not regenerate<\/strong>; it is replaced by scar.<\/p>"}, {"t": "pathway", "mermaid": "flowchart LR\n A[\"Coronary occlusion\"] --> B[\"Stage I: ischemic injury<br/>irreversible after ~30 min<br/>necrosis, leaky membranes, enzymes rise\"]\n B --> C[\"Stage II: inflammation<br/>neutrophils 12-24 h<br/>maximal at 2-3 days\"]\n C --> D[\"Macrophages<br/>phagocytose dead muscle\"]\n D --> E[\"Stage III: granulation tissue<br/>neovessels, fibroblasts, collagen\"]\n E --> F[\"Stage IV: scar<br/>3-6 months<br/>no muscle regeneration\"]"}, {"t": "table", "cols": ["MI type", "Mechanism"], "rows": [["<strong>Type 1<\/strong>", "Plaque rupture/erosion with <strong>occlusive<\/strong> thrombus → <strong>STEMI<\/strong><br>Plaque rupture/erosion with <strong>non-occlusive<\/strong> thrombus → <strong>NSTEMI<\/strong>"], ["<strong>Type 2<\/strong>", "Atherosclerosis + oxygen supply/demand imbalance – e.g. a stenotic, fixed coronary lesion that cannot increase flow when demand rises"], ["", "Vasospasm or coronary microvascular dysfunction"], ["", "Non-atherosclerotic coronary dissection"], ["", "Oxygen supply/demand imbalance alone"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Coronary atherosclerosis\"] --> B{\"Plaque type?\"}\n B -->|\"fibrous, calcified\"| C[\"Stable plaque<br/>fixed stenosis\"]\n B -->|\"fibrofatty, thin cap,<br/>lipid core, inflamed\"| D[\"Vulnerable plaque\"]\n D -->|\"shear stress or<br/>inflammation\"| E[\"Plaque rupture/erosion<br/>+ thrombus\"]\n E --> F{\"Thrombus occlusive?\"}\n F -->|\"yes\"| G[\"Type 1 MI: STEMI<br/>transmural\"]\n F -->|\"no\"| H[\"Type 1 MI: NSTEMI<br/>subendocardial\"]\n C -->|\"demand rises or<br/>supply falls\"| I[\"Type 2 MI<br/>supply/demand imbalance\"]\n J[\"Vasospasm, dissection,<br/>embolus, cocaine\"] --> I\n G --> K[\"VT/VF: sudden cardiac death\"]"}, {"t": "table", "cols": ["Step", "Considerations"], "rows": [["<strong>Is the patient stable? Vitals?<\/strong>", "Airway, breathing, circulation; BP (SBP difference &gt; 20 mmHg between arms = think <strong>aortic dissection<\/strong>), HR (inferior MI = bradycardia, anterior MI = tachycardia), RR, temperature, O<sub>2<\/sub> saturation<br>Oxygen by face mask; cardiac and O<sub>2<\/sub>-saturation monitors; good IV access ×2<br>Treat sustained ventricular arrhythmia rapidly (ACLS protocol)<br><strong>ASA loading dose = 162-325 mg orally<\/strong> unless aortic dissection is being considered; rectal suppository if oral not feasible; <strong>clopidogrel<\/strong> if allergic"], ["<strong>Hx<\/strong>", "Presenting symptoms, PMHx, cardiac risk factors, medications, allergies"], ["", "<strong>Classic presentation<\/strong>: &gt; 15-30 min of crushing retrosternal chest pain or tightness – may radiate to shoulder, arm, forearm (L &gt; R); ± shortness of breath, diaphoresis, nausea/vomiting<br><strong>Other presentations<\/strong>: pain in other locations – back (think aortic dissection), neck/jaw, epigastrium; syncope or cardiac arrest – VT/VF (anterior MI), bradycardia (inferior MI); shock – low BP, reduced tissue perfusion; malaise – atypical presentation in older adults; <strong>silent – diabetic patients<\/strong>"], ["<strong>PEx<\/strong> (may be normal)", "Baseline neurologic function, particularly if fibrinolysis is planned<br>Heart failure: S3 or S4, JVD, pulmonary rales; signs of hemodynamic compromise<br>Pansystolic murmur (rare) – MR, ventricular septal rupture; exclude aortic dissection if an aortic-insufficiency murmur is heard<br>Pericardial rub is a late finding (&gt; 24 h)"], ["<strong>ECG<\/strong>", "<strong>12-lead ECG within 10 min of arrival<\/strong>; repeat every 10 min if non-diagnostic but suspicion remains high<br><strong>ST elevation<\/strong> – may have reciprocal ST depression in some leads; if ST segments are diffusely up across leads, think of other causes (pericarditis)<br><strong>Q waves<\/strong> develop if reperfusion is not established – indicate necrosis and are permanent; pathologic = &gt; 3 mm deep or &gt; 1/3 the height of the R wave"], ["<strong>Bloodwork<\/strong>", "Baseline cardiac biomarkers (troponin), electrolytes, coagulation studies, hemoglobin<br>Troponin may not be elevated/detectable for several hours after pain onset – <strong>do NOT wait for bloodwork to diagnose a STEMI<\/strong>"], ["<strong>DDx<\/strong>", "Consider the diagnosis: women, the elderly and patients with diabetes may have atypical presentations"], ["<strong>Dx<\/strong>", "Hx, PEx and ECG; presentation consistent with acute coronary syndrome (ACS)<br><strong>Criteria<\/strong>: ST elevation of 1 mm (0.1 mV) in 2 anatomically contiguous leads, 2 mm (0.2 mV) in V2 and V3, <strong>or new LBBB<\/strong><br>Complete occlusion: &gt; 90% thrombotic arterial occlusion (common) or primary vasospasm (rare)"]], "lead": "<p><strong>STEMI diagnostic pathway<\/strong><\/p>"}, {"t": "table", "cols": ["Situation", "Intervention"], "rows": [["Chest pain", "<strong>Nitroglycerin 0.4 mg SL ×3, q 5 min<\/strong>; add IV nitroglycerin for persistent chest discomfort, hypertension or HF – only if no hemodynamic compromise (hypotension or RV infarction)"], ["Beta blocker", "<strong>AVOID generally<\/strong>; only if hypertensive, no signs of HF, not at high risk of HF, and no hemodynamic compromise, bradycardia or severe reactive airway disease – speak to a cardiologist first"], ["Persistent pain / anxiety", "<strong>Morphine 2-4 mg slow IV, q 5-15 min<\/strong>"], ["Left heart failure", "Afterload reduction – nitroglycerin SL and/or IV; loop diuretic (furosemide IV)"], ["Pulmonary edema", "Sit upright (reduce preload); furosemide 40-120 mg IV ± Foley catheter; morphine 2-4 mg IV q 5-10 min; consider BiPAP"], ["Tachycardic + high BP", "Metoprolol IV – can result in shock; speak to a cardiologist first"]], "lead": "<p><strong>STEMI initial interventions<\/strong> (after ASA)<\/p>"}, {"t": "table", "cols": ["Pain to reperfusion", "Benefit"], "rows": [["Within 1 h", "<strong>Maximal<\/strong> – may abort the necrosis"], ["Within 6 h", "Significant – reduces the amount of necrosis"], ["Within 12 h", "Moderate – may reduce the amount of necrosis"], ["12-24 h", "Mild – may affect prognosis (case-by-case assessment)"], ["&gt; 24 h", "Generally none"]], "lead": "<p><strong>STEMI management: reperfusion.<\/strong> Re-establishing effective flow relieves pain, preserves myocardium and saves lives – benefit depends on time from pain onset.<\/p>"}, {"t": "table", "cols": ["Absolute", "Relative"], "rows": [["Prior intracranial bleed<br>Intracranial malignancy<br>Ischemic stroke within 3 months<br>Closed head or facial trauma within 3 months<br>Active bleeding (except menses)<br>Aortic dissection or acute pericarditis", "BP &gt; 180/110 mmHg<br>Ischemic stroke &gt; 3 months ago or other intracranial pathology<br>Major surgery &lt; 3 weeks or recent internal bleeding (2-4 weeks)<br>Prolonged CPR &gt; 10 min or puncture of a non-compressible vascular structure<br>Active peptic ulcer<br>Prior streptokinase use or allergy (use TNK or tPA)<br>Pregnancy<br>Therapeutic anticoagulation (coumadin)"]], "lead": "<p><strong>Contraindications to thrombolytics<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Suspected ACS\"] --> B[\"Stabilize: ABC, vitals, O2, monitors,<br/>IV x2, ACLS for VT/VF\"]\n B --> C[\"ASA 162-325 mg PO<br/>unless dissection suspected\"]\n C --> D[\"12-lead ECG within 10 min<br/>+ Hx, PEx, troponin drawn\"]\n D --> E{\"ST elevation in 2 contiguous leads<br/>or new LBBB?\"}\n E -->|\"no\"| N[\"Repeat ECG q 10 min<br/>NSTEMI pathway\"]\n E -->|\"yes: STEMI<br/>do not wait for troponin\"| F[\"Nitro, morphine; 2nd antiplatelet\"]\n F --> G{\"Primary PCI available<br/>without delay?\"}\n G -->|\"yes\"| H[\"Primary PCI<br/>gold standard\"]\n G -->|\"no\"| I{\"Fibrinolysis criteria met,<br/>no contraindication?\"}\n I -->|\"yes\"| J[\"Fibrinolysis + anticoagulation\"]\n I -->|\"no\"| H\n J --> K{\"Signs of reperfusion?<br/>pain eases, ST down 50%, AIVR\"}\n K -->|\"no\"| L[\"Rescue PCI\"]\n K -->|\"yes\"| M[\"Secondary prevention\"]\n H --> M"}, {"t": "table", "cols": ["Step", "Considerations"], "rows": [["<strong>Is the patient stable? Vitals?<\/strong>", "Airway, breathing, circulation; BP, HR, RR, temperature, O<sub>2<\/sub> saturation"], ["<strong>Hx and PEx<\/strong>", "Same as STEMI"], ["<strong>Ix<\/strong>", "ECG may be completely normal (normal ST segments and T waves), or show <strong>ST depression<\/strong> or <strong>T wave inversion<\/strong>; few develop Q waves"], ["<strong>Prognosis<\/strong>", "Early mortality less than STEMI; <strong>6-month mortality is equivalent<\/strong><br>Patients: older, previous MI, multivessel disease, prone to re-infarction"], ["<strong>Dx<\/strong>", "Hx, ECG, <strong>rise and fall in troponin<\/strong><br>Partial occlusion: thrombus (common) and/or impaired supply/demand"], ["<strong>Management<\/strong>", "<strong>Less urgency – no immediate reperfusion therapy needed<\/strong><br><strong>Control the ischemia<\/strong>: bed rest, oxygen, nitrates, morphine, beta blockers, calcium channel blockers, ACEI<br><strong>Pacify the plaque<\/strong> with antiplatelet + anticoagulant therapy to prevent thrombus propagation: ASA + second antiplatelet (clopidogrel, ticagrelor); unfractionated IV heparin, LMWH (enoxaparin), fondaparinux, or thrombin inhibitor (bivalirudin) for 48-72 h<br><strong>Correct aggravating factors<\/strong>: hypoxia, anemia, hypotension<br><strong>Risk stratification<\/strong> → <strong>angiography within 24-48 h<\/strong>, then revascularization as appropriate (angioplasty/stent or CABG) – aim is to define anatomy with a view to revascularization<br>Earlier for higher risk: marked ECG change (ST deviation), elevated troponin, ongoing pain, pulmonary edema or hypotension"]], "lead": "<p><strong>NSTEMI diagnostic pathway<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Suspected ACS, no ST elevation\"] --> B[\"Stabilize: ABC, vitals\"]\n B --> C[\"Hx + PEx as for STEMI\"]\n C --> D[\"ECG: normal, ST depression<br/>or T wave inversion\"]\n D --> E{\"Troponin rise and fall?\"}\n E -->|\"yes\"| F[\"NSTEMI<br/>partial occlusion or supply/demand\"]\n F --> G[\"Control ischemia<br/>nitrates, beta blocker, O2, morphine\"]\n F --> H[\"Pacify plaque<br/>ASA + 2nd antiplatelet + anticoagulant 48-72 h\"]\n F --> I[\"Correct hypoxia, anemia, hypotension\"]\n G --> J[\"Risk stratification\"]\n H --> J\n I --> J\n J -->|\"high risk: ST deviation, troponin,<br/>ongoing pain, edema, hypotension\"| K[\"Earlier angiography\"]\n J -->|\"others\"| L[\"Angiography within 24-48 h\"]\n K --> M[\"Revascularize: PCI or CABG\"]\n L --> M"}, {"t": "table", "cols": ["Therapy", "Recommendation"], "rows": [["<strong>ASA<\/strong><br>UA, NSTEMI, STEMI", "Loading 162-325 mg; maintenance <strong>81-162 mg/day indefinitely<\/strong><br>With ticagrelor, ASA dose = 75-100 mg"], ["<strong>Clopidogrel<\/strong> (with ASA)<br>UA, NSTEMI, STEMI", "Loading 300 mg, or 600 mg if invasive strategy within 24 h<br>Maintenance 75 mg daily for <strong>12 months<\/strong>, regardless of PCI/stent"], ["<strong>Ticagrelor<\/strong> (with ASA)<br>UA, NSTEMI, STEMI", "Loading 180 mg; maintenance 90 mg bid for <strong>12 months<\/strong>, regardless of PCI/stent<br>Potential negative interaction with high-dose ASA<br><strong>Dyspnea in 14%<\/strong> – often mild-moderate, transient; resolves within 1 week in 33%<br>Caution if at risk of bradycardia – 2nd/3rd-degree AV block, sick sinus syndrome"], ["<strong>Beta-blockers<\/strong>", "Start within 12-24 h in all MI patients without contraindications; continue during and after hospitalization<br>↓ myocardial O<sub>2<\/sub> demand: ↓ HR, ↓ systemic BP (afterload), ↓ contractility<br>↑ O<sub>2<\/sub> delivery: ↓ HR prolongs diastole → more coronary perfusion time<br>Reduce recurrent ischemia and re-infarction – anti-ischemic, anti-arrhythmic, anti-hypertensive<br>Long-term mortality benefit for at least 2-3 years post-MI"], ["<strong>ACE inhibitors<\/strong>", "Start within 24 h in all MI patients without contraindications – especially anterior MI, HF, EF ≤ 40%<br>Start low (avoid hypotension) and titrate to an evidence-based dose<br>ARB if indicated but ACEI-intolerant<br>↓ mortality after MI, slow progression to HF, ↓ infarct expansion/LV dilatation"], ["<strong>Aldosterone antagonists<\/strong>", "Consider if already on ACEI + beta blocker, EF ≤ 40%, symptomatic HF or diabetes, and no contraindications<br>Start <strong>eplerenone<\/strong> within 3-12 days post-MI – expensive, but reduces death and repeat hospitalization"], ["<strong>Lipids<\/strong>", "Fasting lipid profile, preferably within 24 h of presentation<br><strong>High-intensity statin in all patients, even with normal cholesterol<\/strong> (no contraindications)<br>Target <strong>LDL-C &lt; 1.8 mmol/L<\/strong> (&lt; 70 mg/dL)"], ["<strong>Lifestyle<\/strong>", "Exercise-based cardiac rehabilitation/secondary prevention programs<br>Risk-factor management: diabetes, hypertension, lipids, smoking cessation<br>Clear care plan promoting medication adherence and timely follow-up; diet and physical-activity advice<br><strong>Driving<\/strong>: not permitted for 1 month post-MI; commercial driving not permitted for 3 months"]], "lead": "<p><strong>Recommended medical management for secondary prevention post-MI<\/strong><\/p>"}, {"t": "table", "cols": ["Type", "Complication", "Features and treatment"], "rows": [["<strong>Ischemic<\/strong>", "<strong>Ischemia<\/strong>", "Seen in untreated multivessel CAD<br>Failed PCI: stent thrombosis; failed CABG: graft occlusion (high troponin rise, significant ECG changes)<br>Repeat catheterization/PCI/CABG"], ["", "<strong>RV infarction<\/strong>", "Higher risk of CHF and death<br>Acute <strong>inferior MI – proximal RCA<\/strong><br><strong>Triad: hypotension, JVD, clear lungs<\/strong><br>ECG: <strong>V4R ST elevation<\/strong><br>Treatment: IV fluids, PCI of RCA; <strong>avoid nitroglycerin<\/strong><br>RV function resolves in 2-3 days"], ["<strong>Mechanical<\/strong>", "<strong>Pulmonary edema / cardiogenic shock<\/strong>", "Anterior MI – proximal LAD; large MI (STEMI or NSTEMI)<br>1/3 of LV damaged – dyspnea, hypoxia<br>Early catheterization/revascularization<br>Treatment: furosemide (Lasix) IV, nitroglycerin IV, morphine IV"], ["", "<strong>Acute mitral regurgitation<\/strong>", "Inferior MI – papillary muscle ischemia or <strong>papillary muscle rupture (flail MV)<\/strong><br>• Anterolateral papillary muscle – LAD and circumflex<br>• Posteromedial papillary muscle – posterior interventricular artery<br>Also secondary to MV pathology or CHF<br><strong>Soft pansystolic murmur at apex<\/strong><br>Right heart catheterization: <strong>large V wave<\/strong> on PCWP tracing<br>Treatment: intra-aortic balloon pump, urgent cardiovascular surgery"], ["", "<strong>Ventricular septal rupture (VSR)<\/strong>", "Large transmural MI – late presentation (rare in the era of primary PCI)<br>• Apical: anterior MI – LAD<br>• Basal: inferior MI – RCA<br><strong>Harsh pansystolic murmur at left sternal border<\/strong><br>LV blood shunts into the RV, so <strong>RV O<sub>2<\/sub> saturation increases<\/strong><br>Results in CHF, pulmonary edema/cardiogenic shock<br>Treatment: IABP, mechanical support, intubation for CHF, urgent cardiovascular surgery, closure devices"], ["", "<strong>LV free wall rupture → cardiac tamponade<\/strong>", "Large transmural MI – late presentation (rare in the era of primary PCI)<br><strong>Hemopericardium<\/strong>: blood accumulates in the pericardial cavity<br>Usually fatal<br>Treatment (stat): echocardiogram, pericardiocentesis, surgical repair"], ["", "<strong>LV free wall rupture → LV pseudoaneurysm<\/strong>", "Large transmural MI – late presentation; contained rupture (see comparison below)"], ["", "<strong>LV aneurysm<\/strong>", "Large transmural MI – anterior &gt; inferior; see comparison below"], ["<strong>Arrhythmic<\/strong>", "<strong>Atrial arrhythmias / conduction<\/strong>", "Inferior MI: sinus bradycardia<br>Inferior MI: Mobitz I and II, 3rd degree – stable/reversible post-PCI; usually no temporary pacemaker needed<br>Anterior MI: Mobitz II – unstable/irreversible; temporary pacemaker, often permanent<br>CHF: sinus tachycardia<br>Atrial fibrillation"], ["", "<strong>Ventricular arrhythmias<\/strong>", "Asystole<br>Bundle branch block – LBBB/RBBB<br>VT/VF: electrical cardioversion, beta blocker/amiodarone<br>Monomorphic VT: days post-MI due to scarring – beta blocker/amiodarone, VT ablation/ICD<br><strong>Accelerated idioventricular rhythm (most common)<\/strong>: wide complex, HR 60-100 bpm; from reperfusion – no treatment"], ["<strong>Pericardial<\/strong>", "<strong>Post-MI pericarditis<\/strong>", "Pleuritic chest pain / pericardial rub<br><strong>Early<\/strong> (&lt; 5 days, transmural MI): high-dose ASA / colchicine<br><strong>Late (Dressler syndrome)<\/strong>: immunological – ASA/NSAIDs, colchicine"]], "lead": "<p><strong>Complications of acute MI<\/strong> – grouped by mechanism; the culprit artery predicts which to expect.<\/p>"}, {"t": "table", "cols": ["", "LV pseudoaneurysm", "LV aneurysm"], "rows": [["Type", "<strong>Mechanical<\/strong> complication – contained LV free-wall rupture", "<strong>Ischemic<\/strong> complication"], ["Wall", "Only 1 layer (pericardium) intact", "All 3 layers (endocardium, myocardium, pericardium)"], ["Neck", "<strong>Narrow<\/strong>", "<strong>Wide<\/strong> – systolic outward bulge"], ["Consequence", "LV rupture – fatal; cardiac tamponade", "LV thrombus (scarred, non-contracting tissue); ineffective pump; CHF"], ["Timing", "Early", "Late"], ["Imaging", "Echocardiogram / MRI", "Contrast echocardiogram / MRI / CT"], ["Treatment", "Surgical repair", "Anticoagulation (warfarin 3-6 months), LV aneurysmectomy, endocardial patch"]], "lead": "<p><strong>Pseudoaneurysm vs. true LV aneurysm<\/strong> (both after large transmural MI; timing from the early/late lists below)<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Acute MI\"] --> E[\"Early complications\"]\n A --> L[\"Late complications\"]\n E --> E1[\"Pulmonary edema /<br/>cardiogenic shock\"]\n E --> E2[\"RV infarction\"]\n E --> E3[\"VT / VF\"]\n E --> E4[\"Acute MR<br/>papillary muscle\"]\n E --> E5[\"VSR or LV free wall rupture<br/>tamponade, pseudoaneurysm\"]\n E --> E6[\"Early pericarditis<br/>under 5 days\"]\n L --> L1[\"Heart failure\"]\n L --> L2[\"LV aneurysm<br/>mural thrombus\"]\n L --> L3[\"Post-MI ischemia\"]\n L --> L4[\"Dressler syndrome\"]"}, {"t": "table", "cols": ["Killip class", "Findings"], "rows": [["I", "No evidence of CHF"], ["IIa", "JVD, crackles &lt; 50%, no S3"], ["IIb", "JVD, crackles &lt; 50%, S3"], ["III", "Crackles &gt; 50%"], ["IV", "Shock – SBP &lt; 90, cold extremities"]], "lead": "<p><strong>Killip classification<\/strong> of heart failure after MI<\/p>"}, {"t": "table", "cols": ["Axis", "Type", "Description"], "rows": [["<strong>Wall layers involved<\/strong>", "<strong>True aneurysm<\/strong>", "Involves all three layers of the arterial wall"], ["", "<strong>Pseudoaneurysm<\/strong> (false)", "Localized disruption of the arterial wall walled off by adventitia and/or perivascular connective tissue/inflammation; often <strong>saccular<\/strong>"], ["<strong>Morphology<\/strong>", "<strong>Saccular<\/strong>", "Bulges out on only one side of the wall; often <strong>secondary to trauma or infection<\/strong>"], ["", "<strong>Fusiform<\/strong> (most common)", "Bulges out on all sides; often <strong>degenerative<\/strong>"], ["<strong>Cause<\/strong>", "<strong>Degenerative / atherosclerotic<\/strong> (most common)", "Major vessels – aorta, iliac arteries<br>Slow growing over years – older adults, typically <strong>asymptomatic<\/strong><br>Atherosclerotic risk factors – cigarette smoking (upregulates collagenase), hypertension, inflammation<br>Genetic susceptibility – matrix metalloproteinases (MMP-9; collagen degradation)"], ["", "<strong>Infectious<\/strong>", "Arterial infection breaks down the wall → aneurysm; often pseudoaneurysms with saccular morphology"], ["", "<strong>Traumatic<\/strong>", "Most common aortic location: just beyond the <strong>left subclavian artery<\/strong>; often shearing stress in a high-velocity motor vehicle accident"], ["", "<strong>Inflammatory<\/strong>", "Giant cell arteritis, Takayasu disease"], ["", "<strong>Post-dissection<\/strong>", "—"], ["", "<strong>Connective tissue<\/strong>", "<strong>Marfan syndrome<\/strong>: autosomal dominant; fibrillin defect (scaffold for elastin)<br>Tall, long limbs/fingers, pectus excavatum, joint laxity, lens subluxation<br>Mitral valve prolapse; aortic root dilation/aortic incompetence; aortic dissection"]], "lead": "<p><strong>Aneurysm classification<\/strong><\/p>"}, {"t": "table", "cols": ["Scheme", "Basis"], "rows": [["<strong>AAA classification<\/strong>", "Proximity to the renal arteries (suprarenal, pararenal, juxtarenal, infrarenal); closer = more difficult to treat"], ["<strong>Thoracoabdominal: Crawford<\/strong>", "Greater extent = more complex repair = higher risk of death or paraplegia"]], "lead": "<p><strong>Anatomic extent<\/strong><\/p>"}, {"t": "table", "cols": ["Topic", "Details"], "rows": [["<strong>Prevalence<\/strong>", "4-5% of men aged 50-79"], ["<strong>Risk factors<\/strong>", "Older age, male, <strong>FHx<\/strong>, Caucasian, hyperlipidemia, hypertension, <strong>smoking<\/strong>"], ["<strong>FHx<\/strong>", "15-25% of patients undergoing AAA repair have a 1st-degree relative with AAA<br>More likely in females, patients with multiple aneurysms, and younger presentations<br>Sibling risk: 7% for male probands, 12% for female probands"], ["<strong>Natural history<\/strong>", "<strong>Never regress<\/strong> – stay stable or grow slowly (<strong>1-3 mm/year<\/strong>)<br>The larger the aneurysm, the faster it grows<br>Saccular/pseudoaneurysms or aneurysms from a secondary cause grow faster and rupture at smaller sizes – <strong>repair regardless of size<\/strong>"], ["<strong>PEx<\/strong> (unreliable)", "Large aneurysms are obvious but often missed<br>Palpation detects only 50% of aneurysms 3.5-6 cm – very inaccurate for size"], ["<strong>Ix<\/strong>", "<strong>Ultrasound<\/strong>: good screening test; no anatomic detail; less accurate than CT (underestimates size by 5 mm)<br><strong>CT angiogram: gold standard<\/strong> – fine cuts (0.625 mm), anatomic detail, most accurate size, allows planning<br>Catheter angiography: not used – measures only luminal, not true diameter; little anatomic detail<br>MR angiography: not used much – long acquisition, risk of nephrotoxicity, poor at resolving calcification, underestimates size"], ["<strong>Screening<\/strong>", "One-time abdominal ultrasound: <strong>men 65-75<\/strong>; women with risk factors (FHx, smoking, atherosclerotic disease); men/women &gt; 55 with a 1st-degree relative<br>MASS trial: 4.9% had AAA &gt; 3 cm; 40% relative risk reduction in AAA mortality; number needed to screen to prevent 1 death = 276"], ["<strong>Management<\/strong>", "<strong>Prevent cardiovascular events<\/strong> (MI, stroke, death) – the leading cause of death during AAA surveillance, <strong>NOT rupture<\/strong><br>Risk-factor modification: smoking cessation, BP and cholesterol control<br>Doxycycline, <strong>statins<\/strong>, beta blockers, ACEI – equivocal evidence for slowing growth/preventing rupture<br>Most patients should be on ASA (or clopidogrel), statins, beta blockers and ACEI for CV risk reduction"]], "lead": "<p><strong>Abdominal aortic aneurysm (AAA)<\/strong><\/p>"}, {"t": "table", "cols": ["Diameter", "Rupture risk / year"], "rows": [["&lt; 5 cm", "&lt; 1%"], ["5.5 cm", "5-10%"], ["6-6.5 cm", "10-15%"], ["6.5-6.9 cm", "15-20%"], ["&gt; 7 cm", "30%"]], "lead": "<p><strong>Risk of rupture<\/strong> is best estimated by diameter.<\/p>"}, {"t": "table", "cols": ["", "Open repair", "EVAR"], "rows": [["Device", "Dacron vascular graft, manually sewn into the aorta; aneurysm excluded from circulation", "Stent placed by catheter under x-ray guidance"], ["Access", "Long abdominal incision", "Minimally invasive – patient preference; not all patients are candidates (anatomy)"], ["Perioperative mortality", "3-5%", "0.5-1%"], ["Major morbidity", "20-30%", "Minimal"], ["Hospital stay", "7 days", "1-2 days"], ["Follow-up", "No surveillance imaging", "Yearly surveillance imaging; 10-20% re-intervention risk; <strong>endoleaks<\/strong> (blood flow outside the graft within the sac)"], ["3-4 year mortality", "<strong>Equivalent<\/strong>", "<strong>Equivalent<\/strong>"]], "lead": "<p><strong>Open repair vs. endovascular repair (EVAR)<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Screening US or incidental AAA\"] --> B[\"CT angiogram for size and anatomy\"]\n B --> C{\"Indication for repair?<br/>men 5.5 cm or more, women 5 cm or more,<br/>growth over 1 cm per yr, symptoms,<br/>saccular, rupture\"}\n C -->|\"no, under 5 cm\"| D[\"Watch and wait<br/>yearly imaging\"]\n D --> E[\"CV risk reduction<br/>smoking cessation, ASA, statin,<br/>beta blocker, ACEI\"]\n D -->|\"reaches threshold\"| C\n C -->|\"yes\"| F{\"Fit for surgery and<br/>suitable anatomy?\"}\n F -->|\"suitable for EVAR<br/>or significant comorbidity\"| G[\"EVAR<br/>yearly surveillance, endoleaks\"]\n F -->|\"fit, anatomy unsuitable<br/>for standard EVAR\"| H[\"Open repair Dacron graft<br/>or fenestrated/branched device\"]\n F -->|\"unfit\"| I[\"Individualized:<br/>rupture risk vs life expectancy\"]"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Intimal tear\"] --> B[\"Blood separates wall layers<br/>true + false lumen\"]\n B --> C[\"Sudden sharp tearing chest pain<br/>radiating to back\"]\n C --> D{\"Stable?\"}\n D -->|\"yes\"| E[\"CT angiogram\"]\n D -->|\"no\"| F[\"TEE\"]\n E --> G{\"Where does the tear start?\"}\n F --> G\n G -->|\"ascending aorta\"| H[\"Type A<br/>surgical graft repair\"]\n G -->|\"descending aorta\"| I[\"Type B<br/>medical BP and HR control\"]\n H -.-> J[\"Rupture: hemopericardium<br/>tamponade\"]\n I -.-> K[\"Rupture: hemothorax or<br/>hemoretroperitoneum\"]\n B -.-> L[\"Extension: carotid = stroke,<br/>coronary = MI, double-barrel aorta\"]"}]}, {"id": "cardio-w3-06", "num": "06", "name": "Cardiac Rehab & Secondary Prevention", "title": "Cardiac Rehabilitation, Secondary Prevention and Peripheral Vascular Disease", "framing": "<p>What happens after the first vascular event: cardiac rehab and drugs to prevent the next one, then the limb version of the same disease. The organising idea: <strong>collaterals decide the presentation<\/strong> – an embolus into a normal artery is catastrophic, while slow atherosclerotic occlusion is often tolerated.<\/p>", "week": 3, "weekLabel": "Week 3 - Ischemic Heart Disease & Vascular Pathology", "items": [{"t": "table", "cols": ["Initial event", "Future risk of MI", "Future risk of stroke"], "rows": [["Stroke", "2–3×", "9×"], ["<strong>MI<\/strong>", "<strong>5–7×<\/strong>", "3–4×"], ["PVD", "2–3×", "2–3×"]], "lead": "<p><strong>Why secondary prevention matters<\/strong> – one vascular event multiplies the risk of the next.<\/p>"}, {"t": "table", "cols": ["Component", "Aerobic training", "Resistance training"], "rows": [["<strong>Warm-up<\/strong>", "≥ 5–10 min of cardiovascular and/or muscular endurance activity at a target HR of 20–35% of HRR", "—"], ["<strong>Frequency<\/strong>", "3–5×/week", "2–3×/week"], ["<strong>Intensity<\/strong>", "40–80% of HRR<br>50–80% VO2 max, HR max or HR reserve<br><strong>Target HR = (intensity factor) × (peak HR – rest HR) + rest HR<\/strong><br>Intensity factor: deconditioned → start at 50%, work up to 70%", "Upper body: 30–40% 1 RM<br>Lower body: 50–60% 1 RM"], ["<strong>Time<\/strong>", "20–40 minutes", "1–3 sets of 12–15 repetitions"], ["<strong>Type<\/strong>", "Aerobic training activities", "6–10 exercises for upper and lower body"], ["<strong>Cool-down<\/strong>", "≥ 5–10 min of cardiovascular and/or muscular endurance activity at a target HR &lt; 60% of HR max", "—"]], "lead": "<p><strong>Exercise prescription – F.I.T.T.<\/strong> (frequency, intensity, time, type) inside a warm-up and cool-down<\/p>"}, {"t": "table", "cols": ["", "Embolic", "Thrombotic"], "rows": [["<strong>Mechanism<\/strong>", "Anything that travels from one place to another in the bloodstream; lodges at an <strong>arterial bifurcation<\/strong>, where vessels naturally narrow", "Progressive atherosclerotic narrowing; <strong>robust collaterals develop<\/strong> as the atherosclerosis builds up"], ["<strong>Presentation<\/strong>", "<strong>Catastrophic<\/strong> – usually in otherwise normal arteries with no established collaterals<br>Typical: <strong>acute white leg + complete neurosensory deficit<\/strong><br>Progressive, as secondary thrombus forms proximal and distal to the occlusion", "Less dramatic; usually a history of claudication, with critical ischemia as the end result<br>Depends on the size of the artery occluded and whether collaterals developed beforehand"], ["<strong>Causes<\/strong>", "<strong>Cardiac source most common<\/strong>:<br>• Atrial fibrillation – thrombus in the L atrial appendage<br>• Mural thrombus, acute MI<br>• Mechanical heart valves – <strong>mitral is highest risk<\/strong> (anticoagulate)<br>• <strong>Paradoxical<\/strong> – usually a young, obese woman on birth control; DVT crosses to the arterial side through a <strong>patent foramen ovale<\/strong><br>• Endocarditis<br>• Cardiac tumour – send to pathology, especially if young with no other cause", "• Progressive atherosclerosis of the leg arteries<br>• Hypercoagulability<br>• Arterial dissection<br>• Bypass graft occlusion"]], "lead": "<p><strong>Acute arterial ischemia<\/strong><\/p>"}, {"t": "table", "cols": ["The 6 Ps", "History, exam and investigations"], "rows": [["1. <strong>Pulseless<\/strong> extremity", "<strong>Duration is the most important part of the history<\/strong> – irreversible muscle necrosis occurs within <strong>6–8 hours<\/strong> if untreated"], ["2. <strong>Paresthesia<\/strong>: numbness (sensory nerves)", "Ask about claudication, look for atrial fibrillation, use the 6 Ps"], ["3. <strong>Pain<\/strong> (sensory nerves)", "Palpable normal pulses in the contralateral leg → <strong>embolism<\/strong>"], ["4. <strong>Paresis<\/strong>: cannot move the limb (motor nerves)", "A strong pulse can mask an occlusion at that level → water-hammer effect"], ["5. <strong>Polar<\/strong>: cold (skin)", "Thrombotic occlusion of the superficial femoral artery = asymptomatic"], ["6. <strong>Pallor<\/strong>: pale (skin)", "Ix: ultrasound, <strong>CT angiogram<\/strong>, angiography"], ["Muscle tenderness is a <strong>late sign<\/strong>", ""]], "lead": "<p><strong>Sudden embolic occlusion of the SFA<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Acute limb ischemia<br/>6 Ps\"] --> B[\"History: duration · claudication · AF<br/>contralateral pulses\"]\n B --> C{\"Likely cause?\"}\n C -->|\"Normal contralateral pulses · AF\"| D[\"Embolic<br/>no collaterals · white leg\"]\n C -->|\"Claudication history\"| E[\"Thrombotic<br/>collaterals · milder\"]\n D --> F[\"Ix: ultrasound · CT angiogram · angiography\"]\n E --> F\n F --> G[\"Heparin 5000 U bolus then 1000 U/h<br/>aPTT 2-3x · O2 · IV fluids · analgesia\"]\n G --> H[\"Revascularize<br/>endovascular or open\"]\n H --> I{\"Compartment swelling<br/>after reperfusion?\"}\n I -->|\"Yes\"| J[\"Fasciotomy\"]\n I -->|\"No\"| K[\"Monitor urine output<br/>thrombophilia screen if indicated\"]"}, {"t": "table", "cols": ["ABI", "Meaning"], "rows": [["0.9–1.0", "Normal"], ["0.7–0.9", "Mild arterial insufficiency"], ["0.6–0.8", "Moderate arterial insufficiency"], ["<strong>&lt; 0.5<\/strong>", "<strong>Severe arterial insufficiency → ischemic rest pain<\/strong>"], ["<strong>&lt; 0.3<\/strong>", "<strong>Severe ischemia → tissue loss, gangrene<\/strong>"]], "lead": "<p><strong>Ankle-brachial index<\/strong>: objective ratio of ankle systolic pressure to arm systolic pressure, quantifying arterial insufficiency.<\/p>"}, {"t": "table", "cols": ["", "Open surgical bypass", "Endovascular revascularization"], "rows": [["<strong>Status<\/strong>", "Traditional approach", "Newer approach"], ["<strong>Technique<\/strong>", "<strong>Inflow<\/strong>: usually the common femoral artery; can be the aorta<br><strong>Outflow<\/strong>: popliteal (above/below knee), anterior tibial, posterior tibial or peroneal arteries<br><strong>Conduit<\/strong>: autogenous vein (long saphenous, small saphenous or arm veins) or synthetic (Gore-Tex)", "Angiography suite, local anesthetic<br>Femoral puncture, balloon angioplasty, stents, atherectomy"], ["<strong>Good<\/strong>", "Effective, inexpensive (unless complications arise), durable (with good anatomy and quality vein)", "Effective (short- to mid-term), minimally invasive, outpatient, minimal risk of infection"], ["<strong>Bad<\/strong>", "General anesthetic, hospital stay, long recovery, wound complications", "Secondary re-interventions, increased cost"], ["<strong>Ugly<\/strong>", "Graft thrombosis (thrombolysis, redo surgery); infected grafts (high rate of limb loss, high mortality)", "Puncture-site complications (expanding hematoma, pseudoaneurysm, arterial thrombosis); distal embolization (could limit other surgical options)"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Chronic arterial occlusive disease\"] --> B{\"Symptoms?\"}\n B -->|\"Pain on exertion, relieved by rest\"| C[\"Intermittent claudication\"]\n B -->|\"Rest pain or tissue loss\"| D[\"Critical limb ischemia\"]\n C --> E[\"ABCDES medical management<br/>smoking cessation most important\"]\n E --> F{\"Disabling claudication?\"}\n F -->|\"No\"| G[\"Continue risk factor control<br/>5% need surgery over 5 years\"]\n F -->|\"Yes\"| H[\"Consider revascularization<br/>controversial\"]\n D --> I[\"CT angiogram or angiography\"]\n I --> J{\"Saving the limb would threaten life?\"}\n J -->|\"Yes\"| K[\"Amputation\"]\n J -->|\"No\"| L[\"Revascularize<br/>open bypass or endovascular\"]\n H --> L"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"STEMI diagnosed<br/>symptoms within 12 h\"] --> B{\"Primary PCI possible within<br/>120 min of first medical contact?\"}\n B -->|\"Yes\"| C[\"Transfer for primary PCI\"]\n B -->|\"No\"| D{\"Absolute contraindication<br/>to fibrinolysis?\"}\n D -->|\"No\"| E[\"Fibrinolysis<br/>+ ASA · clopidogrel · LMWH · nitrates · O2\"]\n D -->|\"Yes\"| C\n E --> F[\"Transfer to PCI-capable hospital\"]\n F --> G[\"Catheterization and stenting<br/>of the culprit artery\"]"}, {"t": "table", "cols": ["Absolute contraindications to fibrinolysis"], "rows": [["Any prior intracerebral hemorrhage"], ["Known structural cerebral vascular lesion (AVM)"], ["Known malignant intracranial neoplasm (primary or metastatic)"], ["Ischemic stroke within 3 months (EXCEPT acute ischemic stroke within 4.5 hours)"], ["Suspected aortic dissection"], ["Active bleeding or bleeding diathesis (excluding menses)"], ["Significant closed-head or facial trauma within 3 months"], ["Intracranial or intraspinal surgery within 2 months"], ["Severe uncontrolled hypertension (unresponsive to emergency therapy)"], ["Prior streptokinase treatment within 6 months"]], "lead": "<p><strong>Which are absolute contraindications? (choose 3)<\/strong> Options: (a) ICH 5 years ago, (b) ischemic stroke 6 months ago, (c) lung adenocarcinoma with brain metastases, (d) trauma CPR, (e) suspected aortic dissection, (f) dementia, (g) pregnancy. Answer: <strong>(a), (c), (e)<\/strong>; the rest are relative contraindications.<\/p>"}]}, {"id": "cardio-w3-07", "num": "07", "name": "Surgical Management of Cardiovascular Disease", "title": "Valvular Heart Disease and Surgical Management", "framing": "<p>The four big left-sided lesions — <strong>aortic stenosis, aortic regurgitation, mitral stenosis and mitral regurgitation<\/strong> — each load the heart in a characteristic way (pressure vs volume, LV vs LA/pulmonary circulation), and that load predicts the symptoms, the signs and the timing of surgery. The organising surgical idea: <strong>regurgitant valves can usually be repaired, stenotic valves must be replaced<\/strong> — and the best valve is your own.<\/p>", "week": 3, "weekLabel": "Week 3 - Ischemic Heart Disease & Vascular Pathology", "items": [{"t": "head", "html": "<h5>Aortic valve disease: stenosis vs regurgitation<\/h5><p><strong>Aortic stenosis<\/strong> is the most common acquired heart (valve) disease — a <strong>pressure<\/strong> load on the LV. <strong>Aortic regurgitation<\/strong> is a <strong>volume<\/strong> load.<\/p>"}, {"t": "table", "cols": ["", "Aortic stenosis", "Aortic regurgitation"], "rows": [["<strong>Patho-physiology<\/strong>", "Obstruction to flow from LV into aorta<br>↑ pressure gradient LV → aorta<br>↑ afterload on LV (<strong>Law of Laplace<\/strong>)<br>Compensatory hypertrophy:<br>• Good: maintains normal afterload<br>• Bad: ↓ LV compliance, ↓ coronary blood flow, ↑ O₂ demand<br>• Contractility maintained until late in course", "Backflow from aorta into LV through a leaking valve<br><strong>Annuloaortic ectasia<\/strong>: dilatation of the aortic root/valve annulus<br>• Usually idiopathic; may be associated with chronic hypertension<br>• ↑ risk of <strong>aortic dissection<\/strong> (tear/laceration)<br><strong>Chronic AR<\/strong>: volume overload → LV dilatation, ↑ wall stress, compensatory hypertrophy; LV systolic function preserved initially, CHF eventually<br><strong>Acute AR<\/strong>: sudden onset (endocarditis, dissection) into a normal-sized, normally compliant LV → sudden ↑ LV pressure; LVEDP transmitted back to LA and pulmonary circulation → <strong>pulmonary edema<\/strong>; dyspnea, hypotension, short (possibly inaudible) murmur; <strong>emergency surgery<\/strong> usually indicated"], ["<strong>Causes<\/strong>", "<strong>Degenerative/calcific<\/strong> (etiology unclear)<br>• Pathophysiology similar to atherosclerosis; calcium deposition<br>• Presents later in life (60s-80s) – wear and tear<br>• Genetic markers being identified<br>• Statins (atherosclerotic regression) have <strong>no benefit<\/strong><br><strong>Congenital/bicuspid<\/strong><br>• 1% of population, male preponderance<br>• Presents in 40s-50s<br>• 1/3 AS, 1/3 AR, 1/3 clinically insignificant<br>• Abnormal, dilated aortas – intrinsic defect in the media", "<strong>Leaflet<\/strong>: calcific degeneration, bicuspid valve, endocarditis, lupus<br><strong>Root enlargement<\/strong> (leading cause in the Western world):<br>• Age-related degeneration/enlargement – most common<br>• Hypertension – stretches the annulus<br>• Cystic medial necrosis – Marfan syndrome<br>• Bicuspid aortic valve aortopathy<br><strong>Acute AR<\/strong>: endocarditis, dissection"], ["<strong>Symptoms<\/strong>", "<strong>\"ASD\"<\/strong>: <strong>A<\/strong>ngina, <strong>S<\/strong>yncope, <strong>D<\/strong>yspnea (CHF)<br>Asymptomatic: survival similar to general population; &lt; 1% SCD<br>Symptomatic: 10% SCD with angina, higher with CHF<br>Overall survival 75% at 3 years; normalises with AVR<br>Dyspnea/HF carries the worst prognosis", "Long asymptomatic period – good prognosis<br>Early: <strong>exertional dyspnea<\/strong>, <strong>fatigue<\/strong><br>CHF as LV systolic function fails: orthopnea, PND<br>Angina can occur – low diastolic pressure, LVH"], ["<strong>Signs<\/strong>", "<strong>Systolic murmur at the base<\/strong>; <strong>later peak = more severe<\/strong> (loudness does not grade severity)<br>Soft S2: stenotic valve does not close properly, so only P2 is heard<br><strong>S4<\/strong>: stiff hypertrophied LV<br><strong>Pulsus parvus et tardus<\/strong>: reduced, delayed<br>LV heave: strong apical impulse; apex may be displaced", "<strong>Diastolic murmur at the (left sternal) border<\/strong>; later peak = more severe<br>LVH with dilated LV: apex displaced down and out<br><strong>S3<\/strong>: CHF; <strong>S4<\/strong>: stiff LV<br><strong>Widened pulse pressure<\/strong> – narrows as CHF develops:<br>• <strong>Quincke<\/strong>: capillary pulsations<br>• <strong>Müller<\/strong>: systolic pulsation of the uvula<br>• <strong>Duroziez<\/strong>: systolic murmur when femoral artery compressed proximally, diastolic when compressed distally<br>• <strong>Traube<\/strong>: pistol-shot sounds over the femoral artery<br>• <strong>Corrigan<\/strong>: collapsing pulse"], ["<strong>Diagnosis<\/strong>", "ECG: not diagnostic<br><strong>Echocardiogram: gold standard<\/strong> – valve gradients, valve area, LV function (EF), other valve disease, LVH, aortic root size", "ECG: not diagnostic<br>CXR: may show LVH or enlarged aorta<br><strong>Echocardiogram: gold standard<\/strong> – etiology, severity, LV response (EF), aortic root size, other valve disease"], ["<strong>Management<\/strong>", "Asymptomatic: watch and wait; no clear benefit to surgery (growing evidence for surgery in some asymptomatic patients)<br>Symptomatic: <strong>valve replacement<\/strong><br>• <strong>Bioprosthetic<\/strong>: porcine cusps or bovine pericardium sewn on a synthetic frame; limited lifespan (~15 years); no long-term anticoagulation<br>• <strong>Mechanical<\/strong>: long life expectancy; oral anticoagulation", "Asymptomatic: no medication improves survival; endocarditis prophylaxis historically, no longer suggested<br>Surgery if LV failing or significantly dilated: <strong>LVEF &lt; 50%<\/strong>, <strong>LVESD &gt; 50 mm<\/strong>, <strong>LVEDD &gt; 65 mm<\/strong> (LVH alone is not a criterion)<br>Symptomatic: depends on etiology<br>• <strong>Leaflets → aortic valve replacement<\/strong><br>• <strong>Root dilation → aortic valve-sparing surgery<\/strong>"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Aortic stenosis<br/>obstruction LV to aorta\"] --> B[\"↑ LV-aorta pressure gradient\"]\n B --> C[\"↑ LV afterload<br/>Law of Laplace\"]\n C --> D[\"Compensatory LV hypertrophy\"]\n D --> E[\"Good: afterload normalised<br/>contractility kept until late\"]\n D --> F[\"Bad: ↓ LV compliance\"]\n D --> G[\"Bad: ↓ coronary flow<br/>↑ O2 demand\"]\n F --> H[\"S4 and dyspnea / CHF\"]\n G --> I[\"Angina\"]\n B --> J[\"Fixed outflow<br/>syncope\"]\n H --> K[\"Symptomatic: replace valve\"]\n I --> K\n J --> K"}, {"t": "table", "cols": ["AS grade", "Valve area (cm²)", "Mean gradient (mm Hg)"], "rows": [["Normal", "3-4", "&lt; 5"], ["Mild", "&gt; 1.5", "&lt; 25"], ["Moderate", "1-1.5", "25-40"], ["<strong>Severe<\/strong>", "<strong>&lt; 1<\/strong>", "<strong>&gt; 40<\/strong>"], ["Critical", "&lt; 0.6", "—"]], "lead": "<p>Echocardiographic grading of aortic stenosis; the gradient is measured using the <strong>Doppler effect<\/strong>.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Aortic regurgitation\"] --> B{\"Onset?\"}\n B -->|\"Acute: endocarditis, dissection\"| C[\"Regurgitation into normal-size<br/>normally compliant LV\"]\n C --> D[\"Sudden ↑ LV pressure<br/>LVEDP to LA\"]\n D --> E[\"Pulmonary edema<br/>dyspnea, hypotension\"]\n E --> F[\"Emergency surgery\"]\n B -->|\"Chronic\"| G[\"LV volume overload<br/>dilatation, hypertrophy\"]\n G --> H{\"Symptomatic?\"}\n H -->|\"No\"| I{\"LVEF under 50% or LVESD over 50 mm<br/>or LVEDD over 65 mm?\"}\n I -->|\"No\"| J[\"Watch and wait<br/>no drug improves survival\"]\n I -->|\"Yes\"| K{\"Etiology?\"}\n H -->|\"Yes\"| K\n K -->|\"Leaflets\"| L[\"Aortic valve replacement\"]\n K -->|\"Root dilation\"| M[\"Valve-sparing surgery\"]"}, {"t": "table", "cols": ["#", "Statement", "Answer"], "rows": [["20", "Which symptom (angina, syncope, palpitations, dyspnea) carries the worst prognosis in severe AS?", "<strong>Dyspnea<\/strong>"], ["21", "Which is NOT associated with severe AS on exam (parvus et tardus pulse, soft S2, late-peaking systolic ejection murmur, loudness of the murmur)?", "<strong>Loudness of the systolic murmur<\/strong> (closure of the aortic and pulmonic valves produces S2)"], ["22", "Which is NOT a quantitative trigger to operate on severe asymptomatic AR (EF &lt; 50%, LVH, LVESD &gt; 50 mm, LVEDD &gt; 65 mm)?", "<strong>Presence of LVH<\/strong>"], ["23", "Which causes <em>acute<\/em> AR (bicuspid valve, hypertensive root dilatation, degenerative valve, endocarditis)?", "<strong>Endocarditis<\/strong>"]], "lead": "<h5>Practice questions: aortic valve<\/h5>"}, {"t": "head", "html": "<h5>Mitral valve disease: stenosis vs regurgitation<\/h5><p>Both lesions raise LA pressure and push it back into the pulmonary circulation, ending in <strong>pulmonary hypertension<\/strong> and right-heart failure. MS <strong>under-fills a normal LV<\/strong>; MR <strong>volume-loads the LV<\/strong> until it fails.<\/p>"}, {"t": "table", "cols": ["", "Mitral stenosis", "Mitral regurgitation"], "rows": [["<strong>Patho-physiology<\/strong>", "Obstruction to flow from LA into LV:<br>• Fusion of leaflet commissures<br>• Thickening, fibrosis, calcification of cusps<br>• Thickening, fusion, shortening of chordae<br>LV underfilled → <strong>reduced systemic CO<\/strong><br>Pooling in LA → stasis → clot/stroke risk<br>↑ LA pressure → distension of pulmonary veins<br>RV compensatory hypertrophy → <strong>pulmonary arterial hypertension<\/strong><br>RV distortion → tricuspid dysfunction, RA dilatation", "Backflow from LV into LA through a leaking valve<br>LV systolic function preserved initially; fails over time → <strong>reduced systemic CO<\/strong><br>↑ LA pressure and volume → transmitted to pulmonary circulation<br>• Rate of rise depends on LA compliance<br>• <strong>Pulmonary hypertension<\/strong> eventually<br><strong>Primary MR<\/strong>: intrinsic valve pathology<br><strong>Secondary MR<\/strong>: distortion of a normal valve by dilatation or dysfunction of surrounding structures"], ["<strong>Causes<\/strong>", "<strong>Rheumatic fever/heart disease<\/strong> – most common globally (&gt; 99%)<br>• Group A strep pharyngitis → autoimmune process (molecular mimicry, cross-reactivity with GAS antigens)<br>• Female preponderance<br>• Developing countries: common, short asymptomatic period<br>• <strong>Western world: uncommon<\/strong>, long asymptomatic period (15 years)<br>• 25% MS, 40% MS + MR, 35% multivalvular<br>• Mitral &gt; aortic &gt; tricuspid &gt; pulmonary<br><strong>Mitral annular calcification (MAC)<\/strong> – aging, atherosclerosis, abnormal Ca²⁺ metabolism, CKD<br><strong>Radiation-induced<\/strong> – late manifestation in survivors of Hodgkin lymphoma<br>Congenital MS", "<strong>Acute<\/strong>:<br>• Ischemic papillary muscle dysfunction or rupture<br>• Infective endocarditis with chordal rupture<br>• Acute rheumatic fever<br>• Myxomatous chordal rupture<br>• Acute LV dilation (myocarditis, ischemia)<br>• Mechanical failure of a prosthetic mitral valve<br><strong>Chronic<\/strong>:<br>• Mitral valve prolapse (<strong>myxomatous MV disease<\/strong>)<br>• Infective endocarditis<br>• Rheumatic MV disease<br>• Cardiomyopathy<br>• Ischemic heart disease"], ["<strong>Symptoms<\/strong>", "<strong>Exertional dyspnea<\/strong> (most common presentation), fatigue<br>LHF: orthopnea, PND<br><strong>Hemoptysis<\/strong>: rupture of thin-walled dilated bronchial veins<br>RHF: peripheral edema, ascites, congested liver<br>Angina: RVH, pulmonary hypertension<br><strong>Hoarseness<\/strong>: compression of the left recurrent laryngeal nerve<br>Earlier in high-output states (pregnancy, anemia, hyperthyroidism, fever) – ↑ CO and HR against a fixed valve", "<strong>Acute<\/strong>: pulmonary edema (↓ SV, ↑ LA pressure); sudden dyspnea, hypotension, HF/cardiogenic shock<br><strong>Chronic<\/strong>: initially asymptomatic; then dyspnea, fatigue, orthopnea, palpitations"], ["<strong>Signs<\/strong>", "<strong>Diastolic murmur at the apex<\/strong><br>S1: loud initially, softens as the valve stiffens<br>S2: loud P2 (pulmonary hypertension)<br>Pulse: atrial fibrillation (LA dilation)<br><strong>Malar flush<\/strong>: rosy cheeks from cutaneous vasodilatation<br>LHF: pulmonary congestion, poor CO<br>RHF: high JVP, tricuspid regurgitation, peripheral edema, ascites", "<strong>Holosystolic murmur at the apex<\/strong>, accentuated in left lateral decubitus; may be soft/inaudible in acute MR<br><strong>Normal carotid upstroke<\/strong> (vs AS)<br>S2: loud P2 (pulmonary hypertension)<br><strong>S3<\/strong>: rapid LV filling in diastole<br>Apical impulse enlarged, sustained, displaced (LV dilation)<br>Pulse: atrial fibrillation (LA dilation)<br>Diffuse precordial lift in severe MR (LA enlargement)"], ["<strong>Diagnosis<\/strong>", "ECG: LA enlargement, atrial fibrillation (clues, not diagnostic)<br>CXR: LA enlargement, double density/border sign, straightened left heart border, splayed carina, RV enlargement<br><strong>Echocardiogram: gold standard<\/strong> – MV morphology, function, severity, effects on other structures (LA dilatation, pulmonary pressure, RV size/function), likely etiology", "ECG: LA enlargement, atrial fibrillation<br>CXR: LA enlargement, cardiomegaly, pulmonary edema<br><strong>Echocardiogram: gold standard<\/strong> – etiology, severity, LV and RV size/systolic function, LA size, pulmonary pressures"], ["<strong>Management<\/strong>", "Asymptomatic: watch and wait<br>Sinus rhythm: <strong>salt restriction + diuretics<\/strong> if pulmonary congestion<br>AF: <strong>beta blockers<\/strong> (slow HR, ↑ diastolic filling time) + <strong>anticoagulation<\/strong> (thrombus/stroke)<br><strong>Percutaneous mitral balloon valvuloplasty<\/strong> (rheumatic MS):<br>• Catheter via femoral vein → IVC → RA → interatrial septum → LA<br>• Balloon inflated inside the valve to ↑ valve area<br>• Only if less than moderate MR<br>• Delays or avoids surgery<br>• Contraindications: LA thrombus, significant MR, calcific MS<br><strong>Mitral valve replacement<\/strong> (stenotic valves must be replaced)<br>• Bioprosthetic: older, history of bleeding<br>• Mechanical: younger, or another indication for anticoagulation<br><strong>MAZE procedure<\/strong>: restore/maintain sinus rhythm<br><strong>Left atrial appendectomy<\/strong>: ↓ stroke risk in AF", "Asymptomatic: watch and wait<br><strong>Blood pressure control<\/strong>; <strong>diuresis<\/strong> for volume overload<br>AF: <strong>rate control<\/strong> + <strong>anticoagulation<\/strong><br>Severe MR: <strong>endocarditis prophylaxis<\/strong><br>Surgery indications:<br>• Symptomatic severe primary MR<br>• Asymptomatic severe primary MR with mild/moderate LV dysfunction<br>• Not favourable once LV dysfunction is severe<br><strong>Repair &gt; replacement<\/strong> if anatomy suitable – no prosthesis, no anticoagulation, less endocarditis<br><strong>Transcatheter repair: MitraClip<\/strong> – expanding evidence (EVEREST II, COAPT)"]]}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Group A strep pharyngitis\"] --> B[\"Molecular mimicry<br/>autoimmune cross-reactivity\"]\n B --> C[\"Rheumatic heart disease<br/>commissural fusion, chordal shortening\"]\n C --> D[\"Mitral stenosis<br/>LA to LV obstruction\"]\n D --> E[\"LV underfilled<br/>↓ systemic CO\"]\n D --> F[\"LA pooling and dilation\"]\n F --> G[\"Atrial fibrillation\"]\n F --> H[\"LA appendage thrombus<br/>stroke, systemic embolism\"]\n G --> H\n D --> I[\"↑ LA pressure<br/>pulmonary venous congestion\"]\n I --> J[\"Dyspnea, orthopnea, hemoptysis\"]\n I --> K[\"Pulmonary arterial hypertension<br/>loud P2, RVH\"]\n K --> L[\"RV distortion, TR, RA dilatation<br/>right heart failure\"]"}, {"t": "table", "cols": ["Revised Jones", "Criteria", "Frequency"], "rows": [["<strong>Major<\/strong>", "Migratory arthritis", "60-80%"], ["", "Carditis/valvulitis", "50-80%"], ["", "CNS involvement", "10-30%"], ["", "Subcutaneous nodules", "0-10%"], ["", "Erythema marginatum", "&lt; 6%"], ["<strong>Minor<\/strong>", "Arthralgia", "—"], ["", "Fever", "—"], ["", "Elevated acute phase reactants (ESR, CRP)", "—"], ["", "Prolonged PR interval on ECG", "—"]], "lead": "<p><strong>Acute rheumatic fever (revised Jones criteria)<\/strong>: recent streptococcal pharyngitis (2-4 weeks) plus <strong>2 major<\/strong> or <strong>1 major + 2 minor<\/strong> criteria.<\/p>"}, {"t": "table", "cols": ["MS grade", "Valve area (cm²)", "Mean gradient (mm Hg)", "PA pressure (mm Hg)"], "rows": [["Mild", "&gt; 1.5", "&lt; 5", "&lt; 30"], ["Moderate", "1-1.5", "5-10", "30-50"], ["<strong>Severe<\/strong>", "<strong>&lt; 1<\/strong>", "<strong>&gt; 10<\/strong>", "<strong>&gt; 50<\/strong>"]], "lead": "<p>Echocardiographic grading of mitral stenosis.<\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Mitral stenosis\"] --> B{\"Symptomatic?\"}\n B -->|\"No\"| C[\"Watch and wait\"]\n B -->|\"Yes\"| D{\"Rhythm?\"}\n D -->|\"Sinus with congestion\"| E[\"Salt restriction + diuretics\"]\n D -->|\"Atrial fibrillation\"| F[\"Beta blocker + anticoagulation\"]\n E --> G{\"Rheumatic MS<br/>without LA thrombus, significant MR<br/>or calcific valve?\"}\n F --> G\n G -->|\"Yes\"| H[\"Percutaneous balloon valvuloplasty\"]\n G -->|\"No\"| I[\"Mitral valve replacement\"]\n I --> J[\"Bioprosthetic: older,<br/>bleeding history\"]\n I --> K[\"Mechanical: younger or<br/>other anticoagulation indication\"]\n I --> L[\"± MAZE and LA appendectomy<br/>for AF\"]"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Severe primary MR\"] --> B{\"Symptomatic?\"}\n B -->|\"Yes\"| D{\"LV dysfunction severe?\"}\n B -->|\"No\"| C{\"Mild or moderate<br/>LV dysfunction?\"}\n C -->|\"No\"| E[\"Watch and wait<br/>BP control, diuresis, rate control\"]\n C -->|\"Yes\"| G[\"Surgery indicated\"]\n D -->|\"No\"| G\n D -->|\"Yes\"| F[\"Surgery not favourable\"]\n G --> H{\"Anatomy suitable<br/>for repair?\"}\n H -->|\"Yes\"| I[\"Mitral valve repair\"]\n H -->|\"No\"| J[\"Mitral valve replacement\"]\n F --> K[\"Consider transcatheter<br/>MitraClip\"]"}, {"t": "table", "cols": ["#", "Statement", "Answer"], "rows": [["24a", "MS is common in Canada", "False – relatively rare; most common cause globally/in developing countries is rheumatic fever"], ["24b", "MS is caused predominantly by smoking", "False – conventional risk factors may contribute to mitral annular calcification, but globally calcific MS is ~1% of cases"], ["24c", "MS is caused predominantly by streptococcal infection", "<strong>True<\/strong> – rheumatic fever, an immunological reaction to an initial streptococcal infection"], ["24d", "MS is not related to radiation exposure", "False – chest radiotherapy can calcify the cardiac valves"], ["25", "Acute rheumatic fever requires 4 major criteria", "False – 2 major, or 1 major + 2 minor"], ["26", "Skin rash is a common finding in acute rheumatic fever", "False – erythema marginatum is a major criterion but found in &lt; 6%"], ["27", "Fever is a major criterion", "False – minor"], ["28a", "MS usually presents with breathlessness", "<strong>True<\/strong> – exertional breathlessness is the most common presentation"], ["28b", "MS is a risk for stroke", "<strong>True<\/strong> – high AF incidence + poor flow across the valve → stasis and thrombus in the LA appendage → stroke/systemic embolism"], ["28c", "MS causes left ventricular failure", "False – causes LHF symptoms/signs, but the problem is passage of blood into the LV, not intrinsic LV dysfunction"], ["28d", "MS may present earlier during another illness", "<strong>True<\/strong> – ↑ demand for CO raises HR against a fixed mitral restriction"], ["29", "Malar flush is due to cutaneous vasodilatation", "<strong>True<\/strong>"], ["30", "Being left-sided, MS gives only left-heart symptoms and signs", "False – usually LHF first, then RHF may follow"], ["31", "MS causes a systolic ejection murmur", "False – the LV fills through the mitral valve in diastole, so the murmur is <strong>diastolic<\/strong>"], ["32a", "CXR is usually sufficient to investigate MV disease", "False – gives clues but does not directly assess the valve"], ["32b", "ECG may yield useful clues", "<strong>True<\/strong> – LA dilatation and AF are clues, not diagnostic"], ["32c", "Echo is the gold standard", "<strong>True<\/strong> – morphology, function and clues to etiology"], ["32d", "Cardiac catheterisation is always required", "False – valve disease is routinely diagnosed by echo"], ["33", "HR control is unimportant in MS", "False – ventricular filling determines CO and is impeded by high HR, especially in AF"], ["34", "Balloon valvuloplasty should be tried in all MS before surgery", "False – contraindicated in calcific MS, significant MR, LA appendage thrombus"], ["35", "Mechanical MV replacement is always preferable to bioprosthetic", "Source answer: <strong>True<\/strong> – but its own explanation argues otherwise: requires uninterrupted anticoagulation, problematic with prior bleeding or in the elderly"], ["36", "Which does NOT affect mitral structure/function (annulus, moderator band, chordae, papillary muscles)?", "<strong>Moderator band<\/strong> – carries conduction fibres through the RV"], ["37", "Secondary MR refers to", "Distortion of a normal valve by dilatation or dysfunction of surrounding structures"], ["38", "Which is FALSE about the MR murmur: (a) holosystolic; (b) best heard at left lower sternal border; (c) accentuated in left lateral decubitus; (d) may be soft/inaudible in acute MR", "No answer in source; per the notes (murmur at the apex), <strong>(b)<\/strong> is the false one"], ["39", "Diagnostic test of choice for MR", "<strong>Echocardiogram<\/strong>"], ["40", "Which is FALSE about MR surgical indications: (a) symptomatic chronic severe primary MR; (b) asymptomatic severe primary MR with mild/moderate LV dysfunction; (c) surgery favourable when LV dysfunction is severe; (d) repair favoured over replacement when anatomy suitable", "No answer in source; per the notes, <strong>(c)<\/strong> is false"], ["41", "Treatment of choice for severe symptomatic MR with normal LV function (favourable anatomy)", "<strong>Surgical mitral valve repair<\/strong>"]], "lead": "<h5>Practice questions: mitral valve<\/h5>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"Sternotomy or minimally invasive access\"] --> B[\"Expose aorta, RA appendage,<br/>base of heart\"]\n B --> C[\"Cardiopulmonary bypass<br/>aorta cross-clamped\"]\n C --> D[\"Expose aortic valve\"]\n D --> E[\"Cardioplegic arrest\"]\n E --> F[\"Excise valve<br/>annular stitches through prosthesis\"]\n F --> G[\"Close aortotomy\"]\n G --> H[\"Pacing wires placed\"]"}, {"t": "table", "cols": ["Valve-sparing root repl.", "Follow-up", "Survival"], "rows": [["<strong>Tricuspid<\/strong> aortic valve", "10 years", "89%"], ["", "15 years", "76%"], ["", "20 years", "70%"], ["<strong>Bicuspid<\/strong> aortic valve", "5 years", "99%"], ["", "10 years", "91%"]], "lead": "<p>Survival after <strong>valve-sparing root replacement (VSRR)<\/strong>.<\/p>"}, {"t": "table", "cols": ["Type", "Prosthesis", "Features"], "rows": [["<strong>Mechanical<\/strong><br>✓ Freedom from structural failure<br>✓ Excellent durability<br>✓ Low profile (easy to implant, small root)<br>✗ Lifelong anticoagulation + monitoring<br>✗ Thromboembolism<br>INR targets: aortic 2-3; mitral 2.5-3.5; On-X 1.5-2", "<strong>Caged-ball<\/strong><br>1960s<br>Starr-Edwards", "Silicone ball<br>Low incidence of mechanical failure<br>Higher thromboembolism, partial flow obstruction, LVOT obstruction (mitral)"], ["", "<strong>Monoleaflet tilting disc<\/strong><br>1970s-present<br>Medtronic Hall", "Single pyrolytic carbon leaflet, titanium housing<br>More physiological flow and durability<br>Opening angle 60-80°"], ["", "<strong>Bileaflet<\/strong><br>St Jude, Carbomedics, On-X", "Two pyrolytic carbon leaflets, pyrolytic carbon or titanium housing<br>Retrograde washing + circular gap regurgitation → less stasis at leaflets and pivots (↓ thrombogenicity)<br>Excellent hemodynamics and durability<br>Opening angle 75-85°"], ["<strong>Stented bioprosthesis<\/strong><br>✓ No anticoagulation<br>✗ Structural valve deterioration", "<strong>Xenograft<\/strong>", "Porcine valve – Medtronic Mosaic<br>Bovine pericardium – Edwards Magna<br>Rigid stents, PTFE sewing cuffs, glutaraldehyde-treated, anti-Ca²⁺ treatment, high/low/zero-pressure fixation<br>Good outcomes for thromboembolism, thrombosis and endocarditis"], ["<strong>TAVI prostheses<\/strong>", "Balloon-expandable, self-expandable, other designs", "See figure below"]]}, {"t": "table", "cols": ["Patient", "Choice", "Why"], "rows": [["80 y, severe calcific AS", "<strong>TAVI<\/strong>", "Elderly – TAVI is standard of care"], ["55 y, bicuspid aortic valve", "<strong>Surgery, mechanical valve<\/strong>; or Ross procedure", "Younger – durability"], ["40 y, dialysis-dependent, rheumatic MS", "<strong>Replace; mechanical valve<\/strong>", "Stenotic lesions must be replaced; dialysis accelerates bioprosthetic deterioration"], ["27 y woman, MV endocarditis", "<strong>Repair preferable<\/strong>; mechanical valve if replaced", "As written in source: anticoagulation is contraindicated in pregnancy; bioprosthetic mitral valves degrade faster than aortic, so she would only get ~5 years"]], "lead": "<h5>Which valve for whom?<\/h5><p>When replacement is indicated, choose the prosthesis on patient characteristics and preferences.<\/p>"}, {"t": "table", "cols": ["#", "Statement", "Answer"], "rows": [["42", "Natural history (expected 50% survival) of severe AS", "<strong>5 y after angina, 3 y after exertional presyncope, 2 y after heart failure<\/strong>"], ["43", "Indications for MV surgery in severe MR", "All of: dyspnea on exertion, new-onset AF, newly dilated LV"], ["44", "Procedural complication of AVR/TAVI", "<strong>Paravalvular leak<\/strong>"], ["45", "Disadvantages of prosthetic replacement vs repair", "All of: prosthetic valve deterioration, higher gradients, ↑ endocarditis risk"], ["46", "Risk factors for early bioprosthetic deterioration", "All of: younger age, ESKD on dialysis, disordered Ca²⁺ homeostasis, diabetes"], ["47", "Benefit of minimally invasive repair/replacement (mini-thoracotomy, mini-sternotomy)", "<strong>Quicker return to activity<\/strong>"]], "lead": "<h5>Practice questions: valve surgery<\/h5>"}, {"t": "table", "cols": ["#", "Statement", "Answer"], "rows": [["6a", "CXR accurately assesses chamber size", "False – approximation only"], ["6b", "CXR assesses valve function well", "False – no direct assessment of valve function"], ["6c", "CXR gives a high radiation dose", "False – minimal dose"], ["6d", "CXR is inexpensive", "<strong>True<\/strong> – widely available, relatively inexpensive"], ["6e", "CXR can show prior history", "<strong>True<\/strong> – prior cardiac surgery and pacemakers are easily seen"], ["7a", "Echo is appropriate for myocardial function", "<strong>True<\/strong> – preferred initial modality"], ["7b", "Echo gives only limited valve information", "False – <strong>gold standard for valve function<\/strong>"], ["7c", "Echo is the gold standard for CAD", "False – no direct information on coronary patency; indirect clues (wall-motion abnormalities)"], ["7d", "Echo provision is limited", "False – widely available, relatively inexpensive"], ["7e", "Body habitus does not affect echo", "False – position and habitus can significantly affect image quality"], ["8", "Cardiac MRI helps assess myocardial function", "<strong>True<\/strong> – gold standard for ventricular function"], ["9", "Cardiac CT is the test of choice for functional valve assessment", "False – assesses anatomy/function but inferior to echo and MRI; radiation exposure"], ["10", "Cardiac CT correlates poorly with invasive angiography", "False – good correlation between CT and invasive coronary angiography"], ["11", "Stress echo relies mostly on relative perfusion", "False – compares wall motion at rest vs stress"], ["12", "Perfusion tests may be more sensitive for CAD than ECG or wall-motion tests", "<strong>True<\/strong> – in the ischemic cascade, perfusion abnormalities precede wall-motion and ECG changes"], ["13", "No chest pain during a stress test means no ischemia", "False – chest pain comes late in the ischemic cascade, after perfusion, wall-motion and ECG changes"], ["14", "TEE is optimal for CAD", "False – yields very little coronary information"], ["15", "TEE should be routine for valve assessment", "False – invasive; only for specific questions TTE cannot answer"], ["16", "TEE helps when transthoracic images are insufficient", "<strong>True<\/strong> – suboptimal TTE, or when very detailed valve assessment is needed"], ["17", "Cardiac catheterisation is routine for any chest-pain concern", "False – only when the risks are justified and the information cannot be obtained non-invasively"], ["18", "Catheterisation risks are small", "False – complications are rare (1/1000 serious injury or death) but very serious"], ["19", "Catheterisation only assesses the coronaries", "False – also excellent for intracardiac pressures and shunts"]], "lead": "<h5>Practice questions: cardiac investigations<\/h5>"}]}, {"id": "cardio-w4-01", "num": "01", "name": "Physiology of Heart Failure", "title": "Heart Failure: Physiology, Classification and Management", "framing": "<p>Heart failure is a <strong>clinical syndrome<\/strong>, not a disease: symptoms and signs plus structural heart disease. Its engine is <strong>neurohormonal activation<\/strong> (SNS, RAAS, AVP) – an appropriate response to dehydration turned harmful – and nearly every HFrEF drug blocks one limb of it.<\/p>", "week": 4, "weekLabel": "Week 4 - Heart Failure, Hypertension & Congenital Disease", "items": [{"t": "table", "cols": ["", "Left-sided HF", "Right-sided HF (cor pulmonale)"], "rows": [["Types", "<strong>Systolic = failure to pump<\/
