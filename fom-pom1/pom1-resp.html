>HF, Na+ retention\"]\n D --> G[\"↓ oncotic pressure<br/>cirrhosis\"]"}]}, {"id": "resp-w7-01", "num": "01", "name": "Alveolar Causes of Dyspnea", "title": "DDx for Dyspnea", "framing": "<p>The differential for dyspnea is organised by <strong>tempo first<\/strong> — acute (minutes to hours) vs chronic — and then by <strong>system<\/strong>: cardiac, pulmonary, other. Within the lung, localise by compartment: airway, parenchyma (alveoli, interstitium), vessels, pleura, pump.<\/p>", "week": 7, "weekLabel": "Week 7 - Gas Exchange, Hypoxia & Interstitial Disease", "items": [{"t": "pathway", "mermaid": "flowchart TD\n A[\"Acute dyspnea<br/>minutes to hours\"] --> B[\"Cardiovascular\"]\n A --> C[\"Respiratory\"]\n B --> B1[\"MI*, cardiac tamponade*, CHF\"]\n C --> D[\"Pleural\"]\n C --> E[\"Parenchymal\"]\n C --> F[\"Vascular\"]\n C --> G[\"Airway\"]\n D --> D1[\"Tension pneumothorax*\"]\n E --> E1[\"Pneumonia\"]\n F --> F1[\"Pulmonary embolism*\"]\n G --> H[\"Lower airway - wheeze<br/>asthma*, AECOPD*, CHF, ARDS\"]\n G --> I[\"Upper airway - stridor<br/>aspiration*, anaphylaxis*\"]"}, {"t": "table", "cols": ["Chronic cardiac", "Causes"], "rows": [["<strong>Pericardial<\/strong>", "Effusion, cardiac tamponade*, constriction"], ["<strong>Myocardial<\/strong>", "Systolic dysfunction, diastolic dysfunction, restrictive cardiomyopathy"], ["<strong>Valvular<\/strong>", "Stenosis, regurgitation, sub-valvular disease"], ["<strong>Coronary artery disease<\/strong>", "Stable angina, acute coronary syndrome*"], ["<strong>Arrhythmia<\/strong>", "Atrial fibrillation, bradyarrhythmia, tachyarrhythmia"]], "lead": "<p><strong>Chronic dyspnea — cardiac<\/strong><\/p>"}, {"t": "table", "cols": ["Category", "Compartment", "Causes"], "rows": [["<strong>Airways<\/strong>", "—", "Asthma, COPD, bronchiectasis"], ["<strong>Parenchyma<\/strong> (abnormal CXR)", "Alveoli", "Pneumonia"], ["", "Interstitium", "Interstitial pulmonary fibrosis, hypersensitivity pneumonitis, CHF, sarcoidosis"], ["", " itis", "<strong>Adolescent males: juvenile nasal angiofibroma<\/strong> — recurrent ipsilateral obstruction; <strong>do NOT biopsy<\/strong> (highly vascular, hemorrhage)"], ["<strong>PEx<\/strong>", "<strong>Nose<\/strong>: pale mucosa, swollen/boggy turbinates, allergic salute crease<br><strong>Throat<\/strong>: hard palate erythema, cobblestoning<br><strong>Eyes<\/strong>: red/watery, allergic shiners, Dennie-Morgan lines<br><strong>TM<\/strong>: serous otitis media", "Rhinoscopy", "Rhinoscopy — yellow mucus in middle meatus bilaterally<br><strong>Nasal polyps = polyposis<\/strong>: CT to exclude intracranial extension, biopsy<br><strong>Samter's triad<\/strong>: nasal polyposis, asthma, aspirin sensitivity", "PPE (gown, mask, gloves); headlamp; nasal speculum; bayonet forceps for packing<br>Patient leans forward, nose to the floor, to find the bleeding side"], ["<strong>Dx<\/strong>", "<strong>Clinical<\/strong>: Hx, symptoms<br><strong>Lab<\/strong>: serum eosinophils, total IgE<br><strong>Skin prick tests<\/strong> for the source<br>Imaging NOT usually done", "<strong>2+ major symptoms, including O or D<\/strong><br><strong>Major (PODS)<\/strong>: facial Pain/pressure, nasal Obstruction, purulent Discharge, Smell disturbance<br><strong>Minor<\/strong>: headache, halitosis, fatigue, toothache, cough, ear pain/pressure", "<strong>2+ major symptoms, including O or D<\/strong><br><strong>Major (PODS + C)<\/strong>: as acute, plus facial congestion<br><strong>Minor<\/strong>: as acute", "—"], ["<strong>Tx<\/strong>", "Prophylaxis: allergen avoidance<br><strong>Intranasal corticosteroids (&gt; age 2)<\/strong><br>Epinephrine (EpiPen)<br>Antihistamines, mast cell stabilizers<br>Decongestants — risk of <strong>rhinitis medicamentosa<\/strong>; <strong>3-7 days ONLY<\/strong><br>Immunotherapy (allergen shots)<br>Surgery: turbinate reduction", "<strong>Watch and wait 7-10 days<\/strong> (1st line)<br>Symptom management (1st line): <strong>intranasal corticosteroids<\/st >", "<strong>M3: mucus production and bronchoconstriction<\/strong>"]]}, {"t": "table", "cols": ["Class", "Examples", "Mechanism", "Indications", "Adverse effects"], "rows": [["<strong>Inhaled β2-agonists<\/strong>", "<strong>SABA<\/strong>: <strong>salbutamol/albuterol<\/strong> (MDI, DPI), terbutaline (DPI)<br><strong>LABA<\/strong>: <strong>formoterol<\/strong> (DPI), <strong>salmeterol<\/strong> (DPI)", "Facilitate conversion of adenylate cyclase (AC) to cAMP → relaxes bronchial smooth muscle<br>Vasodilation; enhance mucociliary clearance; inhibit mast cell mediator release; respiratory stimulant", "Acute or recurrent bronchospasm<br>Exercise-induced bronchospasm prophylaxis<br><strong>Do NOT use LABA monotherapy for asthma — combine with ICS<\/strong>", "Hypoxemia; <strong>tremors<\/strong>; nervousness, anxiety, insomnia; <strong>palpitations, tachycardia, arrhythmias<\/strong>; flushing, hypotension; hypokalemia; <strong>tachyphylaxis<\/strong> (tolerance)"], ["<strong>Muscarinic antagonists<\/strong> (anticholinergics)", "<strong>Ipratropium<\/strong> (MDI, nebulized; 4-6 h)<br><strong>Tiotropium<\/strong> (24 h)<br>Atropine", "Competitively inhibit the <strong>M3 muscarinic receptor<\/strong>, preventing bronchoconstriction", "COPD<br>Acute and chronic asthma", "<strong>Dry mouth<\/strong>; ↑ intraocular pressure, urinary retention, tachycardia"], ["<strong>Methylxanthines<\/strong>", "<strong>Theophylline<\/strong><br>Caffeine (&lt; 5 mg/kg; 2-4 h)", "Inhibit phosphodiesterase (which hydrolyzes cAMP) → ↑ cAMP<br>Block adenosine A1 and A2 receptors; prostaglandin antagonist; inhibit Ca2+ influx into smooth muscle", "<strong>Limited use — narrow therapeutic index<\/strong><br>COPD (3rd line), asthma (3rd line)", "Neurotoxicity (seizures, tremor); cardiotoxicity (tachycardia, arrhythmias); LES reflux, nausea; diuretic<br><strong>Metabolized by CYP1A2<\/strong>"], ["<strong>Inhaled corticosteroids<\/strong>", "<strong>Budesonide<\/strong>, <strong>fluticasone<\/strong>, beclomethasone, mometasone", "Anti-inflammatory; inhibit cytokine synthesis (IL-1, IL-2); inactivate NF-κB, which induces TNF-α", "COPD<br><strong>Acute and chronic asthma (1st line)<\/strong><br><strong>Reverse β2-agonist tachyphylaxis<\/strong>", "Sore mouth, hoarseness<br><strong>Oral thrush — rinse after use<\/strong><br><strong>Metabolized by CYP3A4<\/strong>"], ["<strong>Leukotriene receptor antagonists<\/strong>", "<strong>Montelukast<\/strong>, <strong>zafirlukast<\/strong>, zileuton", "Anti-inflammatory; block leukotriene receptors (CysLT1); inhibit bronchoconstriction", "Allergic rhinitis; exercise-induced bronchoconstriction; <strong>aspirin-induced asthma<\/strong>; post-viral bronchial hyperreactivity", "Nausea"], ["<strong>PDE-4 inhibitors<\/strong>", "<strong>Roflumilast<\/strong>", "Anti-inflammatory; inhibit PDE-4 → ↑ cAMP", "Severe COPD with chronic bronchitis", "N/V/D"], ["<strong>Anti-IgE mAb<\/strong>", "<strong>Omalizumab<\/strong> — SC every 2-4 weeks", "Binds free serum IgE at the Fc region; targets the Th2 pathway", "Severe allergic asthma with ↑ IgE", "Generally well tolerated, but very expensive"], ["<strong>Anti-IL-5 mAb<\/strong>", "<strong>Mepolizumab<\/strong> (IL-5 receptor) — SC every 4 weeks<br><strong>Reslizumab<\/strong> (IL-5 receptor) — IV every 4 weeks<br><strong>Benralizumab<\/strong> (IL-5 receptor α)", "Prevent IL-5-mediated eosinophil differentiation, maturation, activation and survival", "Severe eosinophilic asthma", "—"]], "lead": "<p><strong>Respiratory drug classes<\/strong><\/p>"}, {"t": "pathway", "mermaid": "flowchart TD\n A[\"β2-agonist<br/>SABA, LABA\"] --> B[\"β2 receptor → adenylate cyclase\"]\n B --> C[\"↑ cAMP\"]\n C --> D[\"Bronchial smooth<br/>muscle relaxation\"]\n E[\"Theophylline, roflumilast\"] -->|\"inhibit PDE\"| F[\"↓ cAMP breakdown\"]\n F --> C\n G[\"Parasympathetic tone<br/>acetylcholine\"] --> H[\"M3 receptor\"]\n H --> I[\"Bronchoconstriction<br/>+ mucus\"]\n J[\"Ipratropium, tiotropium\
