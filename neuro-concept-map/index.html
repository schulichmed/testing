<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Neuro Concept Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Patrick+Hand&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: the hand-drawn map's own sections on one sheet; each topic is a highlighter heading, each line under it opens our chart with that column lit */
:root{
  --paper:#ffffff; --ink:#1d1d1f; --soft:#5a5e66; --bar:#f4f3ef; --line:#dcdad3; --rule:#c9c9c9;
  --mint:#bfe8d6; --sky:#c6e3f7; --rose:#f6d3dc; --peach:#fcd9b4; --blush:#f9cfd1; --lilac:#e3d5f5;
  --leaf:#cdeec9; --orchid:#f3d1ec; --butter:#fff0a6; --moss:#d6edc4; --ice:#d3e2f8; --smoke:#e6e6e6; --aqua:#c3eee3;
  --hit:#ffe14d; --accent:#7a3fb0;
  --hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --marker:"Gaegu","Patrick Hand","Comic Sans MS",cursive;
  --ui:Inter,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui)}
header{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-family:var(--marker);font-weight:700;font-size:1.8rem;margin:0;line-height:1;text-transform:uppercase}
h1 small{font-family:var(--hand);font-weight:400;text-transform:none;color:var(--soft);font-size:1.05rem;margin-left:8px}
.search{flex:1 1 220px;min-width:0}
.search input{width:100%;font:inherit;font-size:.92rem;padding:8px 11px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink)}
.search input:focus-visible{outline:3px solid var(--hit)}
header a{font-size:.85rem;color:var(--accent);white-space:nowrap}
main{max-width:1680px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.intro{font-family:var(--hand);font-size:1.2rem;color:var(--soft);margin:2px 0 16px;max-width:70ch}
.zone{margin-bottom:28px}
.zh{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.zh h2{font-family:var(--marker);font-weight:700;font-size:1.7rem;text-transform:uppercase;margin:0;white-space:nowrap;color:var(--soft)}
.zh::after{content:"";flex:1;height:14px;border-radius:7px;background:var(--rule)}
.zone.local .zh::after,.zone.eye .zh::after{height:6px;background:var(--ink)}
.cards{display:grid;gap:22px 26px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-items:start}
.bottom{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:0 34px;border-top:6px solid var(--ink);padding-top:22px}
.bottom > .zone:first-child{border-right:6px solid var(--ink);padding-right:30px}
.card{min-width:0}
.topic{display:inline-block;max-width:100%;text-align:left;font-family:var(--marker);font-weight:700;font-size:1.55rem;line-height:1;text-transform:uppercase;
  padding:7px 15px 6px;border:0;background:var(--hl);color:var(--ink);cursor:pointer;
  border-radius:22px 18px 24px 16px / 18px 22px 16px 24px}
.topic:hover{filter:brightness(.96)}
.topic:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.topic small{display:block;font-family:var(--ui);font-weight:600;font-size:.62rem;letter-spacing:.06em;color:var(--soft);margin-top:3px}
.grp{margin:9px 0 0 6px}
.gl{font-family:var(--hand);font-size:1.05rem;color:var(--soft);margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--hand);font-size:1.08rem;line-height:1.1;text-align:left;padding:5px 10px;border-radius:999px;cursor:pointer;
  background:var(--paper);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--hl) 35%,#555);}
.chip:hover{background:var(--hl)}
.chip.seen::after{content:" ✓";color:#2f7d5b}
.card.dim{opacity:.18}
.chip.dim{opacity:.25}
.chip.hit{background:var(--hit);border-color:#b08a00}
.extra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px;font-family:var(--hand);font-size:1.15rem;color:var(--soft)}
#modal{position:fixed;inset:0;background:rgba(20,20,24,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
#modal .box{background:var(--paper);border-radius:14px;width:min(1240px,100%);height:min(92vh,100%);display:flex;flex-direction:column;overflow:hidden}
#modal .mh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#modal .mh b{font-family:var(--marker);font-size:1.5rem;text-transform:uppercase;flex:1;line-height:1}
#modal .mh b span{display:block;font-family:var(--hand);font-weight:400;font-size:1.05rem;text-transform:none;color:var(--soft)}
#modal .mh a{font-size:.85rem;color:var(--accent)}
#modal button{font:inherit;font-size:.85rem;font-weight:600;border:1.5px solid var(--ink);background:var(--paper);border-radius:8px;padding:5px 10px;cursor:pointer}
#modal iframe{flex:1;border:0;width:100%}
@media (max-width:900px){
  .bottom{grid-template-columns:1fr;border-top:0;padding-top:0}
  .bottom > .zone:first-child{border-right:0;padding-right:0}
}
</style>
</head>
<body>
<header>
  <h1>Neuro concept map<small>PoM 2 Block 4 on one page</small></h1>
  <div class="search"><input id="q" type="search" placeholder="Find a heading: migraine, Horner, GBS…" autocomplete="off" aria-label="Find a heading"></div>
  <a href="drawing.html">See the hand-drawn original</a>
</header>
<main>
  <p class="intro">The same sections and headings as the hand-drawn map. Tap a heading to open its chart; tap a line under it to open the chart with that diagnosis lit.</p>
  <div id="map"></div>
</main>
<div id="modal" hidden><div class="box"><div class="mh"><b id="mt"></b><a id="ml" target="_blank" rel="noopener">Open in a new tab</a><button id="mx">Close</button></div><iframe id="mf" title="Overview chart"></iframe></div></div>
<script>
const MAP = {"zones":[{"id":"approach","name":"Headaches · seizures · altered level of consciousness","topics":[{"title":"Clinical approach to headaches","chart":"neuro-w14-06_2","hl":"mint","groups":[{"label":"Secondary: a red flag","items":[{"col":"sah","name":"Subarachnoid hemorrhage"},{"col":"men","name":"Bacterial meningitis"},{"col":"gca","name":"Giant cell arteritis"},{"col":"tum","name":"Brain tumour"},{"col":"iih","name":"Idiopathic intracranial hypertension"}]},{"label":"Primary: no red flag","items":[{"col":"mig","name":"Migraine"},{"col":"tth","name":"Tension-type"},{"col":"clu","name":"Cluster"}]}]},{"title":"Clinical approach to seizures","chart":"neuro-w14-08_2","hl":"sky","groups":[{"label":"Was it a seizure?","items":[{"col":"ne","name":"Non-epileptic event"}]},{"label":"Seizure","items":[{"col":"prov","name":"Provoked seizure"},{"col":"single","name":"Single unprovoked seizure"},{"col":"epi","name":"Epilepsy"},{"col":"se","name":"Status epilepticus"}]}]},{"title":"Seizures in children","chart":"neuro-w15-05_3","hl":"sky","groups":[{"label":null,"items":[{"col":"sfs","name":"Simple febrile seizure"},{"col":"cfs","name":"Complex febrile seizure"},{"col":"cse","name":"Convulsive status epilepticus"}]}]},{"title":"Altered level of consciousness","chart":"neuro-w14-07_2","hl":"rose","groups":[{"label":"Disorders of consciousness","items":[{"col":"bd","name":"Brain death"},{"col":"coma","name":"Coma"},{"col":"vs","name":"Vegetative state"},{"col":"mcsm","name":"Minimally conscious MINUS"},{"col":"mcsp","name":"Minimally conscious PLUS"}]},{"label":"Looks like coma, is not","items":[{"col":"lis","name":"Locked-in syndrome"}]}]}]},{"id":"disorder","name":"Neurological disorders","topics":[{"title":"Raised ICP · neurosurgical emergencies","chart":"neuro-w14-10_2","hl":"peach","groups":[{"label":null,"items":[{"col":"edh","name":"Epidural hematoma"},{"col":"sdh","name":"Acute subdural hematoma"},{"col":"sah","name":"Subarachnoid hemorrhage"},{"col":"tum","name":"Tumour with edema"},{"col":"hyd","name":"Hydrocephalus"}]}]},{"title":"Brain tumours","chart":"neuro-w15-02_2","hl":"blush","groups":[{"label":null,"items":[{"col":"met","name":"Brain metastasis"},{"col":"hgg","name":"High-grade glioma"},{"col":"lgg","name":"Low-grade glioma"},{"col":"pcl","name":"Primary CNS lymphoma"}]}]},{"title":"Head injury · hemorrhage","chart":"neuro-w14-01_2","hl":"lilac","groups":[{"label":null,"items":[{"col":"edh","name":"Epidural hematoma"},{"col":"sdh","name":"Acute subdural hematoma"},{"col":"cont","name":"Cerebral contusion"},{"col":"ich","name":"Intracerebral hemorrhage"},{"col":"dai","name":"Diffuse axonal injury · traumatic SAH"},{"col":"conc","name":"Concussion"}]}]},{"title":"Strokes","chart":"neuro-w14-03_2","hl":"leaf","groups":[{"label":null,"items":[{"col":"isch","name":"Ischemic stroke"},{"col":"tia","name":"Transient ischemic attack (TIA)"},{"col":"ich","name":"Intracerebral hemorrhage"},{"col":"sah","name":"Subarachnoid hemorrhage"}]}]},{"title":"Meningitis · encephalitis","chart":"neuro-w14-11_2","hl":"orchid","groups":[{"label":null,"items":[{"col":"bac","name":"Bacterial meningitis"},{"col":"asep","name":"Aseptic (viral) meningitis"},{"col":"hsv","name":"Herpes simplex encephalitis"}]}]},{"title":"Multiple sclerosis","chart":"neuro-w14-02_2","hl":"moss","groups":[{"label":null,"items":[{"col":"mye","name":"Myelitis"},{"col":"on","name":"Optic neuritis"},{"col":"bs","name":"Brainstem or cerebellar syndrome"}]}]},{"title":"Nutritional · systemic","chart":"neuro-w15-11_2","hl":"ice","groups":[{"label":null,"items":[{"col":"onc","name":"Five ways cancer reaches the nerves"},{"col":"phr","name":"Bilateral phrenic nerve palsies"},{"col":"wer","name":"Thiamine (B1) deficiency: Wernicke encephalopathy"},{"col":"nut","name":"Other nutrition"},{"col":"ce","name":"Multiple cardioembolic strokes"}]}]},{"title":"Neuroradiology","chart":"neuro-w13-13_2","hl":"smoke","groups":[{"label":null,"items":[{"col":"xr","name":"Radiography"},{"col":"fl","name":"Fluoroscopy"},{"col":"ct","name":"Computed tomography (CT)"},{"col":"us","name":"Ultrasound"},{"col":"mri","name":"MRI"}]}]}]},{"id":"local","name":"UMN vs LMN localization","topics":[{"title":"Localization: start here","chart":"neuro-w13-10_2","hl":"aqua","groups":[{"label":null,"items":[{"col":"cortex","name":"Cortex"},{"col":"subcortex","name":"Subcortex"},{"col":"stem","name":"Brainstem"},{"col":"legs","name":"Bilateral leg weakness"},{"col":"dys","name":"Dysarthria"},{"col":"cereb","name":"Cerebellar system"}]}]},{"title":"Clinical approach to weakness","chart":"neuro-w13-09_2","hl":"aqua","groups":[{"label":"Upper motor neuron","items":[{"col":"brain","name":"Brain"},{"col":"stem","name":"Brainstem"},{"col":"cord","name":"Spinal cord"}]},{"label":"Lower motor neuron","items":[{"col":"ahc","name":"Anterior horn cell"},{"col":"root","name":"Root(s)"},{"col":"plex","name":"Plexus"},{"col":"nerve","name":"Nerve"},{"col":"nmj","name":"Neuromuscular junction"},{"col":"muscle","name":"Muscle"}]}]},{"title":"Cortical syndromes","chart":"neuro-w13-08_2","hl":"aqua","groups":[{"label":null,"items":[{"col":"broca","name":"Broca's"},{"col":"tcm","name":"Transcortical motor"},{"col":"cond","name":"Conduction"},{"col":"wern","name":"Wernicke's"},{"col":"glob","name":"Global"},{"col":"tcs","name":"Transcortical sensory"}]}]},{"title":"Spinal cord syndromes","chart":"neuro-w13-06_2","hl":"aqua","groups":[{"label":null,"items":[{"col":"ant","name":"Anterior cord"},{"col":"post","name":"Posterior cord"},{"col":"cent","name":"Central cord"},{"col":"bs","name":"Brown-Séquard"},{"col":"ce","name":"Cauda equina"},{"col":"rad","name":"Radiculopathy"}]}]},{"title":"Spinal tracts","chart":"neuro-w13-02_2","hl":"aqua","groups":[{"label":null,"items":[{"col":"dcml","name":"Dorsal column (DCML)"},{"col":"stt","name":"Spinothalamic"},{"col":"sct","name":"Spinocerebellar"},{"col":"lcst","name":"Lateral corticospinal"},{"col":"cbt","name":"Corticobulbar"}]}]},{"title":"Sensory symptoms","chart":"neuro-w14-04_2","hl":"ice","groups":[{"label":null,"items":[{"col":"thal","name":"Brain: thalamus"},{"col":"cord","name":"Spinal cord"},{"col":"root","name":"Root (radiculopathy)"},{"col":"mono","name":"Mononeuropathy"},{"col":"poly","name":"Length-dependent polyneuropathy"},{"col":"gbs","name":"Guillain-Barré syndrome"}]}]},{"title":"Neuropathic pain","chart":"neuro-w14-05_2","hl":"ice","groups":[{"label":null,"items":[{"col":"tca","name":"Tricyclics (TCAs)"},{"col":"snri","name":"SNRIs"},{"col":"gab","name":"Gabapentinoids"},{"col":"carb","name":"Sodium-channel anticonvulsant"},{"col":"oth","name":"Topicals · cannabinoids"}]}]},{"title":"Floppy infant","chart":"neuro-w15-05_2","hl":"smoke","groups":[{"label":null,"items":[{"col":"cen","name":"Central hypotonia"},{"col":"per","name":"Peripheral hypotonia"}]}]}]},{"id":"eye","name":"Eyes · ears · cerebellum · basal ganglia","topics":[{"title":"Pupils · ptosis · diplopia","chart":"neuro-w13-07_2","hl":"peach","groups":[{"label":"Double vision","items":[{"col":"cn3","name":"Third nerve palsy"},{"col":"cn4","name":"Fourth nerve palsy"},{"col":"cn6","name":"Sixth nerve palsy"},{"col":"nys","name":"Gaze-evoked nystagmus"}]},{"label":"Pupils","items":[{"col":"para","name":"Parasympathetic paresis"},{"col":"symp","name":"Horner syndrome"},{"col":"rapd","name":"Relative afferent pupillary defect"}]}]},{"title":"Monocular vision loss","chart":"neuro-w15-06_2","hl":"peach","groups":[{"label":"Sudden","items":[{"col":"crao","name":"Central retinal artery occlusion"},{"col":"gca","name":"Giant cell arteritis"},{"col":"on","name":"Optic neuritis"},{"col":"rd","name":"Retinal detachment"},{"col":"vh","name":"Vitreous hemorrhage"}]},{"label":"Gradual","items":[{"col":"gl","name":"Primary open-angle glaucoma"},{"col":"cat","name":"Cataract"},{"col":"amd","name":"Age-related macular degeneration"}]}]},{"title":"Red eye","chart":"neuro-w15-07_2","hl":"peach","groups":[{"label":"Not sight-threatening","items":[{"col":"lid","name":"Stye · chalazion · entropion"},{"col":"vir","name":"Viral conjunctivitis"},{"col":"bac","name":"Bacterial conjunctivitis"},{"col":"gon","name":"Gonococcal conjunctivitis"},{"col":"all","name":"Allergic conjunctivitis"},{"col":"sch","name":"Subconjunctival hemorrhage"},{"col":"abr","name":"Corneal abrasion"}]},{"label":"Sight-threatening","items":[{"col":"ker","name":"Bacterial keratitis"},{"col":"uv","name":"Anterior uveitis (iritis)"},{"col":"aac","name":"Acute angle closure glaucoma"}]}]},{"title":"Ocular trauma","chart":"neuro-w15-07_3","hl":"peach","groups":[{"label":null,"items":[{"col":"fb","name":"Metallic foreign body"},{"col":"lid","name":"Lid laceration"},{"col":"hy","name":"Hyphema"},{"col":"ti","name":"Traumatic iritis"},{"col":"cl","name":"Corneal laceration"}]}]},{"title":"Children's eyes","chart":"neuro-w15-08_2","hl":"peach","groups":[{"label":null,"items":[{"col":"dim","name":"Dim or different reflex"},{"col":"bright","name":"Brighter reflex"},{"col":"white","name":"Leukocoria"},{"col":"con","name":"Concomitant strabismus"},{"col":"inc","name":"Incomitant strabismus"},{"col":"amb","name":"Amblyopia"}]}]},{"title":"Hearing loss","chart":"neuro-w15-09_2","hl":"sky","groups":[{"label":"Conductive","items":[{"col":"eac","name":"Ear canal"},{"col":"om","name":"Otitis media"},{"col":"fix","name":"Drum or ossicles"}]},{"label":"Sensorineural","items":[{"col":"ssnhl","name":"SUDDEN sensorineural"},{"col":"grad","name":"Gradual, symmetric"},{"col":"vs","name":"ONE-sided, progressive"}]}]},{"title":"Vertigo","chart":"neuro-w15-10_2","hl":"sky","groups":[{"label":null,"items":[{"col":"diz","name":"Not vestibular"},{"col":"bppv","name":"BPPV"},{"col":"scd","name":"Superior canal dehiscence"},{"col":"men","name":"Ménière's disease"},{"col":"neu","name":"Vestibular neuronitis / labyrinthitis"},{"col":"ami","name":"Aminoglycoside toxicity"}]}]},{"title":"Cerebellum · basal ganglia","chart":"neuro-w13-04_2","hl":"butter","groups":[{"label":"Cerebellum","items":[{"col":"vest","name":"Vestibulocerebellum"},{"col":"spin","name":"Spinocerebellum"},{"col":"cereb","name":"Cerebrocerebellum"}]},{"label":"Basal ganglia","items":[{"col":"pd","name":"Parkinson disease"},{"col":"chor","name":"Chorea"}]}]},{"title":"Movement disorders","chart":"neuro-w15-03_2","hl":"leaf","groups":[{"label":null,"items":[{"col":"et","name":"Essential tremor"},{"col":"pd","name":"Parkinson's disease"},{"col":"oth","name":"Parkinsonism from ANOTHER cause"}]}]},{"title":"Ataxic child","chart":"neuro-w15-05_4","hl":"butter","groups":[{"label":null,"items":[{"col":"tox","name":"Intoxication"},{"col":"pi","name":"Acute postinfectious cerebellar ataxia"},{"col":"tum","name":"Brain tumour"},{"col":"str","name":"Stroke · hemorrhage · infarction"},{"col":"men","name":"Meningitis · encephalitis"}]}]},{"title":"Non-Mendelian genetics","chart":"neuro-w15-04_2","hl":"smoke","groups":[{"label":null,"items":[{"col":"mt","name":"Mitochondrial DNA disease"},{"col":"nu","name":"Nuclear-gene mitochondrial disease"},{"col":"hd","name":"Huntington disease"},{"col":"dm","name":"Myotonic dystrophy"}]}]}]}],"extra":[{"title":"End of life · MAiD","chart":"neuro-w16-01_2"},{"title":"Autopsy · cause of death","chart":"neuro-w16-02_2"}]};
const BASE = "https://schulichmed.github.io/preclerkship/pom2/charts/";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let seen = {};
try { seen = JSON.parse(localStorage.getItem("ncm-seen") || "{}"); } catch(e) {}
const card = t => '<div class="card" style="--hl:var(--' + t.hl + ')"><button class="topic" data-chart="' + t.chart + '" data-name="' + esc(t.title) + '">' + esc(t.title) + '<small>OPEN THE CHART ›</small></button>' +
  t.groups.map(g => '<div class="grp">' + (g.label ? '<div class="gl">' + esc(g.label) + '</div>' : '') + '<div class="chips">' +
    g.items.map(i => { const k = t.chart + "#" + i.col; return '<button class="chip' + (seen[k] ? ' seen' : '') + '" data-chart="' + t.chart + '" data-col="' + i.col + '" data-name="' + esc(t.title) + '" data-sub="' + esc(i.name) + '">' + esc(i.name) + '</button>'; }).join("") +
  '</div></div>').join("") + '</div>';
const zone = z => '<section class="zone ' + z.id + '"><div class="zh"><h2>' + esc(z.name) + '</h2></div><div class="cards">' + z.topics.map(card).join("") + '</div></section>';
const [a, d, l, e] = MAP.zones;
document.getElementById("map").innerHTML = zone(a) + zone(d) + '<div class="bottom">' + zone(l) + zone(e) + '</div>' +
  '<div class="extra">Also in Block 4:' + MAP.extra.map(x => '<button class="chip" style="--hl:var(--smoke)" data-chart="' + x.chart + '" data-name="' + esc(x.title) + '">' + esc(x.title) + '</button>').join("") + '</div>';

const modal = document.getElementById("modal"), mf = document.getElementById("mf");
function openChart(b){
  const url = BASE + b.dataset.chart + "/" + (b.dataset.col ? "#col=" + b.dataset.col : "");
  document.getElementById("mt").innerHTML = esc(b.dataset.name) + (b.dataset.sub ? '<span>' + esc(b.dataset.sub) + '</span>' : '');
  document.getElementById("ml").href = url;
  mf.src = BASE + b.dataset.chart + "/?embed=1" + (b.dataset.col ? "#col=" + b.dataset.col : "");
  modal.hidden = false; document.getElementById("mx").focus();
  if (b.dataset.col){ const k = b.dataset.chart + "#" + b.dataset.col; seen[k] = 1; b.classList.add("seen"); try { localStorage.setItem("ncm-seen", JSON.stringify(seen)); } catch(e) {} }
  lastBtn = b;
}
let lastBtn = null;
function closeChart(){ modal.hidden = true; mf.src = "about:blank"; lastBtn && lastBtn.focus(); }
document.getElementById("map").addEventListener("click", ev => { const b = ev.target.closest("button[data-chart]"); if (b) openChart(b); });
document.getElementById("mx").onclick = closeChart;
modal.addEventListener("click", ev => { if (ev.target === modal) closeChart(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !modal.hidden) closeChart(); });

const q = document.getElementById("q");
q.addEventListener("input", () => {
  const t = q.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(c => {
    if (!t){ c.classList.remove("dim"); c.querySelectorAll(".chip").forEach(x => x.classList.remove("dim", "hit")); return; }
    const topicHit = c.querySelector(".topic").textContent.toLowerCase().includes(t);
    let any = topicHit;
    c.querySelectorAll(".chip").forEach(x => { const h = x.textContent.toLowerCase().includes(t); x.classList.toggle("hit", h); x.classList.toggle("dim", !h && !topicHit); any = any || h; });
    c.classList.toggle("dim", !any);
  });
});
</script>
</body>
</html>
