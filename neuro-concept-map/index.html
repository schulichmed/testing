<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Neuro Concept Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Patrick+Hand&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: the drawing's topics at the drawing's positions; each topic branches to its headings; the drawing's arrows run between them; any heading opens our chart */
:root{
  --paper:#ffffff; --ink:#1d1d1f; --soft:#5a5e66; --bar:#f4f3ef; --line:#dcdad3; --rule:#cfcfcf;
  --mint:#bfe8d6; --sky:#c6e3f7; --rose:#f6d3dc; --peach:#fcd9b4; --blush:#f9cfd1; --lilac:#e3d5f5;
  --leaf:#cdeec9; --orchid:#f3d1ec; --butter:#fff0a6; --moss:#d6edc4; --ice:#d3e2f8; --smoke:#e6e6e6; --aqua:#c3eee3;
  --hit:#ffe14d; --accent:#7a3fb0; --arrow:#3b3f47;
  --hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --marker:"Gaegu","Patrick Hand","Comic Sans MS",cursive;
  --ui:Inter,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden}
header{background:var(--bar);border-bottom:1px solid var(--line);z-index:5;
  padding:calc(9px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 9px max(16px,env(safe-area-inset-left));
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
h1{font-family:var(--marker);font-weight:700;font-size:1.75rem;margin:0;line-height:1;text-transform:uppercase;white-space:nowrap}
h1 small{font-family:var(--hand);font-weight:400;text-transform:none;color:var(--soft);font-size:1.02rem;margin-left:8px}
.search{flex:1 1 200px;min-width:0}
.search input{width:100%;font:inherit;font-size:.9rem;padding:7px 10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink)}
.search input:focus-visible{outline:3px solid var(--hit)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tool{font:inherit;font-size:.8rem;font-weight:600;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;text-decoration:none}
.tool:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
#view{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:var(--paper)}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#lines .tree{fill:none;stroke:var(--ink);stroke-width:2;opacity:.55;stroke-linecap:round}
#lines .x{fill:none;stroke:var(--arrow);stroke-width:2.6;opacity:.6;stroke-linecap:round}
#lines .x.vs{stroke-dasharray:2 8;opacity:.75}
#lines .x.hub{stroke:#9aa0a8;stroke-width:4;opacity:.5}
#lines .x.on{stroke:var(--accent);opacity:1;stroke-width:4.5}
#lines .lab{font:19px var(--hand);fill:var(--soft);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}
#lines .lab.on{fill:var(--accent)}
#lines .lab.vs{font:700 20px var(--marker)}
.band{position:absolute;pointer-events:none}
.band.grey{height:22px;background:var(--rule);border-radius:11px}
.band.black{height:7px;background:var(--ink);border-radius:4px}
.band.vert{width:7px;background:var(--ink);border-radius:4px}
.zl{position:absolute;font:700 40px var(--marker);text-transform:uppercase;color:#9aa0a8;white-space:nowrap;pointer-events:none}
.cl{position:absolute;display:flex;flex-direction:column;align-items:center;width:max-content}
.cnp,.hubnode{width:max-content}
.topic{font-family:var(--marker);font-weight:700;font-size:27px;line-height:1;text-transform:uppercase;text-align:center;max-width:300px;
  padding:8px 16px 6px;border:0;background:var(--hl);color:var(--ink);cursor:pointer;border-radius:22px 18px 24px 16px / 18px 22px 16px 24px;transition:font-size .15s}
.topic small{display:block;font-family:var(--hand);font-weight:400;font-size:15px;text-transform:none;color:var(--soft);margin-top:2px}
.topic:hover{filter:brightness(.95)}
.groups{display:flex;gap:18px;align-items:flex-start;margin-top:22px}
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-left:16px}
.gl{font-family:var(--hand);font-size:17px;color:var(--soft);background:#f2f2f0;border-radius:10px;padding:2px 9px;margin-left:-16px}
.chip{font-family:var(--hand);font-size:18px;line-height:1.1;text-align:left;padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;
  background:var(--paper);color:var(--ink);border:1.5px solid color-mix(in srgb,var(--hl) 35%,#555)}
.chip:hover{background:var(--hl)}
.chip.seen::after{content:" ✓";color:#2f7d5b}
.topic:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hubnode{position:absolute;transform:translate(-50%,-50%);text-align:center;font-family:var(--marker);font-weight:700;font-size:44px;line-height:.95;text-transform:uppercase;
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 20px 8px;max-width:520px}
.hubnode small{display:block;font-family:var(--hand);font-weight:400;font-size:18px;text-transform:none;color:var(--soft);margin-top:4px}
.chip.hit,.topic.hit{box-shadow:0 0 0 5px var(--hit)}
.cl.lit .topic,.chip.lit{box-shadow:0 0 0 4px var(--accent)}
#world.far .groups{visibility:hidden}
#world.far .topic{font-size:58px;max-width:560px}
#world.far .topic small{display:none}
#world.far #lines .tree{display:none}
#world.far #lines .lab{font-size:34px}
#modal{position:fixed;inset:0;background:rgba(20,20,24,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal[hidden]{display:none}
#modal .box{background:var(--paper);border-radius:14px;width:min(1240px,100%);height:min(92vh,100%);display:flex;flex-direction:column;overflow:hidden}
#modal .mh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#modal .mh b{font-family:var(--marker);font-size:1.5rem;text-transform:uppercase;flex:1;line-height:1}
#modal .mh b span{display:block;font-family:var(--hand);font-weight:400;font-size:1.05rem;text-transform:none;color:var(--soft)}
#modal .mh a{font-size:.85rem;color:var(--accent)}
#modal iframe{flex:1;border:0;width:100%}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));font-family:var(--hand);font-size:1.05rem;color:var(--soft);
  background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:10px;padding:6px 10px;pointer-events:none;max-width:calc(100% - 24px)}

:root{--fm:#1d1d1f;--fg:#2f6fd0;--fs:#8a3fd1;--fp:#2f9d57;--fy:#c0392b}
.cnp{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 18px 18px}
.cnp h3{font:700 44px var(--marker);text-transform:uppercase;margin:0 0 2px;line-height:1}
.cnp .key{display:flex;flex-wrap:wrap;gap:6px 16px;font:17px var(--hand);color:var(--soft);margin:0 0 10px}
.cnp .key i{display:inline-block;width:26px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.cnp .cols{display:flex;gap:40px;align-items:flex-start}
.cncol{position:relative}
.cncol svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.cncol svg path{fill:none;stroke-width:3;stroke-linecap:round}
.cn{position:absolute;transform:translateY(-50%);font-family:var(--hand);font-size:18px;line-height:1.05;white-space:nowrap}
.cn small{display:block;font-size:14px;color:var(--soft);white-space:normal}
.cn{max-width:270px;white-space:normal}
.cn.nerve{max-width:310px}
.cn.nerve{font:700 23px var(--marker);text-transform:uppercase;background:var(--peach);border:0;border-radius:16px 12px 18px 12px;padding:6px 12px 4px;cursor:pointer;color:var(--ink);text-align:left}
.cn.nerve small{font:15px var(--hand);text-transform:none}
.cn.nerve:hover{filter:brightness(.95)}
.cn.nerve:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cn.gang{background:#eef7f1;border:1.5px solid var(--fp);border-radius:999px;padding:2px 9px}
.cn.mid{background:#f3f3f1;border-radius:8px;padding:2px 7px}
#world.far .cn:not(.nerve), #world.far .cncol svg, #world.far .cnp .key{visibility:hidden}
#world.far .cn.nerve{font-size:40px}
#world.far .cn.nerve small{display:none}
#world.far .cnp h3{font-size:70px}
.cn.nerve.lit,.cn.nerve.hit{box-shadow:0 0 0 4px var(--accent)}
</style>
</head>

  // greedy: place each box at its drawing position, or the nearest free spot around it
  const placed = [];
  const free = (b, x, y) => placed.every(p => x + b.w + G <= p.x || p.x + p.w + G <= x || y + b.h + G <= p.y || p.y + p.h + G <= y);
  const order = [cnc].concat(hubs, CL.slice().sort((a, b) => (a.y - b.y) || (a.x - b.x)));
  order.forEach(b => {
    const x0 = b.x, y0 = b.y;
    if (!free(b, x0, y0)){
      let done = false;
      for (let r = 30; r < 4000 && !done; r += 30){
        for (let k = 0; k < 24 && !done; k++){
          const a = k / 24 * Math.PI * 2, x = x0 + Math.cos(a) * r * 1.3, y = y0 + Math.sin(a) * r;
          if (free(b, x, y)){ b.x = x; b.y = y; done = true; }
        }
      }
    }
    placed.push(b);
  });
  let minX = 1e9, minY = 1e9, maxX = 0, maxY = 0;
  all.forEach(a => { minX = Math.min(minX, a.x); minY = Math.min(minY, a.y); maxX = Math.max(maxX, a.x + a.w); maxY = Math.max(maxY, a.y + a.h); });
  const dx = PAD - minX, dy = PAD + 60 - minY;
  CL.forEach(c => { c.x += dx; c.y += dy; c.el.style.left = c.x + "px"; c.el.style.top = c.y + "px"; });
  cnc.x += dx; cnc.y += dy; cnp.style.left = cnc.x + "px"; cnp.style.top = cnc.y + "px";
  hubs.forEach(h => { h.x += dx; h.y += dy; h.el.style.left = (h.x + h.w/2) + "px"; h.el.style.top = (h.y + h.h/2) + "px"; });
  world.W = maxX - minX + 2*PAD; world.H = maxY - minY + 2*PAD + 60;
  world.style.width = world.W + "px"; world.style.height = world.H + "px";
  svg.setAttribute("width", world.W); svg.setAttribute("height", world.H);
  bands();
  draw();
}
function bands(){
  world.querySelectorAll(".band,.zl").forEach(b => b.remove());
  const by = z => CL.filter(c => c.zone === z);
  const add = (cls, css, text) => { const d = document.createElement("div"); d.className = cls; Object.assign(d.style, css); if (text) d.textContent = text; world.insertBefore(d, svg); };
  const dis = by("disorder").map(c => c.y + 18).sort((a, b) => a - b);
  const gy = dis[Math.floor(dis.length/2)];
  add("band grey", {left:PAD/2 + "px", top:gy + "px", width:(world.W - PAD) + "px"});
  const low = by("local").concat(by("eye"));
  const top = Math.min(...low.map(c => c.y)) - 70;
  add("band black", {left:PAD/2 + "px", top:top + "px", width:(world.W - PAD) + "px"});
  const lx = Math.max(...by("local").map(c => c.x + c.w)), ex = Math.min(...by("eye").map(c => c.x));
  if (ex > lx) add("band vert", {left:((lx + ex)/2) + "px", top:top + "px", height:(world.H - top - PAD/2) + "px"});
  add("zl", {left:PAD/2 + "px", top:(Math.min(...by("approach").map(c => c.y)) - 90) + "px"}, "Headaches · seizures · altered LOC");
  add("zl", {left:PAD/2 + "px", top:(gy - 58) + "px"}, "");
  add("zl", {left:PAD/2 + "px", top:(top + 16) + "px"}, "UMN vs LMN localization");
  add("zl", {left:(ex > lx ? (lx + ex)/2 + 30 : world.W/2) + "px", top:(top + 16) + "px"}, "Eyes · ears · cerebellum · basal ganglia");
}
function anchor(key){
  let el = EL[key]; if (!el) return null;
  if (world.classList.contains("far") && el.classList.contains("chip")) el = EL[el.dataset.chart];
  const b = el.classList.contains("hubnode") ? (() => { const r = box(el); return {x:r.x - r.w/2, y:r.y - r.h/2, w:r.w, h:r.h}; })() : box(el);
  return b;
}
function edgePt(b, t){
  const cx = b.x + b.w/2, cy = b.y + b.h/2, dx = t.x - cx, dy = t.y - cy;
  if (!dx && !dy) return {x:cx, y:cy};
  const s = Math.min(Math.abs((b.w/2 + 6)/(dx || 1e-9)), Math.abs((b.h/2 + 6)/(dy || 1e-9)));
  return {x:cx + dx*s, y:cy + dy*s};
}
function draw(){
  let out = '<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b3f47"/></marker>' +
            '<marker id="arOn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fb0"/></marker></defs>';
  // tree branches inside each topic: topic -> group label (or chips) with elbows
  if (!world.classList.contains("far")) CL.forEach(c => {
    const tb = box(c.el.querySelector(".topic")); const tx = tb.x + tb.w/2, ty = tb.y + tb.h;
    c.el.querySelectorAll(".grp").forEach(g => {
      const gb = box(g), trunkX = gb.x + 6;
      const items = [...g.children];
      const lastY = (() => { const lb = box(items[items.length - 1]); return lb.y + lb.h/2; })();
      out += '<path class="tree" d="M' + tx + ',' + ty + ' C' + tx + ',' + (ty + 18) + ' ' + trunkX + ',' + (gb.y - 16) + ' ' + trunkX + ',' + gb.y + ' L' + trunkX + ',' + lastY + '"/>';
      items.forEach(it => { const ib = box(it); const my = ib.y + ib.h/2; if (ib.x > trunkX + 2) out += '<path class="tree" d="M' + trunkX + ',' + my + ' L' + ib.x + ',' + my + '"/>'; });
    });
  });
  MAP.edges.forEach((e, i) => {
    const A = anchor(e.a), B = anchor(e.b); if (!A || !B) return;
    const ca = {x:A.x + A.w/2, y:A.y + A.h/2}, cb = {x:B.x + B.w/2, y:B.y + B.h/2};
    const p1 = edgePt(A, cb), p2 = edgePt(B, ca);
    const mx = (p1.x + p2.x)/2, my = (p1.y + p2.y)/2, k = .18;
    const qx = mx - (p2.y - p1.y)*k, qy = my + (p2.x - p1.x)*k;
    const cls = "x" + (e.kind === "vs" ? " vs" : "") + (e.a.startsWith("hub-disorders") ? " hub" : "");
    out += '<path class="' + cls + '" data-i="' + i + '" d="M' + p1.x + ',' + p1.y + ' Q' + qx + ',' + qy + ' ' + p2.x + ',' + p2.y + '"' + (e.kind === "vs" ? '' : ' marker-end="url(#ar)"') + '/>';
    if (e.label){ const lx = .25*p1.x + .5*qx + .25*p2.x, ly = .25*p1.y + .5*qy + .25*p2.y;
      out += '<text class="lab' + (e.kind === "vs" ? " vs" : "") + '" data-i="' + i + '" x="' + lx + '" y="' + ly + '" text-anchor="middle">' + esc(e.kind === "vs" ? "VS" : e.label) + '</text>'; }
  });
  svg.innerHTML = out;
  if (litKey) light(litKey);
}

/* ---- follow the arrows ---- */
let litKey = null;
function keysOf(el){
  if (el.classList.contains("nerve")) return [el.dataset.key];
  if (el.classList.contains("chip")) return [el.dataset.key, el.dataset.chart];
  if (el.classList.contains("topic")) { const ch = el.dataset.chart; return [ch].concat(Object.keys(EL).filter(k => k.startsWith(ch + "#"))); }
  return [el.dataset.key];
}
function light(key){
  litKey = key;
  document.querySelectorAll(".lit").forEach(x => x.classList.remove("lit"));
  svg.querySelectorAll(".on").forEach(x => { x.classList.remove("on"); if (x.tagName === "path" && !x.classList.contains("vs")) x.setAttribute("marker-end", "url(#ar)"); });
  if (!key) return;
  const el = EL[key]; const ks = new Set(keysOf(el));
  MAP.edges.forEach((e, i) => {
    if (!ks.has(e.a) && !ks.has(e.b)) return;
    svg.querySelectorAll('[data-i="' + i + '"]').forEach(x => { x.classList.add("on"); if (x.tagName === "path" && !x.classList.contains("vs")) x.setAttribute("marker-end", "url(#arOn)"); });
    [e.a, e.b].forEach(k => { const o = EL[k]; if (!o || ks.has(k)) return; (o.classList.contains("topic") ? o.parentElement : o).classList.add("lit"); });
  });
}
world.addEventListener("mouseover", ev => { const t = ev.target.closest(".chip,.topic,.hubnode,.cn.nerve"); if (t && !sticky) light(t.dataset.key || t.dataset.chart); });
world.addEventListener("mouseout", ev => { if (!sticky && ev.target.closest(".chip,.topic,.hubnode,.cn.nerve")) light(null); });
let sticky = false;

/* ---- open a chart ---- */
const modal = document.getElementById("modal"), mf = document.getElementById("mf");
let lastBtn = null;
function openChart(b){
  const url = BASE + b.dataset.chart + "/" + (b.dataset.col ? "#col=" + b.dataset.col : "");
  document.getElementById("mt").innerHTML = esc(b.dataset.name) + (b.dataset.sub ? '<span>' + esc(b.dataset.sub) + '</span>' : '');
  document.getElementById("ml").href = url;
  mf.src = BASE + b.dataset.chart + "/?embed=1" + (b.dataset.col ? "#col=" + b.dataset.col : "");
  modal.hidden = false; document.getElementById("mx").focus(); lastBtn = b;
  if (b.dataset.col){ seen[b.dataset.key] = 1; b.classList.add("seen"); try { localStorage.setItem("ncm-seen", JSON.stringify(seen)); } catch(e) {} }
}
function openUrl(src, href, name, sub){
  document.getElementById("mt").innerHTML = esc(name) + '<span>' + esc(sub) + '</span>';
  document.getElementById("ml").href = href; mf.src = src; modal.hidden = false; document.getElementById("mx").focus();
}
function closeChart(){ modal.hidden = true; mf.src = "about:blank"; lastBtn && lastBtn.focus({preventScroll:true}); }
world.addEventListener("click", ev => {
  if (moved) return;
  const b = ev.target.closest("button[data-chart]");
  if (b){ light(b.dataset.key || b.dataset.chart); openChart(b); return; }
  const nv = ev.target.closest(".cn.nerve[data-cnmap]");
  if (nv){ light(nv.dataset.key); openUrl("../anatomy-tables/?embed=1#cn-map", "../anatomy-tables/#cn-map", nv.dataset.name, "the cranial nerve map"); return; }
  const h = ev.target.closest(".hubnode");
  if (h){ sticky = litKey !== h.dataset.key; light(sticky ? h.dataset.key : null); return; }
  sticky = false; light(null);
});
world.addEventListener("focusin", ev => { const t = ev.target.closest(".chip,.topic"); if (t) light(t.dataset.key || t.dataset.chart); });
document.getElementById("mx").onclick = closeChart;
modal.addEventListener("click", ev => { if (ev.target === modal) closeChart(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !modal.hidden) closeChart(); });

/* ---- pan and zoom ---- */
let S = .3, TX = 0, TY = 0, moved = false, wasFar = null;
function apply(){
  world.style.transform = "translate(" + TX + "px," + TY + "px) scale(" + S + ")";
  const far = S < .36; world.classList.toggle("far", far);
  if (far !== wasFar){ wasFar = far; if (world.W) draw(); }
}
function zoomAt(f, px, py){ const ns = Math.min(2.2, Math.max(.08, S*f)); TX = px - (px - TX)*ns/S; TY = py - (py - TY)*ns/S; S = ns; apply(); }
function fit(){ const r = view.getBoundingClientRect(); S = Math.min(r.width/world.W, r.height/world.H)*.98; TX = (r.width - world.W*S)/2; TY = (r.height - world.H*S)/2; apply(); }
view.addEventListener("wheel", e => { e.preventDefault(); const r = view.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*(e.ctrlKey ? .01 : .0015)), e.clientX - r.left, e.clientY - r.top); }, {passive:false});
const ptrs = new Map(); let last = null, pinch = null;
view.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = false; if (ptrs.size === 1) last = {x:e.clientX, y:e.clientY};
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.x - b.x, a.y - b.y)}; } });
view.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2 && pinch){ const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = view.getBoundingClientRect();
    zoomAt(d/pinch.d, (a.x + b.x)/2 - r.left, (a.y + b.y)/2 - r.top); pinch.d = d; moved = true; return; }
  if (last){ const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (Math.abs(dx) + Math.abs(dy) > 4){ moved = true; view.classList.add("drag"); if (!view.hasPointerCapture(e.pointerId)) view.setPointerCapture(e.pointerId); }
    if (moved){ TX += dx; TY += dy; apply(); last = {x:e.clientX, y:e.clientY}; } }
});
const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size){ last = null; view.classList.remove("drag"); setTimeout(() => moved = false, 0); } };
view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);
document.getElementById("zin").onclick = () => { const r = view.getBoundingClientRect(); zoomAt(1.3, r.width/2, r.height/2); };
document.getElementById("zout").onclick = () => { const r = view.getBoundingClientRect(); zoomAt(1/1.3, r.width/2, r.height/2); };
document.getElementById("fit").onclick = fit;
function flyTo(el){
  const b = box(el.classList.contains("chip") ? el.closest(".cl") : el.parentElement), r = view.getBoundingClientRect();
  S = Math.max(.75, Math.min(1, r.height/(b.h + 160))); TX = r.width/2 - (b.x + b.w/2)*S; TY = r.height/2 - (b.y + b.h/2)*S; apply();
}

/* ---- search ---- */
const q = document.getElementById("q");
q.addEventListener("input", () => {
  const t = q.value.trim().toLowerCase();
  document.querySelectorAll(".hit").forEach(x => x.classList.remove("hit"));
  if (t.length < 2) return;
  const hits = [...document.querySelectorAll(".chip,.topic,.cn.nerve")].filter(x => x.textContent.toLowerCase().includes(t));
  hits.forEach(x => x.classList.add("hit"));
});
q.addEventListener("keydown", e => {
  if (e.key === "Escape"){ q.value = ""; q.dispatchEvent(new Event("input")); }
  if (e.key === "Enter"){ const h = document.querySelector(".chip.hit,.topic.hit,.cn.nerve.hit"); if (h){ flyTo(h); light(h.dataset.key || h.dataset.chart); } }
});

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { layout(); fit(); });
addEventListener("resize", () => fit());
</script>
</body>
